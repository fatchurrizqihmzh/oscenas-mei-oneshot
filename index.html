hemato:[
{id:'imunisasi',name:'Imunisasi Anak (Pentabio, OPV, BCG, KMS)',years:[2022],ss:'Jadwal imunisasi dasar: BCG (lahir-1 bulan), HB (lahir, 2, 3, 4 bulan), DPT-HB-Hib (2, 3, 4 bulan), OPV (0, 2, 3, 4 bulan), MR (9 bulan). KMS untuk monitoring tumbang.',dd:'Reaksi simpang vaksin (demam, kemerahan lokal), KIPI berat (anafilaksis - sangat jarang)',tx:'BCG: ID lengan kanan. OPV: tetes oral. Pentabio (DPT-HB-Hib): IM anterolateral paha. Parasetamol jika demam. Edukasi reaksi normal.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'malaria',name:'Malaria Falciparum',years:[2022,2023],ss:'Demam periodik (bisa tidak beraturan), menggigil, berkeringat, sakit kepala, mual. Splenomegali. Apusan: RING FORMS multipel/sel, "headphone" gametosit. RDT (+).',dd:'Malaria vivax/malariae, Dengue, Leptospirosis, Sepsis, Meningitis',tx:'ACT: DHP (Dihydroartemisinin-Piperaquine) x3 hari + Primakuin hari ke-1. Berat/serebral: ARTESUNAT IV 2.4mg/kgBB (0, 12, 24j lalu 24j sekali).',am:'IDENTITAS: Semua usia, daerah endemis (Papua, NTT, Kalimantan, Sulawesi)\n\nKELUHAN UTAMA: Demam dengan menggigil\n\nSACRED 7:\n1. Lokasi: Sistemik, demam seluruh tubuh\n2. Onset/Kronologi: Mendadak, pola TRIASE berulang (menggigil → demam → berkeringat)\n3. Kuantitas: Demam tinggi 38-41°C, sangat menggigil\n4. Kualitas: TRIASE KHAS: MENGGIGIL hebat 1-2 jam → DEMAM tinggi 2-6 jam → BERKERINGAT banyak lalu mereda\n5. Faktor pemberat: Imunokompromis, kehamilan, bayi/anak kecil\n6. Faktor peringan: Obat antimalaria\n7. Gejala penyerta: Sakit kepala hebat, mual/muntah, nyeri otot, pucat (anemia hemolitik), limpa membesar\n\nFUNDAMENTAL 4:\n1. RPS: Kapan terakhir ke daerah endemis (inkubasi 7-30 hari), sudah minum obat malaria?\n2. RPD: Riwayat malaria sebelumnya, kekambuhan\n3. RPK: Anggota keluarga/satu daerah yang sakit serupa?\n4. Sos-Ek: Tempat tinggal/perjalanan ke daerah endemis, kelambu, pekerjaan (petani/nelayan)'},
{id:'dhf',name:'DHF / DBD',years:[2022,2023],ss:'Demam tinggi mendadak 2-7 hari, perdarahan spontan (petekie, epistaksis, gusi), TOURNIQUET TEST (+), trombositopenia <100.000, Ht naik ≥20%. NS1 antigen (+) hari 1-5.',dd:'Demam dengue, ITP, Malaria, Leptospirosis, Tifoid, Meningokokemia',tx:'Grade I-II: IVFD kristaloid 5-7ml/kgBB/jam, monitor Ht tiap 6j. Grade III-IV (DSS): resusitasi cepat 10-20ml/kgBB. Parasetamol. HINDARI NSAID.',am:'IDENTITAS: Semua usia, anak-dewasa muda, daerah endemis, musim hujan\n\nKELUHAN UTAMA: Demam tinggi mendadak\n\nSACRED 7:\n1. Lokasi: Sistemik, nyeri seluruh badan\n2. Onset/Kronologi: Demam mendadak tinggi hari 1-2, mungkin turun sementara (saddle fever) hari 3-4, kemudian periode kritis\n3. Kuantitas: Demam 38.5-40°C, berlangsung 2-7 hari\n4. Kualitas: Demam tinggi mendadak "seperti disambar petir", badan pegal-pegal hebat\n5. Faktor pemberat: Dehidrasi, tidak mau minum\n6. Faktor peringan: Parasetamol (BUKAN aspirin/ibuprofen!), kompres hangat, minum banyak\n7. Gejala penyerta: Nyeri kepala (retroorbital), nyeri otot/sendi, mual/muntah, ruam/bintik merah, mimisan, gusi berdarah, BAB hitam\n\nFUNDAMENTAL 4:\n1. RPS: Sudah hari ke berapa demam (hari 3-7 = fase kritis), ada tanda perdarahan?\n2. RPD: Riwayat DBD sebelumnya (infeksi ke-2 lebih berisiko syok)\n3. RPK: Keluarga/tetangga ada yang sakit serupa?\n4. Sos-Ek: Lingkungan banyak nyamuk, genangan air, bepergian ke daerah endemis'},
{id:'leptospirosis',name:'Leptospirosis',years:[2023],ss:'Demam bifasik, mialgia betis, KONJUNGTIVAL SUFFUSION (khas, tanpa discharge). Weil disease: ikterus, gagal ginjal, perdarahan. Riwayat banjir/binatang. IgM leptospira (+).',dd:'Dengue, Hepatitis akut, Malaria, Tifoid, Ricketsia',tx:'Ringan: Doksisiklin 2x100mg x7 hari. Berat: Penisilin G IV atau Seftriakson 1g/24j x7 hari. Suportif: IVFD, monitor ginjal/hati.',am:'IDENTITAS: Laki-laki dewasa, pekerjaan berisiko (petani, pekerja selokan), musim hujan/banjir\n\nKELUHAN UTAMA: Demam mendadak dan nyeri betis sangat hebat\n\nSACRED 7:\n1. Lokasi: Sistemik. NYERI KHAS di BETIS/tulang kering (mialgia)\n2. Onset/Kronologi: Mendadak, fase 1 (4-7 hari demam-nyeri) → bebas demam 1-3 hari → fase 2 (komplikasi/Weil disease)\n3. Kuantitas: Demam tinggi 38.5-40°C, nyeri otot sangat berat hingga sulit berjalan\n4. Kualitas: Demam + NYERI BETIS HEBAT + MATA MERAH TANPA KOTORAN (konjungtival suffusion = khas!)\n5. Faktor pemberat: Dehidrasi, keterlambatan pengobatan\n6. Faktor peringan: Antibiotik, hidrasi\n7. Gejala penyerta: Ikterus (Weil disease), kencing berkurang/merah (gagal ginjal), perdarahan (mimisan, BAB hitam), nyeri kepala hebat\n\nFUNDAMENTAL 4:\n1. RPS: Kontak dengan air banjir/lumpur/selokan dalam 2-30 hari terakhir, kontak hewan (tikus, sapi, anjing)\n2. RPD: Riwayat leptospirosis sebelumnya\n3. RPK: Rekan kerja dengan keluhan serupa?\n4. Sos-Ek: Pekerjaan (petani sawah/selokan/dokter hewan/tentara), banjir di lingkungan, berenang di sungai/sawah, tanpa APD'},
{id:'limfadenopati_tb',name:'Limfadenopati TB Anak',years:[2023],ss:'Pembesaran KGB servikal atau multipel, KERAS/KENYAL, TIDAK nyeri tekan (beda infeksi bakteri). Demam subfebris, keringat malam, BB turun. Uji tuberkulin (+). Biopsi: granuloma kaseosa.',dd:'Limfadenitis bakterial (nyeri, eritema), Limfoma, Leukemia, Mononukleosis, Toksoplasma',tx:'OAT Kategori I: 2RHZE/4RH. Monitor respons (KGB mengecil). Bedah draining jika abses.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'anemia_besi',name:'Anemia Defisiensi Besi',years:[2023],ss:'Lemah, lesu, pucat (konjungtiva, telapak). Atrofi papil lidah, koilonikia, angular stomatitis. Hb turun, MCV/MCH turun (MIKROSITIK HIPOKROMIK), ferritin turun, TIBC naik.',dd:'Anemia penyakit kronik (ferritin N/naik), Talasemia minor (HbA2 naik), Sideroblastik',tx:'Ferrous sulfat 3x200mg oral + Vit C. Hb naik 1-2g/dL tiap 3 minggu. Lanjutkan 3 bulan setelah Hb normal. Cari penyebab.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'ra',name:'Rheumatoid Arthritis (RA)',years:[2024],ss:'Artritis SIMETRIS sendi kecil (MCP, PIP, pergelangan tangan), KAKU PAGI >1 JAM, >6 minggu. RF (+), anti-CCP (+). Foto: osteopenia periartikular, erosi. DAS28.',dd:'OA (kaku pagi <30 menit), Gout, Artritis lupus, Artritis reaktif, Psoriatic arthritis',tx:'Metotreksat (MTX) lini 1 + asam folat. NSAID simtomatis. Kortikosteroid bridging. Biologik (anti-TNF, JAK inhibitor) jika MTX gagal.',am:'IDENTITAS: Perempuan 40-60 th (3:1 dibanding pria), penyakit autoimun\n\nKELUHAN UTAMA: Sendi jari-jari tangan kaku dan bengkak, terutama pagi hari\n\nSACRED 7:\n1. Lokasi: Sendi kecil BILATERAL SIMETRIS (MCP, PIP, pergelangan tangan). TIDAK di DIP (beda OA)\n2. Onset/Kronologi: Perlahan, kronik. KAKU PAGI >1 JAM (kunci diagnosis!) sudah >6 minggu\n3. Kuantitas: Bisa ringan-berat, makin parah seiring waktu\n4. Kualitas: Kaku pagi >1 jam, sendi bengkak/merah/hangat, simetris bilateral\n5. Faktor pemberat: Aktivitas, cuaca dingin, stres\n6. Faktor peringan: Kompres hangat, NSAID, MTX\n7. Gejala penyerta: Kelelahan kronik, demam ringan, penurunan BB, nodul reumatoid (siku), anemia\n\nFUNDAMENTAL 4:\n1. RPS: Sudah berapa lama kaku pagi, sendi mana yang terlibat, sudah pernah diterapi?\n2. RPD: Penyakit autoimun lain (Sjögren, SLE, tiroid), infeksi sebelumnya\n3. RPK: Riwayat RA atau penyakit autoimun dalam keluarga\n4. Sos-Ek: Merokok (meningkatkan risiko dan berat RA!), pekerjaan (gerakan berulang sendi), stres'},
{id:'sle',name:'SLE',years:[2024],ss:'Multiorgan: MALAR RASH, fotosensitivitas, ulkus oral, artritis non-erosif, serositis, nefritis, neuropsikiatri. ANA (+), anti-dsDNA (+), C3/C4 turun. Kriteria SLICC ≥4.',dd:'RA, Sindrom Sjogren, Dermatomiositis, MCTD, Infeksi, Drug-induced lupus',tx:'Semua: Hidroksiklorokuin 400mg/hari. Ringan: Prednison dosis rendah+NSAID. Berat: Metilprednisolon pulse + MMF/Azatioprin. Nefritis: MMF/Siklofosfamid.',am:'IDENTITAS: Perempuan usia reproduksi 15-45 th (9:1 dibanding pria), ras Asia/Afrika lebih sering\n\nKELUHAN UTAMA: Ruam wajah, nyeri sendi, kelelahan berat berkepanjangan\n\nSACRED 7:\n1. Lokasi: Multiorgan: kulit wajah, sendi, ginjal, jantung, paru, otak\n2. Onset/Kronologi: Bervariasi, bisa akut (flare) atau kronik berulang\n3. Kuantitas: Dari ringan hingga sangat berat (mengancam jiwa)\n4. Kualitas: Ruam KUPU-KUPU (butterfly rash) di pipi+hidung, nyeri sendi migrasi, kelelahan kronik tidak hilang dengan istirahat\n5. Faktor pemberat: Paparan sinar matahari (fotosensitivitas!), infeksi, stres, kehamilan\n6. Faktor peringan: Hindari matahari, kortikosteroid, hidroksiklorokuin\n7. Gejala penyerta: Rambut rontok, sariawan berulang, kaki/wajah bengkak (nefritis), kejang, nyeri dada pleuritis, Raynaud phenomenon\n\nFUNDAMENTAL 4:\n1. RPS: Organ apa yang terlibat, flare atau remisi, obat yang dipakai\n2. RPD: Penyakit autoimun lain, keguguran berulang (antifosfolipid), riwayat trombosis\n3. RPK: Riwayat SLE atau penyakit autoimun dalam keluarga\n4. Sos-Ek: Paparan matahari, kontrasepsi hormonal (estrogen memperparah SLE), kehamilan, stres'},
{id:'demam_rematik',name:'Demam Rematik Akut / RHD',years:[2024],ss:'Anak 5-15 tahun, 2-4 minggu pasca faringitis Streptokokus. Kriteria Jones mayor: KARDITIS, ARTRITIS migrans, KOREA, nodul subkutan, eritema marginatum. ASTO naik.',dd:'Artritis juvenil idiopatik, Artritis reaktif, SLE, Infektif endokarditis',tx:'Penisilin V atau Benzatin penisilin 1.2 juta IU IM eradikasi Streptokokus. Aspirin untuk artritis. Kortikosteroid jika karditis berat. Profilaksis Benzatin penisilin tiap 3-4 minggu hingga dewasa.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'polimyalgia',name:'Polimyalgia Reumatik',years:[2024],ss:'Nyeri dan kaku BILATERAL bahu dan/atau panggul pada usia >50 tahun (rata-rata 70). Kaku pagi >45 menit. Tidak ada artritis perifer. LED/CRP naik sangat. Respons DRAMATIS kortikosteroid.',dd:'RA onset lanjut usia, OA bahu, Miopati inflamasi, Fibromialgia, Keganasan',tx:'Prednison 15-20mg/hari - respons DRAMATIS dalam 24-72 jam (hampir patognomonik). Tapering perlahan 1-2 tahun. Osteoporosis profilaksis.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'anafilaksis',name:'Syok Anafilaksis',years:[2025],ss:'Reaksi alergi sistemik berat cepat (menit-jam) setelah alergen. Hipotensi + urtikaria/angioedema + stridor/wheezing. Kesadaran bisa menurun.',dd:'Syok septik, Syok kardiogenik, Sinkop vasovagal, Angioedema herediter, Serangan asma',tx:'SEGERA: EPINEFRIN 0.3-0.5mg IM paha anterolateral (1:1000). O2 high-flow. IVFD cepat. Antihistamin H1+H2. Kortikosteroid IV. Observasi 4-8 jam.',am:'IDENTITAS: Semua usia, riwayat alergi\n\nKELUHAN UTAMA: Sesak mendadak, gatal seluruh badan setelah makan/suntik obat\n\nSACRED 7:\n1. Lokasi: Sistemik (kulit, saluran napas, kardiovaskular, GI)\n2. Onset/Kronologi: MENDADAK dalam menit-jam setelah paparan alergen\n3. Kuantitas: Sangat berat, mengancam jiwa\n4. Kualitas: Gatal-biduran seluruh tubuh + sesak napas + pusing/pingsan tiba-tiba\n5. Faktor pemberat: Dosis alergen lebih besar, paparan berulang, asma, beta bloker\n6. Faktor peringan: Epinefrin IM SEGERA\n7. Gejala penyerta: Ruam/urtikaria, bibir/lidah bengkak (angioedema), stridor/wheezing, mual/muntah, nyeri perut, TD turun, pingsan\n\nFUNDAMENTAL 4:\n1. RPS: APA yang dikonsumsi/disuntikkan sebelum gejala, berapa menit setelah paparan gejala muncul\n2. RPD: Riwayat alergi obat/makanan, riwayat anafilaksis sebelumnya (lebih berisiko berat)\n3. RPK: Riwayat alergi dalam keluarga\n4. Sos-Ek: Obat rutin (beta bloker memperparah, ACEi meningkatkan risiko angioedema), alergi yang sudah diketahui'},
{id:'angioedema',name:'Angioedema / Reaksi Anafilaktik',years:[2025],ss:'Edema non-pitting tiba-tiba di wajah (periorbital, bibir, lidah), laring (STRIDOR - darurat), GI (kolik). Bisa tanpa urtikaria. ACEi-induced: bradikinin-mediated.',dd:'Angioedema herediter (C1-INH turun), Urtikaria saja, Selulitis wajah',tx:'Alergi/histamin: Epinefrin IM + antihistamin + kortikosteroid. ACEi-induced: hentikan ACEi, Icatibant atau C1-INH konsentrat. Jaga jalan napas.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
],
musku:[
{id:'ankle_sprain',name:'Ankle Sprain',years:[2022,2023,2025],ss:'Riwayat INVERSI mendadak. Nyeri lateral ankle, edema, ekimosis. Nyeri tekan ATFL. Ottawa ankle rules untuk eksklusi fraktur: nyeri tulang malleolus/navikular/basis MT5 + tidak bisa jalan 4 langkah.',dd:'Fraktur avulsi malleolus lateral, Fraktur basis MT5, Cedera tendon peroneus, Sinus tarsi syndrome',tx:'PRICE: Protection, Rest, Ice 20 menit q2-3j, Compression, Elevation. NSAID. Fisioterapi propioseptif. Grade III/tidak stabil: rujuk orthopedi.',am:'IDENTITAS: Semua usia, sering atlet atau aktivitas di permukaan tidak rata\n\nKELUHAN UTAMA: Pergelangan kaki keseleo, nyeri, bengkak setelah jatuh/melangkah salah\n\nSACRED 7:\n1. Lokasi: Pergelangan kaki lateral (tersering), medial, atau anterior\n2. Onset/Kronologi: Mendadak, setelah trauma INVERSI (kaki terlipat ke dalam) saat berlari/turun tangga\n3. Kuantitas: Ringan (masih bisa berjalan) hingga berat (tidak bisa tumpuan)\n4. Kualitas: Nyeri tajam saat cedera, lalu nyeri tumpul menetap\n5. Faktor pemberat: Digerakkan (terutama inversi), berdiri lama\n6. Faktor peringan: RICE (istirahat, es, kompresi, elevasi)\n7. Gejala penyerta: Bengkak pergelangan kaki, memar (ekimosis), instabilitas sendi\n\nFUNDAMENTAL 4:\n1. RPS: Mekanisme cedera (inversi/eversi), bunyi "pop" (curiga ruptur), bisa jalan atau tidak (Ottawa rules)\n2. RPD: Riwayat keseleo berulang di tempat sama (instabilitas kronik)\n3. RPK: Tidak spesifik\n4. Sos-Ek: Jenis olahraga, alas kaki, kondisi lapangan'},
{id:'oa_genu',name:'OA Genu (Osteoartritis Lutut)',years:[2023,2025],ss:'Nyeri lutut kronik ≥45 tahun, KREPITASI, KAKU PAGI <30 MENIT (beda RA), nyeri memburuk aktivitas. Foto: celah sendi menyempit, osteofit, sklerosis subkondral.',dd:'RA (kaku pagi >1 jam, RF+), Gout/pseudogout, Bursitis, Meniskopati, Artritis septik',tx:'Fisioterapi, penguatan kuadriseps, penurunan BB. Parasetamol (lini 1). NSAID topikal/oral. Injeksi kortikosteroid intraartikular. Berat: TKR.',am:'IDENTITAS: Usia >45 th, perempuan lebih sering pasca menopause, sering obesitas\n\nKELUHAN UTAMA: Lutut nyeri dan kaku, terutama saat naik tangga\n\nSACRED 7:\n1. Lokasi: Lutut (biasanya bilateral), sisi medial lebih sering\n2. Onset/Kronologi: Perlahan, kronik bertahun-tahun, makin memberat\n3. Kuantitas: Nyeri VAS 3-8, makin parah saat aktivitas banyak\n4. Kualitas: Nyeri tumpul, KAKU PAGI <30 MENIT (kunci pembeda dengan RA!), bunyi "krek" (krepitasi)\n5. Faktor pemberat: Naik tangga, jongkok, berdiri lama, cuaca dingin\n6. Faktor peringan: Istirahat, pemanasan, analgetik\n7. Gejala penyerta: Bengkak lutut, deformitas (genu varum), keterbatasan gerak, atrofi otot paha\n\nFUNDAMENTAL 4:\n1. RPS: Sudah berapa lama, pernah suntik/fisioterapi, pakai alat bantu jalan?\n2. RPD: Riwayat cedera lutut, operasi lutut, gout, RA\n3. RPK: Riwayat OA dalam keluarga\n4. Sos-Ek: IMT (setiap 1kg turun = beban lutut berkurang 4kg!), pekerjaan (jongkok/naik tangga), olahraga'},
{id:'knee_sprain',name:'Knee Sprain',years:[2022],ss:'Nyeri lutut pasca trauma (puntiran/benturan). Efusi, instabilitas. Lachman test/anterior drawer (+): ACL. Posterior drawer (+): PCL. Valgus/varus stress (+): MCL/LCL.',dd:'Meniscus tear, Fraktur kondilus femur/tibia, Dislokasi patela, Bursitis prepatelar',tx:'RICE akut. NSAID. Fisioterapi sesuai ligamen cedera. ACL ruptur + instabilitas: rekonstruksi arthroscopic.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'wrist_sprain',name:'Wrist Sprain',years:[2022],ss:'Nyeri pergelangan tangan pasca trauma (jatuh bertumpu tangan). Watson test (scaphoid) atau nyeri ANATOMICAL SNUFFBOX: singkirkan fraktur skafoid!',dd:'Fraktur skafoid (nyeri anatomical snuffbox - foto NORMAL awal!), Fraktur Colles, TFCC tear',tx:'Imobilisasi wrist splint 2-3 minggu. NSAID. Jika curiga fraktur skafoid: foto serial atau MRI.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'fraktur',name:'Fraktur Klavikula / Radius Ulna',years:[2022],ss:'Nyeri, deformitas, edema, krepitasi pasca trauma. Klavikula: step-off di klavikula. 1/3 medial radius ulna: Galeazzi (radius + dislokasi DRUJ) atau Monteggia (ulna + dislokasi kaput radii).',dd:'Kontusio, Dislokasi, Fraktur stress, Patologis fraktur',tx:'Klavikula non-displaced: arm sling 3-6 minggu. Displaced atau Galeazzi/Monteggia: ORIF. Analgetik, RICE. Rujuk orthopedi.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'osteomyelitis',name:'Osteomyelitis',years:[2023],ss:'Nyeri tulang lokal, bengkak, kemerahan, DEMAM. Anak: metafisis tulang panjang tersering. ESR/CRP naik sangat. Foto: destruksi tulang muncul 10-14 hari. MRI: GOLD STANDARD.',dd:'Selulitis, Artritis septik, Tumor tulang, Fraktur stress, Sarkoma Ewing',tx:'AB IV 4-6 minggu: Kloksasilin/Fluklosasilin (S.aureus). MRSA: Vankomisin. Bedah debridemen jika abses atau sequester.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'tenosinovitis',name:'Tenosinovitis Supuratif',years:[2023],ss:'KANAVEL 4 SIGNS (fleksor supuratif): (1) Nyeri tekan seluruh tendon (2) Jari posisi fleksi (3) Edema fusiform jari (4) Nyeri saat ekstensi pasif jari. DARURAT bedah!',dd:'Selulitis jari, Artritis septik PIP/DIP, Felons (abses pulpa), Paronikia',tx:'DARURAT bedah: irigasi dan drainase tendon sheath. AB IV broad-spectrum (Ampisilin-sulbaktam). Elevasi, splint.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'gout',name:'Gout Arthritis',years:[2022],ss:'Nyeri sendi AKUT monoartikular (MTP-1 = PODAGRA tersering). Merah, panas, bengkak, onset MENDADAK (sering tengah malam). Asam urat naik. Kristal urat (jarum, negatif birefringent) pada aspirasi sendi.',dd:'Artritis septik (kultur sendi), Pseudogout (kristal rhomboid, positif birefringent), Selulitis, RA',tx:'Akut: NSAID (Indometasin/Na-diklofenak) x5-7 hari atau Kolkisin 3x0.5mg hari 1. Profilaksis: Allopurinol mulai 100mg, target AU <6mg/dL. Diet rendah purin.',am:'IDENTITAS: Laki-laki >40 th, perempuan lebih sering pasca menopause\n\nKELUHAN UTAMA: Ibu jari kaki merah, bengkak, nyeri sangat hebat tiba-tiba\n\nSACRED 7:\n1. Lokasi: Sendi MTP-1 (pangkal ibu jari kaki = PODAGRA) tersering; bisa ankle, lutut, pergelangan tangan\n2. Onset/Kronologi: MENDADAK, sering saat bangun tengah malam atau dini hari, mencapai puncak dalam 24 jam\n3. Kuantitas: Sangat nyeri (VAS 8-10), tidak bisa disentuh sama sekali\n4. Kualitas: Nyeri SANGAT hebat, sendi merah, panas, bengkak, berkilat\n5. Faktor pemberat: Makan jeroan/seafood/daging merah, alkohol (bir), dehidrasi, stres, diuretik\n6. Faktor peringan: NSAID, kolkisin, kompres dingin, istirahat\n7. Gejala penyerta: Demam ringan, tofi (benjolan putih di telinga/siku pada kasus kronik)\n\nFUNDAMENTAL 4:\n1. RPS: Serangan pertama atau berulang? Makan/minum apa sebelum serangan?\n2. RPD: Riwayat batu ginjal (kristal urat), CKD, hipertensi, dislipidemia\n3. RPK: Riwayat gout dalam keluarga (sering familial)\n4. Sos-Ek: Pola makan (jeroan, seafood, alkohol), konsumsi cairan, obat rutin (diuretik tiazid), BB/IMT'},
{id:'lipoma',name:'Lipoma (Eksisi)',years:[2024],ss:'Benjolan LUNAK, berbatas tegas, MOBILE, tidak nyeri, tumbuh lambat. Lunak kenyal seperti adonan. Kulit di atasnya normal. Superfisial atau subfasial.',dd:'Kista sebasea (lebih superfisial, ada punctum), Lipoma infiltratif, Liposarkoma (keras, tidak mobile)',tx:'Eksisi bedah melalui insisi kecil jika mengganggu. Lokal anestesi. Kapsul harus diangkat UTUH untuk mencegah rekurensi.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'meniscus_tear',name:'Meniscus Tear',years:[2025],ss:'Nyeri lutut (biasanya medial) pasca trauma puntir. KLIK, LOCKING, giving way. McMurray test (+), Apley (+), Thessaly (+). Joint line tenderness. MRI: GOLD STANDARD.',dd:'ACL tear, OA genu, Bursitis, Fraktur kondilus, Plica syndrome',tx:'Akut: RICE, NSAID. Tear kecil/stabil: konservatif + fisioterapi 6-12 minggu. Locking/gagal konservatif: ARTROSKOPI.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'ruptur_achilles',name:'Ruptur Tendon Achilles',years:[2025],ss:'Bunyi POP tiba-tiba, nyeri tumit posterior, tidak bisa berdiri di ujung jari. THOMPSON TEST (+): meremas betis tidak menggerakkan kaki. Gap di tendon teraba.',dd:'Tendinitis achilles (nyeri kronik, tendon intak), Avulsi kalkaneus, Ruptur parsial',tx:'Konservatif: cast equinus 6-8 minggu. Operasi (tendon repair): lebih baik untuk atlet muda/aktif. Fisioterapi intensif pasca imobilisasi.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},

integumen:[
{id:'mh_mb',name:'Morbus Hansen (MH) Tipe MB',years:[2022,2024],ss:'Lesi kulit >5, bilateral/simetris, eritema atau hipopigmentasi, BATAS TIDAK TEGAS, anestesia. Penebalan saraf perifer multipel (N.ulnaris, N.peroneus, N.auricularis magnus). BTA (+) banyak.',dd:'MH tipe PB, Tinea versikolor, Vitiligo, Granuloma annulare, Lupus kutis',tx:'MDT MB (12 bulan): Rifampisin 600mg+Klofazimin 300mg (supervisor bulanan) + Dapson 100mg+Klofazimin 50mg (harian). Monitor reaksi kusta.',am:'IDENTITAS: Semua usia, lebih sering dewasa, daerah endemis kusta\n\nKELUHAN UTAMA: Bercak kulit mati rasa\n\nSACRED 7:\n1. Lokasi: Kulit seluruh tubuh (bilateral, simetris), juga ada penebalan saraf\n2. Onset/Kronologi: Sangat perlahan, bertahun-tahun, sering tidak disadari\n3. Kuantitas: Lesi >5 di kulit, bilateral\n4. Kualitas: Bercak merah atau putih yang mati rasa (anestesia), batas tidak jelas\n5. Faktor pemberat: Kontak erat lama dengan penderita kusta tidak diobati\n6. Faktor peringan: MDT (terapi kusta)\n7. Gejala penyerta: Mati rasa di bercak, kelemahan otot (drop foot, claw hand), penebalan saraf teraba, alis/bulu mata rontok (madarosis)\n\nFUNDAMENTAL 4:\n1. RPS: Sudah berapa lama ada bercak, pernah diterapi MDT sebelumnya, ada cacat/kelumpuhan?\n2. RPD: Riwayat bercak/kusta sebelumnya, pernah diobati MDT?\n3. RPK: Anggota keluarga serumah yang menderita kusta?\n4. Sos-Ek: Kontak erat dengan penderita kusta, tinggal di daerah endemis kusta, sanitasi dan gizi'},
{id:'moluscum',name:'Moluscum Kontagiosum',years:[2023,2024],ss:'Papul kecil (2-5mm), UMBILICATED (cekung di tengah), flesh-colored/putih mutiara, berkelompok. Anak: tubuh/wajah/ekstremitas. Dewasa seksual aktif: genital.',dd:'Varicella (vesikel, demam), Kutil (veruka), Folikulitis, MH nodular',tx:'Self-limiting pada imunokompeten 6-18 bulan. Krioterapi, kuretase, ekspresi isi papul, asam trikloroasetat.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'tinea_pedis',name:'Tinea Pedis',years:[2022],ss:'Lesi interdigitalis (sela jari 3-4-5), sisik, maserasi, fisura, eritema, gatal. Juga telapak dan dorsum kaki. KOH: hifa bersepta.',dd:'Dermatitis kontak, Psoriasis palmaris, Kandidiasis interdigitalis (lebih basah)',tx:'Antijamur topikal: Klotrimazol/Mikonazol/Terbinafin krim 2x/hari x4 minggu. Luas/rekuren: Terbinafin oral 1x250mg x2 minggu atau Flukonazol. Jaga kaki kering.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'tinea_manuum',name:'Tinea Manuum',years:[2022],ss:'Satu tangan biasanya (TWO FEET-ONE HAND syndrome). Sisik difus, hiperkeratosis, gatal. Sering bersamaan tinea pedis. KOH: hifa bersepta.',dd:'Dermatitis kontak, Psoriasis palmaris, Eksema dishidrotik',tx:'Antijamur topikal 4-6 minggu. Oral jika luas.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'herpes_zoster',name:'Herpes Zoster',years:[2022],ss:'Prodromal: nyeri neuropatik terbakar di dermatom 2-3 hari sebelum lesi. Vesikel berkelompok eritema, unilateral, SATU DERMATOM (tidak melewati garis tengah). Nyeri pasca-herpetik >3 bulan.',dd:'Herpes simpleks, Dermatitis kontak vesikular, Impetigo',tx:'Asiklovir 5x800mg x7 hari (efektif <72 jam). Valasiklovir 3x1000mg x7 hari. Analgetik nyeri akut. Neuralgia postherpetik: Pregabalin/Gabapentin, Amitriptilin.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'fde',name:'FDE (Fixed Drug Eruption)',years:[2022],ss:'Plak eritematosa/hiperpigmentasi bulat oval di tempat SAMA setiap kali minum obat tertentu. Bisa berbentuk bula. Meninggalkan bekas hiperpigmentasi. Obat tersering: Kotrimoksazol, Tetrasiklin, NSAID.',dd:'Urtikaria, Eritema multiforme, Herpes simpleks, Tinea korporis, Selulitis',tx:'HENTIKAN obat penyebab. Kortikosteroid topikal/oral jangka pendek. Antihistamin. Edukasi obat yang harus dihindari seumur hidup.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'dermatitis_atopi',name:'Dermatitis Atopi',years:[2022],ss:'GATAL HEBAT, lesi eksematosa kronik relaps. Lokasi age-specific: bayi (wajah), anak (fleksura siku/lutut), dewasa (leher, tangan). Riwayat atopi keluarga. Kriteria Hanifin-Rajka.',dd:'Dermatitis seboroik, Psoriasis, Skabies, Dermatitis kontak, Tinea',tx:'Pelembab regular (emolien). Kortikosteroid topikal (hidrokortison 1% atau mometason). Antihistamin untuk gatal. Takrolimus/pimekrolimus jika steroid-sensitive area.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'varicella',name:'Varicella',years:[2023],ss:'Lesi POLIMORFIK berbagai stadium bersamaan (makula→papula→vesikel "teardrop"→krusta). Distribusi SENTRIPETAL (wajah, batang tubuh > ekstremitas). Demam, gatal hebat.',dd:'Herpes zoster diseminata, Impetigo bulosa, Hand-foot-mouth disease, Scabies',tx:'Asiklovir 5x800mg x7 hari oral (<24 jam lesi). Antihistamin untuk gatal. Jaga lesi bersih. ISOLASI hingga semua lesi berkrusta.',am:'IDENTITAS: Anak usia sekolah 5-9 th, bisa dewasa (lebih berat), belum vaksin\n\nKELUHAN UTAMA: Bintil-bintil berair gatal di seluruh tubuh disertai demam\n\nSACRED 7:\n1. Lokasi: Mulai dari batang tubuh/wajah → menyebar ke ekstremitas (SENTRIPETAL, beda campak)\n2. Onset/Kronologi: Demam 1-2 hari → muncul bintil merah → berair → mengering (7-10 hari total)\n3. Kuantitas: Bisa ratusan lesi, berbagai stadium bersamaan\n4. Kualitas: Makula → papula → vesikel "teardrop" (embun di kelopak) → krusta. BERBAGAI STADIUM BERSAMAAN\n5. Faktor pemberat: Garukan (infeksi sekunder, jaringan parut)\n6. Faktor peringan: Antihistamin, antipiretik, asiklovir\n7. Gejala penyerta: Gatal HEBAT, demam, lemas, nafsu makan turun\n\nFUNDAMENTAL 4:\n1. RPS: Kontak dengan penderita cacar air 10-21 hari sebelumnya, sudah vaksin varisela?\n2. RPD: Riwayat cacar air sebelumnya (biasanya sekali seumur hidup)\n3. RPK: Anggota keluarga yang sakit serupa?\n4. Sos-Ek: Status imunisasi, kondisi imun (ada penyakit kronik/kemoterapi?), perlu isolasi dari sekolah'},
{id:'dermatitis_numular',name:'Dermatitis Numularis / LSK',years:[2023],ss:'Numularis: plak eksematosa BERBENTUK KOIN, gatal, batas tegas, di ekstremitas. LSK: plak LIKENIFIKASI (penebalan kulit, garis kulit prominen) akibat garukan kronik.',dd:'Tinea korporis (KOH positif), Psoriasis (skuama tebal putih), Dermatitis atopi',tx:'Kortikosteroid topikal potensi sedang-kuat. Emolien. Antihistamin. LSK: oklusi dengan balutan. Hindari garukan.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'insect_bite',name:'Insect Bite',years:[2023],ss:'Papul eritematosa, edema lokal, gatal/nyeri di area gigitan serangga. CENTRAL PUNCTUM (+). Reaksi lokal vs sistemik (anafilaksis). Papular urtikaria pada anak sensitif.',dd:'Urtikaria, Folikulitis, Scabies, Impetigo, Reaksi obat',tx:'Kompres dingin. Antihistamin oral (Loratadin/Cetirizin). Kortikosteroid topikal. Anafilaksis: Epinefrin IM.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'pityriasis_rosea',name:'Pityriasis Rosea',years:[2023],ss:'"HERALD PATCH": plak oval tunggal di batang tubuh terlebih dahulu, diikuti lesi sekunder mengikuti garis kulit (pola POHON CEMARA/Christmas tree). Gatal ringan. Self-limiting 6-12 minggu.',dd:'Tinea korporis (KOH positif), Psoriasis gutata, SIFILIS SEKUNDER (wajib serologis!), Dermatitis seboroik',tx:'Self-limiting. Antihistamin untuk gatal. Kortikosteroid topikal ringan. Emolien. Hindari panas.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'urtikaria',name:'Urtikaria Akut',years:[2023],ss:'WHEAL (edema superfisial) eritematosa, sangat gatal, pucat saat ditekan, HILANG <24 JAM per lesi. Bisa disertai angioedema. Penyebab: makanan, obat, infeksi, fisik.',dd:'Angioedema herediter, Vaskulitis urtikaria, Mastositosis, Anafilaksis',tx:'Antihistamin H1 generasi 2: Cetirizin 10mg atau Loratadin 10mg. Berat: Difenhidramin IM + Kortikosteroid sistemik. Anafilaksis: Epinefrin 0.3mg IM.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'skrofuloderma',name:'Skrofuloderma TB',years:[2024],ss:'Nodul subkutan di atas KGB yang terinfeksi TB (servikal tersering). Berkembang menjadi abses → ulkus dengan TEPI MENGGAUNG (undermining edge) → fistula → sikatrik. BTA (+) dari sekret.',dd:'Sporotrikosis, Aktinomikosis, Karbunkel, Hidradenitis supurativa',tx:'OAT Kategori I: 2RHZE/10RH. Tidak perlu operasi rutin kecuali abses besar (aspirasi).',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'furunkel',name:'Furunkel',years:[2024],ss:'Nodul inflamasi dalam folikel rambut, nyeri, berisi pus, merah. Area gesekan (leher, aksila, bokong, paha). S.aureus penyebab tersering. Karbunkel: furunkel multipel bersatu.',dd:'Kista inklusi terinfeksi, Hidradenitis supurativa, Abses, Nodul acne',tx:'Kompres hangat. Fluktuatif: INSISI DAN DRAINASE. AB: Kloksasilin/Diklosasilin jika selulitis sekitar/multipel. MRSA: TMP-SMX atau Doksisiklin.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'clm',name:'CLM (Cutaneous Larva Migrans)',years:[2024],ss:'JALUR BERKELOK-KELOK eritematosa yang BERGERAK (beberapa mm/hari), gatal hebat. Telapak kaki, bokong, tangan. Riwayat kontak tanah/pasir (pantai). Larva Ancylostoma braziliense.',dd:'Larva migrans viseral, Skabies (terowongan lebih pendek, tidak bergerak cepat), Dermatitis kontak',tx:'Albendazol 400mg/hari x3 hari atau Ivermektin 200mcg/kgBB dosis tunggal. Antihistamin untuk gatal.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'erisipelas',name:'Erisipelas',years:[2024],ss:'Lesi eritematosa superfisial BERBATAS TEGAS dan MENINGGI (dermis + limfatik), tepi kulit jeruk, nyeri, hangat, demam menggigil. Streptokokus beta-hemolitikus grup A tersering.',dd:'Selulitis (batas tidak tegas, lebih dalam), Herpes zoster, Dermatitis kontak, DVT',tx:'Penisilin V 4x500mg x10 hari atau Amoksisilin. Berat: Penisilin G IV. Elevasi ekstremitas. Edukasi faktor risiko.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'dermatitis_venenata',name:'Dermatitis Venenata',years:[2025],ss:'Lesi eritema, edema, vesikel/bula pada area kontak bahan iritan/toksik. BATAS TEGAS mengikuti area kontak. Nyeri > gatal. Onset cepat.',dd:'Dermatitis kontak alergi (lebih lambat, meluas), Selulitis, Luka bakar kimia, Fitofotodermatitis',tx:'Cuci area dengan air mengalir SEGERA. Kortikosteroid topikal/oral. Kompres NaCl. Analgetik. Edukasi hindari iritan.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'erupsi_obat',name:'Erupsi Obat Morbiliformis',years:[2025],ss:'Ruam makulopapular simetris, dimulai batang tubuh menyebar ke ekstremitas, gatal. Muncul 7-14 hari setelah mulai obat baru. Tersering: Ampisilin, Allopurinol, sulfonamid, NSAID.',dd:'Campak/morbili (Koplik spots, batuk, demam tinggi), Roseola, Rubela, DRESS (eosinofilia), SJS/TEN',tx:'HENTIKAN obat penyebab. Antihistamin. Kortikosteroid topikal. Oral kortikosteroid jika berat. Monitor tanda SJS/TEN (lepuh, mukosa).',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'akne_berat',name:'Akne Vulgaris Derajat Berat',years:[2025],ss:'Nodul, kista, abses multipel di wajah/dada/punggung. Nyeri. Sikatrik aktif atau parut pasca inflamasi. Derajat berat: >5 nodul/kista.',dd:'Rosasea (tidak ada komedo, usia >30, flush), Folikulitis, Dermatitis perioral',tx:'Topikal: Adapalen + Benzoil peroksida. Oral: Doksisiklin 2x100mg x3-6 bulan. Berat/rekalsitran: Isotretinoin 0.5-1mg/kgBB/hari (rujuk SpKK).',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'lsk',name:'LSK / Neurodermatitis',years:[2025],ss:'Plak LIKENIFIKASI (kulit menebal, garis kulit prominen, hiperpigmentasi) akibat garukan/gosokan kronik. Sangat gatal - SIKLUS GATAL-GARUK-GATAL. Lokasi: tengkuk, pergelangan, malleolus.',dd:'Psoriasis, Dermatitis atopi, Lichen planus, Dermatitis numularis, Tinea',tx:'Kortikosteroid topikal potensi tinggi (Klobetasol/Betametason) + oklusi. Antihistamin sedasi malam (CTM). Cegah garukan: potong kuku, balutan.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'karbunkel',name:'Karbunkel',years:[2025],ss:'Gabungan beberapa furunkel membentuk massa inflamasi besar dengan MULTIPLE DISCHARGE POINTS. Lebih dalam dan berat dari furunkel. Demam, malaise.',dd:'Furunkel tunggal, Hidradenitis supurativa, Aktinomikosis, Skrofuloderma',tx:'Insisi dan drainase LUAS. Diklosasilin atau Kloksasilin 4x500mg x7-14 hari. MRSA: Kotrimoksazol atau Doksisiklin. Monitor DM sebagai faktor risiko.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},

'hnp':{lok:'Punggung bawah menjalar ke tungkai (L4: medial kaki bawah, L5: punggung kaki, S1: telapak/lateral kaki)',ons:'Bertahap atau mendadak setelah mengangkat benda berat/gerakan membungkuk memutar, berlangsung kronis',kua:'Nyeri tajam menjalar seperti tersengat listrik (nyeri neuropatik/radikuler)',kun:'Sedang-berat, lebih berat saat tertentu',mpb:'Batuk, bersin, mengejan (Valsalva), membungkuk, duduk lama, mengangkat beban',mr:'Berbaring terlentang dengan lutut ditekuk, istirahat total',sis:'Baal/kesemutan di tungkai/kaki (+), kelemahan otot tungkai (sulit berjalan di ujung jari/tumit), gangguan BAK/BAB (red flag kauda ekuina)',rpd:'Riwayat nyeri punggung sebelumnya? Riwayat trauma? Riwayat pekerjaan berat? Riwayat TB? Riwayat keganasan?',rpk:'Riwayat HNP atau nyeri punggung dalam keluarga? Riwayat osteoporosis?',rsos:'Pekerjaan berat/mengangkat beban? Lama duduk? Olahraga? BMI (obesitas)? Kebiasaan postur?'},
'spondilitis_tb':{lok:'Punggung (tengah-bawah), nyeri lokal di vertebra yang terkena, bisa menjalar ke perut/tungkai jika ada penekanan saraf',ons:'Bertahap, kronis, berbulan-bulan, makin lama makin berat',kua:'Nyeri tumpul terus-menerus, tidak membaik dengan istirahat (beda nyeri mekanik)',kun:'Sedang-berat, makin berat seiring waktu',mpb:'Aktivitas, palpasi pada vertebra yang terkena',mr:'Sedikit membaik dengan analgetik, tapi tidak sepenuhnya',sis:'Demam subfebris (+), keringat malam (+), BB turun tanpa sebab (+), nafsu makan turun (+), riwayat TB paru atau kontak TB',rpd:'Riwayat TB paru sebelumnya? Riwayat OAT? Kontak dengan penderita TB? Riwayat HIV/imunosupresi? Riwayat trauma punggung?',rpk:'Riwayat TB dalam keluarga atau kontak serumah?',rsos:'Kepadatan hunian? Kondisi gizi? Riwayat pekerja migran/penjara? Akses kesehatan? Merokok?'},
'meniere':{lok:'Telinga (biasanya satu sisi), rasa penuh/tekanan di telinga, terkait dengan vertigo',ons:'Serangan mendadak, berlangsung 20 menit hingga beberapa jam, lalu membaik sendiri',kua:'Vertigo episodik berputar hebat + tinitus + tuli fluktuatif, terjadi bersamaan (trias Meniere)',kun:'Bervariasi, bisa beberapa kali seminggu atau beberapa kali setahun, intensitas sedang-berat',mpb:'Konsumsi garam berlebih, kafein, alkohol, stres, perubahan tekanan udara',mr:'Istirahat berbaring, menghindari trigger, diet rendah garam',sis:'Mual (+), muntah (+) saat serangan, tuli sensorineural fluktuatif (+), tinitus (dengung/berdenging) (+), telinga terasa penuh (+)',rpd:'Episode serupa sebelumnya? Sudah berapa lama? Frekuensi serangan meningkat? Riwayat infeksi telinga? Riwayat trauma kepala? Riwayat autoimun?',rpk:'Riwayat Meniere dalam keluarga? (ada komponen genetik)',rsos:'Konsumsi garam harian? Kafein/alkohol? Tingkat stres? Pekerjaan dengan paparan kebisingan?'},
'demensia':{lok:'Gangguan fungsi otak menyeluruh (memori, orientasi, bahasa, fungsi eksekutif)',ons:'Sangat bertahap, tidak disadari awalnya, berlangsung bertahun-tahun (kronis progresif)',kua:'Lupa hal baru (memori jangka pendek dahulu), disorientasi tempat/waktu, bingung, perubahan perilaku/kepribadian',kun:'Ringan → sedang → berat, dinilai dengan MMSE/MoCA',mpb:'Lingkungan baru, kelelahan, infeksi, perubahan rutinitas',mr:'Lingkungan familiar, rutinitas teratur, stimulasi kognitif',sis:'Gangguan aktivitas sehari-hari (+), perubahan siklus tidur (+), kadang halusinasi pada stadium lanjut',rpd:'Kapan pertama kali keluarga menyadari perubahan? Riwayat stroke? Riwayat hipertensi, DM, dislipidemia? Riwayat depresi? Riwayat trauma kepala? Obat-obatan yang dikonsumsi?',rpk:'Riwayat Alzheimer/demensia dalam keluarga? Riwayat Down syndrome?',rsos:'Tingkat pendidikan (cadangan kognitif)? Aktivitas sosial/fisik/mental? Kondisi gizi? Pengasuh utama siapa?'},
'tia':{lok:'Tergantung arteri yang terlibat: hemisfer (lengan/wajah/bicara) atau vertebrobasiler (vertigo, diplopia, ataksia)',ons:'Mendadak (dalam detik-menit), REVERSIBEL dalam <24 jam (biasanya <1 jam)',kua:'Kelemahan separuh tubuh, kesulitan bicara, penglihatan kabur/ganda, ataksia, vertigo — lalu HILANG SEMPURNA',kun:'Episode tunggal atau berulang, tiap episode berlangsung menit hingga jam',mpb:'Tidak ada faktor spesifik yang memperberat episode itu sendiri',mr:'Episode berhenti sendiri',sis:'Tidak ada gejala sisa setelah episode, TIDAK ada penurunan kesadaran (umumnya)',rpd:'Episode serupa sebelumnya? Riwayat hipertensi, DM, fibrilasi atrium, dislipidemia, merokok? Riwayat stroke sebelumnya? Konsumsi antiplatelet/antikoagulan?',rpk:'Riwayat stroke atau penyakit jantung dalam keluarga? Riwayat hipertensi/DM keluarga?',rsos:'Merokok? Alkohol? Aktivitas fisik? Pola makan? Kepatuhan obat tekanan darah?'},
'stroke':{lok:'Tergantung area otak: hemisfer kiri (afasia, hemiparesis kanan), hemisfer kanan (hemiparesis kiri, neglect), batang otak (vertigo, diplopia, disfagia)',ons:'MENDADAK saat aktivitas atau istirahat, berlangsung >24 jam atau permanen',kua:'Kelemahan/kelumpuhan separuh tubuh mendadak, bicara pelo/tidak bisa bicara, wajah mencong, penglihatan terganggu',kun:'Bervariasi ringan-berat (NIHSS score)',mpb:'Demam, hiperglikemia, hipertensi tidak terkontrol memperburuk prognosis',mr:'Waktu ke rumah sakit (golden period <4.5 jam untuk trombolisis)',sis:'Penurunan kesadaran (bisa ada/tidak), nyeri kepala mendadak hebat (perdarahan), mual/muntah',rpd:'Riwayat TIA sebelumnya? Riwayat hipertensi, DM, fibrilasi atrium, dislipidemia, penyakit jantung? Riwayat stroke sebelumnya? Obat antiplatelet/antikoagulan?',rpk:'Riwayat stroke, hipertensi, penyakit jantung dalam keluarga?',rsos:'Merokok (+++)? Alkohol? Aktivitas fisik kurang? Stres? Diet tinggi lemak/garam? Kepatuhan obat?'},
'trauma_ms':{lok:'Sesuai level vertebra yang cedera (servikal: tetra, thorakal/lumbal: para), gangguan di bawah level lesi',ons:'Mendadak setelah trauma (kecelakaan, jatuh, olahraga)',kua:'Kelemahan/kelumpuhan, hilang rasa (baal) di bawah level cedera, tidak bisa buang air kecil/besar',kun:'Komplit (total) atau inkomplit (parsial) — ASIA scale A-E',mpb:'Gerakan leher/punggung (risiko cedera sekunder)',mr:'Imobilisasi segera, posisi netral',sis:'Hipotensi (syok neurogenik) +, bradikardia +, retensi urin/inkontinensia, priapismus (cervical)',rpd:'Mekanisme trauma? Riwayat osteoporosis? Riwayat tumor tulang? Riwayat spondilitis?',rpk:'Tidak spesifik',rsos:'Pekerjaan berisiko? Kecelakaan lalu lintas? Olahraga kontak? Penggunaan sabuk pengaman?'},
'meningoensefalitis':{lok:'Kepala (nyeri kepala), leher (kaku kuduk), kesadaran (global)',ons:'Mendadak-subakut, berlangsung hari-minggu, makin berat',kua:'Trias meningitis: demam + nyeri kepala hebat + kaku kuduk, bisa disertai penurunan kesadaran (ensefalitis)',kun:'Sedang-berat, progresif',mpb:'Cahaya (fotofobia), suara (fonofobia), gerakan kepala',mr:'Berbaring tenang, gelap',sis:'Demam tinggi (+), fotofobia (+), mual/muntah (+), kejang (ensefalitis +), petekie (meningokokus), ruam',rpd:'Riwayat infeksi ISPA/telinga/sinusitis sebelumnya? Riwayat TB? Riwayat meningitis sebelumnya? Riwayat imunisasi meningokokus/pneumokokus? Status HIV?',rpk:'Riwayat kontak dengan penderita meningitis (meningokokus menular)?',rsos:'Tinggal di asrama/barak/penjara (risiko meningokokus)? Kondisi imun? Riwayat perjalanan ke daerah endemis?'},
'neuropati_dm':{lok:'Kedua kaki (simetris), dimulai dari ujung jari kaki, naik ke atas (stocking distribution), bisa ke tangan (glove)',ons:'Bertahap, kronis, makin lama makin naik ke atas',kua:'Kesemutan, rasa terbakar, baal seperti memakai kaos kaki, bisa ada nyeri neuropatik (menusuk, seperti tersengat listrik)',kun:'Ringan-sedang-berat, menetap setiap hari',mpb:'Malam hari (nokturnal), udara dingin, berdiri lama',mr:'Gerakan kaki, posisi berbeda',sis:'Riwayat DM tidak terkontrol (+), luka di kaki tidak terasa (+), gangguan ereksi (otonom), diare bergantian konstipasi (otonom)',rpd:'Riwayat DM berapa tahun? Kontrol gula selama ini? HbA1c terakhir? Riwayat komplikasi DM lain (retinopati, nefropati)? Konsumsi alkohol? Defisiensi B12?',rpk:'Riwayat DM dalam keluarga?',rsos:'Kepatuhan minum obat DM? Pola makan? Aktivitas fisik? Kebiasaan merokok? Perawatan kaki?'},
'tarsal_tunnel':{lok:'Telapak kaki bagian medial dan jari-jari kaki, di belakang/bawah malleolus medial, TIDAK menyebar ke atas lutut',ons:'Bertahap, makin berat jika tidak diobati, kronis',kua:'Nyeri, baal, kesemutan, seperti terbakar di telapak kaki',kun:'Ringan-sedang, diperberat aktivitas tertentu',mpb:'Berdiri lama, berjalan jauh, akhir hari, menekan belakang malleolus medial (Tinel sign)',mr:'Istirahat, elevasi kaki, melepas alas kaki sempit',sis:'Bisa ada kelemahan otot kecil kaki, perubahan sensasi telapak kaki',rpd:'Riwayat trauma ankle? Riwayat varises kaki? Riwayat RA atau arthritis? Riwayat DM (neuropati tumpang tindih)?',rpk:'Tidak spesifik',rsos:'Jenis pekerjaan (berdiri lama)? Jenis alas kaki? Berat badan (obesitas menekan)?'},
'ptsd':{lok:'Psikologis — pikiran, emosi, perilaku, dan reaksi tubuh (bukan nyeri fisik spesifik)',ons:'Gejala muncul setelah peristiwa traumatik, umumnya dalam 1 bulan, harus berlangsung >1 bulan',kua:'Flashback/mimpi buruk (re-experiencing), menghindari pengingat trauma (avoidance), selalu waspada berlebih (hyperarousal), pikiran/perasaan negatif menetap',kun:'Gejala mengganggu fungsi sosial/pekerjaan/kehidupan sehari-hari secara bermakna',mpb:'Pengingat trauma (tempat, suara, orang), tanggal anniversary, stres tambahan, alkohol',mr:'Dukungan sosial, perasaan aman, terapi',sis:'Insomnia (+), mudah terkejut (+), sulit berkonsentrasi (+), iritabel (+), bisa ada gejala somatik (nyeri kepala, nyeri dada)',rpd:'Peristiwa traumatik apa yang dialami? Kapan? Gejala depresif bersamaan? Riwayat trauma masa kecil? Pernah mendapat terapi psikologis? Riwayat penyalahgunaan zat?',rpk:'Riwayat gangguan psikiatri dalam keluarga? (meningkatkan kerentanan)',rsos:'Dukungan sosial (keluarga/teman)? Pekerjaan? Status pernikahan? Pernah/masih terpapar lingkungan traumatik? Akses layanan kesehatan mental?'},
'baby_blues':{lok:'Emosi dan mood (bukan keluhan fisik spesifik)',ons:'Baby blues: hari 2-3 postpartum. Depresi PP: dalam 4 minggu postpartum, berlangsung >2 minggu',kua:'Mood labil, mudah menangis tanpa sebab jelas, rasa sedih, khawatir berlebih tentang bayi, rasa tidak mampu merawat bayi',kun:'Baby blues: ringan, self-limiting <2 minggu. Depresi PP: sedang-berat, mengganggu fungsi',mpb:'Kelelahan, kurang tidur, kurang dukungan, masalah menyusui, bayi rewel',mr:'Dukungan keluarga, istirahat cukup, berbagi perasaan',sis:'Insomnia (sulit tidur bahkan saat bayi tidur) (+), nafsu makan turun (+), energi rendah (+), anhedonia (depresi PP)',rpd:'Riwayat depresi sebelumnya (terutama premenstrual/kehamilan sebelumnya)? Riwayat gangguan bipolar? Ini kehamilan ke berapa? Proses persalinan? Dukungan pasangan?',rpk:'Riwayat depresi/gangguan psikiatri dalam keluarga?',rsos:'Dukungan suami dan keluarga? Kondisi finansial? Tinggal sendiri/bersama keluarga? Pengalaman ibu sebelumnya? Stressor sosial saat hamil?'},
'gad':{lok:'Psikologis (pikiran, kekhawatiran) + gejala fisik somatik (bukan nyeri satu lokasi)',ons:'Bertahap, kronis, berlangsung ≥6 bulan, sering sulit mengidentifikasi kapan mulai',kua:'Khawatir berlebih sulit dikontrol tentang berbagai hal sehari-hari (pekerjaan, kesehatan, keuangan, keluarga)',kun:'Sedang-berat, hampir setiap hari, mengganggu fungsi sosial/pekerjaan',mpb:'Stres, ketidakpastian, kelelahan, kafein',mr:'Aktivitas menyenangkan, relaksasi, olahraga, kebersamaan dengan orang terpercaya',sis:'Gelisah/tidak bisa diam (+), mudah lelah (+), sulit konsentrasi (+), tegang otot/pegal (+), iritabel (+), gangguan tidur (+)',rpd:'Kapan pertama kali gejala muncul? Peristiwa pemicu? Riwayat gangguan panik/fobia? Riwayat depresi? Riwayat penyakit tiroid? Pernah terapi?',rpk:'Riwayat ansietas/depresi dalam keluarga?',rsos:'Sumber stres utama (pekerjaan/keuangan/hubungan)? Konsumsi kafein/alkohol? Aktivitas fisik? Dukungan sosial? Pola tidur?'},
'insomnia':{lok:'Gangguan tidur (tidak ada lokasi nyeri spesifik), bisa disertai kekhawatiran tentang tidur',ons:'Akut (<1 bulan) atau kronik (≥3 bulan, ≥3 malam/minggu). Kapan mulai? Ada pemicu?',kua:'Sulit memulai tidur (early/sleep onset), sering terbangun malam (middle), bangun terlalu pagi (late/terminal)',kun:'Berlangsung ≥3 malam/minggu, berdampak pada fungsi siang hari',mpb:'Kafein, gadget, cahaya, kebisingan, pikiran berlebih, tidur siang, tidak teratur',mr:'Lingkungan gelap dan tenang, rutinitas tidur, relaksasi, olahraga sore',sis:'Mengantuk di siang hari (+), sulit konsentrasi (+), mudah marah (+), performa kerja menurun (+), kecemasan tentang tidur (anxious arousal)',rpd:'Kapan mulai? Ada pemicu (stres, penyakit, obat, pindah rumah)? Riwayat sleep apnea (mendengkur, henti napas)? Riwayat depresi/ansietas? Obat-obatan apa yang dikonsumsi?',rpk:'Riwayat insomnia dalam keluarga?',rsos:'Pekerjaan shift malam? Kebiasaan sebelum tidur (gadget, kopi)? Kondisi kamar tidur? Stres pekerjaan/keluarga? Konsumsi alkohol?'},
'gizi_buruk':{lok:'Seluruh tubuh (gangguan pertumbuhan dan fungsi organ sistemik)',ons:'Bertahap berbulan-bulan, sering tidak disadari keluarga',kua:'Anak tampak sangat kurus, lemah, tidak aktif, kulit mengendur, apatis atau rewel',kun:'Berat, dinilai Z-score <-3 SD untuk BB/U atau BB/TB',mpb:'Infeksi berulang, diare kronis, asupan makan sangat sedikit',mr:'Pemberian nutrisi adekuat secara bertahap (F-75 → F-100)',sis:'Rambut rontok/jarang (+), kulit kering bersisik (+), edema (kwashiorkor) atau tidak ada edema (marasmus), hipotermia (+), hipoglikemia (+)',rpd:'Riwayat BB lahir? Pola makan sejak lahir? Riwayat ASI eksklusif? Riwayat infeksi berulang (diare, ISPA, TB)? Riwayat imunisasi? Perkembangan sebelumnya?',rpk:'Saudara kandung dengan masalah gizi? Riwayat penyakit kronis dalam keluarga? Kondisi ekonomi keluarga?',rsos:'Penghasilan keluarga? Akses makanan bergizi? Pola asuh? Sanitasi? Pendidikan ibu? Jumlah anak dalam keluarga?'},
'blefaritis':{lok:'Tepi kelopak mata (margo palpebra), bilateral biasanya, tidak menyebar',ons:'Kronik, berbulan-bulan hingga bertahun-tahun, sering kambuh',kua:'Gatal, rasa terbakar, sensasi seperti ada pasir di mata, mata merah dan bersisik di pagi hari',kun:'Ringan-sedang, kronik rekuren',mpb:'Pagi hari (krusta), lingkungan berangin/berdebu, penggunaan lensa kontak, rokok, rosacea',mr:'Kompres hangat, membersihkan tepi kelopak',sis:'Dry eye (+), mata merah (+), silau (+), bisa ada chalazion/hordeolum berulang',rpd:'Sudah berapa lama? Riwayat rosacea, dermatitis seboroik? Riwayat dry eye? Riwayat diabetes? Penggunaan lensa kontak?',rpk:'Riwayat rosacea/dermatitis dalam keluarga?',rsos:'Kebersihan wajah? Penggunaan make-up mata? Pekerjaan di lingkungan berdebu? Konsumsi omega-3?'},
'oma_supuratif':{lok:'Dalam telinga (satu/kedua sisi), nyeri di dalam telinga, TIDAK menyebar',ons:'Mendadak, biasanya 1-7 hari setelah ISPA, berlangsung hari-minggu',kua:'Nyeri telinga (otalgia) menusuk/berdenyut, makin berat, lalu berkurang saat membran timpani perforasi (keluar cairan)',kun:'Sedang-berat pada fase akut',mpb:'Berbaring, mengunyah, menelan, tekanan udara (naik pesawat), tidur malam',mr:'Tegak, analgetik',sis:'Demam (+), riwayat ISPA (+), hidung tersumbat (+), pendengaran menurun (+), keluar cairan dari telinga jika sudah perforasi (+)',rpd:'Episode serupa sebelumnya? Riwayat OMA berulang? Riwayat operasi telinga? Riwayat alergi? Riwayat imunisasi pneumokokus/influenza?',rpk:'Riwayat OMA berulang dalam keluarga (anak)? Riwayat alergi?',rsos:'Paparan asap rokok (anak)? Penggunaan dot/botol susu sambil tiduran? Anak sekolah/daycare (risiko infeksi)? Status imunisasi anak?'},
'rhinitis_alergi':{lok:'Hidung (gejala utama) + bisa mata (konjungtivitis alergi), tidak menyebar',ons:'Musiman (intermiten) atau sepanjang tahun (persisten), dipicu alergen spesifik',kua:'Bersin berulang (>5 kali berturutan), hidung gatal, hidung tersumbat, ingus encer bening',kun:'Ringan (tidak mengganggu aktivitas) atau sedang-berat (mengganggu aktivitas/tidur)',mpb:'Paparan alergen (debu, tungau, serbuk bunga, bulu binatang, jamur), udara dingin/kering',mr:'Menjauh dari alergen, antihistamin, berada di dalam ruangan ber-AC',sis:'Mata merah, gatal, berair (konjungtivitis alergi) (+), sakit kepala/wajah (sinusitis komplikasi) (+), gangguan tidur (+), menurun konsentrasi (+)',rpd:'Riwayat asma? Riwayat dermatitis atopi? Kapan pertama kali? Alergen apa yang sudah diketahui? Pernah skin prick test? Pengobatan sebelumnya?',rpk:'Riwayat atopi (asma, rhinitis alergi, dermatitis atopi) dalam keluarga? (trias atopi)',rsos:'Binatang peliharaan di rumah? Kondisi rumah (lembab, karpet tebal, AC kotor)? Pekerjaan (paparan debu/bahan kimia)? Merokok/paparan asap rokok?'},
'asma':{lok:'Dada/saluran napas bawah, bilateral, terasa sesak di seluruh dada',ons:'Episodik, sering malam/dini hari atau setelah aktivitas/paparan pemicu, berlangsung menit-jam',kua:'Sesak napas, mengi (bunyi ngik-ngik saat napas), dada terasa berat/seperti ditekan, batuk terutama malam',kun:'Ringan-sedang-berat-mengancam jiwa (GINA classification)',mpb:'Alergen (debu, bulu, asap), ISPA, aktivitas fisik, udara dingin, stres, aspirin/NSAID (aspirin-exacerbated)',mr:'Bronkodilator (pelega), istirahat, posisi duduk tegak, menjauh dari pemicu',sis:'Riwayat atopi (+), rhinitis alergi (+), dermatitis atopi (+), keluarga dengan asma',rpd:'Riwayat asma sebelumnya? Sejak kapan? Frekuensi serangan? Pernah dirawat/ICU karena asma? Pemicu yang sudah diketahui? Obat-obatan yang dipakai?',rpk:'Riwayat asma atau atopi dalam keluarga?',rsos:'Perokok atau terpapar asap rokok? Pekerjaan (asma akibat kerja)? Kondisi rumah (lembab, karpet, hewan peliharaan)? Olahraga teratur?'},
'ppok':{lok:'Dada/saluran napas, sesak menyebar ke seluruh dada',ons:'Kronis progresif (bertahun-tahun), eksaserbasi: perburukan dalam hari-minggu',kua:'Sesak napas progresif, makin berat bahkan saat istirahat (eksaserbasi), batuk produktif kronik, dahak bertambah/lebih purulen',kun:'Bervariasi stadiumnya (GOLD 1-4), eksaserbasi: sedang-berat',mpb:'Infeksi ISPA, polusi udara, cuaca dingin/berangin, aktivitas, asap rokok',mr:'Bronkodilator, oksigen, posisi duduk condong ke depan (tripod)',sis:'Barrel chest (+), jari tabuh (+), sianosis (+) pada berat, edema kaki (cor pulmonale berat)',rpd:'Riwayat merokok (pack-year)? Sudah berhenti? Riwayat PPOK sebelumnya? Riwayat eksaserbasi/rawat inap sebelumnya? Riwayat paparan debu pekerjaan? Riwayat asma?',rpk:'Riwayat PPOK atau emfisema dalam keluarga? Riwayat defisiensi Alpha-1 antitripsin (familial)?',rsos:'Status merokok (aktif/mantan, berapa bungkus/hari, berapa tahun)? Paparan debu/asap kerja? Kemampuan aktivitas sehari-hari? Kondisi gizi?'},
