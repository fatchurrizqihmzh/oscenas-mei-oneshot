{id:'furunkel',name:'Furunkel',years:[2024],ss:'Nodul inflamasi dalam folikel rambut, nyeri, berisi pus, merah. Area gesekan (leher, aksila, bokong, paha). S.aureus penyebab tersering. Karbunkel: furunkel multipel bersatu.',dd:'Kista inklusi terinfeksi, Hidradenitis supurativa, Abses, Nodul acne',tx:'Kompres hangat. Fluktuatif: INSISI DAN DRAINASE. AB: Kloksasilin/Diklosasilin jika selulitis sekitar/multipel. MRSA: TMP-SMX atau Doksisiklin.'},
{id:'clm',name:'CLM (Cutaneous Larva Migrans)',years:[2024],ss:'JALUR BERKELOK-KELOK eritematosa yang BERGERAK (beberapa mm/hari), gatal hebat. Telapak kaki, bokong, tangan. Riwayat kontak tanah/pasir (pantai). Larva Ancylostoma braziliense.',dd:'Larva migrans viseral, Skabies (terowongan lebih pendek, tidak bergerak cepat), Dermatitis kontak',tx:'Albendazol 400mg/hari x3 hari atau Ivermektin 200mcg/kgBB dosis tunggal. Antihistamin untuk gatal.'},
{id:'erisipelas',name:'Erisipelas',years:[2024],ss:'Lesi eritematosa superfisial BERBATAS TEGAS dan MENINGGI (dermis + limfatik), tepi kulit jeruk, nyeri, hangat, demam menggigil. Streptokokus beta-hemolitikus grup A tersering.',dd:'Selulitis (batas tidak tegas, lebih dalam), Herpes zoster, Dermatitis kontak, DVT',tx:'Penisilin V 4x500mg x10 hari atau Amoksisilin. Berat: Penisilin G IV. Elevasi ekstremitas. Edukasi faktor risiko.'},
{id:'dermatitis_venenata',name:'Dermatitis Venenata',years:[2025],ss:'Lesi eritema, edema, vesikel/bula pada area kontak bahan iritan/toksik. BATAS TEGAS mengikuti area kontak. Nyeri > gatal. Onset cepat.',dd:'Dermatitis kontak alergi (lebih lambat, meluas), Selulitis, Luka bakar kimia, Fitofotodermatitis',tx:'Cuci area dengan air mengalir SEGERA. Kortikosteroid topikal/oral. Kompres NaCl. Analgetik. Edukasi hindari iritan.'},
{id:'erupsi_obat',name:'Erupsi Obat Morbiliformis',years:[2025],ss:'Ruam makulopapular simetris, dimulai batang tubuh menyebar ke ekstremitas, gatal. Muncul 7-14 hari setelah mulai obat baru. Tersering: Ampisilin, Allopurinol, sulfonamid, NSAID.',dd:'Campak/morbili (Koplik spots, batuk, demam tinggi), Roseola, Rubela, DRESS (eosinofilia), SJS/TEN',tx:'HENTIKAN obat penyebab. Antihistamin. Kortikosteroid topikal. Oral kortikosteroid jika berat. Monitor tanda SJS/TEN (lepuh, mukosa).'},
{id:'akne_berat',name:'Akne Vulgaris Derajat Berat',years:[2025],ss:'Nodul, kista, abses multipel di wajah/dada/punggung. Nyeri. Sikatrik aktif atau parut pasca inflamasi. Derajat berat: >5 nodul/kista.',dd:'Rosasea (tidak ada komedo, usia >30, flush), Folikulitis, Dermatitis perioral',tx:'Topikal: Adapalen + Benzoil peroksida. Oral: Doksisiklin 2x100mg x3-6 bulan. Berat/rekalsitran: Isotretinoin 0.5-1mg/kgBB/hari (rujuk SpKK).'},
{id:'lsk',name:'LSK / Neurodermatitis',years:[2025],ss:'Plak LIKENIFIKASI (kulit menebal, garis kulit prominen, hiperpigmentasi) akibat garukan/gosokan kronik. Sangat gatal - SIKLUS GATAL-GARUK-GATAL. Lokasi: tengkuk, pergelangan, malleolus.',dd:'Psoriasis, Dermatitis atopi, Lichen planus, Dermatitis numularis, Tinea',tx:'Kortikosteroid topikal potensi tinggi (Klobetasol/Betametason) + oklusi. Antihistamin sedasi malam (CTM). Cegah garukan: potong kuku, balutan.'},
{id:'karbunkel',name:'Karbunkel',years:[2025],ss:'Gabungan beberapa furunkel membentuk massa inflamasi besar dengan MULTIPLE DISCHARGE POINTS. Lebih dalam dan berat dari furunkel. Demam, malaise.',dd:'Furunkel tunggal, Hidradenitis supurativa, Aktinomikosis, Skrofuloderma',tx:'Insisi dan drainase LUAS. Diklosasilin atau Kloksasilin 4x500mg x7-14 hari. MRSA: Kotrimoksazol atau Doksisiklin. Monitor DM sebagai faktor risiko.'},
],
}

let activeSys='all', activeYears=new Set([2022,2023,2024,2025]), searchQ=''
let isDark = localStorage.getItem('osce_theme') !== 'light'
function applyTheme(){
  document.body.classList.toggle('light', !isDark)
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light' : '🌙 Dark'
}
function toggleTheme(){
  isDark = !isDark
  localStorage.setItem('osce_theme', isDark ? 'dark' : 'light')
  applyTheme()
}
applyTheme()
const sk=id=>'osce4_'+id
const loadNote=id=>{try{return JSON.parse(localStorage.getItem(sk(id)))||{}}catch{return{}}}
const saveNote=(id,obj)=>localStorage.setItem(sk(id),JSON.stringify(obj))
const clearNote=id=>localStorage.removeItem(sk(id))

function buildNav(){
  const mkItems=container=>{
    const allCnt=SYSTEMS.reduce((a,s)=>a+visibleCount(s.key),0)
    container.innerHTML=`
      <div class="side-label">Sistem Organ</div>
      <div class="side-item ${activeSys==='all'?'active':''}" onclick="setSys('all')">
        <span class="side-icon">📋</span><span class="side-name">Semua Sistem</span>
        <span class="side-count">${allCnt}</span>
      </div>
      <div class="side-divider"></div>
      ${SYSTEMS.map(s=>`<div class="side-item ${activeSys===s.key?'active':''}" onclick="setSys('${s.key}')">
        <span class="side-icon">${s.icon}</span><span class="side-name">${s.label}</span>
        <span class="side-count">${visibleCount(s.key)}</span>
      </div>`).join('')}`
  }
  mkItems(document.getElementById('sidebar'))
  mkItems(document.getElementById('overlayNav'))
}

function visibleCount(key){return(DATA[key]||[]).filter(t=>t.years.some(y=>activeYears.has(y))).length}

function setSys(key){
  activeSys=key
  document.getElementById('activeSysLabel').textContent=key==='all'?'Semua Sistem':(SYSTEMS.find(s=>s.key===key)||{}).label||''
  buildNav(); render(); closeOverlay()
  window.scrollTo({top:0,behavior:'smooth'})
}

function toggleYr(yr,btn){
  if(activeYears.has(yr)&&activeYears.size===1)return
  if(activeYears.has(yr)){activeYears.delete(yr);btn.className='yr-btn'}
  else{activeYears.add(yr);btn.className=`yr-btn on-${yr}`}
  buildNav(); render()
}

document.getElementById('searchInput').addEventListener('input',function(){
  searchQ=this.value.toLowerCase().trim()
  document.getElementById('searchClear').style.display=searchQ?'block':'none'
  render()
})
function clearSearch(){searchQ='';document.getElementById('searchInput').value='';document.getElementById('searchClear').style.display='none';render()}

function toggleCard(id){
  const c=document.getElementById('card_'+id)
  if(c) c.classList.toggle('open')
}

function saveCard(id,e){
  if(e)e.stopPropagation()
  const ss=document.getElementById('ss_'+id)?.value||''
  const dd=document.getElementById('dd_'+id)?.value||''
  const tx=document.getElementById('tx_'+id)?.value||''
  saveNote(id,{ss,dd,tx})
  const btn=document.getElementById('sb_'+id)
  if(btn){const orig=btn.textContent;btn.textContent='✓ Tersimpan!';btn.className='btn-save flash';setTimeout(()=>{btn.textContent=orig;btn.className='btn-save'},2000)}
  updateStats(); toast('✓ Catatan tersimpan')
}

function resetCard(id,e){
  if(e)e.stopPropagation()
  if(!confirm('Reset ke data default?'))return
  clearNote(id)
  const t=Object.values(DATA).flat().find(x=>x.id===id)
  if(!t)return
  const el=f=>document.getElementById(f+'_'+id)
  if(el('ss'))el('ss').value=t.ss||''
  if(el('dd'))el('dd').value=t.dd||''
  if(el('tx'))el('tx').value=t.tx||''
  updateStats(); toast('🔄 Direset ke default')
}

function saveAll(){
  let n=0
  document.querySelectorAll('.card').forEach(card=>{
    const id=card.dataset.id
    if(!id)return
    const ss=document.getElementById('ss_'+id)?.value
    if(ss!==undefined){saveNote(id,{ss,dd:document.getElementById('dd_'+id)?.value||'',tx:document.getElementById('tx_'+id)?.value||''});n++}
  })
  const btn=document.querySelector('.btn-save-all')
  btn.textContent='✓ Semua Tersimpan!';btn.style.background='#059669'
  setTimeout(()=>{btn.textContent='💾 Simpan Semua';btn.style.background=''},2500)
  updateStats(); toast(`✓ ${n} catatan tersimpan`)
}

function openOverlay(){document.getElementById('overlay').classList.add('show')}
function closeOverlay(){document.getElementById('overlay').classList.remove('show')}

function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show')
  setTimeout(()=>t.classList.remove('show'),2200)
}

function updateStats(){
  const rows=getRows()
  let total=0,multi=0,filled=0
  rows.forEach(({list})=>list.forEach(t=>{
    total++;if(t.years.length>1)multi++
    const n=loadNote(t.id);if(n.ss||n.dd||n.tx)filled++
  }))
  document.getElementById('statTotal').textContent=total
  document.getElementById('statMulti').textContent=multi
  document.getElementById('statFilled').textContent=filled
}

function getRows(){
  const sys=activeSys==='all'?SYSTEMS:SYSTEMS.filter(s=>s.key===activeSys)
  return sys.map(s=>({sys:s,list:(DATA[s.key]||[]).filter(t=>{
    if(!t.years.some(y=>activeYears.has(y)))return false
    if(!searchQ)return true
    return [t.name,t.ss,t.dd,t.tx].join(' ').toLowerCase().includes(searchQ)
  })})).filter(r=>r.list.length>0)
}

function escH(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

function render(){
  const rows=getRows()
  if(!rows.length){
    document.getElementById('content').innerHTML='<div class="empty"><div class="empty-icon">🔍</div><strong>Tidak ada topik ditemukan</strong><br><small>Coba ubah filter atau kata kunci</small></div>'
    updateStats();return
  }
  document.getElementById('content').innerHTML=rows.map(({sys,list})=>`
    <div class="sys-section">
      <div class="sys-head">
        <span style="font-size:18px">${sys.icon}</span>
        <h2>${sys.label}</h2>
        <span class="sys-count">${list.length} topik</span>
      </div>
      ${list.map(t=>{
        const note=loadNote(t.id)
        const ss=note.ss!==undefined?note.ss:(t.ss||'')
        const dd=note.dd!==undefined?note.dd:(t.dd||'')
        const tx=note.tx!==undefined?note.tx:(t.tx||'')
        const hasSaved=Object.keys(note).length>0
        const isMulti=t.years.length>1
        const dots=['#60a5fa','#fb923c','#34d399'].map((c,i)=>{
          const v=[ss,dd,tx][i]
          return`<div class="dot" style="background:${v?c:'var(--border)'};opacity:${v?1:0.3}"></div>`
        }).join('')
        return`<div class="card" id="card_${t.id}" data-id="${t.id}">
          <div class="card-head" onclick="toggleCard('${t.id}')">
            <div class="card-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></div>
            <div class="card-info">
              <div class="card-name">${t.name}</div>
              <div class="card-tags">
                ${t.years.map(y=>`<span class="tag tag-${y}">Mei ${y}</span>`).join('')}
                ${isMulti?`<span class="tag tag-multi">🔁 ${t.years.length}× muncul</span>`:''}
                ${hasSaved&&(ss||dd||tx)?'<span class="tag tag-saved">✓ tersimpan</span>':''}
              </div>
            </div>
            <div class="dots">${dots}</div>
          </div>
          <div class="card-body">
            <div class="fields">
              <div class="field-group">
                <div class="field-label ss">🔵 Signs &amp; Symptoms</div>
                <textarea id="ss_${t.id}" class="ss-ta" placeholder="Tanda dan gejala khas..." onclick="event.stopPropagation()">${escH(ss)}</textarea>
              </div>
              <div class="field-group">
                <div class="field-label dd">🟠 Diagnosis Banding</div>
                <textarea id="dd_${t.id}" class="dd-ta" placeholder="Diagnosis banding utama..." onclick="event.stopPropagation()">${escH(dd)}</textarea>
              </div>
              <div class="field-group">
                <div class="field-label tx">🟢 Tatalaksana</div>
                <textarea id="tx_${t.id}" class="tx-ta" placeholder="Tatalaksana farmako & non-farmako..." onclick="event.stopPropagation()">${escH(tx)}</textarea>
              </div>
            </div>
            <div class="card-actions">
              <button class="btn-reset" onclick="resetCard('${t.id}',event)">Reset</button>
              <button class="btn-save" id="sb_${t.id}" onclick="saveCard('${t.id}',event)">💾 Simpan</button>
            </div>
          </div>
        </div>`
      }).join('')}
    </div>`).join('')
  updateStats()
}

buildNav(); render()
</script>
</body>
</html>
