'appendisitis':{lok:'Awalnya periumbilikal (pusar), lalu BERPINDAH ke RLQ (perut kanan bawah) — migrasi nyeri khas!',ons:'Mendadak-subakut, berlangsung jam hingga hari, makin berat',kua:'Nyeri terus-menerus (bukan kolik), makin berat saat bergerak, batuk, atau ditekan',kun:'Sedang-berat, makin memburuk',mpb:'Bergerak, berjalan, batuk, ditekan perut kanan bawah',mr:'Berbaring diam dengan lutut sedikit ditekuk',sis:'Demam subfebris (37.5-38.5°C) (+), mual (+), muntah 1-2x (+), nafsu makan turun (+), konstipasi atau diare ringan',rpd:'Riwayat nyeri perut kanan bawah sebelumnya? Riwayat operasi perut? Riwayat batu ginjal/ureter? (Pada wanita: riwayat haid terakhir, kemungkinan hamil, riwayat kista ovarium)',rpk:'Riwayat appendisitis dalam keluarga? (ada komponen familial)',rsos:'Pola makan (rendah serat)? Konsumsi air putih? Aktivitas fisik? (Pada wanita: riwayat seksual, kontrasepsi)'},
'gerd':{lok:'Epigastrik (ulu hati) menjalar ke dada (retrosternal), kadang ke leher/tenggorokan, TIDAK ke lengan',ons:'Setelah makan, saat berbaring atau membungkuk, berlangsung menit-jam',kua:'Rasa terbakar/panas di dada (heartburn), asam/pahit di mulut (regurgitasi), sensasi ada sesuatu naik dari perut ke tenggorokan',kun:'Ringan-sedang, bisa setiap hari atau hanya setelah makan besar tertentu',mpb:'Makan besar, makanan berlemak/asam/pedas/coklat/kafein/alkohol, berbaring setelah makan, obesitas, hamil, pakaian ketat',mr:'Antasida, tegak duduk, minum air, menghindari makanan pemicu',sis:'Batuk kronik (terutama malam) (+), suara serak pagi hari (+), sensasi ada yang mengganjal di tenggorokan (+)',rpd:'Kapan pertama kali? Riwayat ulkus peptikum? Riwayat endoskopi? Pernah mendapat PPI? Gejala alarm: disfagia, penurunan BB, hematemesis?',rpk:'Riwayat GERD, Barrett\'s esophagus, atau kanker esofagus dalam keluarga?',rsos:'Pola makan (waktu, jumlah, jenis)? IMT/obesitas? Merokok (relaksasi LES)? Alkohol? Konsumsi obat NSAID/aspirin? Pekerjaan yang membutuhkan membungkuk?'},
'tifoid':{lok:'Perut (nyeri difus, terutama epigastrik-umbilikal), demam sistemik',ons:'Bertahap, demam naik STEPLADDER (naik setiap hari), biasanya hari ke-7 sudah tinggi',kua:'Demam naik bertahap tidak turun sempurna, nyeri perut tumpul, lidah terasa tidak enak',kun:'Sedang-berat, makin berat tanpa pengobatan',mpb:'Tanpa pengobatan, komplikasi (perforasi usus)',mr:'Antibiotik tepat, tirah baring, diet lunak',sis:'Demam (+), lidah tifoid (putih kotor tepi merah) (+), perut kembung (+), konstipasi (awal) atau diare (lanjut) (+), bradikardi relatif (+), hepatosplenomegali (+)',rpd:'Riwayat tifoid sebelumnya? Kapan? Pernah mendapat vaksin tifoid? Riwayat konsumsi air/makanan tidak bersih?',rpk:'Ada anggota keluarga yang sakit serupa? (kemungkinan sumber kontaminasi yang sama)',rsos:'Sumber air minum? Kebiasaan makan di luar (warung pinggir jalan)? Kebersihan tangan? Sanitasi lingkungan? Status vaksinasi tifoid?'},
'hepatitis_a':{lok:'Perut kanan atas (nyeri tekan hati), mata dan kulit (ikterus sistemik)',ons:'Fase prodromal 1-2 minggu: flu-like, lalu fase ikterik 1-3 minggu',kua:'Demam, mual, lemas, lalu muncul kuning (ikterus), urin gelap seperti teh, feses pucat',kun:'Ringan-sedang, self-limiting',mpb:'Alkohol (wajib dihindari), obat hepatotoksik',mr:'Istirahat, diet cukup kalori',sis:'Demam (+), mual/muntah (+), ikterus (+), urin gelap (+), feses pucat (+), hepatomegali nyeri tekan (+), malaise berat',rpd:'Riwayat hepatitis sebelumnya? Riwayat penyakit hati? Vaksin hepatitis A? Riwayat konsumsi alkohol? Obat-obatan (hepatotoksik)?',rpk:'Ada anggota keluarga/kontak yang mengalami gejala serupa? (wabah hepatitis A)',rsos:'Sumber air minum? Makan kerang/seafood mentah? Perjalanan ke daerah endemis? Sanitasi? Status vaksinasi hepatitis A dan B?'},
'gnaps':{lok:'Urin (perubahan warna), wajah (edema), umum (hipertensi)',ons:'Mendadak, 1-3 minggu SETELAH infeksi tenggorokan atau kulit (Streptokokus)',kua:'Urin berwarna merah/kecoklatan seperti cola/air cucian daging, wajah bengkak (terutama pagi), tekanan darah naik',kun:'Sedang-berat, umumnya membaik dalam 2-4 minggu',mpb:'Asupan garam dan cairan berlebih (memperburuk edema/hipertensi)',mr:'Tirah baring, diet rendah garam, antihipertensi',sis:'Edema periorbita pagi hari (+), hematuria (+), oliguria (+), hipertensi (+), demam ringan (+), riwayat ISPA/impetigo 1-3 minggu sebelumnya',rpd:'Riwayat ISPA/infeksi kulit belakangan ini? Pernah sakit serupa? Riwayat penyakit ginjal? Riwayat hipertensi?',rpk:'Riwayat penyakit ginjal dalam keluarga? Riwayat GNAPS dalam keluarga?',rsos:'Kondisi sanitasi? Kepadatan hunian? Status gizi? Riwayat imunisasi?'},
'sistitis':{lok:'Kandung kemih (suprapubik), uretra (saat BAK), TIDAK ada nyeri pinggang/punggung',ons:'Mendadak, biasanya beberapa hari setelah faktor risiko',kua:'Nyeri/rasa terbakar saat BAK (disuria), sering BAK walau sedikit (polakisuria), tiba-tiba ingin BAK tidak bisa ditahan (urgency)',kun:'Ringan-sedang, mengganggu aktivitas',mpb:'Menahan BAK, kurang minum air, hubungan seksual (honeymoon cystitis), pemakaian kateter',mr:'Banyak minum air, sering BAK, antibiotik',sis:'TIDAK ada demam tinggi, TIDAK ada nyeri pinggang, bisa ada urin keruh/berbau, bisa ada hematuria ringan',rpd:'Episode serupa sebelumnya? Berapa kali? Riwayat ISK rekuren? Riwayat batu ginjal? Riwayat DM (faktor risiko)? Riwayat abnormalitas saluran kemih?',rpk:'Tidak spesifik',rsos:'(Wanita) Aktivitas seksual? Higiene setelah BAB (front-to-back)? Penggunaan kontrasepsi (diafragma/spermatisida)? Banyak minum? Menopause (atrofi uretra)?'},
'pap_smear':{lok:'Serviks (tidak ada gejala nyeri untuk skrining rutin), atau perdarahan/keputihan jika ada kelainan',ons:'Prosedur skrining preventif atau karena keluhan perdarahan pasca-sanggama/intermenstrual',kua:'Skrining: tidak ada gejala (asimtomatik). Jika ada kelainan: perdarahan tidak normal, keputihan berbau',kun:'Skrining: tiap 3 tahun (sitologi) atau tiap 5 tahun (sitologi+HPV co-test)',mpb:'N/A untuk skrining rutin',mr:'N/A',sis:'Skrining: pasien sehat tanpa keluhan. Jika ada lesi: keputihan (+), nyeri panggul, perdarahan pasca-sanggama',rpd:'Kapan PAP smear terakhir? Hasilnya? Riwayat infeksi HPV? Riwayat IMS (klamidia, gonore)? Riwayat displasia/CIN? Status vaksinasi HPV?',rpk:'Riwayat kanker serviks dalam keluarga?',rsos:'Usia pertama aktif seksual? Jumlah pasangan seksual? Merokok (meningkatkan risiko ca serviks)? Kontrasepsi oral jangka panjang? Status imun (HIV)?'},
'bv':{lok:'Vagina dan vulva, tidak menyebar',ons:'Bisa mendadak atau bertahap, sering setelah hubungan seksual atau menstruasi',kua:'Keputihan abu-abu homogen encer dengan BAU AMIS (fishy odor) yang mencolok, terutama setelah berhubungan seksual',kun:'Ringan-sedang, sering tidak ada gejala (50% asimtomatik)',mpb:'Setelah berhubungan seksual, setelah menstruasi, penggunaan sabun/douching vagina',mr:'Menjaga kebersihan vagina, menghindari douching',sis:'Biasanya tidak ada demam (tidak ada inflamasi), tidak ada gatal bermakna (beda kandidiasis), tidak ada nyeri panggul',rpd:'Episode serupa sebelumnya? Riwayat IMS? Riwayat konsumsi antibiotik baru-baru ini? Riwayat infeksi jamur?',rpk:'Tidak spesifik',rsos:'Pasangan seksual (baru/ganti)? Higiene vagina (douching merusak flora normal)? Penggunaan kontrasepsi? AKDR meningkatkan risiko BV? Status merokok?'},
'dm2':{lok:'Sistemik — tidak ada lokasi nyeri spesifik kecuali ada komplikasi (kaki baal, nyeri, luka)',ons:'Sangat bertahap, sering tanpa gejala, ditemukan saat skrining/cek rutin',kua:'Sering kencing terutama malam (poliuria), sering haus (polidipsi), sering lapar (polifagia) meski BB turun, lemas',kun:'Ringan-sedang, banyak yang tidak sadar sampai ada komplikasi',mpb:'Makan tinggi karbohidrat/gula, tidak minum obat, stres, infeksi',mr:'Diet sehat, olahraga, obat antidiabetik',sis:'Luka sulit sembuh (+), sering infeksi (kulit/saluran kemih) (+), gangguan penglihatan kabur (+), kesemutan kaki (+), disfungsi ereksi (+)',rpd:'Kapan pertama kali didiagnosis DM? HbA1c terakhir? Obat yang dikonsumsi? Riwayat komplikasi (retinopati, nefropati, neuropati, KAD)? Riwayat penyakit jantung?',rpk:'Riwayat DM tipe 2 dalam keluarga? (risiko meningkat 2-6x lipat)',rsos:'Pola makan (karbohidrat, gula)? Aktivitas fisik? BMI (obesitas sentral)? Kepatuhan minum obat? Merokok? Alkohol? Cek gula rutin?'},
'malaria':{lok:'Sistemik — demam, menggigil, berkeringat (paroksismal), nyeri kepala, mual. Nyeri perut/punggung bisa ada',ons:'Tiba-tiba, paroksismal — siklus demam menggigil-puncak-berkeringat (Plasmodium falciparum: tidak teratur)',kua:'Demam tinggi mendadak disertai menggigil hebat, lalu berkeringat banyak dan suhu turun, nyeri kepala berat, mual',kun:'Sedang-berat, berulang siklik (falciparum: bisa setiap hari tidak teratur)',mpb:'Tanpa pengobatan, imunosupresi, kehamilan',mr:'ACT, antipiretik',sis:'Splenomegali (+) jika kronik, anemia (+), ikterus (+) pada berat, penurunan kesadaran (malaria serebral - falciparum)',rpd:'Riwayat malaria sebelumnya? Kapan? Sudah pernah diobati? Pernah tinggal/bepergian ke daerah endemis malaria?',rpk:'Tidak spesifik (kecuali riwayat penyakit sel sabit yang melindungi dari malaria berat)',rsos:'Perjalanan ke daerah endemis malaria (Kalimantan, Papua, NTT, dll)? Kebiasaan keluar malam? Penggunaan kelambu/repelen? Kondisi rumah?'},
'dhf':{lok:'Sistemik — demam, nyeri seluruh tubuh, perdarahan di berbagai tempat',ons:'Mendadak, demam tinggi 2-7 hari, lalu fase kritis (hari ke 4-6)',kua:'Demam tinggi mendadak, nyeri di belakang bola mata (retro-orbital), nyeri sendi dan otot hebat, lemas',kun:'Sedang-berat, bisa sangat berat (syok)',mpb:'Tidak minum cukup cairan, terlambat ke RS pada fase kritis',mr:'Hidrasi adekuat, parasetamol, monitoring ketat',sis:'Ruam/petekie (+), perdarahan spontan (epistaksis, gusi) (+), mual/muntah (+), nyeri perut (+), gelisah/tangan dingin (tanda syok)',rpd:'Riwayat DBD sebelumnya? Kapan? (infeksi kedua lebih berat — risiko DSS). Tinggal di daerah banyak nyamuk? Tetangga/teman yang sakit DBD?',rpk:'Tidak spesifik (ada risiko genetik tertentu untuk syok)',rsos:'Kondisi lingkungan (genangan air/jentik nyamuk)? Penggunaan kelambu/repelen? Musim hujan? Kondisi rumah? Fogging di lingkungan?'},
'leptospirosis':{lok:'Betis (nyeri otot khas), mata (kemerahan), sistemik (demam, ikterus, gagal ginjal pada kasus berat)',ons:'Mendadak, fase leptospiremia (4-7 hari): demam, mialgia. Kemudian membaik sebentar, lalu fase imun (ikterus, gagal ginjal)',kua:'Demam tinggi mendadak, nyeri otot betis SANGAT HEBAT (nyeri tekan betis khas), mata merah tanpa discharge (sufusi konjungtiva khas), menggigil',kun:'Sedang-berat, fase imun bisa sangat berat (Weil disease)',mpb:'Tanpa pengobatan, terlambat diagnosis',mr:'Doksisiklin/penisilin, rehidrasi',sis:'Ikterus (+) Weil disease, gagal ginjal (oliguria) (+) Weil disease, perdarahan (+), batuk darah (+), meningitis aseptik (+)',rpd:'Riwayat paparan banjir/air tergenang? Kontak dengan hewan (tikus, sapi, anjing, babi)? Pekerjaan berisiko (petani, peternak, pekerja selokan)?',rpk:'Tidak spesifik',rsos:'Pekerjaan: petani/peternak/pekerja kebersihan? Riwayat banjir di lingkungan? Kebiasaan mandi di sungai/sawah? Penggunaan APD? Musim hujan?'},
'ra':{lok:'Sendi kecil tangan dan kaki (MCP, PIP, pergelangan tangan) SIMETRIS, bisa menyebar ke sendi besar',ons:'Bertahap, berlangsung ≥6 minggu, sering dimulai dari sendi tangan',kua:'Nyeri sendi, bengkak, hangat, kaku terutama pagi hari (>1 jam, memberat setelah istirahat)',kun:'Sedang-berat, mempengaruhi aktivitas sehari-hari',mpb:'Pagi hari (morning stiffness), istirahat lama, cuaca dingin, aktivitas berlebih',mr:'Bergerak (berbeda OA!), kompres hangat, NSAID, DMARD',sis:'Kelelahan (+), demam ringan (+), penurunan BB (+), nodul rematoid (+), bisa ada manifestasi ekstra-artikular (paru, mata, jantung)',rpd:'Kapan pertama kali? Sendi apa yang pertama kena? Riwayat OA/gout/penyakit sendi lain? Riwayat ISPA/infeksi sebelum gejala mulai? Pengobatan sebelumnya?',rpk:'Riwayat RA atau penyakit autoimun lain dalam keluarga? (HLA-DR4 terkait)',rsos:'Merokok (faktor risiko RA dan memperburuk prognosis)? Stres? Pekerjaan (aktivitas tangan intensif)? Kondisi finansial (biaya DMARD mahal)?'},
'sle':{lok:'Multi-organ — kulit (ruam), sendi, ginjal, paru, sistem saraf, darah (tidak ada satu lokasi tunggal)',ons:'Bervariasi — bisa mendadak atau bertahap berbulan-bulan, sering dengan periode remisi dan flare',kua:'Ruam kupu-kupu di wajah (malar rash), ruam memburuk di bawah sinar matahari, nyeri sendi, luka di mulut, rambut rontok, kelelahan hebat',kun:'Ringan-berat, dinilai dengan SLEDAI score',mpb:'Paparan sinar matahari (UV), infeksi, stres, kehamilan, terputus obat',mr:'Menghindari sinar matahari, hidroksiklorokuin, kortikosteroid',sis:'Demam (+), kelelahan berat (+), rambut rontok (+), ulkus oral (+), serositis (pleuritis/perikarditis) (+), edema (nefritis) (+)',rpd:'Riwayat flare sebelumnya? Manifestasi organ apa yang pernah terkena? Obat-obatan sebelumnya? Riwayat keguguran berulang? Riwayat trombosis? Riwayat obat yang bisa induksi lupus (hidralasin, prokainamid, INH)?',rpk:'Riwayat SLE atau penyakit autoimun lain dalam keluarga? (kembar identik risiko 50%)',rsos:'Paparan sinar matahari pekerjaan? Penggunaan tabir surya? Merokok? Stres? Dukungan keluarga? Rencana kehamilan (kontraindikasi MMF)?'},
'ankle_sprain':{lok:'Lateral ankle (paling sering — ligamen talofibular anterior/kalkaneofibular), TIDAK menyebar',ons:'Mendadak setelah trauma inversi (kaki terpelintir ke dalam), biasanya saat olahraga/jalan di permukaan tidak rata',kua:'Nyeri lokal lateral ankle, bengkak, bisa ada bunyi "pop" saat cedera',kun:'Grade I (ringan): sedikit nyeri, tidak ada instabilitas. Grade II (sedang): nyeri+bengkak+sedikit instabilitas. Grade III (berat): nyeri hebat, instabilitas jelas',mpb:'Berjalan, berdiri, menekan area lateral ankle',mr:'RICE (Rest-Ice-Compression-Elevation), analgetik, tidak menumpu berat',sis:'Bengkak lokal (+), ekimosis (memar) (+), bisa ada keterbatasan gerak',rpd:'Riwayat cedera ankle sebelumnya? Sudah berapa kali? (ankle sprain rekuren meningkatkan risiko instabilitas kronik). Riwayat fraktur?',rpk:'Tidak spesifik (bisa ada faktor hipermobilitas sendi bawaan)',rsos:'Olahraga apa? Frekuensi? Jenis alas kaki? Permukaan latihan? Pemanasan sebelum olahraga? Pekerjaan (risiko jatuh)?'},
'oa_genu':{lok:'Lutut (biasanya bilateral, sering lebih berat satu sisi), tidak menyebar ke paha/betis secara bermakna',ons:'Bertahap, kronis, berlangsung bulan-tahun, makin berat seiring usia',kua:'Nyeri tumpul yang memburuk setelah aktivitas dan membaik dengan istirahat (berbeda RA). Krepitasi (bunyi berderak) saat gerak. Kaku pagi <30 menit',kun:'Ringan-berat, dinilai dengan VAS dan Kellgren-Lawrence grading foto',mpb:'Naik-turun tangga, jongkok, berdiri lama, cuaca dingin, kelebihan berat badan',mr:'Istirahat, NSAID, kompres hangat, fisioterapi, alat bantu jalan, penurunan BB',sis:'Tidak ada tanda inflamasi sistemik (demam, kelelahan) berbeda RA. Deformitas varus/valgus pada stadium lanjut.',rpd:'Kapan pertama kali nyeri lutut? Riwayat trauma lutut sebelumnya? Riwayat gout/RA? Riwayat pekerjaan berat (mengangkat, berjalan jauh)? Operasi lutut?',rpk:'Riwayat OA dalam keluarga? (faktor genetik 50%)',rsos:'IMT (obesitas adalah faktor risiko utama)? Pekerjaan (berdiri/jalan jauh/jongkok lama)? Olahraga? Aktivitas fisik harian?'},
'gout':{lok:'MTP-1 (pangkal jempol kaki = podagra) tersering, bisa juga pergelangan kaki, lutut, pergelangan tangan, jari tangan',ons:'MENDADAK (sering tengah malam/dini hari), mencapai puncak dalam 12-24 jam',kua:'Nyeri HEBAT (sangat berat), merah, panas, bengkak. Bahkan angin sepoi-sepoi pun terasa nyeri. Berlangsung 3-10 hari tanpa pengobatan',kun:'BERAT saat akut, tanpa pengobatan berlangsung berhari-hari',mpb:'Alkohol (terutama bir), seafood, daging merah, jeroan, fruktosa, dehidrasi, diuretik tiazid, obat-obatan tertentu, trauma lokal',mr:'NSAID (Indometasin), kolkisin, es batu, mengangkat anggota gerak',sis:'Demam ringan (+) saat akut, tofi (benjolan keras asam urat) di daun telinga/tendon (+) pada kronik, tanda kerusakan ginjal jika kronik',rpd:'Riwayat serangan gout sebelumnya? Kapan dan di sendi mana? Kadar asam urat terakhir? Obat yang pernah diminum? Riwayat batu ginjal? Riwayat hipertensi/DM?',rpk:'Riwayat gout dalam keluarga? (ada komponen genetik — enzim HPRT)',rsos:'Konsumsi alkohol (jenis dan jumlah)? Konsumsi seafood/daging merah/jeroan? Asupan air putih? Berat badan? Obat-obatan rutin (diuretik tiazid meningkatkan asam urat)?'},
'fraktur':{lok:'Sesuai lokasi trauma — klavikula (bahu), radius/ulna (lengan bawah), TIDAK menyebar tapi bisa ada nyeri sekitar area fraktur',ons:'MENDADAK setelah trauma (kecelakaan, jatuh, olahraga kontak)',kua:'Nyeri hebat mendadak di lokasi trauma, deformitas (bengkok/pendek), tidak bisa menggerakkan anggota gerak',kun:'BERAT, tidak bisa ditoleransi tanpa analgetik',mpb:'Menggerakkan anggota gerak, menekan lokasi fraktur',mr:'Imobilisasi (bidai), analgetik, elevasi',sis:'Bengkak lokal (+), ekimosis (+), krepitasi (+), deformitas (+), bisa ada luka terbuka (fraktur terbuka), syok jika perdarahan banyak',rpd:'Mekanisme trauma persis bagaimana? Kekuatan trauma (energi tinggi/rendah)? Riwayat osteoporosis? Riwayat tumor tulang? Riwayat fraktur sebelumnya?',rpk:'Riwayat osteoporosis dalam keluarga? Riwayat osteogenesis imperfekta?',rsos:'Pekerjaan (risiko kecelakaan)? Olahraga kontak? Konsumsi kalsium/vit D? Merokok/alkohol (mempengaruhi penyembuhan tulang)? Penggunaan sabuk pengaman?'},
'meniscus_tear':{lok:'Lutut (medial lebih sering), di garis sendi (joint line), TIDAK menyebar',ons:'Mendadak setelah trauma puntir lutut, atau bertahap (degeneratif pada usia >40 tahun)',kua:'Nyeri garis sendi lutut, bunyi "klik/pop" saat cedera, lutut terasa terkunci (locking) atau mengunci sementara (catching), bisa terasa goyah (giving way)',kun:'Sedang-berat, mengganggu aktivitas olahraga dan fungsi sehari-hari',mpb:'Jongkok, memutar lutut, naik-turun tangga, berlari',mr:'Istirahat, RICE, NSAID',sis:'Efusi lutut (bengkak berisi cairan) (+) setelah beberapa jam, nyeri tekan garis sendi (+)',rpd:'Mekanisme cedera? Riwayat cedera lutut sebelumnya? Riwayat OA (meniskus degeneratif)? Riwayat operasi lutut?',rpk:'Tidak spesifik',rsos:'Jenis olahraga (risiko tinggi: sepak bola, basket, ski)? Frekuensi dan intensitas latihan? Teknik latihan yang benar? Pemanasan? Alas kaki?'},
'ruptur_achilles':{lok:'Tendon Achilles (belakang tumit, sekitar 2-6 cm di atas insersi ke kalkaneus), nyeri sangat lokal',ons:'MENDADAK saat aktivitas tiba-tiba (melompat, berlari, mendorong), terdengar bunyi "POP" keras',kua:'Nyeri hebat tiba-tiba di belakang tumit, seperti ditendang dari belakang, lalu tidak bisa berdiri di ujung jari atau menggerakkan kaki ke bawah (plantar fleksi)',kun:'BERAT, tidak bisa berjalan normal',mpb:'Mencoba plantar fleksi, berjalan',mr:'Istirahat total, elevasi, analgetik',sis:'Gap/cekungan di tendon teraba (+), Thompson test positif (meremas betis tidak menggerakkan kaki)',rpd:'Riwayat nyeri tendon Achilles sebelumnya (tendinitis)? Riwayat injeksi kortikosteroid lokal ke tendon Achilles? Konsumsi fluorokuinolon? Riwayat gout?',rpk:'Tidak spesifik',rsos:'Olahraga apa? Frekuensi latihan? Peningkatan intensitas mendadak? Pemanasan? Jenis alas kaki?'},
'mh_mb':{lok:'Kulit (lesi multipel tersebar), saraf tepi (penebalan), bisa menyebar ke seluruh tubuh (simetris)',ons:'Sangat bertahap, berbulan-bulan hingga bertahun-tahun sebelum terdiagnosis',kua:'Bercak kulit yang MATI RASA (anestesia) atau kurang rasa, tidak gatal. Bercak kemerahan atau bercak putih dengan batas tidak tegas',kun:'Lesi >5 (tipe MB), tersebar bilateral',mpb:'Tidak diobati (makin banyak lesi, makin rusak saraf), malnutrisi',mr:'MDT (Multi Drug Therapy) selama 12 bulan',sis:'Penebalan saraf tepi teraba (N. ulnaris, N. peroneus, N. auricularis magnus) (+), kelemahan otot tangan/kaki (+), mata tidak bisa menutup sempurna (+), luka di tangan/kaki yang tidak terasa (+)',rpd:'Kontak erat dengan penderita kusta? Sudah berapa lama ada bercak? Pernah didiagnosis kusta sebelumnya? Pernah minum MDT?',rpk:'Ada anggota keluarga yang pernah menderita kusta? (kontak serumah = faktor risiko)',rsos:'Kondisi tempat tinggal (padat, lembab)? Kondisi gizi? Pekerjaan? Akses ke fasilitas kesehatan? Stigma sosial di lingkungan?'},
'varicella':{lok:'Awalnya batang tubuh, menyebar ke wajah dan ekstremitas (sentripetal — beda cacar)',ons:'Mendadak, fase prodromal 1-2 hari (demam, malaise), lalu muncul lesi kulit bergelombang',kua:'Lesi polimorfik bersamaan: makula, papula, vesikel berisi cairan jernih (teardrop), krusta. Sangat gatal',kun:'Ratusan lesi bisa ada, gatal sangat mengganggu',mpb:'Menggaruk (risiko infeksi sekunder/sikatrik), imunosupresi (lebih berat)',mr:'Antihistamin, calamine lotion, asiklovir jika dalam 24 jam',sis:'Demam (+), malaise (+), nafsu makan turun (+). Komplikasi: pneumonia varicella, ensefalitis (jarang)',rpd:'Riwayat varicella sebelumnya? Vaksin varicella? Kontak dengan penderita cacar air 10-21 hari lalu? Status imun (imunosupresi)?',rpk:'Status vaksinasi varicella anggota keluarga?',rsos:'Kontak serumah/di sekolah dengan penderita varicella? Anak sekolah? Status vaksinasi? Kondisi imun keluarga serumah?'},
'herpes_zoster':{lok:'Mengikuti SATU dermatom (unilateral), paling sering thorakal, wajah (V1 → zoster oftalmik), lumbosacral. TIDAK melewati garis tengah',ons:'Fase prodromal 2-3 hari: nyeri/rasa terbakar di dermatom SEBELUM muncul lesi. Lalu vesikel muncul',kua:'Nyeri neuropatik (terbakar, tersengat, menusuk) di area dermatom, lalu muncul vesikel berkelompok berisi cairan jernih di atas eritema',kun:'Sedang-berat, nyeri bisa sangat mengganggu, terutama pada lansia',mpb:'Kontak dengan lesi, usia lanjut, imunosupresi, stres',mr:'Asiklovir dini (<72 jam), analgetik, pembalut luka',sis:'Demam ringan (+), malaise (+), limfadenopati regional (+), komplikasi: post-herpetik neuralgia (nyeri >3 bulan setelah sembuh)',rpd:'Riwayat varicella (cacar air) sebelumnya? (reaktivasi VZV laten). Riwayat herpes zoster sebelumnya? Status imun (HIV, keganasan, terapi imunosupresi, kortikosteroid lama)?',rpk:'Tidak spesifik (bukan penyakit herediter)',rsos:'Status imun saat ini? Tingkat stres? Usia (>60 tahun risiko lebih tinggi dan lebih berat)? Vaksin zoster sudah/belum?'},
'urtikaria':{lok:'Kulit di mana saja (bisa berpindah-pindah), bisa disertai angioedema (wajah, bibir, tenggorokan — DARURAT jika tenggorokan)',ons:'Mendadak, tiap lesi hilang dalam <24 jam tapi lesi baru terus muncul. Akut: <6 minggu',kua:'Bentol (wheal) kemerahan, sangat gatal, pucat saat ditekan, menghilang sendiri dalam jam lalu muncul lagi di tempat lain',kun:'Ringan-berat, akut bisa sangat mengganggu. Kronik: >6 minggu',mpb:'Penyebab: obat-obatan (aspirin, NSAID, AB), makanan (seafood, kacang, telur), gigitan serangga, lateks, infeksi, stres, olahraga, panas',mr:'Antihistamin, menghindari pemicu, kortikosteroid jika berat',sis:'Angioedema (+) bisa ada: bibir/wajah/tenggorokan bengkak. Anafilaksis jika ada sesak/hipotensi',rpd:'Riwayat urtikaria sebelumnya? Pernah diidentifikasi penyebabnya? Riwayat alergi makanan/obat? Riwayat atopi? Riwayat infeksi (H. pylori, parasit)?',rpk:'Riwayat atopi atau alergi dalam keluarga?',rsos:'Makanan apa yang dimakan sebelum muncul? Obat-obatan terbaru? Produk perawatan kulit baru? Aktivitas fisik? Paparan panas/dingin? Tingkat stres?'},
'dermatitis_atopi':{lok:'Bayi: wajah (pipi, dahi), batang tubuh. Anak: lipatan siku, lipatan lutut, leher. Dewasa: tangan, leher, kelopak mata. Gejala bilateral, berpindah sesuai usia',ons:'Kronis, sejak bayi/anak kecil, dengan periode eksaserbasi dan remisi',kua:'GATAL HEBAT (terutama malam), kulit kering, eksim (kemerahan, bersisik, bisa basah/mengalir, penebalan pada kronik)',kun:'Ringan-berat, makin berat saat kambuh, siklus gatal-garuk-gatal',mpb:'Keringat berlebih, sabun keras, wol/bahan kasar, suhu ekstrem, infeksi (Staph aureus), stres, alergen (debu, bulu, makanan pada anak)',mr:'Pelembab (emolien) rutin, mandi air hangat (bukan panas), kortikosteroid topikal saat kambuh',sis:'Riwayat asma dan/atau rhinitis alergi (+) — trias atopi. Sering ada infeksi kulit sekunder (S. aureus).',rpd:'Kapan pertama kali muncul? Riwayat asma? Riwayat rhinitis alergi? Faktor yang memperburuk yang sudah diketahui? Pengobatan sebelumnya? Riwayat alergi makanan (anak)?',rpk:'Riwayat atopi (asma, rhinitis, dermatitis atopi) dalam keluarga? — risiko 70% jika kedua orang tua atopi',rsos:'Sabun/deterjen yang digunakan? Pakaian (katun vs wol)? Hewan peliharaan? Kondisi rumah (lembab, debu)? Pola mandi? Stress?'},
'fde':{lok:'LOKASI YANG SAMA setiap kali terjadi (khas FDE!), sering: bibir, genital, tangan, wajah',ons:'Muncul 30 menit - 8 jam setelah mengonsumsi obat penyebab. Meninggalkan bercak hiperpigmentasi',kua:'Plak bulat oval merah/ungu/hitam, bisa berupa bula, nyeri atau gatal di lokasi lesi. Meninggalkan bekas hiperpigmentasi permanen',kun:'Ringan-sedang, terjadi setiap kali minum obat penyebab',mpb:'Minum obat penyebab (kotrimoksazol, tetrasiklin, NSAID, parasetamol, dll)',mr:'Menghentikan obat penyebab',sis:'Tidak ada gejala sistemik berat (berbeda SJS/TEN). Hanya lesi di lokasi yang sama.',rpd:'Obat apa yang diminum sebelum muncul lesi? Sudah berapa kali terjadi dan apakah di lokasi yang sama? Riwayat alergi obat?',rpk:'Riwayat alergi obat dalam keluarga?',rsos:'Daftar semua obat yang diminum (termasuk obat bebas, herbal)? Kebiasaan membeli obat sendiri?'},
'erisipelas':{lok:'Tungkai bawah (paling sering), wajah (nose/butterfly). Berbatas TEGAS, tidak menyebar melewati batas tegas tersebut',ons:'Mendadak dalam 24-48 jam, didahului demam tinggi menggigil',kua:'Kulit merah terang, bengkak, TERABA PANAS, nyeri, batas tegas dan meninggi (khas — beda selulitis: batas tidak tegas). Permukaan seperti kulit jeruk',kun:'Sedang-berat, makin berat tanpa antibiotik',mpb:'Tidak diobati, sistem imun lemah, limfedema, venous insufficiency, luka/pintu masuk',mr:'Penisilin, elevasi ekstremitas, kompres',sis:'Demam tinggi (+), menggigil (+), limfadenopati regional (+), malaise (+)',rpd:'Riwayat erisipelas sebelumnya? (sering rekuren). Riwayat luka/lecet/tinea pedis di area terkena? Riwayat limfedema? Riwayat ISPA sebelumnya?',rpk:'Tidak spesifik',rsos:'Kondisi imun (DM, HIV, steroid)? Higienitas kaki? Riwayat tinea pedis (pintu masuk Streptokokus)? Kebiasaan berjalan tanpa alas kaki?'},
'anafilaksis':{lok:'Kulit (urtikaria, angioedema), saluran napas (stridor, wheezing), kardiovaskular (hipotensi), sistemik (mual/muntah)',ons:'SANGAT MENDADAK dalam menit setelah paparan alergen',kua:'Gatal seluruh tubuh, bentol-bentol, kulit memerah, sesak napas mendadak, jantung berdebar, pusing, pingsan',kun:'BERAT, mengancam jiwa',mpb:'Paparan alergen (obat, makanan, sengatan serangga, lateks, kontras radiologi)',mr:'Epinefrin IM segera, O2, cairan IV',sis:'Urtikaria/angioedema (+), stridor/wheezing (+), hipotensi (+), takikardia (+), mual/muntah (+), sinkop (+)',rpd:'Riwayat reaksi alergi sebelumnya? Riwayat anafilaksis? Alergen yang sudah diketahui? Apakah sedang dalam terapi imunoterapi alergen? Riwayat asma?',rpk:'Riwayat atopi atau alergi berat dalam keluarga?',rsos:'Obat apa yang baru diminum/disuntik? Makanan apa yang baru dimakan? Aktivitas apa (sengatan serangga)? Riwayat membawa epinefrin auto-injector?'},
'pid':{lok:'Perut bawah bilateral, nyeri menjalar ke paha/punggung bisa ada',ons:'Akut-subakut, beberapa hari hingga 2 minggu, sering setelah menstruasi atau prosedur intrauterin',kua:'Nyeri perut bawah bilateral tumpul terus-menerus, demam, keputihan purulen, nyeri saat berhubungan seksual (dispareunia)',kun:'Sedang-berat, mengganggu aktivitas',mpb:'Bergerak, palpasi perut bawah, pemeriksaan dalam (nyeri goyang serviks khas)',mr:'Antibiotik, analgetik, istirahat',sis:'Demam (+), keputihan berbau (+), mual (+), dispareunia (+), menstruasi tidak teratur (+)',rpd:'Riwayat IMS sebelumnya? Riwayat PID sebelumnya? Riwayat prosedur intrauterin (IUD, kuretase, histerosalpingografi)? Riwayat persalinan? Pasangan seksual berganti?',rpk:'Tidak spesifik',rsos:'Jumlah pasangan seksual? Penggunaan kondom? Jenis kontrasepsi (IUD meningkatkan risiko PID)? Riwayat tes IMS?'},
'peb':{lok:'Kepala (nyeri kepala), perut kanan atas (nyeri epigastrik/RUQ = tanda HELLP), mata (gangguan visus), seluruh tubuh (edema)',ons:'Umumnya setelah usia kehamilan 20 minggu, bisa mendadak memburuk',kua:'Nyeri kepala berat, pandangan kabur/berkunang, edema muka dan tangan tiba-tiba memberat, nyeri ulu hati',kun:'BERAT, darurat obstetri',mpb:'Tidak mendapat pengobatan, hipertensi tidak terkontrol',mr:'MgSO4, antihipertensi, terminasi kehamilan',sis:'Hipertensi berat (TD ≥160/110) (+), proteinuria masif (+), edema (+), refleks patologis (+), oliguria (+), bisa kejang (eklamsia)',rpd:'Riwayat hipertensi sebelum hamil? Riwayat PEB/eklamsia pada kehamilan sebelumnya? Riwayat DM, penyakit ginjal, penyakit autoimun? Kehamilan kembar?',rpk:'Riwayat PEB dalam keluarga (ibu/saudara perempuan)? Riwayat hipertensi dalam keluarga?',rsos:'Kehamilan ke berapa? Jarak kehamilan? ANC teratur? Akses ke fasilitas kesehatan? Kondisi gizi? Status sosial ekonomi?'}}

const PEMFIS_DATA = {'migrain':{f:'TTV: TD, Nadi, RR, Suhu, SpO2. Kepala: nyeri tekan perikranial (+). Mata: fund us okuli (jika pertama kali). Neurologis: status mental, saraf kranial, motorik, sensorik, refleks — NORMAL saat interiktal. Jika ada aura: periksa defisit fokal sementara.',p:'Klinis, tidak perlu rutin. CT/MRI kepala jika: pertama kali, ada red flag (thunderclap, defisit fokal, demam, usia >50). Tidak ada pemeriksaan laboratorium rutin.'},
'tth':{f:'TTV: normal. Kepala: nyeri tekan otot perikranial bilateral (temporal, suboksipital, trapezius) (+). Leher: kekakuan otot leher (+), ROM leher terbatas. Neurologis: NORMAL (tidak ada defisit fokal).',p:'Klinis murni. CT/MRI kepala jika ada red flag. Tidak ada pemeriksaan laboratorium spesifik.'},
'bppv':{f:'TTV: normal. Uji Dix-Hallpike: (+) nistagmus geotropik <1 menit (kanal posterior). Uji Roll Test: kanal horizontal. Otoskopi: normal. Romberg: bisa (+) saat serangan. Rinne/Weber: NORMAL (tidak ada tuli).',p:'Klinis. Audiometri jika dicurigai Meniere. MRI otak jika atipik atau tidak respons terapi.'},
'bells_palsy':{f:'TTV: normal. Inspeksi wajah: asimetri, dahi tidak bisa dikerutkan (UMN vs LMN!), tidak bisa menutup mata (lagoftalmus), sudut mulut turun, sulkus nasolabial menghilang. House-Brackmann scale. Saraf kranial lain: NORMAL. Otoskopi: cek vesikel (Ramsay Hunt).',p:'Klinis. Gula darah (singkirkan DM). MRI kepala dengan kontras jika ada kecurigaan tumor/stroke. EMG jika berat (prognosis). Tes Schirmer (produksi air mata).'},
'hnp':{f:'TTV: normal. Inspeksi: posisi antalgik, skoliosis. Palpasi: nyeri tekan paravertebral (+), spasme otot (+). SLR/Laseque test: (+) jika <60°. Crossed SLR (+) patognomonis. Bragard test. Motorik: kekuatan ekstremitas bawah. Sensorik: dermatom L4/L5/S1. Refleks: patela (L4), achilles (S1). Tes jalan ujung jari/tumit.',p:'X-ray lumbosacral: penyempitan diskus, skoliosis. MRI lumbosacral: GOLD STANDARD — tampak herniasi diskus. EMG/NCS: neuropati.'},
'spondilitis_tb':{f:'TTV: suhu subfebris (+). Inspeksi: gibbus (kifosis angular khas). Palpasi: nyeri ketuk vertebra (+). Neurologis bawah lesi: kekuatan, sensorik, refleks, tonus. Pemeriksaan paru: ronki (TB paru bersamaan). Limfadenopati.',p:'X-ray vertebra: destruksi korpus, kolaps diskus, abses paravertebral. MRI vertebra: GOLD STANDARD. CT vertebra. Lab: LED/CRP meningkat, leukosit. Mantoux/IGRA. BTA sputum. Biopsi jaringan (kultur, PA): konfirmasi TB.'},
'meniere':{f:'TTV: normal. Otoskopi: normal (MT intak). Uji garpu tala: Rinne dan Weber — tuli sensorineural unilateral. Uji keseimbangan: Romberg (+) saat serangan. Nistagmus: horizontal, berubah arah sesuai fase.',p:'Audiometri: tuli sensorineural frekuensi rendah, fluktuatif. Elektrokohleografi (ECoG): hydrops endolimfatik. MRI otak + kontras gadolinium: singkirkan neuroma akustik. Gliserol test/furosemid test.'},
'stroke':{f:'TTV: TD sering tinggi, suhu, nadi. GCS. Pupil: isokor/anisokor. Saraf kranial: parese N VII, XII. Motorik: hemiparesis/plegia, Babinski (+), refleks meningkat. Sensorik: hemihipestesia. Bicara: afasia (Broca/Wernicke/global). NIHSS score.',p:'CT scan kepala non-kontras: SEGERA — hipodense (iskemik), hiperdens (hemoragik). MRI DWI: lebih sensitif. EKG: AF, infark miokard. Lab: GDS, DL, faal hemostasis, profil lipid, fungsi ginjal. Ekokardiografi jika kardioemboli.'},
'tia':{f:'TTV: TD sering meningkat. Saat serangan: defisit neurologis fokal. Setelah serangan: NORMAL. Periksa bruit karotis. Jantung: AF. ABCD2 score.',p:'CT kepala (singkirkan stroke/perdarahan). MRI DWI: ada lesi kecil. Duplex karotis: stenosis. EKG: AF. Holter monitor 24 jam. Ekokardiografi. Lab: DL, gula, lipid, koagulasi.'},
'trauma_ms':{f:'TTV: hipotensi, bradikardia (syok neurogenik). GCS. Level lesi: periksa sensorik (pin prick, sentuhan), motorik (5 kelompok), refleks (bulbokavernosus, anal). ASIA impairment scale A-E. Tanda cedera kepala lain.',p:'X-ray vertebra AP/lateral (cepat, di UGD). CT vertebra: detail tulang, fraktur. MRI vertebra: GOLD STANDARD untuk medula, edema, perdarahan. Lab: DL, elektrolit, fungsi ginjal, koagulasi.'},
'meningoensefalitis':{f:'TTV: demam tinggi, takikardia, hipotensi (berat). GCS turun. Kaku kuduk (+). Kernig sign (+). Brudzinski sign (+). Papil edema (peningkatan TIK). Ruam petekie/purpura (meningokokus). Fokal neurologis (ensefalitis).',p:'LP (pungsi lumbal): KUNCI — analisis LCS (warna, tekanan, sel, protein, glukosa, kultur, Gram). CT kepala sebelum LP jika ada papil edema/fokal. Lab: DL, CRP, prokalsitonin, kultur darah, serologis. PCR LCS.'},
'neuropati_dm':{f:'TTV: normal. Monofilamen Semmes-Weinstein 10g: penurunan sensasi telapak kaki. Garpu tala 128 Hz: penurunan vibrasi. Refleks achilles: menurun/hilang. Refleks patela: menurun. Kekuatan otot kaki. Inspeksi kaki: ulkus, deformitas, kapalan.',p:'GDS, HbA1c, GDP. NCS/EMG: GOLD STANDARD — amplitudo ↓, kecepatan hantaran ↓, polineuropati. Lab: fungsi ginjal (nefropati), profil lipid. Funduskopi (retinopati). Ankle-Brachial Index (ABI) — vaskuler.'},
'ptsd':{f:'TTV: normal atau takikardia/hipertensi saat cemas akut. Status mental: afek cemas/takut/marah, kontak mata kurang, waspada berlebih (hypervigilant), mudah terkejut. Pemeriksaan fisik umum untuk menyingkirkan penyebab organik.',p:'Klinis + skala penilaian: PCL-5 (PTSD Checklist), CAPS-5 (structured interview). Lab dasar jika perlu menyingkirkan organik: TSH (tiroid), GDS, DL. Tidak ada pemeriksaan penunjang spesifik PTSD.'},
'baby_blues':{f:'TTV: normal. Status obstetri: kondisi nifas, produksi ASI, kondisi bayi. Status mental: mood labil, menangis, iritabel, kelelahan — tanpa psikosis. Pemeriksaan fisik umum postpartum.',p:'EPDS (Edinburgh Postnatal Depression Scale): skor ≥13 → depresi postpartum. TSH (singkirkan hipotiroid postpartum). Lab dasar: DL (anemia postpartum memperburuk). Tidak ada penunjang spesifik.'},
'gad':{f:'TTV: takikardia, hipertensi ringan saat cemas. Status mental: gelisah, tegang, hipervigilant, sulit konsentrasi. Fisik umum: tidak ada kelainan organik.',p:'GAD-7 score. TSH (hipertiroid). EKG (aritmia). GDS (hipoglikemia). Lab dasar: DL, elektrolit. Tidak ada penunjang spesifik.'},
'insomnia':{f:'TTV: normal. Lingkar leher (obesitas + sleep apnea). Status mental: kelelahan, konsentrasi kurang, iritabel. Tonsilomegali (sleep apnea). Pemeriksaan umum untuk menyingkirkan penyebab organik.',p:'Sleep diary 2 minggu. Polysomnografi (PSG): GOLD STANDARD jika curiga sleep apnea/parasomnisa. Aktigrafi. ISI (Insomnia Severity Index). TSH (hipotiroid). Lab dasar.'},
'blefaritis':{f:'TTV: normal. Inspeksi kelopak mata: eritema tepi kelopak, skuama/krusta di pangkal bulu mata, busa (posterior), dilatasik elenjar Meibom. Slit lamp: detail tepi kelopak, tear film. Visus: biasanya normal.',p:'Klinis terutama. Kultur sekret kelopak jika ada infeksi sekunder. Tes Schirmer (dry eye bersamaan). Tear break-up time (TBUT). Tidak ada pemeriksaan laboratorium rutin.'},
'oma_supuratif':{f:'TTV: demam (+). Otoskopi: MT merah/hiperemis, bulging (bombans), keruh, cone of light hilang. Jika perforasi: sekret (+), MT perforasi. Nyeri tekan tragus (+). Rinne/Weber: tuli konduktif. Nyeri tekan mastoid (komplikasi).',p:'Klinis dan otoskopi. Timpanometri: tipe B (efusi). Kultur sekret (jika kronik/rekuren). X-ray/CT mastoid (jika curiga mastoiditis). Lab: DL jika demam tinggi.'},
'rhinitis_alergi':{f:'TTV: normal. Rinoskopi anterior: mukosa livid/pucat, edema konka, sekret encer bening. Inspeksi mata: konjungtivitis alergi. Allergic shiner (hitam bawah mata). Allergic salute (garis melintang hidung). Cobblestone pharynx.',p:'Skin prick test (SPT): GOLD STANDARD identifikasi alergen. Serum total IgE dan IgE spesifik (RAST). Eosinofil darah dan sekret nasal. Nasoendoskopi. Foto sinus (komplikasi sinusitis).'},
'uveitis':{f:'Visus: menurun. Injeksi silier. Slit lamp: flare (+), sel (+) di COA, KP di endotel kornea. Pupil: miosis, sinekia posterior. TIO: rendah (akut) atau tinggi (glaukoma sekunder).',p:'Lab: DL, LED. HLA-B27 (spondilitis ankilosing). ANA, RF. Mantoux/IGRA (TB uveitis). Rontgen toraks, sakroiliaka. ACE (sarkoidosis). VDRL/TPHA (sifilis). HIV. FTA-ABS. USG mata (vitreous opacities).'},
'keratitis':{f:'Visus: menurun. Injeksi silier berat (+). Slit lamp: infiltrat kornea (+), ulkus kornea (+), hipopion (+). Refleks cahaya: menurun. TIO: normal atau meningkat.',p:'Kerokan kornea: Gram + KOH + kultur — WAJIB sebelum antibiotik. Konfokalmikroskopi (Acanthamoeba). Kultur sekret. PCR (HSV). Lab dasar jika perlu.'},
'asma':{f:'TTV: RR meningkat, SpO2 turun. Inspeksi: penggunaan otot bantu napas, retraksi. Auskultasi: WHEEZING ekspirasi (kadang inspirasi pada berat). Perkusi: hipersonor (hiperinflasi). Peak flow meter: PEFR turun.',p:'Spirometri: FEV1/FVC <0.7, uji bronkodilator (+) ≥12% & ≥200 mL. Peak flow: variabilitas diurnal >20%. Rontgen dada: hiperinflasi (bukan rutin). Lab: eosinofil darah, IgE total. Skin prick test alergen. Analisis gas darah (berat).'},
'ppok':{f:'TTV: RR meningkat, SpO2 turun, pursed-lip breathing. Inspeksi: barrel chest, penggunaan otot bantu napas. Perkusi: hipersonor. Auskultasi: suara napas menurun, wheezing dan/atau ronki. Jari tabuh (jarang). Edema tungkai (cor pulmonale).',p:'Spirometri post-bronkodilator: FEV1/FVC <0.7 — DIAGNOSIS. Rontgen dada: hiperinflasi, diafragma mendatar, bula. CT dada: emfisema. Analisis gas darah: hipoksemia, hiperkapnia. Lab: DL (polisitemia), alfa-1 antitripsin. EKG: cor pulmonale.'},
'pneumotoraks':{f:'TTV: SpO2 turun, takikardia, hipotensi (tension). Inspeksi: hemitoraks yang sakit mengembang. Trakea terdorong kontralateral (tension). Perkusi: hipersonor hemitoraks sakit. Auskultasi: suara napas HILANG hemitoraks sakit.',p:'Rontgen dada: DIAGNOSIS — garis pleura tanpa vascular marking, kolaps paru. CT dada: lebih sensitif. Analisis gas darah: hipoksemia. Tidak perlu penunjang sebelum dekompresi jarum pada tension!'},
'efusi_pleura':{f:'TTV: RR meningkat, SpO2 turun. Inspeksi: hemitoraks yang sakit tertinggal. Perkusi: REDUP pada efusi. Fremitus: menurun. Auskultasi: suara napas menurun/hilang. Egofoni. Friction rub (pleuritis).',p:'Rontgen dada: opasitas homogen meniskus sign. USG dada: TERBAIK untuk deteksi efusi kecil. CT dada. Torakosentesis diagnostik: analisis cairan (Light criteria: eksudat vs transuda), kultur, sitologi (keganasan), ADA (TB). Lab: DL, protein, LDH darah.'},
'pertusis':{f:'TTV: suhu bisa normal atau subfebris. Auskultasi: bersih di antara serangan. Konjungtiva: perdarahan subkonjungtiva (dari batuk keras). Wajah: petekie wajah. Sianosis perioral saat serangan batuk.',p:'Kultur nasofaring: GOLD STANDARD (Bordetella pertussis). PCR nasofaring: lebih cepat dan sensitif. DL: limfositosis absolut khas (>10.000/μL, terutama bayi). Serologi IgA/IgG anti-pertussis. Rontgen dada: kadang atelektasis/pneumonia.'},
'tb_hiv':{f:'TTV: demam subfebris, BB turun drastis. Auskultasi: ronki +/- menghilang. Limfadenopati multipel (termasuk aksila, inguinal). Sariawan (kandidiasis oral). Pembesaran hati/limpa. Skin turgor menurun.',p:'Sputum BTA SPS (sewaktu-pagi-sewaktu): WAJIB. Tes cepat molekular (TCM/GeneXpert): pilihan. Kultur M. tuberculosis. Foto toraks: infiltrat/kavitas apeks. HIV rapid test: WAJIB. CD4 count. VL HIV. Lab: DL, fungsi hati (sebelum OAT). ADA cairan pleura/LCS jika ekstraparu.'},
'hipertensi':{f:'TD kedua lengan (minimal 2x, 5 menit istirahat, 2 posisi). Nadi: frekuensi, regularitas. Berat badan, BMI, lingkar pinggang. Funduskopi: perubahan Keith-Wagener. Jantung: S4 gallop, kardiomegali. Paru: ronki (gagal jantung). Abdomen: bruit renal (HT renovaskular). Edema tungkai.',p:'EKG: LVH (hipertrofi ventrikel kiri), aritmia. Rontgen dada: kardiomegali. Lab: DL, ureum/kreatinin/GFR, elektrolit, GDS, profil lipid, asam urat, urinalisis (proteinuria). USG ginjal. Ekokardiografi (LVH). Holter BP 24 jam.'},
'af':{f:'TTV: Nadi IREGULER IREGULER, frekuensi bervariasi. Pulse deficit (nadi perifer < denyut jantung). Tekanan nadi bervariasi. Tanda gagal jantung: JVP meningkat, ronki, edema. Auskultasi: bunyi jantung ireguler.',p:'EKG: DIAGNOSTIK — tidak ada gelombang P, RR ireguler, baseline bergelombang (fibrilasi). Ekokardiografi: fungsi sistolik, katup, trombus atrium. Lab: DL, elektrolit, fungsi tiroid (TSH — hipertiroid penyebab AF), fungsi ginjal. Holter monitor. CHA2DS2-VASc dan HAS-BLED score.'},
'svt':{f:'TTV: HR 150-250x/menit, TD bisa turun. Nadi reguler tapi cepat. Pulsasi vena jugularis (cannon A waves). Tanda instabilitas: hipotensi, nyeri dada, sinkop, gagal jantung.',p:'EKG: DIAGNOSTIK — takikardia reguler QRS sempit (kebanyakan), gelombang P tersembunyi/retrograd. Bila QRS lebar: bedakan VT dengan kriteria Brugada. Lab: elektrolit, TSH, troponin. EKG vagal manuver sebelum dan sesudah.'},
'stemi':{f:'TTV: TD bisa turun, nadi cepat. Diaphoresis (keringat dingin). Pucat. Auskultasi: bunyi jantung S3/S4, murmur baru (regurgitasi mitral — ruptur muskulus papilaris). Tanda gagal jantung. Pemeriksaan kaki (edema).',p:'EKG: SEGERA — elevasi ST ≥1mm ≥2 sadapan berturutan atau LBBB baru. Serial EKG tiap 30 menit. Troponin I/T (serial 3-6 jam): naik. CK-MB. Rontgen dada. Lab: DL, profil lipid, GDS, fungsi ginjal, elektrolit. Ekokardiografi. Koronarografi (PCI).'},
'vfib':{f:'Tidak ada nadi karotis. Tidak ada napas atau gasping. Tidak sadar. Pupil midriasis. Sianosis. EKG: fibrilasi ventrikel atau VT tanpa nadi.',p:'EKG: SEGERA. Analisis gas darah. Elektrolit: K+, Ca2+, Mg2+. Troponin, CK-MB. Lab toksikologi. Setelah ROSC: ekokardiografi, angiografi koroner. Target temperature management monitoring.'},
'cvi':{f:'Inspeksi: varises, pigmentasi, lipodermatosklerosis, eczema stasis, ulkus (malleolus medial). Pitting edema. Palpasi: nyeri tekan sepanjang vena. Auskultasi: bruit (fistula AV). Uji Trendelenburg. ABI (Ankle-Brachial Index): normal (>0.9) pada CVI murni.',p:'Duplex USG (Doppler): GOLD STANDARD — inkompetensi katup vena, refluks, DVT. Plethysmografi. Foto kaki/tungkai. Lab: DL, koagulasi. Venografi (jarang).'},
'tromboflebitis':{f:'TTV: low-grade fever (+). Inspeksi: eritema, edema lokal mengikuti vena. Palpasi: korda keras nyeri sepanjang vena superfisial. Kulit hangat. Homan sign: TIDAK spesifik.',p:'Duplex USG: PILIHAN — konfirmasi trombus, singkirkan DVT. Lab: D-dimer (tidak spesifik). DL, LED. Koagulasi jika curiga trombofilia.'},
'limfangitis':{f:'TTV: demam tinggi. Inspeksi: garis merah mengikuti aliran limfe dari luka ke KGB regional. Palpasi: hangat, nyeri. Limfadenopati regional: nyeri, membesar. Cari pintu masuk (luka, selulitis, tinea pedis).',p:'Klinis. Lab: DL (leukositosis). Kultur dari luka primer atau darah jika sepsis. Lab darah: LED, CRP.'},
'appendisitis':{f:'TTV: demam subfebris 37.5-38.5°C, takikardia. Inspeksi: tidak ada distensi. Auskultasi: BU normal/menurun. Perkusi: nyeri ketuk RLQ. Palpasi: nyeri tekan McBurney (+), nyeri lepas (Blumberg) (+), Rovsing sign (+), Psoas sign (+), Obturator sign (+). Rectal toucher: nyeri jam 9-10. Alvarado score.',p:'Lab: DL — leukositosis >10.000 + shift to left. CRP meningkat. Urinalisis (singkirkan ISK). USG abdomen: apendiks membesar >6mm, non-compressible, free fluid. CT abdomen kontras: GOLD STANDARD. Urine βhCG (wanita usia reproduktif).'},
'gerd':{f:'TTV: normal. Berat badan, BMI. Orofaring: erosi gigi (regurgitasi kronik), larings (laringitis). Abdomen: nyeri tekan epigastrik ringan. Tidak ada organomegali. Tanda alarm: massa, darah.',p:'Klinis dan terapi empiris (PPI test). Endoskopi atas: GOLD STANDARD — esofagitis, Barrett, singkirkan keganasan (jika ada alarm). Manometri esofagus: LES pressure. pH-metri 24 jam: konfirmasi refluks. Lab dasar. H. pylori test (UBT/antigen feses/biopsi).'},
'tifoid':{f:'TTV: demam 39-40°C, relatif bradikardia (nadi lambat relatif terhadap suhu). Inspeksi: tampak sakit sedang. Mulut: lidah tifoid (putih kotor, tepi hiperemis). Abdomen: distensi (meteorismus), nyeri tekan ringan epigastrik-periumbilikal. Hepar/limpa: hepatosplenomegali (+). Rose spots (jarang pada kulit gelap).',p:'Lab: DL — leukopenia/normal, shift to left tidak ada. SGOT/SGPT meningkat. Widal: O dan H ≥1/320 (kontekstual, bukan diagnosis). IgM Salmonella typhi (Tubex/Typhidot M): lebih spesifik. Kultur darah (gold standard, hari 1-7): 70-90% positif. Kultur tinja/urin (minggu 2-3).'},
'hepatitis_a':{f:'TTV: demam. Sklera ikterik (+). Kulit: ikterus. Abdomen: hepatomegali nyeri tekan (+), limfadenopati mesenterika. Urin: gelap (bilirubinuria). Feses: pucat (acholic).',p:'Lab: SGOT/SGPT meningkat (>10x normal). Bilirubin total/direk/indirek meningkat. GGT, ALP meningkat. IgM anti-HAV (+): DIAGNOSTIK akut. IgG anti-HAV (+): infeksi lama/vaksin. DL. Urinalisis: bilirubin (+), urobilinogen (+). USG abdomen: hepatomegali, KGB periportal.'},
'hemoroid':{f:'TTV: normal. Inspeksi perianal: prolaps, skin tag. Rectal toucher: tonus sfingter, massa dalam rektum, nyeri (trombosis). Anoskopi: GOLD STANDARD visualisasi hemoroid interna. Bisa ada darah merah segar di sarung tangan.',p:'Anoskopi/proktoskopi: WAJIB — visualisasi langsung, gradasi. Kolonoskopi/sigmoidoskopi: jika ada keraguan, perdarahan banyak, faktor risiko keganasan. Lab: DL (anemia jika perdarahan kronik), feses lengkap.'},
'peritonitis':{f:'TTV: demam tinggi, takikardia, hipotensi (sepsis). Inspeksi: abdomen papan (rigiditas). Auskultasi: BU HILANG (ileus paralitik). Perkusi: nyeri ketuk seluruh lapang abdomen, pekak hati hilang (udara bebas). Palpasi: DEFANS MUSKULAR seluruh kuadran, nyeri lepas.',p:'Lab: DL — leukositosis tinggi. CRP, prokalsitonin. Fungsi ginjal, elektrolit. Rontgen abdomen tegak: udara bebas subdiafragma (crescent sign) — PERFORASI. CT abdomen kontras: lebih detail. Analisis gas darah (asidosis metabolik). Kultur darah.'},
'intususepsi':{f:'TTV: demam, takikardia. Inspeksi: perut buncit. Palpasi: teraba massa sosis di RUQ (sausage-shaped mass) (+). Rectal toucher: darah seperti jelly kismis (+), massa teraba. Tanda peritonitis jika iskemia.',p:'USG abdomen: target sign / pseudo-kidney sign — DIAGNOSTIK. Rontgen abdomen: ileus, massa jaringan lunak. Enema barium/udara: diagnostik DAN terapeutik. Lab: DL, elektrolit. Untuk dewasa: CT abdomen (cari lead point/tumor).'},
'ruptur_varises':{f:'TTV: takikardia, hipotensi (syok). Tanda gagal hati kronik: spider nevi, ginekomastia, eritema palmaris, leukonikhia, ikterus. Asites. Splenomegali (hipertensi portal). Kaput medusae. Rectal: melena.',p:'Endoskopi atas: SEGERA setelah stabilisasi — diagnostik dan terapeutik (ligasi/skleroterapi). Lab: DL, PT/INR (koagulopati), fungsi hati (SGOT/SGPT/bilirubin/albumin), elektrolit, BUN/kreatinin. Goldar + crossmatch. Analisis gas darah. USG abdomen Doppler.'},
'fimosis':{f:'TTV: normal. Inspeksi genitalia: preputium tidak dapat diretraksi, cincin fimotik (cincin fibrosa di ujung preputium). Palpasi: BXO (keras/putih). Pada parafimosis: glans edema, sianosis, preputium terjebak.',p:'Klinis murni. Urinalisis (ISK bersamaan). Gula darah (DM pada dewasa). Tidak perlu pemeriksaan khusus.'},
'gnaps':{f:'TTV: hipertensi (+), suhu normal-subfebris. Mata: edema periorbita (+). Kulit: pucat. Abdomen: tanda retensi cairan. Perkusi: CVA tenderness ringan. Extremitas: edema pitting.',p:'Urinalisis: hematuria (+), proteinuria (+), silinder eritrosit (+) khas, leukosituria. Urin 24 jam: proteinuria. Darah: DL (anemia dilutional), ureum/kreatinin meningkat, C3 menurun (khas GNAPS), ASTO meningkat. Kultur tenggorokan/kulit. USG ginjal: pembesaran bilateral. Biopsi ginjal (jarang, jika atipik).'},
'pielonefritis':{f:'TTV: demam tinggi (>38.5°C), menggigil, takikardia. CVA tenderness (+++) — nyeri ketuk sudut kostovertebral. Palpasi ginjal: nyeri. Genitalia: cari sumber infeksi.',p:'Urinalisis: leukosituria (+), bakteriuria (+), nitrit (+), silinder leukosit (+). Kultur urin: GOLD STANDARD + sensitivitas antibiotik. DL: leukositosis. CRP meningkat. Ureum/kreatinin. USG ginjal: pembesaran, abses perinefrik. CT urografi kontras (jika komplikasi/tidak respons).'},
'sistitis':{f:'TTV: TIDAK demam (atau subfebris ringan saja). Nyeri tekan suprapubik (+). CVA tenderness NEGATIF (beda pielonefritis). Genitalia: sekret, eritema uretra.',p:'Urinalisis: leukosituria (+), bakteriuria (+), nitrit (+). Dipstik: leukosit esterase (+). Kultur urin + sensitivitas: jika rekuren/hamil/komplikata. Lab darah: tidak diperlukan jika tidak komplikata. USG kandung kemih (jika rekuren).'},
'nefrolitiasis':{f:'TTV: bisa takikardia karena nyeri. CVA tenderness (+++) — sangat nyeri. Abdomen: tidak ada peritonitis (beda appendisitis). Genitalia: nyeri alih ke skrotum/labia. Mual, gelisah.',p:'Urinalisis: hematuria (+) — mikro/makroskopik, kristal. USG ginjal dan saluran kemih: batu (+), hidronefrosis. CT scan urografi tanpa kontras: GOLD STANDARD — sensitivitas 97%. Foto polos abdomen (BNO): batu radio-opak. Lab: DL, ureum/kreatinin, asam urat, kalsium, elektrolit. Analisis batu (jika keluar).'},
'prostatitis':{f:'TTV: demam tinggi (akut). Colok dubur (DRE): prostat membesar, SANGAT nyeri tekan, hangat, lunak berfluktuasi (abses). Catatan: DRE hati-hati pada akut karena bisa picu bakteremia! Pembesaran KGB inguinal.',p:'Urinalisis + kultur urin: KUNCI. EPS (Expressed Prostatic Secretion) — jangan pada prostatitis akut (nyeri+risiko bakteremia). PSA meningkat (akut). DL: leukositosis. Transrektal USG (TRUS): abses prostat. CT pelvis jika komplikasi.'},
'uretritis_go':{f:'TTV: normal. Inspeksi genitalia: sekret uretra purulen kuning-hijau, uretra hiperemis. Palpasi kelenjar inguinal: limfadenopati (+). Pada wanita: sekret serviks purulen (gonore endoservikitis). Cek adanya PID.',p:'Apusan uretra: Gram — diplokokus gram negatif intraseluler di PMN (khas). Kultur Thayer-Martin: GOLD STANDARD. PCR/NAAT uretra/serviks: paling sensitif. Lab: VDRL/TPHA (sifilis), HIV rapid test, Hepatitis B/C (skrining IMS komprehensif).'},
'sindrom_nefritik':{f:'TTV: hipertensi (+). Mata: edema periorbita pagi. Abdomen: edema generalisata. Perkusi: CVA tenderness. Ascites (jika berat).',p:'Urinalisis: hematuria, proteinuria, silinder eritrosit (khas nefritik!). Urin 24 jam: proteinuria <3.5g/hari (beda nefrotik). Darah: DL, ureum/kreatinin, albumin (sedikit turun), komplemen C3/C4, ANA, ANCA, ASTO. Biopsi ginjal: GOLD STANDARD diagnosis definitif.'},
'pap_smear':{f:'TTV: normal. Pemeriksaan ginekologi dengan spekulum: serviks (warna, permukaan, ektropion, lesi), ostium uteri eksternum. Pemeriksaan bimanual: ukuran uterus, nyeri tekan adneksa.',p:'PAP smear: usap ektoserviks (spatula Ayre) + endoserviks (cytobrush) → fiksasi alkohol 95% → interpretasi Bethesda. IVA test: asam asetat 3-5%. HPV DNA test (co-test usia ≥30). Kolposkopi + biopsi jika hasil abnormal.'},
'bv':{f:'TTV: normal. Inspeksi vulva: sekret vagina abu-abu encer, berbau amis. pH vagina >4.5. Whiff test: amine/fishy odor dengan KOH 10% (+). Spekulum: tidak ada eritema signifikan (beda kandidiasis), sekret tipis homogen.',p:'Kriteria Amsel (≥3/4): pH >4.5 + clue cells + whiff test (+) + sekret abu-abu homogen. Apusan basah/KOH: clue cells (epitel vagina diselimuti bakteri). Pewarnaan Gram: Nugent score ≥7. Kultur: tidak rutin.'},
'pid':{f:'TTV: demam (+). Abdomen: nyeri tekan perut bawah bilateral. Pemeriksaan dalam: CMT (cervical motion tenderness) — khas!, nyeri tekan uterus, nyeri tekan adneksa bilateral. Sekret serviks: purulen. Massa adneksa (abses tuba-ovarium).',p:'Lab: DL leukositosis, CRP/LED meningkat. Gonore dan klamidia: NAAT serviks. Apusan serviks: Gram. USG TV (transvaginal): abses tuba-ovarium, cairan bebas. Laparoskopi: GOLD STANDARD (jarang dilakukan rutin). βhCG: singkirkan KET. Urinalisis.'},
'abortus_imminens':{f:'TTV: normal. Abdomen: TFU sesuai usia kehamilan. Spekulum: OUE TERTUTUP — khas! Tidak ada jaringan keluar dari serviks. Perdarahan aktif dari OUE (+/-). DJJ: dengarkan dengan Doppler.',p:'USG obstetri: DJJ (+), kantung gestasi intak, letak. Subchorionic hematoma? βhCG serial (tiap 48 jam): meningkat >66% = prognosis baik. Goldar + rhesus. Progesteron serum.'},
'peb':{f:'TTV: TD ≥160/110 mmHg (ukur 2x, 4 jam selang). Edema: wajah, tangan, tungkai (pitting). Fundoskopi: perubahan vaskular. Neurologi: refleks patela hiperaktif (pre-eklamsia berat), klonus (+). Auskultasi: ronki (edema paru).',p:'Lab LENGKAP dan SEGERA: DL (trombositopenia <100.000 = HELLP), hapusan darah tepi. Ureum/kreatinin. SGOT/SGPT (HELLP). LDH meningkat. Asam urat. Proteinuria: dipstik ≥2+ atau urin 24 jam ≥300mg. Koagulasi (PT, APTT, fibrinogen). USG obstetri + Doppler umbilikal + CTG. Monitoring janin ketat.'},
'mastitis':{f:'TTV: demam >38.5°C. Payudara: kemerahan (+), teraba panas (+), keras/indurasi (+), nyeri tekan (+), edema kulit. Fluktuasi (abses). KGB aksila: pembesaran. Puting: lecet/fisura (pintu masuk). ASI: cek produksi dan pengeluaran.',p:'Klinis terutama. Kultur ASI/sekret puting (jika rekuren atau tidak respons AB). USG payudara: membedakan mastitis vs abses (abses: lesi kistik berdinding). Lab: DL (leukositosis pada mastitis berat).'},
'bartholinitis':{f:'TTV: bisa demam. Inspeksi: pembengkakan di labia mayora posterior unilateral, eritema, kulit mengkilat. Palpasi: nyeri tekan, hangat, fluktuatif (abses). Diferensiasi: kista Bartolin (tidak merah, tidak nyeri).',p:'Klinis. Kultur sekret/pus (setelah drainase): gonore, klamidia, flora campuran. Gram apusan. Lab: DL jika sistemik. Jika rekuren pada usia >40 tahun: biopsi singkirkan karsinoma Bartolin.'},
'dm2':{f:'TTV: TD, nadi, BB, TB, IMT, lingkar pinggang. Kulit: acanthosis nigricans (resistensi insulin), kandidiasis kulit, luka. Mata: funduskopi (retinopati diabetik). Neurologis kaki: monofilamen 10g, garpu tala 128 Hz, refleks achilles. Kaki: deformitas, ulkus, neuropati. Palpasi nadi perifer (vaskulopati).',p:'GDP ≥126 atau GDS ≥200 + gejala atau HbA1c ≥6.5%. HbA1c: kontrol 3 bulan. Urinalisis: glukosuria, proteinuria (nefropati). Urin mikroalbuminuria. Fungsi ginjal (ureum/kreatinin/GFR). Profil lipid. EKG. Funduskopi (SpM). ABI (vaskuler perifer).'},
'graves':{f:'TTV: takikardia, hipertensi sistolik, suhu hangat, berkeringat. BB turun. Eksoftalmus (proptosis), lid lag, lid retraction (mata). Tremor halus tangan (+). Goiter difus, bruit tiroid (+). Kulit: hangat, lembab. Miopati proksimal.',p:'TSH sangat rendah (↓↓), FT4/FT3 sangat meningkat. TRAb/TSI (+): khas Graves. Sidik tiroid: penyerapan merata meningkat. USG tiroid: pembesaran difus, hipervaskularisasi. Lab: DL, fungsi hati, glukosa.'},
'hhs':{f:'TTV: hipotensi, takikardia, turgor sangat menurun, mukosa kering. Kesadaran: somnolen/stupor/koma. Dehidrasi berat. Tidak ada napas Kussmaul (berbeda DKA). Tidak ada bau keton.',p:'GDS: SANGAT TINGGI (>600 mg/dL). Osmolalitas serum >320 mOsm/kg: KUNCI. Elektrolit: Na, K. Analisis gas darah: pH normal/sedikit asidosis, bikarbonat normal (beda DKA). Keton urin/darah: negatif/minimal. DL, fungsi ginjal, urinalisis.'},
'hipoglikemia':{f:'TTV: takikardia, diaphoresis, pucat. Kesadaran: bingung, gelisah, bisa tidak sadar/kejang. Kulit: dingin, basah. Triad Whipple: gejala hipoglikemia + GDS rendah + membaik setelah glukosa.',p:'GDS: <70 mg/dL (konfirmasi dengan glukometer SEGERA). Setelah koreksi: GDS ulang tiap 15 menit. Lab: elektrolit, fungsi ginjal. Insulin serum + C-peptide (jika curiga insulinoma). Kortisol (insufisiensi adrenal).'},
'cushing':{f:'TTV: hipertensi. Inspeksi: moon face, buffalo hump, obesitas sentral, striae ungu ≥1cm (khas, beda stretch mark biasa: putih). Kulit tipis, mudah memar (ekimosis minimal trauma). Hirsutisme. Edema.',p:'Screening: kortisol urin 24 jam (UFC) ↑, kortisol saliva tengah malam ↑, tes supresi deksametason 1mg semalam (kortisol >1.8 μg/dL = abnormal). Konfirmasi: tes supresi deksametason 2 hari. ACTH plasma: bedakan tergantung/tidak tergantung ACTH. MRI hipofisis / CT adrenal.'},
'goiter':{f:'TTV: normal (eutiroid). Inspeksi leher: pembesaran anterior saat menelan. Palpasi tiroid: ukuran, tekstur, nyeri, nodular. Auskultasi: bruit (toksik). Tidak ada tanda tirotoksikosis.',p:'TSH: normal (eutiroid). FT4: normal. USG tiroid: ukuran, echo, nodular/difus. Sidik tiroid (thyroid scan). TRAb (jika curigai Graves). TSI. Iodium urin (defisiensi iodium). FNA biopsi (jika ada nodul curiga keganasan).'},
'gizi_buruk':{f:'Antropometri: BB, TB, MUAC (<11.5cm berat) — Z-score. Inspeksi: tampak sangat kurus, kulit keriput/mengendur, wajah seperti orang tua, rambut rontok/jarang. Edema: tidak ada (marasmus) atau ada (kwashiorkor). Suhu: hipotermia. GCS: apatis.',p:'GDS: hipoglikemia (<54 mg/dL). DL: anemia, limfopenia. Elektrolit: hipokalemia, hiponatremia, hipofosfatemia. Albumin: rendah. Urinalisis. Mantoux/IGRA (TB bersamaan). Rontgen dada. Feses: parasit. Lab sesuai komplikasi.'},
'hipoparatiroid':{f:'TTV: normal. Chvostek sign: ketuk N. facialis → kontraksi otot wajah ipsilateral (+). Trousseau sign: manset >TD sistolik 3 menit → karpopedal spasme (+). Kuku rapuh, rambut kasar/rontok. Katarak (kronik).',p:'Kalsium serum total: rendah (<8.5 mg/dL). Kalsium ionik: rendah. Fosfor: meningkat. PTH: rendah (khas hipoparatiroid; beda pseudohipo: PTH tinggi). Magnesium (hipoMg menyebabkan hipoparatiroid fungsional). EKG: interval QT memanjang.'},
'malaria':{f:'TTV: demam tinggi (39-41°C saat paroksismal). Konjungtiva: ikterik (+). Splenomegali (jika kronik). Hepatomegali. Tanda malaria berat: penurunan kesadaran, kejang, anemia berat, ikterus, SpO2 turun.',p:'Apusan darah tebal dan tipis: GOLD STANDARD — identifikasi spesies dan kepadatan parasit. RDT (Rapid Diagnostic Test): cepat, untuk falciparum dan vivax. PCR malaria: paling sensitif. Lab: DL (anemia, trombositopenia), bilirubin, LDH, fungsi ginjal, glukosa, analisis gas darah (berat).'},
'dhf':{f:'TTV: demam 38-40°C. Uji tourniquet (Rumpel-Leede): peteki ≥10/1 inci² = POSITIF. Inspeksi: petekie, purpura, perdarahan gusi, epistaksis. Abdomen: nyeri tekan epigastrik/RUQ (hati). Hepatomegali (+). Tanda syok: akral dingin, nadi lemah, capillary refill >2 detik.',p:'Lab serial: DL tiap 4-6 jam — trombosit <100.000 (↓progresif) + hematokrit ↑≥20% = KHAS. NS1 antigen: hari 1-5 (spesifik tinggi). IgM/IgG anti-dengue (hari ke 5+). Antigen/antibodi combo. USG abdomen: asites, efusi pleura, penebalan dinding kandung empedu.'},
'leptospirosis':{f:'TTV: demam tinggi. Konjungtival suffusion (kemerahan konjungtiva bilateral TANPA discharge — khas!). Nyeri tekan betis BERAT (+). Hepatomegali (+) fase imun. Ikterus (+) Weil disease. Oliguria. Kaku kuduk (meningitis aseptik).',p:'IgM anti-leptospira: positif mulai hari ke 5-7. MAT (Microscopic Agglutination Test): GOLD STANDARD sero, dilakukan lab rujukan. PCR leptospira: fase awal. Lab: DL (leukositosis), bilirubin (meningkat), SGOT/SGPT (meningkat moderat), ureum/kreatinin (gagal ginjal), CK (mialgia), urinalisis (proteinuria, hematuria, silinder).'},
'anemia_besi':{f:'TTV: takikardia kompensasi jika berat. Konjungtiva palpebra: PUCAT (paling mudah dinilai). Telapak tangan: pucat. Lidah: pucat, atrofi papil. Kuku: koilonichia (cekung). Sudut mulut: angular stomatitis. Jantung: bising sistolik (anemia berat). Limpa: splenomegali ringan (kadang).',p:'DL: Hb↓, MCV↓<80fL, MCH↓<27pg, MCHC↓. Apusan darah tepi: mikrositik hipokromik, sel pensil, poikilosit. Ferritin: RENDAH (<12 μg/L) — paling spesifik. Serum iron↓, TIBC↑, saturasi transferin↓. Retikulosit: rendah (beda hemolisis). Cari penyebab: endoskopi (perdarahan GI), urinalisis (ISK/hematuria).'},
'ra':{f:'TTV: normal atau demam ringan. Inspeksi sendi: bengkak, eritema, deformitas (swan neck, boutonniere, ulnar deviation). Palpasi: hangat, nyeri tekan sendi. Kekuatan genggaman menurun. Nodul rematoid (ekstra-artikular). Auskultasi: perikarditis, pleuritis (komplikasi).',p:'Lab: RF (Rheumatoid Factor): (+) 70-80%. Anti-CCP: SPESIFIK (95%), bisa (+) lebih awal. LED, CRP: meningkat (aktivitas). DL: anemia normositik normokromik. Fungsi ginjal/hati (sebelum DMARD). Foto sendi: osteopenia periartikular, erosi, penyempitan celah sendi. USG sendi: sinovitis, erosi awal. MRI sendi.'},
'sle':{f:'TTV: demam. Kulit: malar rash (butterfly rash, tidak mengenai lipatan nasolabial), diskoid, fotosensitif, alopesia, ulkus oral (painless). Sendi: artritis non-erosif. Paru: pleural rub. Jantung: perikardial rub. Abdomen: hepatosplenomegali, asites. Edema (nefritis).',p:'ANA: (+) >95% sensitif, tidak spesifik. Anti-dsDNA: (+) spesifik, titer korelasi dengan aktivitas. Anti-Sm: (+) spesifik. Komplemen C3/C4: turun saat aktif. DL: anemia hemolitik (Coombs (+)), leukopenia, limfopenia, trombositopenia. Urinalisis + sedimen: proteinuria, hematuria, silinder. Fungsi ginjal. APS (anti-kardiolipin, anti-β2GPI, LA). SLEDAI score.'},
'demam_rematik':{f:'TTV: demam. Jantung: AUSKULTASI KUNCI — murmur mitral (regurgitasi: pansistolik apeks; stenosis: middiastolik), perikardial friction rub. Artritis: sendi merah, bengkak, panas, berpindah. Korea: gerakan involunter. Kulit: eritema marginatum (merah dengan tepi jelas), nodul subkutan (keras, tidak nyeri, di atas tonjolan tulang).',p:'Lab: ASTO: meningkat (≥400 Todd Unit pada anak) — KUNCI. Anti-DNase B. Kultur tenggorokan (Streptokokus grup A). DL: leukositosis. LED/CRP: meningkat. EKG: PR interval memanjang (derajat 1 AV block — karditis). Ekokardiografi: valvulitis (mitral/aorta), vegetasi, disfungsi ventrikel — WAJIB pada semua kasus.'},
'polimyalgia':{f:'TTV: normal atau demam ringan. Bahu: NYERI dan KAKU bilateral, ROM sangat terbatas (abduksi aktif terbatas, pasif hampir normal — beda artritis). Panggul: nyeri, kaku bilateral. Kekuatan otot: NORMAL (sangat penting membedakan dari miopati inflamasi). Tidak ada artritis perifer bermakna.',p:'LED: SANGAT TINGGI >50 mm/jam (sering >100). CRP: sangat meningkat. DL: anemia normokromik normositer. RF dan anti-CCP: NEGATIF (beda RA). ANA: negatif. Alkali fosfatase: sedikit meningkat. USG bahu: bursitis subdeltoid bilateral (+). Biopsi arteri temporal (jika ada gejala GCA: sakit kepala, jaw claudication, penurunan visus).'},
'anafilaksis':{f:'TTV: hipotensi (TD <90/60), takikardia, SpO2 turun. Kulit: urtikaria difus, angioedema (wajah, bibir, lidah). Saluran napas: stridor (edema laring), wheezing. Paru: tidak ada suara napas (bronkospasme berat). Abdomen: nyeri, mual. Neurologis: penurunan kesadaran.',p:'KLINIS — jangan tunda pengobatan untuk pemeriksaan! Setelah stabilisasi: triptase serum (peak 1-2 jam, <6 jam setelah onset): meningkat pada anafilaksis. IgE spesifik alergen (retrospektif). Skin prick test (6 minggu setelah episode, untuk identifikasi alergen). Lab: DL, elektrolit, analisis gas darah.'},
'angioedema':{f:'TTV: normal atau hipotensi (jika anafilaksis). Inspeksi: edema non-pitting wajah (periorbita, bibir, lidah), leher, ekstremitas. Stridor (laring). Auskultasi: stridor inspirasi (darurat!). Abdomen: nyeri kolik (GI involvement).',p:'C4: RENDAH pada angioedema herediter (AEH). C1-INH: RENDAH pada AEH. C1q: rendah (AEH tipe II). Triptase: meningkat pada anafilaksis. IgE spesifik. Lab: DL, fungsi ginjal (ACEi-induced: stop ACEi, tidak ada pemeriksaan spesifik).'},
'ankle_sprain':{f:'TTV: normal. Inspeksi: edema, ekimosis (memar lateral ankle). Palpasi: nyeri tekan tepat di ATFL (anterior talofibular ligament), kalkaneofibular ligament. Ottawa ankle rules: nyeri tulang malleolus medial/lateral atau navikular atau basis MT5 + tidak bisa jalan 4 langkah → indikasi X-ray. Anterior drawer test: laxity (grade III). Talar tilt test.',p:'X-ray ankle AP, lateral, mortise: singkirkan fraktur (jika Ottawa positif). MRI ankle: cedera ligamen, osteochondral defect (jika tidak membaik). USG: ligamen, tendon peroneal.'},
'oa_genu':{f:'TTV: normal. IMT. Inspeksi: deformitas varus/valgus, efusi (knee effusion — ballottement/bulge sign). Palpasi: krepitasi (+), nyeri tekan garis sendi. ROM: terbatas. Lachman, McMurray (singkirkan lesi ligamen/meniskus). Panjang tungkai.',p:'X-ray genu AP + lateral + skyline (posisi berdiri): penyempitan celah sendi, osteofit, sklerosis subkondral, kista. Kellgren-Lawrence grading I-IV. Lab: DL, LED, RF, asam urat (singkirkan RA/gout). MRI (jika curiga meniskopati/lesi kartilago). Analisis cairan sendi (jika efusi besar: singkirkan infeksi/gout).'},
'gout':{f:'TTV: demam ringan saat akut. Inspeksi: MTP-1 (jempol kaki) atau sendi lain: merah, bengkak besar, mengkilat. Palpasi: SANGAT nyeri (bahkan angin sepoi nyeri!), hangat. Tofi: benjolan keras putih-kuning di daun telinga, tendo Achilles, olekranon. ROM sendi: terbatas karena nyeri.',p:'Asam urat serum: sering tinggi (tapi bisa normal saat serangan akut!). DL: leukositosis ringan. LED/CRP: meningkat. Fungsi ginjal (urikosuria). Aspirasi sendi: GOLD STANDARD — kristal urat berbentuk jarum, birefringen negatif (polarisasi). X-ray sendi: &quot;rat-bite&quot; erosion, kalsifikasi tofi. USG: double contour sign, agregat kristal.'},
'fraktur':{f:'TTV: nyeri (takikardia), hipotensi jika perdarahan banyak. Inspeksi: deformitas (angulasi, shortening, rotasi), pembengkakan, ekimosis, luka (fraktur terbuka — DARURAT). Palpasi: nyeri tekan tepat (+), krepitasi (+). Neurovaskular distal: nadi, kapiler, sensasi, motorik. Status kompartemen (compartment syndrome).',p:'X-ray: WAJIB — minimal 2 proyeksi (AP + lateral), sendi atas dan bawah fraktur. CT scan: fraktur kompleks (intraartikular, vertebra, pelvis). MRI: fraktur stress, jaringan lunak. Lab: DL, goldar, koagulasi (perdarahan banyak).'},
'meniscus_tear':{f:'TTV: normal. Inspeksi: efusi lutut (ballottement/stroke test +). Palpasi: nyeri tekan garis sendi (medial atau lateral). McMurray test (+). Apley compression (+). Thessaly test. ROM: terbatas (locking). Lachman/anterior drawer (singkirkan ACL bersamaan).',p:'MRI lutut: GOLD STANDARD — tampak tear meniskus, grading I-III. X-ray lutut: singkirkan fraktur, OA. Artroskopi: diagnostik DAN terapeutik (gold standard definitif).'},
'ruptur_achilles':{f:'TTV: normal. Inspeksi: pembengkakan belakang tumit, cekungan di tendon. Palpasi: GAP di tendon (+), nyeri tekan (+). Thompson test (Simmonds test): POSITIF — meremas betis tidak menggerakkan kaki ke plantar fleksi. ROM: tidak bisa aktif plantar fleksi kaki.',p:'USG tendon Achilles: konfirmasi ruptur, derajat. MRI: detail jaringan lunak, partial vs complete tear. X-ray lateral kaki: singkirkan avulsi kalkaneus (Haglund deformity). '},
'osteomyelitis':{f:'TTV: demam tinggi. Inspeksi: bengkak, eritema di atas tulang yang terkena, fistula (kronis). Palpasi: nyeri tekan LANGSUNG di tulang (bukan sendi — beda artritis septik). Perkusi: nyeri. ROM sendi terdekat: terbatas.',p:'Lab: DL (leukositosis), LED/CRP (sangat meningkat), kultur darah (30-50% positif). X-ray: NORMAL 10-14 hari pertama! Perubahan awal: edema jaringan lunak. Lanjut: destruksi tulang, periosteal reaction, sequester. MRI: GOLD STANDARD dan paling awal deteksi — edema sumsum tulang. Skintigrafi tulang. Biopsi tulang + kultur: definitif.'},
'tenosinovitis':{f:'TTV: demam. Kanavel 4 signs: (1) jari posisi sedikit fleksi, (2) edema fusiform seluruh jari, (3) nyeri tekan sepanjang tendon fleksor, (4) nyeri saat ekstensi pasif jari secara pasif. Semua 4 signs: diagnostik tenosinovitis supuratif.',p:'Lab: DL leukositosis, CRP meningkat, kultur darah. X-ray jari: singkirkan osteomyelitis, benda asing. MRI: detail inflamasi tendon sheath (jarang, tidak perlu jika klinis jelas). Kultur intraoperatif (saat drainase): kritis untuk antibiotik definitif.'},
'lipoma':{f:'TTV: normal. Inspeksi: massa subkutan, kulit di atasnya normal (tidak ada punctum). Palpasi: lunak, kenyal seperti adonan (dough-like), berbatas tegas, MOBILE (meluncur), tidak nyeri, tidak melekat ke kulit. Ukur diameter. Transilluminasi.',p:'Klinis biasanya cukup. USG: lesi hiperekoik homogen (lemak). MRI: jika curiga liposarkoma (keras, tidak mobile, >5cm, dalam fascia): sinyal lemak dengan septa tebal. Biopsi/PA: jika ada keraguan.'},
'wrist_sprain':{f:'TTV: normal. Inspeksi: bengkak, ekimosis. Palpasi: nyeri tekan anatomical snuffbox (skafoid!), DRUJ (radiocarpal distal). Watson test (scaphoid shift test). Grip strength menurun. ROM pergelangan.',p:'X-ray pergelangan AP + lateral + oblique: singkirkan fraktur Colles, skafoid (awal bisa normal!). Jika nyeri anatomical snuffbox + X-ray normal: anggap fraktur skafoid → immobilisasi + foto serial 2 minggu atau MRI segera (paling sensitif untuk skafoid).'},
'knee_sprain':{f:'TTV: normal. Efusi lutut (ballottement). Lachman test (+) = ACL. Anterior drawer test. Posterior drawer test (+) = PCL. Valgus stress test (+) = MCL. Varus stress test (+) = LCL. Pivot shift test. McMurray (meniskus bersamaan).',p:'X-ray lutut: singkirkan fraktur (Segond fracture = patognomonik cedera ACL). MRI lutut: GOLD STANDARD — cedera ligamen, meniskus, osteochondral. Artroskopi (definitif).'},
'mh_mb':{f:'TTV: normal. Inspeksi seluruh kulit: lesi, distribusi (bilateral), batas, hipopigmentasi/eritema, anestesia (uji kapas, pin prick). Palpasi saraf tepi: penebalan N. ulnaris (di sulkus ulnaris), N. peroneus (di caput fibula), N. auricularis magnus (leher). Slit-skin smear: BTA (+).',p:'Slit-skin smear (kerokan kulit): BTA (+) banyak pada MB. Biopsi kulit: gambaran histopatologi (granuloma lepramatosa — MB). Bacterial index (BI) dan Morphological index (MI). Lepromatin test: NEGATIF pada MB. Pemeriksaan saraf: kecepatan hantaran saraf.'},
'varicella':{f:'TTV: demam 38-39°C. Inspeksi kulit: lesi polimorfik berbagai stadium bersamaan (makula → papula → vesikel → krusta), distribusi sentripetal, mukosa oral bisa ada. Palpasi: tidak nyeri. Limfadenopati servikal (+).',p:'Klinis terutama. PCR VZV (jika atipik/imunosupresi): dari cairan vesikel. Tzanck smear: sel raksasa multinukleat (tidak spesifik, bisa herpes simpleks). Serologi IgM VZV (jarang diperlukan). Lab: DL (leukopenia limfositosis). '},
'herpes_zoster':{f:'TTV: normal atau demam ringan. Inspeksi: vesikel berkelompok di atas eritema, mengikuti SATU dermatom, unilateral, TIDAK melewati garis tengah. Distribusi sesuai saraf: thorakal (paling sering), wajah (V1 — keterlibatan kornea!), lumbal. Periksa mata jika V1 (zoster oftalmik).',p:'Klinis. PCR VZV dari cairan vesikel (jika atipik). Tzanck smear (tidak spesifik). Lab: DL normal. Serologi (jarang). Kultur VZV. Jika ada keterlibatan mata: pemeriksaan slit lamp (uveitis, keratitis).'},
'urtikaria':{f:'TTV: bisa takikardia, hipotensi (anafilaksis). Inspeksi: wheal (papul/plak eritematosa, bentuk dan ukuran bervariasi), angioedema (wajah/bibir/lidah/tenggorokan). Dermografisme. Tekanan: urtikaria tekanan. Dermoskopi. Tanda anafilaksis: stridor, wheezing, hipotensi.',p:'Klinis akut: tidak perlu pemeriksaan rutin. Kronik: DL, LED, CRP, TSH (tiroid), IgE total, tes alergi (prick test/RAST). Biopsi kulit (jika curiga vaskulitis urtikaria). H. pylori test. Komplemen C4 (angioedema herediter). Tantangan fisik (dermografisme, cold, pressure).'},
'dermatitis_atopi':{f:'TTV: normal. Inspeksi: ekskoriasi, likenifikasi, krusta, erosi (dari garukan), distribusi sesuai usia. Dermatoskopi. Tanda Dennie-Morgan (lipatan infraorbita ganda). Kulit kering (xerosis) seluruh tubuh. Infeksi sekunder: krusta madu (impetigo), vesikel (herpes).',p:'Klinis (kriteria Hanifin-Rajka). IgE total serum: sering tinggi. IgE spesifik alergen (RAST): jika curiga alergen spesifik. Skin prick test. Apusan kulit + kultur: S. aureus (eksaserbasi). Biopsi kulit (jika atipik). Patch test (dermatitis kontak bersamaan).'},
'fde':{f:'TTV: normal. Inspeksi: plak bulat oval eritematosa/hiperpigmentasi/bula di lokasi yang sama berulang. Mukosa: bisa ada (FDE genital). Tanda SJS/TEN: tidak ada (lesi tunggal/beberapa, tidak ada erosimukosal luas, tidak ada Nikolsky).',p:'Klinis terutama (riwayat obat + lokasi sama). Biopsi kulit: interface dermatitis dengan melanofag (konfirmasi). Patch test (provokasi terkontrol di lokasi lesi): positif spesifik. Tes provokasi oral (dengan pengawasan dokter): jika diagnosis meragukan.'},
'erisipelas':{f:'TTV: demam tinggi (39-40°C), menggigil. Inspeksi: plak eritematosa BERBATAS TEGAS dan MENINGGI (perbedaan utama dengan selulitis!), kulit jeruk (peau d&#39;orange), eritema cerah, sangat nyeri. Limfadenopati regional (+). Cari pintu masuk (luka, fisura, tinea pedis).',p:'Klinis terutama. Lab: DL leukositosis, LED/CRP meningkat. Kultur darah (jika demam tinggi/sepsis). Apusan dari luka/pintu masuk (jarang produktif). ASO (infeksi Streptokokus). Doppler vena (singkirkan DVT).'},
'skrofuloderma':{f:'TTV: demam subfebris. Inspeksi: nodul subkutan berkembang jadi ulkus dengan TEPI MENGGAUNG (undermining edges) — khas, fistula draining, sikatrik. Leher paling sering. Palpasi: KGB membesar, lunak/fluktuatif. Cari TB paru bersamaan.',p:'Lab: DL, LED/CRP meningkat. Mantoux/IGRA: (+). BTA dari sekret fistula/kerokan ulkus: (+). Kultur M. tuberculosis. Biopsi: granuloma tuberkuloid dengan nekrosis kaseosa. Foto toraks (TB paru bersamaan). PCR TB.'},
'furunkel':{f:'TTV: demam jika berat/multipel. Inspeksi: nodul inflamasi (eritema, edema) dengan pustul sentral, folikel rambut di tengah. Palpasi: fluktuasi (+) → indikasi drainase. Batas lesi. KGB regional (limfadenopati jika berat).',p:'Klinis. Kultur pus (setelah drainase): S. aureus. Sensitivitas antibiotik (termasuk MRSA jika tidak respons). GDS: DM sebagai faktor risiko. Lab darah jika multipel/rekuren: DL, imunoglobulin.'},
'clm':{f:'TTV: normal. Inspeksi: jejak berliku-liku eritematosa (meandering track) bergerak maju, papul/vesikel di ujung trek aktif, gatal hebat. Distribusi: telapak kaki, bokong, tangan. Kulit sekitar: ekskoriasi (garukan).',p:'Klinis terutama (riwayat kontak tanah/pasir di daerah tropis + gambaran khas). Dermoskopi: larva kadang tampak. Biopsi kulit (jarang): larva sulit ditemukan karena berada di depan trek yang tampak. Lab: eosinofilia darah (kadang).'},
'erupsi_obat':{f:'TTV: biasanya normal. Inspeksi: ruam makulopapular simetris, dimulai badan → menyebar ke ekstremitas, eritematosa, gatal. Mukosa: NORMAL (beda SJS/TEN). Nikolsky sign: NEGATIF (beda SJS/TEN). Cari tanda DRESS: limfadenopati, hepatomegali.',p:'Lab: DL — eosinofilia (curiga DRESS). Fungsi hati (DRESS). Patch test (6 minggu setelah sembuh): identifikasi obat penyebab. Biopsi kulit (jika atipik): interface dermatitis. Monitoring: tanda SJS/TEN (lepuh, erosimukosal, Nikolsky (+)).'},
'akne_berat':{f:'TTV: normal. Inspeksi: nodul, kista, pustul, papul, komedo (terbuka dan tertutup). Distribusi: wajah, dada, punggung, bahu. Sikatrik aktif atau hipertrofik. Tidak ada telangiektasia/eritem sentrifugal (beda rosasea). Global Acne Grading Scale (GAGS).',p:'Klinis terutama. Apusan lesi + Gram (jika curiga gram-negatif follikulitis). Hormonal: testosteron, DHEA-S, LH/FSH, prolaktin (jika ada tanda hiperandrogenisme pada wanita). Sebelum isotretinoin: DL, SGOT/SGPT, lipid, βhCG (wanita).'},
'moluscum':{f:'TTV: normal. Inspeksi: papul bulat 2-5mm, warna seperti kulit/putih mutiara, UMBILICATED (cekungan di tengah) — KHAS! Berkelompok atau soliter. Distribusi: badan, wajah, ekstremitas (anak); genitalia (dewasa seksual aktif). Dermoskopi: pola polylobular.',p:'Klinis (gambaran khas). Jika meragukan: Biopsi/eksisi + PA (Henderson-Patterson bodies). Ekspresi isi papul: material putih seperti keju. Pada dewasa dengan lesi luas: tes HIV (imunosupresi).'},
'lsk':{f:'TTV: normal. Inspeksi: plak likenifikasi (penebalan kulit, garis kulit menonjol = lichenification, hiperpigmentasi). Lokasi: tengkuk, pergelangan, malleolus medial, skrotum. Batas relatif tegas. Ekskoriasi (+). Tidak ada vesikel/bula (beda eksim).',p:'Klinis. Biopsi kulit (jika atipik): akantosis, hiperkeratosis, fibrosis dermis (konfirmasi). KOH (singkirkan dermatofit). Patch test (singkirkan dermatitis kontak alergi). Evaluasi psikologis.'},
'karbunkel':{f:'TTV: demam (+), malaise. Inspeksi: massa inflamasi besar dengan MULTIPLE discharge points (beda furunkel = satu), eritema, edema, sangat nyeri. Lokasi: tengkuk, punggung, paha. Palpasi: fluktuasi luas (+). KGB regional (+).',p:'Lab: DL (leukositosis berat). GDS (DM faktor risiko — sering terungkap di sini!). Kultur pus (setelah drainase): S. aureus, MRSA. Sensitivitas AB. Kultur darah jika sepsis.'},
'tinea_pedis':{f:'TTV: normal. Inspeksi: lesi interdigitalis (sela jari 3-4-5 paling sering): maserasi, fisura, skuama putih, eritema. Bentuk lain: vesikular (telapak), hiperkeratotik (plantar kronik), ulseratif. Bau (+).',p:'KOH 10-20%: hifa bersepta (positif). Kultur jamur (Sabouraud): jika KOH meragukan atau terapi gagal. Lampu Wood: kadang fluoresen (beda eritrasma: merah bata).'},
'pityriasis_rosea':{f:'TTV: normal (atau demam ringan prodromal). Inspeksi: HERALD PATCH (plak oval tunggal besar dengan skuama di dalam/collar of scale, bukan di tepi) → 1-2 minggu kemudian muncul lesi sekunder mengikuti garis Blaschko/cleavage lines (Christmas tree pattern di punggung).',p:'Klinis. VDRL/TPHA/RPR: WAJIB singkirkan sifilis sekunder (klinis mirip!). Lab: DL. KOH (singkirkan tinea). Biopsi (jika atipik). Tes HIV jika ada risiko.'},
'tinea_manuum':{f:'TTV: normal. Inspeksi: satu tangan biasanya (two feet-one hand syndrome: 2 kaki + 1 tangan dominan). Sisik difus hiperkeratosis telapak tangan, garis tangan menonjol. Periksa kaki bersamaan (hampir selalu ada tinea pedis). KOH (+).',p:'KOH: hifa bersepta (+). Kultur jamur (jika perlu). Lampu Wood (beda eritrasma).'},
'ome':{f:'TTV: normal (tidak demam). Otoskopi: MT suram, keabu-abuan/kuning, retraksi, air-bubble atau air-fluid level, cone of light hilang atau terdistorsi, MT tidak bergerak pada pneumatoskopi. Pendengaran: turun. Rinne dan Weber: tuli konduktif.',p:'Timpanometri: TIPE B (flat curve) — khas efusi. Timpanometri tipe C: retraksi MT. Audiometri nada murni: tuli konduktif. Nasoendoskopi: hipertrofi adenoid (penyebab). Impedansmetri.'},
'miringitis':{f:'TTV: demam, nyeri telinga berat. Otoskopi: bulla hemoragik pada permukaan membran timpani dan/atau liang telinga medial (khas!). Pendengaran: turun ringan. Tidak ada perforasi (berbeda OMA).',p:'Klinis. Kultur dari bulla (jika dipecah): campuran bakteri, kadang Mycoplasma. Audiometri. Timpanometri. Lab: DL jika demam berat.'},
'mastoiditis':{f:'TTV: demam tinggi. Inspeksi: aurikula terdorong ke depan-bawah, eritema, pembengkakan retroaurikuler. Palpasi: nyeri tekan mastoid (+++) — khas. Fluktuasi (abses subperiosteal). Otoskopi: dinding posterior MAE menonjol (sagging posterior canal wall), sekret (+).',p:'CT scan temporal/mastoid: GOLD STANDARD — erosi tulang, opasifikasi sel mastoid, abses. X-ray mastoid (Schuller): opasifikasi sel mastoid (sudah jarang). Lab: DL (leukositosis berat), CRP. Kultur sekret telinga. Kultur darah jika sepsis.'},
