'demensia':{lok:'Gangguan fungsi otak menyeluruh (memori, orientasi, bahasa, fungsi eksekutif)',ons:'Sangat bertahap, tidak disadari awalnya, berlangsung bertahun-tahun (kronis progresif)',kua:'Lupa hal baru (memori jangka pendek dahulu), disorientasi tempat/waktu, bingung, perubahan perilaku/kepribadian',kun:'Ringan → sedang → berat, dinilai dengan MMSE/MoCA',mpb:'Lingkungan baru, kelelahan, infeksi, perubahan rutinitas',mr:'Lingkungan familiar, rutinitas teratur, stimulasi kognitif',sis:'Gangguan aktivitas sehari-hari (+), perubahan siklus tidur (+), kadang halusinasi pada stadium lanjut',rpd:'Kapan pertama kali keluarga menyadari perubahan? Riwayat stroke? Riwayat hipertensi, DM, dislipidemia? Riwayat depresi? Riwayat trauma kepala? Obat-obatan yang dikonsumsi?',rpk:'Riwayat Alzheimer/demensia dalam keluarga? Riwayat Down syndrome?',rsos:'Tingkat pendidikan (cadangan kognitif)? Aktivitas sosial/fisik/mental? Kondisi gizi? Pengasuh utama siapa?'},
'tia':{lok:'Tergantung arteri yang terlibat: hemisfer (lengan/wajah/bicara) atau vertebrobasiler (vertigo, diplopia, ataksia)',ons:'Mendadak (dalam detik-menit), REVERSIBEL dalam <24 jam (biasanya <1 jam)',kua:'Kelemahan separuh tubuh, kesulitan bicara, penglihatan kabur/ganda, ataksia, vertigo — lalu HILANG SEMPURNA',kun:'Episode tunggal atau berulang, tiap episode berlangsung menit hingga jam',mpb:'Tidak ada faktor spesifik yang memperberat episode itu sendiri',mr:'Episode berhenti sendiri',sis:'Tidak ada gejala sisa setelah episode, TIDAK ada penurunan kesadaran (umumnya)',rpd:'Episode serupa sebelumnya? Riwayat hipertensi, DM, fibrilasi atrium, dislipidemia, merokok? Riwayat stroke sebelumnya? Konsumsi antiplatelet/antikoagulan?',rpk:'Riwayat stroke atau penyakit jantung dalam keluarga? Riwayat hipertensi/DM keluarga?',rsos:'Merokok? Alkohol? Aktivitas fisik? Pola makan? Kepatuhan obat tekanan darah?'},
'stroke':{lok:'Tergantung area otak: hemisfer kiri (afasia, hemiparesis kanan), hemisfer kanan (hemiparesis kiri, neglect), batang otak (vertigo, diplopia, disfagia)',ons:'MENDADAK saat aktivitas atau istirahat, berlangsung >24 jam atau permanen',kua:'Kelemahan/kelumpuhan separuh tubuh mendadak, bicara pelo/tidak bisa bicara, wajah mencong, penglihatan terganggu',kun:'Bervariasi ringan-berat (NIHSS score)',mpb:'Demam, hiperglikemia, hipertensi tidak terkontrol memperburuk prognosis',mr:'Waktu ke rumah sakit (golden period <4.5 jam untuk trombolisis)',sis:'Penurunan kesadaran (bisa ada/tidak), nyeri kepala mendadak hebat (perdarahan), mual/muntah',rpd:'Riwayat TIA sebelumnya? Riwayat hipertensi, DM, fibrilasi atrium, dislipidemia, penyakit jantung? Riwayat stroke sebelumnya? Obat antiplatelet/antikoagulan?',rpk:'Riwayat stroke, hipertensi, penyakit jantung dalam keluarga?',rsos:'Merokok (+++)? Alkohol? Aktivitas fisik kurang? Stres? Diet tinggi lemak/garam? Kepatuhan obat?'},
'trauma_ms':{lok:'Sesuai level vertebra yang cedera (servikal: tetra, thorakal/lumbal: para), gangguan di bawah level lesi',ons:'Mendadak setelah trauma (kecelakaan, jatuh, olahraga)',kua:'Kelemahan/kelumpuhan, hilang rasa (baal) di bawah level cedera, tidak bisa buang air kecil/besar',kun:'Komplit (total) atau inkomplit (parsial) — ASIA scale A-E',mpb:'Gerakan leher/punggung (risiko cedera sekunder)',mr:'Imobilisasi segera, posisi netral',sis:'Hipotensi (syok neurogenik) +, bradikardia +, retensi urin/inkontinensia, priapismus (cervical)',rpd:'Mekanisme trauma? Riwayat osteoporosis? Riwayat tumor tulang? Riwayat spondilitis?',rpk:'Tidak spesifik',rsos:'Pekerjaan berisiko? Kecelakaan lalu lintas? Olahraga kontak? Penggunaan sabuk pengaman?'},
'meningoensefalitis':{lok:'Kepala (nyeri kepala), leher (kaku kuduk), kesadaran (global)',ons:'Mendadak-subakut, berlangsung hari-minggu, makin berat',kua:'Trias meningitis: demam + nyeri kepala hebat + kaku kuduk, bisa disertai penurunan kesadaran (ensefalitis)',kun:'Sedang-berat, progresif',mpb:'Cahaya (fotofobia), suara (fonofobia), gerakan kepala',mr:'Berbaring tenang, gelap',sis:'Demam tinggi (+), fotofobia (+), mual/muntah (+), kejang (ensefalitis +), petekie (meningokokus), ruam',rpd:'Riwayat infeksi ISPA/telinga/sinusitis sebelumnya? Riwayat TB? Riwayat meningitis sebelumnya? Riwayat imunisasi meningokokus/pneumokokus? Status HIV?',rpk:'Riwayat kontak dengan penderita meningitis (meningokokus menular)?',rsos:'Tinggal di asrama/barak/penjara (risiko meningokokus)? Kondisi imun? Riwayat perjalanan ke daerah endemis?'},
'neuropati_dm':{lok:'Kedua kaki (simetris), dimulai dari ujung jari kaki, naik ke atas (stocking distribution), bisa ke tangan (glove)',ons:'Bertahap, kronis, makin lama makin naik ke atas',kua:'Kesemutan, rasa terbakar, baal seperti memakai kaos kaki, bisa ada nyeri neuropatik (menusuk, seperti tersengat listrik)',kun:'Ringan-sedang-berat, menetap setiap hari',mpb:'Malam hari (nokturnal), udara dingin, berdiri lama',mr:'Gerakan kaki, posisi berbeda',sis:'Riwayat DM tidak terkontrol (+), luka di kaki tidak terasa (+), gangguan ereksi (otonom), diare bergantian konstipasi (otonom)',rpd:'Riwayat DM berapa tahun? Kontrol gula selama ini? HbA1c terakhir? Riwayat komplikasi DM lain (retinopati, nefropati)? Konsumsi alkohol? Defisiensi B12?',rpk:'Riwayat DM dalam keluarga?',rsos:'Kepatuhan minum obat DM? Pola makan? Aktivitas fisik? Kebiasaan merokok? Perawatan kaki?'},
'tarsal_tunnel':{lok:'Telapak kaki bagian medial dan jari-jari kaki, di belakang/bawah malleolus medial, TIDAK menyebar ke atas lutut',ons:'Bertahap, makin berat jika tidak diobati, kronis',kua:'Nyeri, baal, kesemutan, seperti terbakar di telapak kaki',kun:'Ringan-sedang, diperberat aktivitas tertentu',mpb:'Berdiri lama, berjalan jauh, akhir hari, menekan belakang malleolus medial (Tinel sign)',mr:'Istirahat, elevasi kaki, melepas alas kaki sempit',sis:'Bisa ada kelemahan otot kecil kaki, perubahan sensasi telapak kaki',rpd:'Riwayat trauma ankle? Riwayat varises kaki? Riwayat RA atau arthritis? Riwayat DM (neuropati tumpang tindih)?',rpk:'Tidak spesifik',rsos:'Jenis pekerjaan (berdiri lama)? Jenis alas kaki? Berat badan (obesitas menekan)?'},
'ptsd':{lok:'Psikologis — pikiran, emosi, perilaku, dan reaksi tubuh (bukan nyeri fisik spesifik)',ons:'Gejala muncul setelah peristiwa traumatik, umumnya dalam 1 bulan, harus berlangsung >1 bulan',kua:'Flashback/mimpi buruk (re-experiencing), menghindari pengingat trauma (avoidance), selalu waspada berlebih (hyperarousal), pikiran/perasaan negatif menetap',kun:'Gejala mengganggu fungsi sosial/pekerjaan/kehidupan sehari-hari secara bermakna',mpb:'Pengingat trauma (tempat, suara, orang), tanggal anniversary, stres tambahan, alkohol',mr:'Dukungan sosial, perasaan aman, terapi',sis:'Insomnia (+), mudah terkejut (+), sulit berkonsentrasi (+), iritabel (+), bisa ada gejala somatik (nyeri kepala, nyeri dada)',rpd:'Peristiwa traumatik apa yang dialami? Kapan? Gejala depresif bersamaan? Riwayat trauma masa kecil? Pernah mendapat terapi psikologis? Riwayat penyalahgunaan zat?',rpk:'Riwayat gangguan psikiatri dalam keluarga? (meningkatkan kerentanan)',rsos:'Dukungan sosial (keluarga/teman)? Pekerjaan? Status pernikahan? Pernah/masih terpapar lingkungan traumatik? Akses layanan kesehatan mental?'},
'baby_blues':{lok:'Emosi dan mood (bukan keluhan fisik spesifik)',ons:'Baby blues: hari 2-3 postpartum. Depresi PP: dalam 4 minggu postpartum, berlangsung >2 minggu',kua:'Mood labil, mudah menangis tanpa sebab jelas, rasa sedih, khawatir berlebih tentang bayi, rasa tidak mampu merawat bayi',kun:'Baby blues: ringan, self-limiting <2 minggu. Depresi PP: sedang-berat, mengganggu fungsi',mpb:'Kelelahan, kurang tidur, kurang dukungan, masalah menyusui, bayi rewel',mr:'Dukungan keluarga, istirahat cukup, berbagi perasaan',sis:'Insomnia (sulit tidur bahkan saat bayi tidur) (+), nafsu makan turun (+), energi rendah (+), anhedonia (depresi PP)',rpd:'Riwayat depresi sebelumnya (terutama premenstrual/kehamilan sebelumnya)? Riwayat gangguan bipolar? Ini kehamilan ke berapa? Proses persalinan? Dukungan pasangan?',rpk:'Riwayat depresi/gangguan psikiatri dalam keluarga?',rsos:'Dukungan suami dan keluarga? Kondisi finansial? Tinggal sendiri/bersama keluarga? Pengalaman ibu sebelumnya? Stressor sosial saat hamil?'},
'gad':{lok:'Psikologis (pikiran, kekhawatiran) + gejala fisik somatik (bukan nyeri satu lokasi)',ons:'Bertahap, kronis, berlangsung ≥6 bulan, sering sulit mengidentifikasi kapan mulai',kua:'Khawatir berlebih sulit dikontrol tentang berbagai hal sehari-hari (pekerjaan, kesehatan, keuangan, keluarga)',kun:'Sedang-berat, hampir setiap hari, mengganggu fungsi sosial/pekerjaan',mpb:'Stres, ketidakpastian, kelelahan, kafein',mr:'Aktivitas menyenangkan, relaksasi, olahraga, kebersamaan dengan orang terpercaya',sis:'Gelisah/tidak bisa diam (+), mudah lelah (+), sulit konsentrasi (+), tegang otot/pegal (+), iritabel (+), gangguan tidur (+)',rpd:'Kapan pertama kali gejala muncul? Peristiwa pemicu? Riwayat gangguan panik/fobia? Riwayat depresi? Riwayat penyakit tiroid? Pernah terapi?',rpk:'Riwayat ansietas/depresi dalam keluarga?',rsos:'Sumber stres utama (pekerjaan/keuangan/hubungan)? Konsumsi kafein/alkohol? Aktivitas fisik? Dukungan sosial? Pola tidur?'},
'insomnia':{lok:'Gangguan tidur (tidak ada lokasi nyeri spesifik), bisa disertai kekhawatiran tentang tidur',ons:'Akut (<1 bulan) atau kronik (≥3 bulan, ≥3 malam/minggu). Kapan mulai? Ada pemicu?',kua:'Sulit memulai tidur (early/sleep onset), sering terbangun malam (middle), bangun terlalu pagi (late/terminal)',kun:'Berlangsung ≥3 malam/minggu, berdampak pada fungsi siang hari',mpb:'Kafein, gadget, cahaya, kebisingan, pikiran berlebih, tidur siang, tidak teratur',mr:'Lingkungan gelap dan tenang, rutinitas tidur, relaksasi, olahraga sore',sis:'Mengantuk di siang hari (+), sulit konsentrasi (+), mudah marah (+), performa kerja menurun (+), kecemasan tentang tidur (anxious arousal)',rpd:'Kapan mulai? Ada pemicu (stres, penyakit, obat, pindah rumah)? Riwayat sleep apnea (mendengkur, henti napas)? Riwayat depresi/ansietas? Obat-obatan apa yang dikonsumsi?',rpk:'Riwayat insomnia dalam keluarga?',rsos:'Pekerjaan shift malam? Kebiasaan sebelum tidur (gadget, kopi)? Kondisi kamar tidur? Stres pekerjaan/keluarga? Konsumsi alkohol?'},
'gizi_buruk':{lok:'Seluruh tubuh (gangguan pertumbuhan dan fungsi organ sistemik)',ons:'Bertahap berbulan-bulan, sering tidak disadari keluarga',kua:'Anak tampak sangat kurus, lemah, tidak aktif, kulit mengendur, apatis atau rewel',kun:'Berat, dinilai Z-score <-3 SD untuk BB/U atau BB/TB',mpb:'Infeksi berulang, diare kronis, asupan makan sangat sedikit',mr:'Pemberian nutrisi adekuat secara bertahap (F-75 → F-100)',sis:'Rambut rontok/jarang (+), kulit kering bersisik (+), edema (kwashiorkor) atau tidak ada edema (marasmus), hipotermia (+), hipoglikemia (+)',rpd:'Riwayat BB lahir? Pola makan sejak lahir? Riwayat ASI eksklusif? Riwayat infeksi berulang (diare, ISPA, TB)? Riwayat imunisasi? Perkembangan sebelumnya?',rpk:'Saudara kandung dengan masalah gizi? Riwayat penyakit kronis dalam keluarga? Kondisi ekonomi keluarga?',rsos:'Penghasilan keluarga? Akses makanan bergizi? Pola asuh? Sanitasi? Pendidikan ibu? Jumlah anak dalam keluarga?'},
'blefaritis':{lok:'Tepi kelopak mata (margo palpebra), bilateral biasanya, tidak menyebar',ons:'Kronik, berbulan-bulan hingga bertahun-tahun, sering kambuh',kua:'Gatal, rasa terbakar, sensasi seperti ada pasir di mata, mata merah dan bersisik di pagi hari',kun:'Ringan-sedang, kronik rekuren',mpb:'Pagi hari (krusta), lingkungan berangin/berdebu, penggunaan lensa kontak, rokok, rosacea',mr:'Kompres hangat, membersihkan tepi kelopak',sis:'Dry eye (+), mata merah (+), silau (+), bisa ada chalazion/hordeolum berulang',rpd:'Sudah berapa lama? Riwayat rosacea, dermatitis seboroik? Riwayat dry eye? Riwayat diabetes? Penggunaan lensa kontak?',rpk:'Riwayat rosacea/dermatitis dalam keluarga?',rsos:'Kebersihan wajah? Penggunaan make-up mata? Pekerjaan di lingkungan berdebu? Konsumsi omega-3?'},
'oma_supuratif':{lok:'Dalam telinga (satu/kedua sisi), nyeri di dalam telinga, TIDAK menyebar',ons:'Mendadak, biasanya 1-7 hari setelah ISPA, berlangsung hari-minggu',kua:'Nyeri telinga (otalgia) menusuk/berdenyut, makin berat, lalu berkurang saat membran timpani perforasi (keluar cairan)',kun:'Sedang-berat pada fase akut',mpb:'Berbaring, mengunyah, menelan, tekanan udara (naik pesawat), tidur malam',mr:'Tegak, analgetik',sis:'Demam (+), riwayat ISPA (+), hidung tersumbat (+), pendengaran menurun (+), keluar cairan dari telinga jika sudah perforasi (+)',rpd:'Episode serupa sebelumnya? Riwayat OMA berulang? Riwayat operasi telinga? Riwayat alergi? Riwayat imunisasi pneumokokus/influenza?',rpk:'Riwayat OMA berulang dalam keluarga (anak)? Riwayat alergi?',rsos:'Paparan asap rokok (anak)? Penggunaan dot/botol susu sambil tiduran? Anak sekolah/daycare (risiko infeksi)? Status imunisasi anak?'},
'rhinitis_alergi':{lok:'Hidung (gejala utama) + bisa mata (konjungtivitis alergi), tidak menyebar',ons:'Musiman (intermiten) atau sepanjang tahun (persisten), dipicu alergen spesifik',kua:'Bersin berulang (>5 kali berturutan), hidung gatal, hidung tersumbat, ingus encer bening',kun:'Ringan (tidak mengganggu aktivitas) atau sedang-berat (mengganggu aktivitas/tidur)',mpb:'Paparan alergen (debu, tungau, serbuk bunga, bulu binatang, jamur), udara dingin/kering',mr:'Menjauh dari alergen, antihistamin, berada di dalam ruangan ber-AC',sis:'Mata merah, gatal, berair (konjungtivitis alergi) (+), sakit kepala/wajah (sinusitis komplikasi) (+), gangguan tidur (+), menurun konsentrasi (+)',rpd:'Riwayat asma? Riwayat dermatitis atopi? Kapan pertama kali? Alergen apa yang sudah diketahui? Pernah skin prick test? Pengobatan sebelumnya?',rpk:'Riwayat atopi (asma, rhinitis alergi, dermatitis atopi) dalam keluarga? (trias atopi)',rsos:'Binatang peliharaan di rumah? Kondisi rumah (lembab, karpet tebal, AC kotor)? Pekerjaan (paparan debu/bahan kimia)? Merokok/paparan asap rokok?'},
'asma':{lok:'Dada/saluran napas bawah, bilateral, terasa sesak di seluruh dada',ons:'Episodik, sering malam/dini hari atau setelah aktivitas/paparan pemicu, berlangsung menit-jam',kua:'Sesak napas, mengi (bunyi ngik-ngik saat napas), dada terasa berat/seperti ditekan, batuk terutama malam',kun:'Ringan-sedang-berat-mengancam jiwa (GINA classification)',mpb:'Alergen (debu, bulu, asap), ISPA, aktivitas fisik, udara dingin, stres, aspirin/NSAID (aspirin-exacerbated)',mr:'Bronkodilator (pelega), istirahat, posisi duduk tegak, menjauh dari pemicu',sis:'Riwayat atopi (+), rhinitis alergi (+), dermatitis atopi (+), keluarga dengan asma',rpd:'Riwayat asma sebelumnya? Sejak kapan? Frekuensi serangan? Pernah dirawat/ICU karena asma? Pemicu yang sudah diketahui? Obat-obatan yang dipakai?',rpk:'Riwayat asma atau atopi dalam keluarga?',rsos:'Perokok atau terpapar asap rokok? Pekerjaan (asma akibat kerja)? Kondisi rumah (lembab, karpet, hewan peliharaan)? Olahraga teratur?'},
'ppok':{lok:'Dada/saluran napas, sesak menyebar ke seluruh dada',ons:'Kronis progresif (bertahun-tahun), eksaserbasi: perburukan dalam hari-minggu',kua:'Sesak napas progresif, makin berat bahkan saat istirahat (eksaserbasi), batuk produktif kronik, dahak bertambah/lebih purulen',kun:'Bervariasi stadiumnya (GOLD 1-4), eksaserbasi: sedang-berat',mpb:'Infeksi ISPA, polusi udara, cuaca dingin/berangin, aktivitas, asap rokok',mr:'Bronkodilator, oksigen, posisi duduk condong ke depan (tripod)',sis:'Barrel chest (+), jari tabuh (+), sianosis (+) pada berat, edema kaki (cor pulmonale berat)',rpd:'Riwayat merokok (pack-year)? Sudah berhenti? Riwayat PPOK sebelumnya? Riwayat eksaserbasi/rawat inap sebelumnya? Riwayat paparan debu pekerjaan? Riwayat asma?',rpk:'Riwayat PPOK atau emfisema dalam keluarga? Riwayat defisiensi Alpha-1 antitripsin (familial)?',rsos:'Status merokok (aktif/mantan, berapa bungkus/hari, berapa tahun)? Paparan debu/asap kerja? Kemampuan aktivitas sehari-hari? Kondisi gizi?'},
'appendisitis':{lok:'Awalnya periumbilikal (pusar), lalu BERPINDAH ke RLQ (perut kanan bawah) — migrasi nyeri khas!',ons:'Mendadak-subakut, berlangsung jam hingga hari, makin berat',kua:'Nyeri terus-menerus (bukan kolik), makin berat saat bergerak, batuk, atau ditekan',kun:'Sedang-berat, makin memburuk',mpb:'Bergerak, berjalan, batuk, ditekan perut kanan bawah',mr:'Berbaring diam dengan lutut sedikit ditekuk',sis:'Demam subfebris (37.5-38.5°C) (+), mual (+), muntah 1-2x (+), nafsu makan turun (+), konstipasi atau diare ringan',rpd:'Riwayat nyeri perut kanan bawah sebelumnya? Riwayat operasi perut? Riwayat batu ginjal/ureter? (Pada wanita: riwayat haid terakhir, kemungkinan hamil, riwayat kista ovarium)',rpk:'Riwayat appendisitis dalam keluarga? (ada komponen familial)',rsos:'Pola makan (rendah serat)? Konsumsi air putih? Aktivitas fisik? (Pada wanita: riwayat seksual, kontrasepsi)'},
'gerd':{lok:'Epigastrik (ulu hati) menjalar ke dada (retrosternal), kadang ke leher/tenggorokan, TIDAK ke lengan',ons:'Setelah makan, saat berbaring atau membungkuk, berlangsung menit-jam',kua:'Rasa terbakar/panas di dada (heartburn), asam/pahit di mulut (regurgitasi), sensasi ada sesuatu naik dari perut ke tenggorokan',kun:'Ringan-sedang, bisa setiap hari atau hanya setelah makan besar tertentu',mpb:'Makan besar, makanan berlemak/asam/pedas/coklat/kafein/alkohol, berbaring setelah makan, obesitas, hamil, pakaian ketat',mr:'Antasida, tegak duduk, minum air, menghindari makanan pemicu',sis:'Batuk kronik (terutama malam) (+), suara serak pagi hari (+), sensasi ada yang mengganjal di tenggorokan (+)',rpd:'Kapan pertama kali? Riwayat ulkus peptikum? Riwayat endoskopi? Pernah mendapat PPI? Gejala alarm: disfagia, penurunan BB, hematemesis?',rpk:'Riwayat GERD, Barrett\'s esophagus, atau kanker esofagus dalam keluarga?',rsos:'Pola makan (waktu, jumlah, jenis)? IMT/obesitas? Merokok (relaksasi LES)? Alkohol? Konsumsi obat NSAID/aspirin? Pekerjaan yang membutuhkan membungkuk?'},
'tifoid':{lok:'Perut (nyeri difus, terutama epigastrik-umbilikal), demam sistemik',ons:'Bertahap, demam naik STEPLADDER (naik setiap hari), biasanya hari ke-7 sudah tinggi',kua:'Demam naik bertahap tidak turun sempurna, nyeri perut tumpul, lidah terasa tidak enak',kun:'Sedang-berat, makin berat tanpa pengobatan',mpb:'Tanpa pengobatan, komplikasi (perforasi usus)',mr:'Antibiotik tepat, tirah baring, diet lunak',sis:'Demam (+), lidah tifoid (putih kotor tepi merah) (+), perut kembung (+), konstipasi (awal) atau diare (lanjut) (+), bradikardi relatif (+), hepatosplenomegali (+)',rpd:'Riwayat tifoid sebelumnya? Kapan? Pernah mendapat vaksin tifoid? Riwayat konsumsi air/makanan tidak bersih?',rpk:'Ada anggota keluarga yang sakit serupa? (kemungkinan sumber kontaminasi yang sama)',rsos:'Sumber air minum? Kebiasaan makan di luar (warung pinggir jalan)? Kebersihan tangan? Sanitasi lingkungan? Status vaksinasi tifoid?'},
'hepatitis_a':{lok:'Perut kanan atas (nyeri tekan hati), mata dan kulit (ikterus sistemik)',ons:'Fase prodromal 1-2 minggu: flu-like, lalu fase ikterik 1-3 minggu',kua:'Demam, mual, lemas, lalu muncul kuning (ikterus), urin gelap seperti teh, feses pucat',kun:'Ringan-sedang, self-limiting',mpb:'Alkohol (wajib dihindari), obat hepatotoksik',mr:'Istirahat, diet cukup kalori',sis:'Demam (+), mual/muntah (+), ikterus (+), urin gelap (+), feses pucat (+), hepatomegali nyeri tekan (+), malaise berat',rpd:'Riwayat hepatitis sebelumnya? Riwayat penyakit hati? Vaksin hepatitis A? Riwayat konsumsi alkohol? Obat-obatan (hepatotoksik)?',rpk:'Ada anggota keluarga/kontak yang mengalami gejala serupa? (wabah hepatitis A)',rsos:'Sumber air minum? Makan kerang/seafood mentah? Perjalanan ke daerah endemis? Sanitasi? Status vaksinasi hepatitis A dan B?'},
'gnaps':{lok:'Urin (perubahan warna), wajah (edema), umum (hipertensi)',ons:'Mendadak, 1-3 minggu SETELAH infeksi tenggorokan atau kulit (Streptokokus)',kua:'Urin berwarna merah/kecoklatan seperti cola/air cucian daging, wajah bengkak (terutama pagi), tekanan darah naik',kun:'Sedang-berat, umumnya membaik dalam 2-4 minggu',mpb:'Asupan garam dan cairan berlebih (memperburuk edema/hipertensi)',mr:'Tirah baring, diet rendah garam, antihipertensi',sis:'Edema periorbita pagi hari (+), hematuria (+), oliguria (+), hipertensi (+), demam ringan (+), riwayat ISPA/impetigo 1-3 minggu sebelumnya',rpd:'Riwayat ISPA/infeksi kulit belakangan ini? Pernah sakit serupa? Riwayat penyakit ginjal? Riwayat hipertensi?',rpk:'Riwayat penyakit ginjal dalam keluarga? Riwayat GNAPS dalam keluarga?',rsos:'Kondisi sanitasi? Kepadatan hunian? Status gizi? Riwayat imunisasi?'},
'sistitis':{lok:'Kandung kemih (suprapubik), uretra (saat BAK), TIDAK ada nyeri pinggang/punggung',ons:'Mendadak, biasanya beberapa hari setelah faktor risiko',kua:'Nyeri/rasa terbakar saat BAK (disuria), sering BAK walau sedikit (polakisuria), tiba-tiba ingin BAK tidak bisa ditahan (urgency)',kun:'Ringan-sedang, mengganggu aktivitas',mpb:'Menahan BAK, kurang minum air, hubungan seksual (honeymoon cystitis), pemakaian kateter',mr:'Banyak minum air, sering BAK, antibiotik',sis:'TIDAK ada demam tinggi, TIDAK ada nyeri pinggang, bisa ada urin keruh/berbau, bisa ada hematuria ringan',rpd:'Episode serupa sebelumnya? Berapa kali? Riwayat ISK rekuren? Riwayat batu ginjal? Riwayat DM (faktor risiko)? Riwayat abnormalitas saluran kemih?',rpk:'Tidak spesifik',rsos:'(Wanita) Aktivitas seksual? Higiene setelah BAB (front-to-back)? Penggunaan kontrasepsi (diafragma/spermatisida)? Banyak minum? Menopause (atrofi uretra)?'},
'pap_smear':{lok:'Serviks (tidak ada gejala nyeri untuk skrining rutin), atau perdarahan/keputihan jika ada kelainan',ons:'Prosedur skrining preventif atau karena keluhan perdarahan pasca-sanggama/intermenstrual',kua:'Skrining: tidak ada gejala (asimtomatik). Jika ada kelainan: perdarahan tidak normal, keputihan berbau',kun:'Skrining: tiap 3 tahun (sitologi) atau tiap 5 tahun (sitologi+HPV co-test)',mpb:'N/A untuk skrining rutin',mr:'N/A',sis:'Skrining: pasien sehat tanpa keluhan. Jika ada lesi: keputihan (+), nyeri panggul, perdarahan pasca-sanggama',rpd:'Kapan PAP smear terakhir? Hasilnya? Riwayat infeksi HPV? Riwayat IMS (klamidia, gonore)? Riwayat displasia/CIN? Status vaksinasi HPV?',rpk:'Riwayat kanker serviks dalam keluarga?',rsos:'Usia pertama aktif seksual? Jumlah pasangan seksual? Merokok (meningkatkan risiko ca serviks)? Kontrasepsi oral jangka panjang? Status imun (HIV)?'},
'bv':{lok:'Vagina dan vulva, tidak menyebar',ons:'Bisa mendadak atau bertahap, sering setelah hubungan seksual atau menstruasi',kua:'Keputihan abu-abu homogen encer dengan BAU AMIS (fishy odor) yang mencolok, terutama setelah berhubungan seksual',kun:'Ringan-sedang, sering tidak ada gejala (50% asimtomatik)',mpb:'Setelah berhubungan seksual, setelah menstruasi, penggunaan sabun/douching vagina',mr:'Menjaga kebersihan vagina, menghindari douching',sis:'Biasanya tidak ada demam (tidak ada inflamasi), tidak ada gatal bermakna (beda kandidiasis), tidak ada nyeri panggul',rpd:'Episode serupa sebelumnya? Riwayat IMS? Riwayat konsumsi antibiotik baru-baru ini? Riwayat infeksi jamur?',rpk:'Tidak spesifik',rsos:'Pasangan seksual (baru/ganti)? Higiene vagina (douching merusak flora normal)? Penggunaan kontrasepsi? AKDR meningkatkan risiko BV? Status merokok?'},
'dm2':{lok:'Sistemik — tidak ada lokasi nyeri spesifik kecuali ada komplikasi (kaki baal, nyeri, luka)',ons:'Sangat bertahap, sering tanpa gejala, ditemukan saat skrining/cek rutin',kua:'Sering kencing terutama malam (poliuria), sering haus (polidipsi), sering lapar (polifagia) meski BB turun, lemas',kun:'Ringan-sedang, banyak yang tidak sadar sampai ada komplikasi',mpb:'Makan tinggi karbohidrat/gula, tidak minum obat, stres, infeksi',mr:'Diet sehat, olahraga, obat antidiabetik',sis:'Luka sulit sembuh (+), sering infeksi (kulit/saluran kemih) (+), gangguan penglihatan kabur (+), kesemutan kaki (+), disfungsi ereksi (+)',rpd:'Kapan pertama kali didiagnosis DM? HbA1c terakhir? Obat yang dikonsumsi? Riwayat komplikasi (retinopati, nefropati, neuropati, KAD)? Riwayat penyakit jantung?',rpk:'Riwayat DM tipe 2 dalam keluarga? (risiko meningkat 2-6x lipat)',rsos:'Pola makan (karbohidrat, gula)? Aktivitas fisik? BMI (obesitas sentral)? Kepatuhan minum obat? Merokok? Alkohol? Cek gula rutin?'},
'malaria':{lok:'Sistemik — demam, menggigil, berkeringat (paroksismal), nyeri kepala, mual. Nyeri perut/punggung bisa ada',ons:'Tiba-tiba, paroksismal — siklus demam menggigil-puncak-berkeringat (Plasmodium falciparum: tidak teratur)',kua:'Demam tinggi mendadak disertai menggigil hebat, lalu berkeringat banyak dan suhu turun, nyeri kepala berat, mual',kun:'Sedang-berat, berulang siklik (falciparum: bisa setiap hari tidak teratur)',mpb:'Tanpa pengobatan, imunosupresi, kehamilan',mr:'ACT, antipiretik',sis:'Splenomegali (+) jika kronik, anemia (+), ikterus (+) pada berat, penurunan kesadaran (malaria serebral - falciparum)',rpd:'Riwayat malaria sebelumnya? Kapan? Sudah pernah diobati? Pernah tinggal/bepergian ke daerah endemis malaria?',rpk:'Tidak spesifik (kecuali riwayat penyakit sel sabit yang melindungi dari malaria berat)',rsos:'Perjalanan ke daerah endemis malaria (Kalimantan, Papua, NTT, dll)? Kebiasaan keluar malam? Penggunaan kelambu/repelen? Kondisi rumah?'},
'dhf':{lok:'Sistemik — demam, nyeri seluruh tubuh, perdarahan di berbagai tempat',ons:'Mendadak, demam tinggi 2-7 hari, lalu fase kritis (hari ke 4-6)',kua:'Demam tinggi mendadak, nyeri di belakang bola mata (retro-orbital), nyeri sendi dan otot hebat, lemas',kun:'Sedang-berat, bisa sangat berat (syok)',mpb:'Tidak minum cukup cairan, terlambat ke RS pada fase kritis',mr:'Hidrasi adekuat, parasetamol, monitoring ketat',sis:'Ruam/petekie (+), perdarahan spontan (epistaksis, gusi) (+), mual/muntah (+), nyeri perut (+), gelisah/tangan dingin (tanda syok)',rpd:'Riwayat DBD sebelumnya? Kapan? (infeksi kedua lebih berat — risiko DSS). Tinggal di daerah banyak nyamuk? Tetangga/teman yang sakit DBD?',rpk:'Tidak spesifik (ada risiko genetik tertentu untuk syok)',rsos:'Kondisi lingkungan (genangan air/jentik nyamuk)? Penggunaan kelambu/repelen? Musim hujan? Kondisi rumah? Fogging di lingkungan?'},
'leptospirosis':{lok:'Betis (nyeri otot khas), mata (kemerahan), sistemik (demam, ikterus, gagal ginjal pada kasus berat)',ons:'Mendadak, fase leptospiremia (4-7 hari): demam, mialgia. Kemudian membaik sebentar, lalu fase imun (ikterus, gagal ginjal)',kua:'Demam tinggi mendadak, nyeri otot betis SANGAT HEBAT (nyeri tekan betis khas), mata merah tanpa discharge (sufusi konjungtiva khas), menggigil',kun:'Sedang-berat, fase imun bisa sangat berat (Weil disease)',mpb:'Tanpa pengobatan, terlambat diagnosis',mr:'Doksisiklin/penisilin, rehidrasi',sis:'Ikterus (+) Weil disease, gagal ginjal (oliguria) (+) Weil disease, perdarahan (+), batuk darah (+), meningitis aseptik (+)',rpd:'Riwayat paparan banjir/air tergenang? Kontak dengan hewan (tikus, sapi, anjing, babi)? Pekerjaan berisiko (petani, peternak, pekerja selokan)?',rpk:'Tidak spesifik',rsos:'Pekerjaan: petani/peternak/pekerja kebersihan? Riwayat banjir di lingkungan? Kebiasaan mandi di sungai/sawah? Penggunaan APD? Musim hujan?'},
'ra':{lok:'Sendi kecil tangan dan kaki (MCP, PIP, pergelangan tangan) SIMETRIS, bisa menyebar ke sendi besar',ons:'Bertahap, berlangsung ≥6 minggu, sering dimulai dari sendi tangan',kua:'Nyeri sendi, bengkak, hangat, kaku terutama pagi hari (>1 jam, memberat setelah istirahat)',kun:'Sedang-berat, mempengaruhi aktivitas sehari-hari',mpb:'Pagi hari (morning stiffness), istirahat lama, cuaca dingin, aktivitas berlebih',mr:'Bergerak (berbeda OA!), kompres hangat, NSAID, DMARD',sis:'Kelelahan (+), demam ringan (+), penurunan BB (+), nodul rematoid (+), bisa ada manifestasi ekstra-artikular (paru, mata, jantung)',rpd:'Kapan pertama kali? Sendi apa yang pertama kena? Riwayat OA/gout/penyakit sendi lain? Riwayat ISPA/infeksi sebelum gejala mulai? Pengobatan sebelumnya?',rpk:'Riwayat RA atau penyakit autoimun lain dalam keluarga? (HLA-DR4 terkait)',rsos:'Merokok (faktor risiko RA dan memperburuk prognosis)? Stres? Pekerjaan (aktivitas tangan intensif)? Kondisi finansial (biaya DMARD mahal)?'},
'sle':{lok:'Multi-organ — kulit (ruam), sendi, ginjal, paru, sistem saraf, darah (tidak ada satu lokasi tunggal)',ons:'Bervariasi — bisa mendadak atau bertahap berbulan-bulan, sering dengan periode remisi dan flare',kua:'Ruam kupu-kupu di wajah (malar rash), ruam memburuk di bawah sinar matahari, nyeri sendi, luka di mulut, rambut rontok, kelelahan hebat',kun:'Ringan-berat, dinilai dengan SLEDAI score',mpb:'Paparan sinar matahari (UV), infeksi, stres, kehamilan, terputus obat',mr:'Menghindari sinar matahari, hidroksiklorokuin, kortikosteroid',sis:'Demam (+), kelelahan berat (+), rambut rontok (+), ulkus oral (+), serositis (pleuritis/perikarditis) (+), edema (nefritis) (+)',rpd:'Riwayat flare sebelumnya? Manifestasi organ apa yang pernah terkena? Obat-obatan sebelumnya? Riwayat keguguran berulang? Riwayat trombosis? Riwayat obat yang bisa induksi lupus (hidralasin, prokainamid, INH)?',rpk:'Riwayat SLE atau penyakit autoimun lain dalam keluarga? (kembar identik risiko 50%)',rsos:'Paparan sinar matahari pekerjaan? Penggunaan tabir surya? Merokok? Stres? Dukungan keluarga? Rencana kehamilan (kontraindikasi MMF)?'},
'ankle_sprain':{lok:'Lateral ankle (paling sering — ligamen talofibular anterior/kalkaneofibular), TIDAK menyebar',ons:'Mendadak setelah trauma inversi (kaki terpelintir ke dalam), biasanya saat olahraga/jalan di permukaan tidak rata',kua:'Nyeri lokal lateral ankle, bengkak, bisa ada bunyi "pop" saat cedera',kun:'Grade I (ringan): sedikit nyeri, tidak ada instabilitas. Grade II (sedang): nyeri+bengkak+sedikit instabilitas. Grade III (berat): nyeri hebat, instabilitas jelas',mpb:'Berjalan, berdiri, menekan area lateral ankle',mr:'RICE (Rest-Ice-Compression-Elevation), analgetik, tidak menumpu berat',sis:'Bengkak lokal (+), ekimosis (memar) (+), bisa ada keterbatasan gerak',rpd:'Riwayat cedera ankle sebelumnya? Sudah berapa kali? (ankle sprain rekuren meningkatkan risiko instabilitas kronik). Riwayat fraktur?',rpk:'Tidak spesifik (bisa ada faktor hipermobilitas sendi bawaan)',rsos:'Olahraga apa? Frekuensi? Jenis alas kaki? Permukaan latihan? Pemanasan sebelum olahraga? Pekerjaan (risiko jatuh)?'},
'oa_genu':{lok:'Lutut (biasanya bilateral, sering lebih berat satu sisi), tidak menyebar ke paha/betis secara bermakna',ons:'Bertahap, kronis, berlangsung bulan-tahun, makin berat seiring usia',kua:'Nyeri tumpul yang memburuk setelah aktivitas dan membaik dengan istirahat (berbeda RA). Krepitasi (bunyi berderak) saat gerak. Kaku pagi <30 menit',kun:'Ringan-berat, dinilai dengan VAS dan Kellgren-Lawrence grading foto',mpb:'Naik-turun tangga, jongkok, berdiri lama, cuaca dingin, kelebihan berat badan',mr:'Istirahat, NSAID, kompres hangat, fisioterapi, alat bantu jalan, penurunan BB',sis:'Tidak ada tanda inflamasi sistemik (demam, kelelahan) berbeda RA. Deformitas varus/valgus pada stadium lanjut.',rpd:'Kapan pertama kali nyeri lutut? Riwayat trauma lutut sebelumnya? Riwayat gout/RA? Riwayat pekerjaan berat (mengangkat, berjalan jauh)? Operasi lutut?',rpk:'Riwayat OA dalam keluarga? (faktor genetik 50%)',rsos:'IMT (obesitas adalah faktor risiko utama)? Pekerjaan (berdiri/jalan jauh/jongkok lama)? Olahraga? Aktivitas fisik harian?'},
'gout':{lok:'MTP-1 (pangkal jempol kaki = podagra) tersering, bisa juga pergelangan kaki, lutut, pergelangan tangan, jari tangan',ons:'MENDADAK (sering tengah malam/dini hari), mencapai puncak dalam 12-24 jam',kua:'Nyeri HEBAT (sangat berat), merah, panas, bengkak. Bahkan angin sepoi-sepoi pun terasa nyeri. Berlangsung 3-10 hari tanpa pengobatan',kun:'BERAT saat akut, tanpa pengobatan berlangsung berhari-hari',mpb:'Alkohol (terutama bir), seafood, daging merah, jeroan, fruktosa, dehidrasi, diuretik tiazid, obat-obatan tertentu, trauma lokal',mr:'NSAID (Indometasin), kolkisin, es batu, mengangkat anggota gerak',sis:'Demam ringan (+) saat akut, tofi (benjolan keras asam urat) di daun telinga/tendon (+) pada kronik, tanda kerusakan ginjal jika kronik',rpd:'Riwayat serangan gout sebelumnya? Kapan dan di sendi mana? Kadar asam urat terakhir? Obat yang pernah diminum? Riwayat batu ginjal? Riwayat hipertensi/DM?',rpk:'Riwayat gout dalam keluarga? (ada komponen genetik — enzim HPRT)',rsos:'Konsumsi alkohol (jenis dan jumlah)? Konsumsi seafood/daging merah/jeroan? Asupan air putih? Berat badan? Obat-obatan rutin (diuretik tiazid meningkatkan asam urat)?'},
'fraktur':{lok:'Sesuai lokasi trauma — klavikula (bahu), radius/ulna (lengan bawah), TIDAK menyebar tapi bisa ada nyeri sekitar area fraktur',ons:'MENDADAK setelah trauma (kecelakaan, jatuh, olahraga kontak)',kua:'Nyeri hebat mendadak di lokasi trauma, deformitas (bengkok/pendek), tidak bisa menggerakkan anggota gerak',kun:'BERAT, tidak bisa ditoleransi tanpa analgetik',mpb:'Menggerakkan anggota gerak, menekan lokasi fraktur',mr:'Imobilisasi (bidai), analgetik, elevasi',sis:'Bengkak lokal (+), ekimosis (+), krepitasi (+), deformitas (+), bisa ada luka terbuka (fraktur terbuka), syok jika perdarahan banyak',rpd:'Mekanisme trauma persis bagaimana? Kekuatan trauma (energi tinggi/rendah)? Riwayat osteoporosis? Riwayat tumor tulang? Riwayat fraktur sebelumnya?',rpk:'Riwayat osteoporosis dalam keluarga? Riwayat osteogenesis imperfekta?',rsos:'Pekerjaan (risiko kecelakaan)? Olahraga kontak? Konsumsi kalsium/vit D? Merokok/alkohol (mempengaruhi penyembuhan tulang)? Penggunaan sabuk pengaman?'},
'meniscus_tear':{lok:'Lutut (medial lebih sering), di garis sendi (joint line), TIDAK menyebar',ons:'Mendadak setelah trauma puntir lutut, atau bertahap (degeneratif pada usia >40 tahun)',kua:'Nyeri garis sendi lutut, bunyi "klik/pop" saat cedera, lutut terasa terkunci (locking) atau mengunci sementara (catching), bisa terasa goyah (giving way)',kun:'Sedang-berat, mengganggu aktivitas olahraga dan fungsi sehari-hari',mpb:'Jongkok, memutar lutut, naik-turun tangga, berlari',mr:'Istirahat, RICE, NSAID',sis:'Efusi lutut (bengkak berisi cairan) (+) setelah beberapa jam, nyeri tekan garis sendi (+)',rpd:'Mekanisme cedera? Riwayat cedera lutut sebelumnya? Riwayat OA (meniskus degeneratif)? Riwayat operasi lutut?',rpk:'Tidak spesifik',rsos:'Jenis olahraga (risiko tinggi: sepak bola, basket, ski)? Frekuensi dan intensitas latihan? Teknik latihan yang benar? Pemanasan? Alas kaki?'},
'ruptur_achilles':{lok:'Tendon Achilles (belakang tumit, sekitar 2-6 cm di atas insersi ke kalkaneus), nyeri sangat lokal',ons:'MENDADAK saat aktivitas tiba-tiba (melompat, berlari, mendorong), terdengar bunyi "POP" keras',kua:'Nyeri hebat tiba-tiba di belakang tumit, seperti ditendang dari belakang, lalu tidak bisa berdiri di ujung jari atau menggerakkan kaki ke bawah (plantar fleksi)',kun:'BERAT, tidak bisa berjalan normal',mpb:'Mencoba plantar fleksi, berjalan',mr:'Istirahat total, elevasi, analgetik',sis:'Gap/cekungan di tendon teraba (+), Thompson test positif (meremas betis tidak menggerakkan kaki)',rpd:'Riwayat nyeri tendon Achilles sebelumnya (tendinitis)? Riwayat injeksi kortikosteroid lokal ke tendon Achilles? Konsumsi fluorokuinolon? Riwayat gout?',rpk:'Tidak spesifik',rsos:'Olahraga apa? Frekuensi latihan? Peningkatan intensitas mendadak? Pemanasan? Jenis alas kaki?'},
'mh_mb':{lok:'Kulit (lesi multipel tersebar), saraf tepi (penebalan), bisa menyebar ke seluruh tubuh (simetris)',ons:'Sangat bertahap, berbulan-bulan hingga bertahun-tahun sebelum terdiagnosis',kua:'Bercak kulit yang MATI RASA (anestesia) atau kurang rasa, tidak gatal. Bercak kemerahan atau bercak putih dengan batas tidak tegas',kun:'Lesi >5 (tipe MB), tersebar bilateral',mpb:'Tidak diobati (makin banyak lesi, makin rusak saraf), malnutrisi',mr:'MDT (Multi Drug Therapy) selama 12 bulan',sis:'Penebalan saraf tepi teraba (N. ulnaris, N. peroneus, N. auricularis magnus) (+), kelemahan otot tangan/kaki (+), mata tidak bisa menutup sempurna (+), luka di tangan/kaki yang tidak terasa (+)',rpd:'Kontak erat dengan penderita kusta? Sudah berapa lama ada bercak? Pernah didiagnosis kusta sebelumnya? Pernah minum MDT?',rpk:'Ada anggota keluarga yang pernah menderita kusta? (kontak serumah = faktor risiko)',rsos:'Kondisi tempat tinggal (padat, lembab)? Kondisi gizi? Pekerjaan? Akses ke fasilitas kesehatan? Stigma sosial di lingkungan?'},
'varicella':{lok:'Awalnya batang tubuh, menyebar ke wajah dan ekstremitas (sentripetal — beda cacar)',ons:'Mendadak, fase prodromal 1-2 hari (demam, malaise), lalu muncul lesi kulit bergelombang',kua:'Lesi polimorfik bersamaan: makula, papula, vesikel berisi cairan jernih (teardrop), krusta. Sangat gatal',kun:'Ratusan lesi bisa ada, gatal sangat mengganggu',mpb:'Menggaruk (risiko infeksi sekunder/sikatrik), imunosupresi (lebih berat)',mr:'Antihistamin, calamine lotion, asiklovir jika dalam 24 jam',sis:'Demam (+), malaise (+), nafsu makan turun (+). Komplikasi: pneumonia varicella, ensefalitis (jarang)',rpd:'Riwayat varicella sebelumnya? Vaksin varicella? Kontak dengan penderita cacar air 10-21 hari lalu? Status imun (imunosupresi)?',rpk:'Status vaksinasi varicella anggota keluarga?',rsos:'Kontak serumah/di sekolah dengan penderita varicella? Anak sekolah? Status vaksinasi? Kondisi imun keluarga serumah?'},

let activeSys='all', activeYears=new Set([2022,2023,2024,2025]), searchQ=''
let isDark = localStorage.getItem('osce_theme') !== 'light'
function applyTheme(){
  document.body.classList.toggle('light', !isDark)
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light' : '🌙 Dark'
}
function toggleTheme(){
  isDark = !isDark
  localStorage.setItem('osce_theme', isDark ? 'dark' : 'light')
  applyTheme()
}
applyTheme()
const sk=id=>'osce4_'+id
const loadNote=id=>{try{return JSON.parse(localStorage.getItem(sk(id)))||{}}catch{return{}}}
const saveNote=(id,obj)=>localStorage.setItem(sk(id),JSON.stringify(obj))
const clearNote=id=>localStorage.removeItem(sk(id))

function buildNav(){
  const mkItems=container=>{
    const allCnt=SYSTEMS.reduce((a,s)=>a+visibleCount(s.key),0)
    container.innerHTML=`
      <div class="side-label">Sistem Organ</div>
      <div class="side-item ${activeSys==='all'?'active':''}" onclick="setSys('all')">
        <span class="side-icon">📋</span><span class="side-name">Semua Sistem</span>
        <span class="side-count">${allCnt}</span>
      </div>
      <div class="side-divider"></div>
      ${SYSTEMS.map(s=>`<div class="side-item ${activeSys===s.key?'active':''}" onclick="setSys('${s.key}')">
        <span class="side-icon">${s.icon}</span><span class="side-name">${s.label}</span>
        <span class="side-count">${visibleCount(s.key)}</span>
      </div>`).join('')}`
  }
  mkItems(document.getElementById('sidebar'))
  mkItems(document.getElementById('overlayNav'))
}

function visibleCount(key){return(DATA[key]||[]).filter(t=>t.years.some(y=>activeYears.has(y))).length}

function setSys(key){
  activeSys=key
  document.getElementById('activeSysLabel').textContent=key==='all'?'Semua Sistem':(SYSTEMS.find(s=>s.key===key)||{}).label||''
  buildNav(); render(); closeOverlay()
  window.scrollTo({top:0,behavior:'smooth'})
}

function toggleYr(yr,btn){
  if(activeYears.has(yr)&&activeYears.size===1)return
  if(activeYears.has(yr)){activeYears.delete(yr);btn.className='yr-btn'}
  else{activeYears.add(yr);btn.className=`yr-btn on-${yr}`}
  buildNav(); render()
}

document.getElementById('searchInput').addEventListener('input',function(){
  searchQ=this.value.toLowerCase().trim()
  document.getElementById('searchClear').style.display=searchQ?'block':'none'
  render()
})
function clearSearch(){searchQ='';document.getElementById('searchInput').value='';document.getElementById('searchClear').style.display='none';render()}

function toggleCard(id){
  const c=document.getElementById('card_'+id)
  if(c) c.classList.toggle('open')
}

function saveCard(id,e){
  if(e)e.stopPropagation()
  const am=document.getElementById('am_'+id)?.value||''
  // Get ss from textarea (may be hidden if list view)
  const ssTa = document.getElementById('ss_'+id)
  const ss = ssTa ? ssTa.value : ''
  const dd=document.getElementById('dd_'+id)?.value||''
  const tx=document.getElementById('tx_'+id)?.value||''
  saveNote(id,{am,ss,dd,tx})
  const btn=document.getElementById('sb_'+id)
  if(btn){const orig=btn.textContent;btn.textContent='✓ Tersimpan!';btn.className='btn-save flash';setTimeout(()=>{btn.textContent=orig;btn.className='btn-save'},2000)}
  updateStats(); toast('✓ Catatan tersimpan')
}

function resetCard(id,e){
  if(e)e.stopPropagation()
  if(!confirm('Reset ke data default?'))return
  clearNote(id)
  const t=Object.values(DATA).flat().find(x=>x.id===id)
  if(!t)return
  const el=f=>document.getElementById(f+'_'+id)
  if(el('am'))el('am').value=t.am||''
  if(el('ss'))el('ss').value=t.ss||''
  if(el('dd'))el('dd').value=t.dd||''
  if(el('tx'))el('tx').value=t.tx||''
  updateStats(); toast('🔄 Direset ke default')
}

function saveAll(){
  let n=0
  document.querySelectorAll('.card').forEach(card=>{
    const id=card.dataset.id
    if(!id)return
    const ss=document.getElementById('ss_'+id)?.value
    if(ss!==undefined){saveNote(id,{am:document.getElementById('am_'+id)?.value||'',ss,dd:document.getElementById('dd_'+id)?.value||'',tx:document.getElementById('tx_'+id)?.value||''});n++}
  })
  const btn=document.querySelector('.btn-save-all')
  btn.textContent='✓ Semua Tersimpan!';btn.style.background='#059669'
  setTimeout(()=>{btn.textContent='💾 Simpan Semua';btn.style.background=''},2500)
  updateStats(); toast(`✓ ${n} catatan tersimpan`)
}

function openOverlay(){document.getElementById('overlay').classList.add('show')}
function closeOverlay(){document.getElementById('overlay').classList.remove('show')}

function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show')
  setTimeout(()=>t.classList.remove('show'),2200)
}

function updateStats(){
  const rows=getRows()
  let total=0,multi=0,filled=0
  rows.forEach(({list})=>list.forEach(t=>{
    total++;if(t.years.length>1)multi++
    const n=loadNote(t.id);if(n.ss||n.dd||n.tx)filled++
  }))
  document.getElementById('statTotal').textContent=total
  document.getElementById('statMulti').textContent=multi
  document.getElementById('statFilled').textContent=filled
}

function getRows(){
  const sys=activeSys==='all'?SYSTEMS:SYSTEMS.filter(s=>s.key===activeSys)
  return sys.map(s=>({sys:s,list:(DATA[s.key]||[]).filter(t=>{
    if(!t.years.some(y=>activeYears.has(y)))return false
    if(!searchQ)return true
    return [t.name,t.ss,t.dd,t.tx].join(' ').toLowerCase().includes(searchQ)
  })})).filter(r=>r.list.length>0)
}

function escH(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

function buildAnam(id){
  const a = ANAM[id]
  if(!a) return ''
  const row = (lbl,val) => val ? `<div class="anam-item"><div class="anam-label">${lbl}</div><div class="anam-val">${val}</div></div>` : ''
  const rowFull = (lbl,val) => val ? `<div class="anam-item anam-full"><div class="anam-label">${lbl}</div><div class="anam-val">${val}</div></div>` : ''
  return `<div class="anam-section">
    <div class="anam-title">📋 Anamnesis</div>
    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:5px">🪪 Identitas Pasien</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px;font-size:11px;color:var(--text2)">
      <div>Nama: ................</div>
      <div>Usia: ................</div>
      <div>Pekerjaan: .......</div>
      <div>Status: □ Menikah &nbsp;□ Belum</div>
    </div>
    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:4px">📍 Penyakit Sekarang (Sacred Seven)</div>
    <div class="anam-grid" style="margin-bottom:6px">
      ${row('1. Lokasi & Penyebaran', a.lok)}
      ${row('2. Onset & Kronologi', a.ons)}
      ${row('3. Kualitas Keluhan', a.kua)}
      ${row('4. Kuantitas & Frekuensi', a.kun)}
      ${row('5. Faktor Memperberat', a.mpb)}
      ${row('6. Faktor Meringankan', a.mr)}
      ${rowFull('7. Gejala Sistemik Penyerta', a.sis)}
    </div>
    <div class="anam-grid">
      ${rowFull('🏥 RPD — Riwayat Penyakit Dahulu', a.rpd)}
      ${rowFull('👨‍👩‍👧 RPK — Riwayat Penyakit Keluarga', a.rpk)}
      ${rowFull('🌍 Riwayat Sosial, Ekonomi & Kebiasaan', a.rsos)}
    </div>
  </div>`
}

function buildSSDisplay(ss, id){
  if(!ss) return `<textarea id="ss_${id}" class="ss-ta" placeholder="Tanda dan gejala khas..." onclick="event.stopPropagation()"></textarea>`
  // Convert comma/period-separated text to numbered list, or split on dot/comma
  const parts = ss.split(/(?<=[.+)])\s+(?=[A-Z0-9(])/).filter(p=>p.trim())
  if(parts.length <= 1){
    // Try splitting on comma for short entries
    const byComma = ss.split(',').map(s=>s.trim()).filter(s=>s)
    if(byComma.length > 2){
      const items = byComma.map(p=>`<li>${p}</li>`).join('')
      return `<div onclick="toggleSSEdit('${id}')" style="cursor:pointer" title="Klik untuk edit">
        <ol class="ss-num">${items}</ol>
      </div>
      <textarea id="ss_${id}" class="ss-ta" style="display:none;margin-top:6px" placeholder="Tanda dan gejala khas..." onclick="event.stopPropagation()">${escH(ss)}</textarea>`
    }
  }
  const items = parts.map(p=>`<li>${p.trim()}</li>`).join('')
  return `<div onclick="toggleSSEdit('${id}')" style="cursor:pointer" title="Klik untuk edit">
    <ol class="ss-num">${items}</ol>
  </div>
  <textarea id="ss_${id}" class="ss-ta" style="display:none;margin-top:6px" placeholder="Tanda dan gejala khas..." onclick="event.stopPropagation()">${escH(ss)}</textarea>`
}

function toggleSSEdit(id){
  const ta = document.getElementById('ss_'+id)
  if(!ta) return
  ta.style.display = ta.style.display==='none' ? 'block' : 'none'
}

function render(){
  const rows=getRows()
  if(!rows.length){
    document.getElementById('content').innerHTML='<div class="empty"><div class="empty-icon">🔍</div><strong>Tidak ada topik ditemukan</strong><br><small>Coba ubah filter atau kata kunci</small></div>'
    updateStats();return
  }
  document.getElementById('content').innerHTML=rows.map(({sys,list})=>`
    <div class="sys-section">
      <div class="sys-head">
        <span style="font-size:18px">${sys.icon}</span>
        <h2>${sys.label}</h2>
        <span class="sys-count">${list.length} topik</span>
      </div>
      ${list.map(t=>{
        const note=loadNote(t.id)
        const am=note.am!==undefined?note.am:(t.am||'')
        const ss=note.ss!==undefined?note.ss:(t.ss||'')
        const dd=note.dd!==undefined?note.dd:(t.dd||'')
        const tx=note.tx!==undefined?note.tx:(t.tx||'')
        const hasSaved=Object.keys(note).length>0
        const isMulti=t.years.length>1
        const dots=['#A855F7','#60a5fa','#fb923c','#34d399'].map((c,i)=>{
          const v=[am,ss,dd,tx][i]
          return`<div class="dot" style="background:${v?c:'var(--border)'};opacity:${v?1:0.3}"></div>`
        }).join('')
        return`<div class="card" id="card_${t.id}" data-id="${t.id}">
          <div class="card-head" onclick="toggleCard('${t.id}')">
            <div class="card-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></div>
            <div class="card-info">
              <div class="card-name">${t.name}</div>
              <div class="card-tags">
                ${t.years.map(y=>`<span class="tag tag-${y}">Mei ${y}</span>`).join('')}
                ${isMulti?`<span class="tag tag-multi">🔁 ${t.years.length}× muncul</span>`:''}
                ${hasSaved&&(ss||dd||tx)?'<span class="tag tag-saved">✓ tersimpan</span>':''}
              </div>
            </div>
            <div class="dots">${dots}</div>
          </div>
          <div class="card-body">
            ${buildAnam(t.id)}
            <div class="fields">
              <div class="field-group">
                <div class="field-label ss">🔵 Signs &amp; Symptoms <span style="font-size:9px;color:var(--text3)">(klik untuk edit)</span></div>
                ${buildSSDisplay(ss, t.id)}
              </div>
              <div class="field-group">
                <div class="field-label dd">🟠 Diagnosis Banding</div>
                <textarea id="dd_${t.id}" class="dd-ta" placeholder="Diagnosis banding utama..." onclick="event.stopPropagation()">${escH(dd)}</textarea>
              </div>
              <div class="field-group">
                <div class="field-label tx">🟢 Tatalaksana</div>
                <textarea id="tx_${t.id}" class="tx-ta" placeholder="Tatalaksana farmako & non-farmako..." onclick="event.stopPropagation()">${escH(tx)}</textarea>
              </div>
            </div>
            <div class="card-actions">
              <button class="btn-reset" onclick="resetCard('${t.id}',event)">Reset</button>
              <button class="btn-save" id="sb_${t.id}" onclick="saveCard('${t.id}',event)">💾 Simpan</button>
            </div>
          </div>
        </div>`
      }).join('')}
    </div>`).join('')
  updateStats()
}

buildNav(); render()
</script>
</body>
</html>
