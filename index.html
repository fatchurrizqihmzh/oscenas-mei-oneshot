{id:'hipertensi',name:'Hipertensi',years:[2022],ss:'TD ≥140/90 mmHg pada ≥2 pengukuran berbeda. Sering asimtomatik. Krisis: nyeri kepala oksipital, penglihatan kabur, epistaksis. Cari kerusakan organ target.',dd:'Hipertensi sekunder (renal, endokrin), White coat hypertension',tx:'Modifikasi gaya hidup. Farmako: ACEi/ARB (+ DM/CKD), CCB (lansia), Tiazid. Kombinasi jika perlu. Target <130/80 mmHg.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'af',name:'Atrial Fibrilasi (AF)',years:[2022,2025],ss:'Palpitasi, sesak, nyeri dada. Nadi IREGULER IREGULER. EKG: tidak ada gelombang P, RR ireguler, baseline bergelombang. Risiko stroke (CHA2DS2-VASc).',dd:'Flutter atrial, Takikardia multifokal, Ekstrasistol sering',tx:'Kontrol laju: Beta bloker atau CCB. Kontrol irama: Amiodaron/kardioversi (<48j). Antikoagulasi: Warfarin (INR 2-3) atau NOAC jika CHA2DS2-VASc ≥2.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'svt',name:'SVT (Supraventrikular Takikardi)',years:[2022,2023],ss:'Palpitasi onset mendadak, denyut 150-250x/menit, reguler. EKG: QRS sempit, gelombang P mungkin tersembunyi. Paroksismal, bisa terminasi spontan.',dd:'AF dengan konduksi cepat, Flutter atrial 2:1, VT (QRS lebar), Sinus takikardi',tx:'Vagal manuver (Valsalva modifikasi). Adenosin 6mg IV bolus cepat lini 1. Verapamil/Diltiazem IV. Tidak stabil: kardioversi sinkronisasi.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'stemi',name:'STEMI',years:[2022],ss:'Nyeri dada khas ≥20 menit, menjalar lengan kiri/rahang. EKG: elevasi ST ≥1mm di ≥2 sadapan berturutan atau LBBB baru. Troponin naik.',dd:'NSTEMI (tidak ada elevasi ST), UAP, Perikarditis akut, Diseksi aorta, Emboli paru',tx:'MONA: Morfin, O2 (SpO2<90%), Nitrat SL, Aspirin 300mg. Reperfusi: PCI primer <90 menit atau fibrinolisis <3 jam. Heparin, Clopidogrel, Statin.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'uap',name:'UAP (Unstable Angina Pectoris)',years:[2022],ss:'Angina baru, saat istirahat, atau meningkat frekuensi/intensitas. EKG: bisa normal atau depresi ST/inversi T. TROPONIN NORMAL (beda NSTEMI).',dd:'NSTEMI (troponin naik), STEMI, Perikarditis, Esofagospasme, Kostokondritis',tx:'Rawat inap, monitoring EKG. Aspirin+Clopidogrel, Heparin IV/LMWH, Nitrat, Beta bloker. TIMI score. Koronarografi elektif.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'pvc',name:'PVC (Premature Ventricular Contraction)',years:[2022],ss:'Palpitasi "jantung berdegup kuat" atau "jantung berhenti sebentar". EKG: QRS lebar prematur tanpa P sebelumnya, gelombang T berlawanan, pause kompensatorik.',dd:'PAC (QRS sempit), Konduksi aberan, VT (jika ≥3 berurutan), Artefak',tx:'PVC simtomatik: Beta bloker atau CCB. Singkirkan penyebab (elektrolit, kafein, stres, iskemia). Umumnya jinak.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'vfib',name:'VFib + RJP',years:[2023],ss:'Tidak ada nadi + tidak ada napas normal. EKG: gelombang fibrilasi ireguler kaotik. Henti jantung mendadak. Segera RJP!',dd:'VT pulseless, Asistol, PEA (Pulseless Electrical Activity)',tx:'RJP segera 30:2, kedalaman 5-6cm, 100-120x/menit. Defibrilasi 200J (bifasik) segera. Epinefrin 1mg IV tiap 3-5 menit. Amiodaron 300mg. Atasi 4H4T.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'bradikardia',name:'Sinus Bradikardia',years:[2023],ss:'Denyut <60x/menit, irama reguler, P sebelum QRS normal. Bisa asimtomatik (atlet) atau simtomatik (pusing, sinkop, sesak).',dd:'Blok AV (PR memanjang), Sick sinus syndrome, Efek obat (beta bloker, digoksin)',tx:'Asimtomatik: observasi. Simtomatik: Atropin 0.5mg IV, ulangi max 3mg. Tidak respons: pacu jantung sementara.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'cvi',name:'CVI (Chronic Venous Insufficiency)',years:[2024],ss:'Kaki berat, edema tungkai bawah memburuk sore hari. Varises, lipodermatosklerosis, hiperpigmentasi, eczema stasis. Ulkus vena di malleolus medial.',dd:'DVT, Insufisiensi arteri, Edema kardiak/renal, Limfedema',tx:'Stocking kompresi 30-40 mmHg. Elevasi kaki. Diosmin+Hesperidin. Ulkus: kompresi 4-layer, perawatan luka. Bedah/skleroterapi untuk varises.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'tromboflebitis',name:'Tromboflebitis Superfisial',years:[2024,2025],ss:'Kemerahan, nyeri, hangat, teraba korda keras sepanjang vena superfisial di tungkai bawah. Riwayat varises, imobilisasi, IV line. Low-grade fever.',dd:'DVT (lebih dalam, tungkai bengkak difus), Selulitis, Limfangitis, Noda kulit',tx:'NSAID oral + topikal. Kompres hangat. Stocking kompresi. Enoksaparin profilaksis jika dekat vena dalam atau >5cm.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'limfangitis',name:'Limfangitis',years:[2024,2025],ss:'Garis merah mengikuti aliran limfe dari luka terinfeksi ke KGB regional. Hangat, nyeri, demam, limfadenopati regional. Streptokokus penyebab utama.',dd:'Tromboflebitis superfisial, Selulitis, Erisipelas, AEFI pasca vaksin',tx:'Amoksisilin 3x500mg atau Diklosasilin. Berat: Penisilin G IV. Rawat luka primer. Elevasi ekstremitas. Kompres hangat.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},

{id:'appendisitis',name:'Appendisitis Akut',years:[2022,2023,2025],ss:'Nyeri migrasi periumbilikal → RLQ. Demam subfebris, mual, muntah. McBurney (+), Rovsing (+), Psoas (+), Blumberg (+). Leukositosis. Alvarado ≥7.',dd:'Kolik ureter, KET, Kista ovarium terpuntir, Adenitis mesenterika, Crohn',tx:'Appendektomi (laparoskopi/terbuka). Antibiotik preoperatif: Sefazolin IV. Perforasi: Metronidazol+Seftriakson+drainase.',am:'IDENTITAS: Usia 10-30 th, sedikit lebih sering pria\n\nKELUHAN UTAMA: Nyeri perut kanan bawah\n\nSACRED 7:\n1. Lokasi: Awalnya periumbilikal (sekitar pusar) → BERPINDAH ke kanan bawah (titik McBurney)\n2. Onset/Kronologi: Nyeri periumbilikal 4-6 jam lalu berpindah ke RLQ, makin lama makin berat\n3. Kuantitas: Berat, mengganggu aktivitas, nyeri saat berjalan\n4. Kualitas: Nyeri tumpul awalnya → nyeri tajam menetap di RLQ\n5. Faktor pemberat: Bergerak, batuk, bersin (nyeri peritoneal)\n6. Faktor peringan: Berbaring diam dengan lutut ditekuk ke kanan\n7. Gejala penyerta: Mual, muntah (setelah nyeri!), demam subfebris, nafsu makan hilang, konstipasi\n\nFUNDAMENTAL 4:\n1. RPS: Urutan nyeri (periumbilikal → RLQ) khas. Mual/muntah setelah nyeri (bukan sebelum)\n2. RPD: Riwayat nyeri serupa, riwayat operasi abdomen\n3. RPK: Tidak spesifik\n4. Sos-Ek: Pola makan (rendah serat), wanita: siklus haid terakhir (singkirkan KET)'},
{id:'gerd',name:'GERD',years:[2023,2025],ss:'Heartburn (rasa terbakar retrosternal), regurgitasi, memburuk setelah makan/berbaring. Gejala ekstraesofageal: batuk kronik, laringitis. Alarm: disfagia, penurunan BB.',dd:'Ulkus peptikum, Angina pektoris, Spasme esofagus, Dispepsia fungsional',tx:'Modifikasi gaya hidup: hindari makanan asam/berlemak, tinggikan kepala, turunkan BB. PPI: Omeprazol 2x20mg x4-8 minggu.',am:'IDENTITAS: Dewasa, sering pada obesitas, hamil, atau perokok\n\nKELUHAN UTAMA: Nyeri/rasa terbakar di dada atau ulu hati\n\nSACRED 7:\n1. Lokasi: Retrosternal (dada tengah) atau epigastrium, kadang menjalar ke leher\n2. Onset/Kronologi: Setelah makan besar atau berbaring, berlangsung >4 minggu berulang\n3. Kuantitas: Ringan-berat, mengganggu tidur malam\n4. Kualitas: Rasa terbakar (heartburn), pahit di mulut, cairan naik ke tenggorok (regurgitasi)\n5. Faktor pemberat: Makan besar, makanan asam/pedas/berlemak/coklat/kafein, berbaring setelah makan\n6. Faktor peringan: Antasida, duduk tegak, makan sedikit-sedikit dan sering\n7. Gejala penyerta: Batuk kronik (malam), suara serak pagi hari, rasa mengganjal di tenggorok\n\nFUNDAMENTAL 4:\n1. RPS: Berapa lama, apakah ada alarm symptoms (disfagia, penurunan BB, hematemesis) → endoskopi!\n2. RPD: Riwayat maag, tukak lambung, hernia hiatus, alergi obat\n3. RPK: Tidak spesifik\n4. Sos-Ek: Pola makan (waktu, jenis makanan), IMT (obesitas), merokok, alkohol, stres'},
{id:'tifoid',name:'Demam Tifoid',years:[2022],ss:'Demam STEPLADDER (naik bertahap 1 minggu), relatif bradikardia, lidah tifoid (putih kotor tepi hiperemis), meteorismus, konstipasi. Widal O/H ≥1/320. IgM tifoid (+).',dd:'Malaria, Leptospirosis, Dengue, ISK, Hepatitis A akut',tx:'Kloramfenikol 4x500mg x14 hari atau Siprofloksasin 2x500mg x10-14 hari atau Seftriakson IV. Diet lunak. Tirah baring.',am:'IDENTITAS: Semua usia, anak-dewasa muda, sanitasi buruk, daerah endemis\n\nKELUHAN UTAMA: Demam sudah lebih dari satu minggu\n\nSACRED 7:\n1. Lokasi: Sistemik (demam), pencernaan (nyeri perut, diare/konstipasi)\n2. Onset/Kronologi: Demam naik bertahap (STEPLADDER) sejak hari 1, lebih tinggi sore/malam, puncak hari 7-14\n3. Kuantitas: Demam 38-40°C, sudah >1 minggu\n4. Kualitas: Demam KONTINU (terus-menerus, tidak turun ke normal - beda malaria yang intermiten!)\n5. Faktor pemberat: Tidak istirahat, makan makanan keras, perut penuh\n6. Faktor peringan: Istirahat, diet lunak, antibiotik\n7. Gejala penyerta: Nyeri kepala, nyeri perut, mual, LIDAH TIFOID (putih tebal tepi merah), konstipasi dewasa/diare anak, perut kembung (meteorismus)\n\nFUNDAMENTAL 4:\n1. RPS: Sudah hari ke berapa, pola demam (naik-turun atau terus-menerus), sudah minum antibiotik?\n2. RPD: Riwayat tifoid sebelumnya, alergi antibiotik\n3. RPK: Anggota keluarga/tetangga yang sakit serupa?\n4. Sos-Ek: Kebiasaan jajan/makan di luar, kualitas air minum, cuci tangan, bepergian ke daerah endemis'},
{id:'hepatitis_a',name:'Hepatitis A',years:[2022],ss:'Demam, mual, muntah, IKTERUS, urin gelap seperti teh, feses pucat. Hepatomegali nyeri tekan. IgM anti-HAV (+). SGOT/SGPT naik sangat tinggi.',dd:'Hepatitis B/C/E akut, Kolestasis, EBV, Hemolisis, Obstruksi biliaris',tx:'Suportif: istirahat, diet cukup kalori, hindari alkohol/hepatotoksik. Self-limiting 4-8 minggu. Vaksinasi kontak serumah.',am:'IDENTITAS: Semua usia, anak-remaja lebih sering, sanitasi buruk\n\nKELUHAN UTAMA: Kulit/mata kuning, urin gelap seperti teh\n\nSACRED 7:\n1. Lokasi: Hati/liver (sistemik: ikterus, demam)\n2. Onset/Kronologi: Fase prodromal 1-2 minggu (demam, mual, lemas) → fase ikterik (kulit/mata kuning)\n3. Kuantitas: Ikterus bisa ringan-berat tergantung fase\n4. Kualitas: Kulit dan mata kuning (ikterus), urin gelap seperti teh pekat, feses pucat seperti dempul\n5. Faktor pemberat: Konsumsi alkohol, obat hepatotoksik\n6. Faktor peringan: Istirahat, diet cukup kalori rendah lemak\n7. Gejala penyerta: Demam, mual/muntah, nyeri perut kanan atas, lemas, nafsu makan hilang, gatal-gatal\n\nFUNDAMENTAL 4:\n1. RPS: Riwayat makan di luar (makanan tidak higienis, kerang mentah), kontak penderita hepatitis A\n2. RPD: Riwayat penyakit hati, sudah vaksin hepatitis A?\n3. RPK: Anggota keluarga/komunitas yang sakit serupa (cluster/wabah)\n4. Sos-Ek: Sumber air minum, kebiasaan jajan, sanitasi (cuci tangan), perjalanan ke daerah endemis'},
{id:'disentri',name:'Disentri Ameba',years:[2022],ss:'Diare berdarah berlendir, nyeri perut kram, TENESMUS, demam ringan. Trofozoit E.histolytica (+) pada mikroskop tinja. Bisa berkembang menjadi abses hepar.',dd:'Disentri basiler (Shigella - lebih akut, demam tinggi), IBD, Colitis iskemik',tx:'Metronidazol 3x500mg x7-10 hari. Lanjutkan Paromomycin/Diloksanida furoat untuk eradikasi kista. Rehidrasi.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'kandidiasis_oral',name:'Kandidiasis Oral',years:[2022],ss:'Plak putih seperti keju yang dapat DIANGKAT meninggalkan dasar merah eritem. Mukosa mulut, lidah, palatum. Terbakar/nyeri. KOH: pseudohifa dan spora.',dd:'Leukoplakia (tidak bisa diangkat), Stomatitis aphthous, Difteri faring, Geographic tongue',tx:'Nistatin suspensi 4x1-2 mL berkumur-telan x7 hari. Imunokompromis: Flukonazol 1x150mg x7-14 hari. Cari penyebab (DM, HIV, AB kronik).',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'hemoroid',name:'Hemoroid Interna',years:[2023],ss:'Perdarahan segar saat BAB (menetes/menyemprot), prolaps, pruritus ani. Grade I-IV berdasarkan prolaps. Tidak nyeri kecuali trombosis.',dd:'Fisura ani, Polip rektum, Ca kolorektum, Proktitis',tx:'Grade I-II: konservatif (diet tinggi serat, skleroterapi/rubber band ligation). Grade III-IV: hemoroidektomi.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'peritonitis',name:'Peritonitis',years:[2023,2024],ss:'Nyeri abdomen DIFUS, DEFANS MUSKULAR (+), rigiditas dinding perut, bising usus turun/hilang. Demam tinggi, takikardia. Foto: udara bebas subdiafragma (perforasi).',dd:'Appendisitis perforasi, Ulkus perforasi, Perforasi usus, Kolesistitis perforasi',tx:'Puasa, NGT dekompresi, IVFD kristaloid cepat. Antibiotik broad spectrum IV. Laparotomi eksplorasi segera.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'intususepsi',name:'Intususepsi',dd:'Volvulus, Ileus, Gastroenteritis, Invaginasi dewasa (tumor)',tx:'Anak: reduksi hidrostatik (enema barium/udara/NaCl) USG-guided - keberhasilan 70-90%. Gagal atau peritonitis: operasi.',years:[2024],ss:'Anak 6 bulan-3 tahun. Nyeri perut KOLIK episodik paroksismal, muntah, BAB berdarah seperti "jelly kismis" (current jelly stool). Massa sosis di RUQ. USG: target sign.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'ruptur_varises',name:'Ruptur Varises Esofagus',years:[2024],ss:'HEMATEMESIS MASIF tiba-tiba pada pasien sirosis/hipertensi portal. Melena. Syok hemodinamik. Riwayat alkohol, hepatitis kronik. Spider nevi, asites, splenomegali.',dd:'Ulkus peptikum berdarah, Mallory-Weiss tear, Gastropati hipertensi portal, Ca esofagus',tx:'Resusitasi IVFD (NGT untuk monitoring). Terlipressin/Oktreotid IV. Endoskopi (ligasi/skleroterapi) segera. Antibiotik profilaksis (Norfloksasin). TIPS jika gagal.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'abses_perianal',name:'Abses Perianal / Fistula Ani',years:[2025],ss:'Nyeri hebat perirektal terus-menerus, bengkak, kemerahan, fluktuasi perianal. Demam. Fistula: sekret kronik perianal, lubang eksternal teraba.',dd:'Hemoroid trombosis, Pilonidal sinus, Hidradenitis supurativa, Crohn perianal',tx:'Abses: INSISI DAN DRAINASE segera. AB jika selulitis luas. Fistula: fistulektomi/seton setelah peradangan mereda.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'hernia',name:'Hernia Inguinalis',years:[2025],ss:'Benjolan lipat paha, membesar saat berdiri/mengejan, mengecil/hilang saat berbaring. Inkarserata: tidak bisa dikembalikan + nyeri. Strangulata: iskemia usus.',dd:'Lipoma, Limfadenopati inguinal, Hidrokel, Kriptorkismus, Femoral hernia',tx:'Elektif: herniorafi/hernioplasti (Lichtenstein mesh). Inkarserata/strangulata: OPERASI DARURAT.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'abses_hepar',name:'Abses Hepar ec E.histolytica',years:[2025],ss:'Demam, nyeri RUQ, hepatomegali nyeri tekan. Sering TANPA riwayat disentri jelas. USG: lesi hipoekhoik/anechoic. IgM/IgG ameba (+).',dd:'Abses hepar piogenik (bakteri - multilokulasi, lebih toksik), Kista hepar, HCC nekrotik',tx:'Metronidazol 3x750mg x10 hari + Diloksanida furoat 3x500mg x10 hari. Drainase perkutan jika >5cm atau tidak respons.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'fimosis',name:'Fimosis (Sirkumsisi)',years:[2023,2025],ss:'Preputium tidak bisa diretraksi ke proksimal glans. Fisiologis: bayi ≤3 tahun. Patologis: >3 tahun, BXO, infeksi rekuren, nyeri, retensi urin.',dd:'Parafimosis (darurat), BXO, Balanoposthitis, Stenosis meatal',tx:'Konservatif: Betametason topikal x4-8 minggu + retraksi pelan. Gagal/komplikasi: sirkumsisi.',am:'IDENTITAS: Bayi-anak (fisiologis) atau pria dewasa (patologis)\n\nKELUHAN UTAMA: Kulup tidak bisa ditarik, nyeri atau susah kencing\n\nSACRED 7:\n1. Lokasi: Penis (preputium)\n2. Onset/Kronologi: Sejak lahir (fisiologis) atau setelah infeksi/iritasi berulang (patologis)\n3. Kuantitas: Ringan (bisa ditarik sedikit) hingga berat (tidak bisa ditarik sama sekali)\n4. Kualitas: Preputium menggelembung saat BAK, aliran urin lemah/menetes, nyeri saat ereksi\n5. Faktor pemberat: BAK, ereksi, infeksi/peradangan\n6. Faktor peringan: Posisi yang nyaman\n7. Gejala penyerta: Nyeri, kemerahan, bau tidak sedap (infeksi smegma), susah kencing\n\nFUNDAMENTAL 4:\n1. RPS: Sudah berapa lama, pernah infeksi kepala penis, BAK normal atau tidak\n2. RPD: Riwayat balanitis/balanoposthitis berulang (menyebabkan BXO)\n3. RPK: Tidak spesifik\n4. Sos-Ek: Kebersihan (rutin membersihkan?), sudah aktif seksual (fimosis mengganggu hubungan)'},
{id:'parafimosis',name:'Parafimosis (Dorsumsisi)',years:[2025],ss:'Preputium terjebak di proksimal glans setelah retraksi, tidak bisa dikembalikan. Edema glans progresif, sangat nyeri, iskemia. DARURAT urologi.',dd:'Fimosis, Edema glans karena trauma, Infiltrat tumor',tx:'Reduksi manual segera: kompres es 15 menit, tekan glans kuat sambil dorong preputium ke distal. Gagal: DORSUMSISI DARURAT. Setelah sembuh: sirkumsisi elektif.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},

ginjal:[
{id:'gnaps',name:'GNAPS',years:[2022,2024],ss:'Hematuria makroskopik (urin cola/merah), edema periorbita pagi, hipertensi, oliguria. Riwayat ISPA/infeksi kulit streptokokus 1-3 minggu lalu. ASTO naik, C3 turun, eritrosit disformik.',dd:'Sindrom nefrotik, IgA nephropathy, Lupus nefritis, Nefritis herediter (Alport)',tx:'Tirah baring, diet rendah garam-protein. Amlodipine antihipertensi. Furosemid jika edema/oliguria. Penisilin 10 hari. Self-limiting 2-4 minggu.',am:'IDENTITAS: Anak 5-12 th, laki-laki lebih sering, 1-3 minggu pasca ISPA/infeksi kulit\n\nKELUHAN UTAMA: Kencing berwarna merah/coklat, wajah bengkak saat bangun pagi\n\nSACRED 7:\n1. Lokasi: Ginjal (sistemik: edema, hipertensi)\n2. Onset/Kronologi: 1-3 minggu setelah ISPA atau impetigo, onset mendadak\n3. Kuantitas: Urin merah (hematuria makroskopik), edema periorbita terutama pagi hari\n4. Kualitas: Urin seperti teh/cola/daging mentah\n5. Faktor pemberat: Dehidrasi, konsumsi garam berlebih\n6. Faktor peringan: Diet rendah garam, antihipertensi\n7. Gejala penyerta: BAK berkurang (oliguria), kepala pusing (hipertensi), badan lemas, nafsu makan turun\n\nFUNDAMENTAL 4:\n1. RPS: Riwayat infeksi tenggorokan/kulit 1-3 minggu sebelumnya, kapan, diobati atau tidak\n2. RPD: Riwayat penyakit ginjal sebelumnya\n3. RPK: Riwayat penyakit ginjal/autoimun dalam keluarga\n4. Sos-Ek: Higiene diri, kondisi lingkungan (padat, sanitasi buruk)'},
{id:'pielonefritis',name:'Pielonefritis Akut',years:[2022,2024],ss:'Demam tinggi mendadak, menggigil, CVA TENDERNESS (+), disuria, frekuensi. Urinalisis: leukosituria, bakteriuria, cast leukosit. WBC naik.',dd:'Sistitis, Appendisitis, Kolik ureter, Abses perinefrik',tx:'Seftriakson 1-2g/24j IV atau Siprofloksasin 2x500mg oral x7-10 hari. IVFD, analgetik, antipiretik. Rawat inap jika berat.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'sistitis',name:'Sistitis',years:[2022,2025],ss:'Disuria, polakisuria, urgency, nyeri suprapubik. TIDAK ada demam tinggi atau CVA tenderness. Urinalisis: leukosituria, bakteriuria, nitrit (+).',dd:'Pielonefritis (ada demam+CVA), Uretritis, Vulvovaginitis, Kandidiasis',tx:'Kotrimoksazol 2x960mg x3 hari atau Siprofloksasin 2x500mg x3 hari atau Nitrofurantoin x7 hari. Minum banyak air.',am:'IDENTITAS: Perempuan usia reproduksi lebih sering (uretra pendek), aktif seksual\n\nKELUHAN UTAMA: Nyeri/perih saat kencing, sering kencing\n\nSACRED 7:\n1. Lokasi: Kandung kemih (suprapubik), uretra (saat BAK)\n2. Onset/Kronologi: Mendadak, berlangsung beberapa hari, sering kambuh\n3. Kuantitas: Sering BAK (>8x/hari), hanya keluar sedikit tiap kali\n4. Kualitas: Perih/panas/terbakar saat BAK (disuria), rasa tidak lampias (urgency)\n5. Faktor pemberat: Hubungan seksual ("honeymoon cystitis"), kurang minum, celana ketat\n6. Faktor peringan: Banyak minum air, antibiotik\n7. Gejala penyerta: Nyeri tekan suprapubik, urin keruh/berbau, kadang ada darah (hematuria)\n\nFUNDAMENTAL 4:\n1. RPS: TIDAK ada demam/nyeri pinggang (jika ada → pielonefritis!), riwayat hubungan seksual\n2. RPD: Riwayat ISK sebelumnya (berapa kali?), alergi antibiotik\n3. RPK: Tidak spesifik\n4. Sos-Ek: Kebiasaan minum air, cara cebok (depan ke belakang!), kontrasepsi, aktivitas seksual'},
{id:'nefrolitiasis',name:'Nefrolitiasis / Ureterolitiasis',years:[2022],ss:'KOLIK (nyeri pinggang mendadak hebat menjalar ke selangkangan/genitalia), hematuria, mual. CVA tenderness (+). USG/CT urografi: batu saluran kemih.',dd:'Kolik bilier, Pielonefritis, Appendisitis, KET, Aneurisma aorta',tx:'Analgetik: NSAID (Ketorolak IM) atau opioid. Hidrasi. Tamsulosin (expulsive therapy batu <10mm). Batu >10mm: ESWL atau ureteroskopi.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'ruptur_ginjal',name:'Ruptur Ginjal ec Trauma',years:[2022],ss:'Riwayat trauma abdomen/pinggang. Nyeri pinggang, HEMATURIA (tanda khas), ekimosis flank (Grey Turner sign). CT kontras: GOLD STANDARD grading AAST.',dd:'Kontusio ginjal, Trauma lien, Trauma hepar, Ruptur ureter',tx:'Grade I-III: konservatif (bed rest, monitoring). Grade IV-V atau hemodinamik tidak stabil: operasi atau embolisasi angiografi.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'sindrom_nefritik',name:'Sindrom Nefritik',years:[2024],ss:'Hematuria, proteinuria ringan-sedang, hipertensi, edema, oliguria. Silinder eritrosit. Berbeda sindrom nefrotik: proteinuria masif >3.5g/hari, edema berat, hipoalbuminemia.',dd:'GNAPS, IgA nephropathy, Lupus nefritis, Nefritis herediter, Vaskulitis ANCA',tx:'Tergantung penyebab. Umum: tirah baring, diet rendah garam, diuretik, antihipertensi. Biopsi ginjal untuk diagnosis definitif.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'prostatitis',name:'Prostatitis',years:[2024],ss:'Nyeri perineum/suprapubik, disuria, frekuensi, DEMAM (akut). Colok dubur: prostat nyeri tekan, hangat, lunak (akut). Urin/EPS: leukosituria, bakteriuria.',dd:'BPH, Ca prostat, ISK, Epididimo-orchitis, Abses prostat',tx:'Siprofloksasin 2x500mg atau Kotrimoksazol x28 hari. Berat/abses: rawat inap, AB IV. Analgetik, alpha bloker.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'uretritis_go',name:'Uretritis Gonore',years:[2024],ss:'Sekret uretra PURULEN kuning-hijau, disuria, uretra terbakar. Inkubasi 2-7 hari setelah kontak seksual. Gram: diplokokus gram negatif intraseluler. Kultur Thayer-Martin (+).',dd:'Uretritis non-gonore (Klamidia - sekret mukoid, lebih ringan), Sistitis, Prostatitis',tx:'Seftriakson 500mg IM dosis tunggal + Azitromisin 1g oral. Notifikasi pasangan. Skrining IMS lain (HIV, sifilis).',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},

obgyn:[
{id:'pap_smear',name:'PAP Smear / Skrining Kanker Serviks',years:[2022],ss:'Skrining perempuan seksual aktif ≥21 tahun. Hasil Bethesda: Normal, ASC-US, LSIL, HSIL, Karsinoma. Mulai 3 tahun setelah aktif seksual.',dd:'Servisitis, Infeksi HPV, CIN I/II/III, Adenokarsinoma serviks',tx:'Teknik: spekulum → usap ektoserviks (spatula) + endoserviks (cytobrush) → apus kaca objek → fiksasi alkohol 95%. Hasil abnormal: kolposkopi + biopsi.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'bv',name:'Bakterial Vaginosis (BV)',years:[2022,2024],ss:'Sekret vagina abu-abu homogen BERBAU AMIS (fishy odor) terutama post-koitus. pH vagina >4.5. Clue cells (+). Whiff test (+) dengan KOH 10%. Kriteria Amsel ≥3/4.',dd:'Kandidiasis (sekret putih bergumpal, gatal), Trikomoniasis (kuning berbusa), Servisitis',tx:'Metronidazol 2x500mg x7 hari atau gel vagina 0.75% x5 hari atau Klindamisin krim vagina x7 hari. Tidak perlu terapi pasangan.',am:'IDENTITAS: Perempuan usia reproduksi 15-44 th, aktif seksual\n\nKELUHAN UTAMA: Keputihan berbau amis\n\nSACRED 7:\n1. Lokasi: Vagina (sekret dari vagina)\n2. Onset/Kronologi: Perlahan, sering kambuh, sering memburuk setelah berhubungan seksual\n3. Kuantitas: Sekret banyak, homogen, abu-abu kehijauan\n4. Kualitas: BAU AMIS seperti ikan (fishy odor) terutama setelah berhubungan seksual\n5. Faktor pemberat: Setelah berhubungan seksual, pembersih vagina (douching)\n6. Faktor peringan: Menghindari trigger\n7. Gejala penyerta: Gatal ringan (beda dengan kandidiasis yang sangat gatal), tidak ada nyeri BAK\n\nFUNDAMENTAL 4:\n1. RPS: Riwayat seksual, penggunaan IUD, antibiotik sebelumnya\n2. RPD: Riwayat keputihan/IMS sebelumnya\n3. RPK: Tidak relevan\n4. Sos-Ek: Aktivitas seksual (berganti pasangan meningkatkan risiko), kebiasaan membersihkan vagina, pakaian dalam (ketat/sintetis)'},
{id:'ca_serviks',name:'Susp. Ca Serviks (IVA Test)',years:[2022],ss:'Perdarahan vagina pasca-senggama atau intermenstrual. Sekret berbau. IVA test: lesi ACETOWHITE pada serviks. Stadium awal sering asimtomatik. HPV high-risk.',dd:'Ektropion serviks, Servisitis, Polip serviks, Ca endometrium',tx:'IVA positif: biopsi konfirmasi → terapi sesuai stadium. CIN II-III: LEEP/konisasi. Kanker invasif: histerektomi radikal/radioterapi/kemoterapi.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'abortus_imminens',name:'Abortus Imminens',years:[2022],ss:'Perdarahan vagina sedikit + kram pada kehamilan <20 minggu. OUE TERTUTUP. USG: janin masih hidup, DJJ (+). Ancaman keguguran tapi kehamilan bisa dipertahankan.',dd:'Abortus insipiens (OUE terbuka), KET, Abortus inkomplit, Mola hidatidosa',tx:'Tirah baring. Progesteron suportif (Dydrogesterone/Micronized progesteron). Hindari aktivitas seksual. Follow-up USG serial.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'peb',name:'PEB (Preeklamsia Berat) - ANC',years:[2023],ss:'TD ≥160/110 mmHg pada ≥20 minggu kehamilan. Proteinuria ≥300mg/24j. Nyeri kepala, gangguan visus, nyeri epigastrik. HELLP syndrome.',dd:'Hipertensi kronik, Eklamsia (sudah kejang), Lupus nefritis, Sindrom antifosfolipid',tx:'MgSO4 4g IV bolus loading, lanjut 1g/jam (cegah kejang). Nifedipin/Labetalol antihipertensi. Terminasi ≥34 minggu atau kondisi tidak stabil.',am:'IDENTITAS: Perempuan hamil ≥20 minggu, nullipara lebih sering, usia <20 atau >35 th\n\nKELUHAN UTAMA: Kepala pusing, pandangan kabur, kaki bengkak pada ibu hamil\n\nSACRED 7:\n1. Lokasi: Kepala, mata, tangan/kaki (edema), ulu hati (epigastrium)\n2. Onset/Kronologi: Setelah usia kehamilan 20 minggu, onset subakut\n3. Kuantitas: TD ≥160/110 mmHg, edema bisa pitting\n4. Kualitas: Nyeri kepala berdenyut, penglihatan kabur/berkunang, nyeri ulu hati berat\n5. Faktor pemberat: Kehamilan kembar, mola, DM, hipertensi kronik sebelumnya\n6. Faktor peringan: Istirahat (tidak menyembuhkan)\n7. Gejala penyerta: Nyeri epigastrium/RUQ (tanda HELLP!), mual/muntah, bengkak wajah mendadak, sesak, gerak janin berkurang\n\nFUNDAMENTAL 4:\n1. RPS: Usia gestasi, G-P-A, TD sebelum hamil, ANC rutin, lab terakhir\n2. RPD: Hipertensi, DM, penyakit ginjal, PEB pada kehamilan sebelumnya\n3. RPK: Riwayat PEB/eklamsia dalam keluarga\n4. Sos-Ek: Status gizi, aktivitas, stres, dukungan keluarga, akses pelayanan kesehatan'},
{id:'anemia_anc',name:'Anemia Def. Besi pada Kehamilan - ANC',years:[2023],ss:'Hb <11g/dL (trimester 1&3) atau <10.5g/dL (trimester 2). Lemah, pusing, pucat, takikardia. MCV turun, ferritin turun, TIBC naik. Risiko BBLR, partus prematur.',dd:'Anemia defisiensi folat (MCV naik), Anemia penyakit kronik, Talasemia, Anemia hemolitik',tx:'Ferrous sulfat 3x200mg/hari (terapi) atau 1x200mg/hari (profilaksis) + Vit C. Folat 400-800mcg/hari. Monitor Hb tiap 4 minggu.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'endometritis',name:'Endometritis',years:[2023],ss:'DEMAM POSTPARTUM, nyeri uterus tekan, lokia berbau busuk/purulen setelah persalinan (hari 2-3). Riwayat seksio atau KPSW. Uterus subinvolusi.',dd:'ISK, Mastitis, Tromboflebitis septik pelvis, Abses pelvis, Wound infection',tx:'Gentamisin + Klindamisin IV atau Ampisilin-sulbaktam. Perbaikan setelah 72 jam: switch oral. Kuretase jika ada sisa plasenta.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'abortus_komplik',name:'Abortus Komplit Spontan',years:[2023],ss:'Semua hasil konsepsi telah keluar. Perdarahan berhenti/berkurang. OUE TERTUTUP kembali. Uterus mengecil. USG: kavum uteri kosong. Nyeri kram mereda.',dd:'Abortus inkomplit (OUE terbuka, masih ada sisa), Abortus mola, KET',tx:'Observasi ketat. Tidak perlu evakuasi jika USG bersih. Analgetik jika perlu. Edukasi tanda bahaya.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'pid',name:'PID (Pelvic Inflammatory Disease)',years:[2023,2024],ss:'Nyeri abdomen bawah bilateral + CMT (CERVICAL MOTION TENDERNESS) + nyeri adneksa. Demam, sekret vagina purulen. Kriteria Hager.',dd:'Appendisitis, KET, Kista ovarium terpuntir, Endometriosis, ISK',tx:'Rawat jalan: Seftriakson 500mg IM + Doksisiklin 2x100mg x14 hari + Metronidazol x14 hari. Rawat inap: Sefoksitik IV+Doksisiklin. Terapi pasangan.',am:'IDENTITAS: Perempuan usia reproduksi 15-25 th, aktif seksual, sering berganti pasangan\n\nKELUHAN UTAMA: Nyeri perut bawah, keputihan, demam\n\nSACRED 7:\n1. Lokasi: Perut bawah (bilateral), vagina/serviks\n2. Onset/Kronologi: Akut beberapa hari, sering setelah menstruasi atau prosedur ginekologi\n3. Kuantitas: Nyeri bisa ringan-berat\n4. Kualitas: Nyeri tekan perut bawah bilateral, NYERI SAAT SERVIKS DIGOYANG (CMT = patognomonik!), keputihan purulen\n5. Faktor pemberat: Hubungan seksual, menstruasi, aktivitas fisik berat\n6. Faktor peringan: Antibiotik, istirahat\n7. Gejala penyerta: Demam, mual/muntah, disuria, menstruasi tidak teratur, nyeri saat berhubungan (dispareunia)\n\nFUNDAMENTAL 4:\n1. RPS: Riwayat seksual (kondom atau tidak), IUD, prosedur uterus (kuretase) baru-baru ini\n2. RPD: Riwayat PID atau IMS sebelumnya, riwayat kehamilan ektopik\n3. RPK: Tidak spesifik\n4. Sos-Ek: Aktivitas seksual (berganti pasangan, tidak pakai kondom), riwayat IMS pasangan'},
{id:'salpingitis',name:'Salpingitis',years:[2024],ss:'Nyeri adneksa unilateral/bilateral, demam, keputihan purulen. Teraba massa adneksa (abses tuba-ovarium). Komplikasi PID. Nyeri goyang serviks (+).',dd:'Appendisitis, KET, Kista ovarium terpuntir, Endometriosis',tx:'Sama dengan PID berat. Abses tuba-ovarium: drainase perkutan USG-guided atau laparoskopi.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'mastitis',name:'Mastitis / Breast Engorgement',years:[2025],ss:'Mastitis: payudara merah, nyeri, hangat, keras, DEMAM >38.5°C, umumnya minggu 2-4 postpartum. Engorgement: penuh, berat, TIDAK ada demam. Fluktuasi: abses.',dd:'Abses payudara (perlu drainase), Galaktokel, Karsinoma inflamasi',tx:'Mastitis: lanjutkan menyusui/memompa, Amoksisilin-klavulanat 3x625mg x10-14 hari, kompres hangat. Engorgement: keluarkan ASI sering, kompres dingin. Abses: insisi-drainase.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'anc_risiko',name:'ANC Kehamilan Risiko Tinggi (Letak Sungsang)',years:[2025],ss:'Letak lintang/sungsang (letling) pada usia gestasi 33-34 minggu. USG: presentasi bokong/bahu. G2P1A0 - evaluasi riwayat persalinan. Monitor kesejahteraan janin.',dd:'Letak normal belum engaged, Mioma uteri, Plasenta previa, Panggul sempit',tx:'Versi luar (ECV) ab 36-37 minggu jika tidak ada kontraindikasi. Gagal ECV: SC elektif. Senam hamil/posisi knee-chest untuk sungsang.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'bartholinitis',name:'Bartholinitis / Abses Bartolin',years:[2025],ss:'Benjolan nyeri di labia mayora posterior, merah, hangat, FLUKTUATIF. Unilateral. Nyeri saat berjalan/duduk. Kista Bartolin tanpa infeksi: tidak nyeri.',dd:'Kista Bartolin (tidak nyeri, tidak merah), Abses perianal, Lipoma terinfeksi',tx:'Insisi-drainase atau Word catheter x4-6 minggu (mencegah rekurensi). AB: Amoksisilin-klavulanat x7 hari. Marsupialisasi untuk kasus rekuren.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'cracked_nipple',name:'Cracked Nipple',years:[2025],ss:'Puting susu lecet/retak, nyeri saat menyusui, bisa berdarah. Penyebab: teknik perlekatan (LATCH-ON) salah. Pintu masuk infeksi ke mastitis.',dd:'Mastitis (ada demam, kemerahan), Paget disease puting (lesi menahun), Dermatitis kontak',tx:'Perbaiki teknik latch-on (mulut bayi mencakup areola). Lanolin murni (Lansinoh) oles setelah menyusui. Biarkan kering di udara.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},

{id:'dm2',name:'DM Tipe 2',years:[2022,2024],ss:'Hiperglikemia: poliuri, polidipsi, polifagi, penurunan BB. GDP ≥126 atau GDS ≥200 + gejala atau HbA1c ≥6.5%. Sering ditemukan pada skrining tanpa gejala.',dd:'DM tipe 1 (muda, kurus, DKA), MODY, DM sekunder, Impaired fasting glucose',tx:'Metformin lini 1 + modifikasi gaya hidup. Kombinasi jika HbA1c tidak tercapai: DPP4i, SGLT2i, GLP-1RA, sulfonilurea, insulin. Target HbA1c <7%.',am:'IDENTITAS: Usia >40 th (makin sering usia muda), sering obesitas/overweight\n\nKELUHAN UTAMA: Sering kencing, sering haus, banyak makan tapi BB turun\n\nSACRED 7:\n1. Lokasi: Sistemik (metabolik)\n2. Onset/Kronologi: Perlahan, sering tidak disadari bertahun-tahun, terdeteksi saat skrining\n3. Kuantitas: Poliuri (BAK >8x/hari, kencing malam), polidipsi (minum >3L/hari)\n4. Kualitas: 3P - Poliuri, Polidipsi, Polifagi dengan penurunan BB\n5. Faktor pemberat: Pola makan tinggi karbohidrat/gula, kurang aktivitas, stres\n6. Faktor peringan: Diet, olahraga, obat antidiabetes\n7. Gejala penyerta: Lemas, luka lama sembuh, kesemutan kaki (neuropati), penglihatan kabur (retinopati), gatal-gatal, infeksi berulang\n\nFUNDAMENTAL 4:\n1. RPS: Sudah berapa lama, obat apa, kontrol terakhir kapan, ada komplikasi (kesemutan, kabur, luka)?\n2. RPD: Riwayat prediabetes, DM gestasional, hipertensi, dislipidemia\n3. RPK: Riwayat DM dalam keluarga (orang tua, saudara kandung)\n4. Sos-Ek: Pola makan (karbohidrat, minuman manis), aktivitas fisik, merokok, pekerjaan sedentary'},
{id:'sindrom_metabolik',name:'Sindrom Metabolik',years:[2022,2024],ss:'≥3 dari 5: lingkar pinggang naik (>90cm pria/>80cm wanita Asia), TG ≥150, HDL rendah, TD ≥130/85, GDP ≥100. Resistensi insulin sebagai inti.',dd:'DM tipe 2, Hipotiroid, Sindrom Cushing, PCOS, Dislipidemia primer',tx:'Modifikasi gaya hidup: penurunan BB 7-10%, aktivitas fisik 150 menit/minggu, diet mediterania. Farmako per komponen: statin, antihipertensi, metformin, fibrat.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'obesitas',name:'Obesitas + Hiperlipidemia',years:[2022],ss:'IMT ≥30 (Barat) / ≥25 (Asia). Hiperlipidemia: LDL naik, TG naik, HDL turun. Risiko kardiovaskular, DM2, sleep apnea, NAFLD, osteoartritis.',dd:'Obesitas sekunder (Cushing, hipotiroid), Pseudoobesitas (edema)',tx:'Diet defisit 500-1000 kkal, aktivitas fisik, CBT. Farmako: Orlistat, Bupropion-naltrexone. Bariatrik jika IMT ≥40 atau ≥35+komorbid. Statin untuk dislipidemia.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'graves',name:'Graves Disease / Hipertiroid',years:[2022],ss:'Palpitasi, tremor, berkeringat, intoleransi panas, BB turun meski nafsu makan naik, EKSOFTALMUS, goiter difus. FT4/T3 naik, TSH turun. TRAb (+).',dd:'Tiroiditis subakut/Hashimoto fase awal, Struma multinodosa toksik, Adenoma toksik, Feokromositoma',tx:'Anti-tiroid: PTU atau Metimazol. Beta bloker (Propranolol) untuk gejala. Yodium radioaktif. Tiroidektomi. Krisis tiroid: PTU+Lugol+deksametason+beta bloker.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'hhs',name:'HHS (Hyperosmolar Hyperglycemic State)',years:[2023],ss:'GDS EKSTREM (>600 mg/dL), osmolalitas >320. Dehidrasi berat, gangguan kesadaran. TIDAK ada atau minimal ketonemia. Umumnya DM tipe 2 lansia.',dd:'DKA (ada ketosis, pH <7.3, lebih pada DM tipe 1), Stroke, Uremia, Keracunan',tx:'Rehidrasi agresif NaCl 0.9% IV (defisit 8-10L). Insulin regular IV setelah 1-2 jam rehidrasi. Koreksi elektrolit (K+). Monitor neurologi.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'hipoglikemia',name:'Hipoglikemia Berat',years:[2023],ss:'GDS <70 mg/dL + gejala adrenergik (berkeringat, tremor, palpitasi) atau neuroglikopenik (bingung, kejang, tidak sadar). Sering akibat insulin atau sulfonilurea.',dd:'Stroke, Epilepsi, Intoksikasi alkohol, Syncope, Ensefalopati lain',tx:'Sadar: 15g karbohidrat cepat (3-4 tablet glukosa), ulangi 15 menit. TIDAK SADAR: Dekstrosa 40% 25-50ml IV bolus atau Glukagon 1mg IM/SC.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'goiter',name:'Goiter Endemik',years:[2024],ss:'Pembesaran tiroid difus di daerah kekurangan iodium. Sering EUTIROID. Stadium WHO I-III. Kadar TSH normal.',dd:'Hashimoto, Graves disease, Struma multinodosa, Ca tiroid, Tiroiditis subakut',tx:'Iodium (garam beriodium, suplementasi). LT4 jika hipotiroid. Bedah jika menekan struktur sekitar. Radioiodin jika toksik.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'gizi_buruk',name:'Gizi Buruk (Marasmus)',years:[2025],ss:'BB sangat rendah (<60% median W/A atau z-score <-3 SD). Anak "KULIT TULANG", otot atrofi, muka seperti orang tua. TIDAK ada edema. MUAC <11.5cm.',dd:'Kwashiorkor (ada edema, hipoalbuminemia), Marasmus-kwashiorkor, TB, HIV, jantung bawaan',tx:'Fase stabilisasi: diet F-75 tiap 2 jam, koreksi hipoglikemia/hipotermia/dehidrasi/infeksi. Fase rehabilitasi: F-100. Suplementasi mikronutrien.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'cushing',name:'Cushing Disease / Cushing Syndrome',years:[2025],ss:'Obesitas sentral (MOON FACE, BUFFALO HUMP, perut buncit). STRIAE UNGU, kulit tipis mudah memar, hirsutisme, amenore, hipertensi, osteoporosis, DM. Kortisol naik. Deksametason supresi abnormal.',dd:'Obesitas biasa, Sindrom metabolik, DM tipe 2, Pseudo-Cushing (depresi, alkohol)',tx:'Adenoma hipofisis: operasi transsfenoidal. Adrenal: adrenalektomi. Ektopik: terapi tumor primer. Medikamentosa: Ketokonazol, Metirapone.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'hipoparatiroid',name:'Hipoparatiroid',years:[2025],ss:'Hipokalsemia: CHVOSTEK SIGN (+), TROUSSEAU SIGN (+), kram otot, parestesi perioral/ujung jari, kejang, laryngospasme. PTH turun, Ca turun, P naik. Paling sering pasca tiroidektomi.',dd:'Hiperventilasi (alkalosis respiratorik), Hipomagnesemia, Pseudohipoparatiroid, Pankreatitis akut',tx:'Akut (gejala berat): Ca glukonat 10% 10ml IV perlahan. Kronis: Ca karbonat 3x500mg + Kalsitriol 0.25-0.5mcg/hari.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
