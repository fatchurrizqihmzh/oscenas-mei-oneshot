'miopia':{f:'Visus jauh: menurun (turun dengan koreksi lensa negatif). Visus dekat: normal. Refraksi: lensa sferis negatif membaiki visus. Funduskopi: miopi tinggi — atrofi koroid, staphyloma posterior, degenerasi retina (perifer). Segmen anterior: normal. TIO: normal.',p:'Refraksi subjektif dan objektif. Autorefraktometer. Keratometri. Panjang aksial (biometri — jika perlu). Topografi kornea (jika pertimbangan Lasik). Foto fundus (miopi tinggi >6D).'},
'presbiopia':{f:'Visus dekat: menurun (butuh dijauhkan — arm-length reading). Visus jauh: tergantung refraksi. Amplitudo akomodasi berkurang. Koreksi dengan lensa positif (adisi).',p:'Refraksi lengkap (jauh dan dekat). Pembacaan kartu Jaeger (visus dekat). Tidak ada pemeriksaan laboratorium spesifik.'},
'astigmatisme':{f:'Visus: kabur semua jarak. Koreksi dengan lensa silindris membaik. Keratometri: 2 meridian utama berbeda (≥0.25D). Segmen anterior: normal. Placido disk: oval (reguler) atau ireguler (keratokonus).',p:'Refraksi subjektif + objektif (autorefraktometer). Keratometri. Topografi kornea (curiga keratokonus). Aberrometri (jika pertimbangkan Lasik).'},
'dry_eye':{f:'Visus: bisa sedikit turun, meningkat setelah berkedip. Slit lamp: debris tear film, filamen mukus, keratitis pungtata superfisial. TBUT (Tear Break-Up Time): <10 detik (abnormal). Tes Schirmer I: <5mm/5 menit (abnormal). Rose Bengal atau lissamine green staining: konjungtiva.',p:'TBUT, Schirmer test. Osmolalitas air mata. Impresi sitologi konjungtiva. Evaluasi sistemik: ANA, RF, anti-Ro/La (Sjögren). TSH (hipotiroid). Biopsi kelenjar saliva minor (Sjögren).'},
'blefarokonj':{f:'Visus: normal atau sedikit turun. Kelopak: merah, bersisik, krusta. Konjungtiva: injeksi, sekret mukopurulen. Kornea: bisa ada keratitis pungtata. Slit lamp: detail kelopak dan konjungtiva.',p:'Kultur sekret (jika tidak respons AB). Gram apusan sekret. Tes sensitivitas. Tidak ada lab rutin.'},
'hifema':{f:'Visus: menurun. Inspeksi: darah dalam COA (level hifema). Slit lamp: grading hifema I-IV. TIO: ukur (glaukoma sekunder!). Gonioskopi (jika TIO meningkat). Funduskopi (jika media jernih).',p:'TIO monitor serial. USG mata (B-scan) jika fundus tidak terlihat. Foto segmen anterior. Sickle cell test (anemia sel sabit — kontraindikasi aspirin). Lab: DL, koagulasi, goldar.'},
'laserasi_pal':{f:'TTV: normal. Inspeksi luka: lokasi, kedalaman, keterlibatan margo, kanalikulus (medial!), levator, tarsal plate. Visus. Gerakan bola mata. Fluorescein stain (lacerasi kornea bersamaan).',p:'CT orbita (jika curiga benda asing, fraktur orbita). Pemeriksaan khusus SpM: eksplorasi intraoperatif.'},
'rhinitis_vasomotor':{f:'TTV: normal. Rinoskopi anterior: konka inferior edema (unilateral atau bilateral), bisa merah atau livid, sekret encer/mukoid. Tidak ada polip. Skin prick test/IgE: NEGATIF (beda alergi).',p:'Nasoendoskopi: evaluasi detail kavum nasi. Tes alergi negatif (IgE spesifik, SPT). Nasal provokasi (histamin, metakolin). Foto sinus (singkirkan sinusitis). Sitologi nasal: eosinofil minimal.'},
'ca_serviks':{f:'TTV: normal. Inspeksi vulva: normal. Spekulum: serviks — lesi, ektropion, perdarahan kontak. IVA test: lesi acetowhite (+). Pemeriksaan bimanual: ukuran, konsistensi serviks, mobilitas uterus, parametrium.',p:'PAP smear: LSIL, HSIL, SCC. HPV DNA/genotyping: 16, 18, 31, 33. Kolposkopi: GOLD STANDARD evaluasi lesi abnormal. Biopsi serviks + PA: konfirmasi diagnosis. Jika kanker: CT abdomen-pelvis/MRI (staging), CXR, sistoskopi, rektoskopi.'},
'anemia_anc':{f:'TTV: takikardia kompensasi jika anemia berat. Konjungtiva: pucat (+). Telapak tangan pucat. Pemeriksaan obstetri: TFU, DJJ, presentasi. Edema (pre-eklamsia bersamaan?).',p:'DL: Hb <11 g/dL (T1&T3) atau <10.5 (T2), MCV, MCH, MCHC, RDW. Apusan darah tepi. Ferritin (konfirmasi defisiensi besi). Serum iron, TIBC. Goldar + Rh. Urinalisis. USG obstetri.'},
'endometritis':{f:'TTV: DEMAM ≥38°C (paling khas). Abdomen: nyeri tekan suprapubik. Pemeriksaan dalam: uterus membesar, NYERI TEKAN (+), subinvolusi. Lokia: purulen/berbau busuk. Sekret serviks: purulen.',p:'Lab: DL (leukositosis). CRP meningkat. Kultur lokia/sekret endometrium: kuman penyebab. Urinalisis (ISK bersamaan). USG uterus: sisa jaringan plasenta?, endometrium tebal, cairan dalam kavum. Serum βhCG (jika curiga retensi hasil konsepsi).'},
'salpingitis':{f:'TTV: demam. Nyeri tekan adneksa (+) satu/dua sisi. CMT (+). Massa adneksa? (abses tuba-ovarium). Rebound tenderness jika peritonitis.',p:'Lab: DL leukositosis, CRP/LED. βhCG (singkirkan KET). NAAT gonore & klamidia. USG TV: tuba membesar berisi cairan (hydrosalpinx/pyosalpinx), abses. Laparoskopi: GOLD STANDARD. Cairan peritoneum untuk kultur.'},
'abortus_komplik':{f:'TTV: normal atau sedikit takikardia. Abdomen: TFU mengecil, tidak sesuai usia kehamilan. Spekulum: OUE tertutup, tidak ada jaringan. Perdarahan: minimal atau berhenti. Bimanual: uterus mengecil, tidak nyeri bermakna.',p:'USG: kavum uteri KOSONG (konfirmasi komplit). βhCG: menurun (progresif). DL, goldar. Urinalisis.'},
'cracked_nipple':{f:'TTV: normal. Inspeksi puting: fisura/retakan, sering di pangkal, bisa berdarah. Tidak ada eritema/hangat/keras (beda mastitis). Evaluasi teknik menyusui (latch-on). Inspeksi mulut bayi (ankyloglossic, oral thrush).',p:'Klinis. Kultur dari sekret puting (jika curiga candida/infeksi): KOH, kultur jamur. Tidak ada pemeriksaan rutin.'},
'anc_risiko':{f:'TTV: TD, nadi, BB, edema. Tinggi fundus uteri: sesuai/tidak sesuai usia kehamilan. Leopold I-IV: presentasi janin (bokong/bahu), DJJ. Pelvis: taksiran panggul. Tanda komplikasi (hipertensi, proteinuria).',p:'USG obstetri: konfirmasi letak janin, AFI, plasenta, biometri. NST/CTG: kesejahteraan janin. Lab ANC: DL, goldar Rh, GDS, protein urin, HBsAg, VDRL, HIV rapid test.'},
'sindrom_metabolik':{f:'TTV: TD ≥130/85 mmHg. Antropometri: BB, TB, IMT, LINGKAR PINGGANG (>90cm pria/>80cm wanita Asia — kriteria utama!). Buffalo hump (Cushing?). Kulit: acanthosis nigricans. Hirsutisme (PCOS wanita).',p:'Lab: GDP ≥100 mg/dL (atau DM). Profil lipid: TG ≥150 mg/dL, HDL <40 (pria)/<50 (wanita). Asam urat. Insulin puasa + HOMA-IR. TSH (hipotiroid). Kortisol (Cushing). USG abdomen: fatty liver (NAFLD).'},
'obesitas':{f:'TTV: TD (hipertensi). Antropometri: BB, TB, IMT ≥25 (Asia) atau ≥30 (Barat), lingkar pinggang, lingkar pinggul, waist-hip ratio. Leher: lingkar, tonsilomegali (OSA). Abdomen: striae, umbilikus tertarik. Akantosis nigricans. Edema.',p:'Lab: GDS/GDP (DM), profil lipid (dislipidemia), TSH (hipotiroid), asam urat, fungsi hati (NAFLD). PSG (jika curiga OSA: mendengkur, apnea, hipersomnia). EKG. Ekokardiografi (hipertensi pulmonal). USG abdomen.'},
'hipersomnia':{f:'TTV: normal atau obesitas (OSA). Status mental: somnolen. Lingkar leher (>40cm wanita/>43cm pria = OSA). Tonsilomegali. Maloklusi mandibula. Pemeriksaan Epworth Sleepiness Scale (ESS).',p:'PSG (Polysomnography): GOLD STANDARD — AHI untuk OSA. Multiple Sleep Latency Test (MSLT): narkolepsi (sleep latency <8 menit). TSH (hipotiroid). HbA1c/GDP. EEG (jika ada kejang).'},
'bipolar':{f:'TTV: normal atau takikardia saat manik. Status mental: mood depresi, psikomotor lambat, berbicara lambat (episode depresi). Atau sebaliknya: ekspansif, flight of ideas, psikomotor meningkat (manik).',p:'Klinis dan riwayat. MDQ (Mood Disorder Questionnaire). TSH (tiroid). EKG (sebelum antipsikotik/mood stabilizer). Kadar litium (jika mendapat litium). Fungsi ginjal dan tiroid (litium). Lab dasar.'},
'disfungsi_seksual':{f:'TTV: normal. Status hormonal: tanda hipotiroid/menopause. Genitalia: inspeksi, tanda atrofi vagina (estrogen rendah), nyeri saat palpasi vestibula (vulvodynia, vaginismus). Uji Q-tip (vulvodynia). Tes tonus otot dasar panggul.',p:'Hormonal: TSH, testosteron total/bebas, LH, FSH, prolaktin, estradiol. GDS. DL. Sexual Function Questionnaire (FSFI wanita, IIEF pria). USG pelvis (patologi struktural). Duplex Doppler (disfungsi ereksi vaskuler).'},
'tic':{f:'TTV: normal. Observasi: tic motorik (kedipan, gerak kepala, bahu) dan/atau vokal (berdehem, mengendus) — catat frekuensi, distribusi, bisa ditahan sementara. Pemeriksaan neurologis: NORMAL. Tidak ada koreiformis atau distonoid.',p:'Klinis (observasi 12 bulan). Yale Global Tic Severity Scale (YGTSS). EEG (jika ada kejang). ADHD rating scale (komorbid sering). Tes streptokokus (PANDAS).'},
'somatisasi':{f:'TTV: normal. Pemeriksaan fisik menyeluruh: NORMAL (tidak ada temuan organik yang menjelaskan keluhan). Status mental: cemas berlebih tentang gejala, afek sesuai.',p:'Pemeriksaan terbatas sesuai keluhan (tidak berlebihan). Lab dasar: DL, TSH, GDS, urinalisis, elektrolit. PHQ-15 (somatic symptom scale). Tidak ada pemeriksaan spesifik.'},
'skizoafektif':{f:'TTV: normal. Status mental: mood depresi/manik + gejala psikotik (halusinasi, waham). Pemeriksaan fisik umum untuk menyingkirkan organik.',p:'Klinis. PANSS. MADRS atau YMRS. Lab: DL, fungsi hati, TSH, toksikologi urin/darah. EEG. CT/MRI otak (jika pertama kali). EKG (sebelum antipsikotik).'},
'psikotik_akut':{f:'TTV: bisa takikardia (agitasi). Status mental: halusinasi (+), waham (+), perilaku kacau, agitasi. Pemeriksaan fisik menyeluruh: menyingkirkan organik (demam, tanda neurologis).',p:'Lab: DL, fungsi ginjal/hati, elektrolit, glukosa. Toksikologi urin (NAPZA). TSH. CT/MRI otak. EEG. LP (jika curiga ensefalitis). Kultur darah jika demam.'},
'campuran_ansietas':{f:'TTV: normal atau sedikit takikardia. Status mental: campuran cemas dan depresi ringan-sedang. Fisik umum: tidak ada kelainan organik.',p:'PHQ-9 (depresi). GAD-7 (ansietas). TSH. Lab dasar: DL, GDS, elektrolit.'},
'depresi_ringan':{f:'TTV: normal. Status mental: mood depresif, gerakan sedikit melambat, kontak mata baik. Fisik umum: singkirkan organik (hipotiroid, anemia).',p:'PHQ-9: skor 5-9 (ringan). TSH (hipotiroid). DL (anemia). GDS. Lab dasar.'},
'imunisasi':{f:'TTV: suhu, BB, TB (pemantauan tumbuh kembang = KMS). Status gizi. Inspeksi lokasi injeksi sebelumnya (BCG: papul/ulkus di lengan kanan; DPT: indurasi lokal). Pemeriksaan umum: sehat untuk divaksin (tidak demam >37.5°C, tidak infeksi akut berat).',p:'Tidak ada pemeriksaan penunjang rutin pra-imunisasi. Imunoglobulin G (jika status imunisasi tidak jelas). Lab sesuai KIPI yang terjadi.'},
'limfadenopati_tb':{f:'TTV: demam subfebris. Inspeksi dan palpasi KGB: lokasi (servikal posterior tersering), ukuran, konsistensi (keras/kenyal), nyeri tekan (tidak nyeri — beda infeksi bakterial akut), mobilitas, tanda radang. Cari TB paru (auskultasi). Ukuran hepar/limpa.',p:'Mantoux/IGRA: positif. Foto toraks: TB paru bersamaan? Lab: DL (leukositosis ringan/limfositosis), LED tinggi, CRP. USG KGB: khas limfadenitis TB (nekrosis sentral). FNA (Fine Needle Aspiration): BTA (+), sel epiteloid, nekrosis kaseosa. Biopsi KGB + PA + kultur: definitif.'}}

const NEURO_TMPL = {ku:'Kesadaran: Compos Mentis / GCS E_V_M_. Tampak sakit ringan/sedang/berat. Gizi: baik/kurang.',tv:'TD: ___/___mmHg | Nadi: ___x/mnt | RR: ___x/mnt | Suhu: ___°C | SpO2: ___%',nc:{n1:'N.I (Olfaktorius): Penghidu kanan/kiri — normosmia / anosmia / hiposmia',n2:'N.II (Optikus): Visus OD/OS, Lapang pandang (konfrontasi), Funduskopi: papil edema/atropi/normal',n3:'N.III/IV/VI (Okulomotor/Troklear/Abdusen): Ptosis (+/-), Posisi bola mata: isoforia/deviasi, Gerak bola mata: normal/terbatas (arah?), Pupil: isokor/anisokor ___mm/__mm, Refleks cahaya langsung/tidak langsung (+/-)',n5:'N.V (Trigeminus): Sensasi wajah (V1-ophthalmic/V2-maxillary/V3-mandibular): normal/menurun, Refleks kornea (+/-), Kekuatan otot mastikasi: normal/lemah',n7:'N.VII (Fasialis): Kerutan dahi simetris/asimetris, Menutup mata kuat/lemah, Sudut mulut simetris/asimetris, Menggembungkan pipi: simetris/asimetris — UMN (dahi sparing) vs LMN (dahi terlibat)',n8:'N.VIII (Vestibuloakustik): Pendengaran: normal/menurun (Rinne/Weber/Schwabach), Keseimbangan: nistagmus (+/-), Romberg (+/-)',n9:'N.IX/X (Glossofaringeus/Vagus): Palatum molle: simetris/asimetris, Refleks muntah (+/-), Disfagia (+/-), Suara: normal/serak/nasal',n11:'N.XI (Aksesorius): SCM dan trapezius: kekuatan normal/lemah, atropi (+/-)',n12:'N.XII (Hipoglosus): Lidah: deviasi ke kanan/kiri/normal, fasikulasi (+/-), atropi (+/-)' },mo:{ins:'Inspeksi: atropi (+/-), hipertrofi (+/-), fasikulasi (+/-), tremor (+/-)',ton:'Tonus otot: normotonus / hipotonus / hipertonus (spastik/rigiditas)',kek:'Kekuatan (0-5):<br>  ESD: _/_ (proksimal/distal) | ESS: _/_ <br>  EID: _/_ (proksimal/distal) | EIS: _/_',kor:'Koordinasi: Tes jari-hidung: dismetri (+/-), Tes tumit-lutut, Disdiadokokinesia (+/-)' },se:{rab:'Sensasi raba ringan (kapas): normal/menurun/hilang — tentukan batas level',nye:'Sensasi nyeri (jarum): normal/menurun/hilang',suh:'Sensasi suhu: normal/menurun/hilang',vib:'Sensasi vibrasi (garpu tala 128Hz): normal/menurun/hilang',pos:'Sensasi posisi (propiosepsi): normal/terganggu' },re:{fis:'Refleks Fisiologis:<br>  Biceps (C5-C6): +N/↑/↓ kanan-kiri<br>  Triceps (C7-C8): +N/↑/↓ kanan-kiri<br>  Brachioradialis (C5-C6): +N/↑/↓ kanan-kiri<br>  Patela (L2-L4): +N/↑/↓ kanan-kiri<br>  Achilles (S1-S2): +N/↑/↓ kanan-kiri',pat:'Refleks Patologis:<br>  Babinski: (+/-) kanan/kiri<br>  Chaddock: (+/-)<br>  Oppenheim: (+/-)<br>  Gordon: (+/-)<br>  Schaeffer: (+/-)<br>  Hoffman-Tromner: (+/-) (ekstremitas atas)<br>  Klonus: (+/-) kanan/kiri' },men:'Tanda Rangsang Meningeal:<br>  Kaku kuduk: (+/-)<br>  Kernig: (+/-) kanan/kiri<br>  Brudzinski I (leher): (+/-)<br>  Brudzinski II (kontralateral): (+/-)',luh:'Fungsi Luhur: Orientasi (tempat/waktu/orang), Memori (jangka pendek/panjang), Bahasa (lancar/afasia), Kalkulasi, Abstraksi, MMSE: ___/30'}

const PSI_TMPL = {'keadaan_umum':'Keadaan Umum: Penampilan [rapi/tidak terawat/sesuai usia], perawatan diri [baik/kurang], kontak mata [ada/tidak ada/kurang], sikap [kooperatif/tidak kooperatif/pasif/waspada berlebih]','kontak':'Kontak: Ada/Tidak ada. Wajar/Tidak wajar. Verbal: [lancar/terbatas/tidak ada]. Non-verbal: [ekspresi sesuai/datar/tidak sesuai konteks]','kesadaran':'Kesadaran: Compos Mentis / Berkabut / Bingung / Somnolen<br>Orientasi: Tempat [baik/terganggu] | Waktu [baik/terganggu] | Orang [baik/terganggu]','mood_afek':'Mood (subjektif): [eutimia/disforik/depresi/iritabel/euforik/ansietas/labil]<br>Afek (objektif): [serasi/tidak serasi/datar/tumpul/labil/terbatas]<br>Keserasian mood-afek: serasi/tidak serasi','proses_pikir':'Bentuk pikir: [realistis/tidak realistis/autistik/dereistik]<br>Arus pikir: [koheren/inkoheren/flight of ideas/sirkumstansial/tangensial/logorhea/asosiasi longgar/mutisme]<br>Isi pikir: [waham (-) / waham (+): waham kejar/kebesaran/rujukan/curiga/nihilistik/somatic/erotomanik/sisip pikir/siar pikir/kontrol pikir]','persepsi':'Halusinasi: (-) / (+)<br>  Auditorik: [suara memerintah/mengomentari/percakapan]<br>  Visual: [tampak bayangan/figur]<br>  Taktil: [rasa diraba]<br>  Olfaktorius/Gustatorius: [bau/rasa tidak nyata]<br>Ilusi: (-) / (+)<br>Depersonalisasi/Derealisasi: (-) / (+)','kemauan':'Kemauan/Dorongan: [meningkat/menurun/normoaktif]<br>Aktivitas sehari-hari: [mandiri/perlu bantuan/tergantung penuh]<br>Drive/motivasi: [baik/menurun]','psikomotor':'Psikomotor: [normoaktif/hipoaktif/hiperaktif/agitasi/stupor/gaduh gelisah]<br>Gerakan abnormal: [tidak ada / ada: tardive dyskinesia/tremor/distonik/katatonik]<br>Bicara: [spontan/lambat/cepat/volume pelan/keras/afasia/mutisme]','tilikan':'Tilikan (Insight): Derajat __ (1-6)<br>  1=Penyangkalan penuh<br>  2=Sedikit sadar, tapi langsung menyangkal<br>  3=Sadar tapi menyalahkan faktor luar<br>  4=Sadar sakit akibat faktor dalam diri tapi tidak paham<br>  5=Tilikan intelektual (paham tapi tak ubah perilaku)<br>  6=Tilikan sejati (paham penuh dan berubah)','taraf_dapat_dipercaya':'Taraf Dapat Dipercaya: Dapat dipercaya / Kurang dapat dipercaya / Tidak dapat dipercaya'}

const PSI_SPES = {'ptsd':{'keadaan_umum':'Penampilan cukup terawat, postur tegang, waspada berlebih (hypervigilant), mudah terkejut saat ada suara/gerakan mendadak, kontak mata kurang dan menghindari, mungkin terlihat pucat/berkeringat','kontak':'Ada, verbal terbatas terutama saat membahas topik trauma. Non-verbal: ekspresi takut/cemas/marah saat topik terkait trauma','kesadaran':'Compos mentis. Orientasi baik. Bisa ada dissociasi/flashback saat recall trauma','mood_afek':'Mood: ansietas, ketakutan, kadang marah/iritabel, atau mati rasa emosional (emotional numbing)<br>Afek: terbatas, atau bereaksi berlebih (hiperreaktif) terhadap stimulus tertentu<br>Keserasian: kurang serasi (afek tumpul tapi bisa tiba-tiba breakdown)','proses_pikir':'Bentuk pikir: realistis<br>Arus pikir: koheren, mungkin ada preokupasi pada trauma<br>Isi pikir: preokupasi trauma (+), pikiran intrusif (+), rasa bersalah (+), pikiran negatif tentang diri/dunia (+). Waham: tidak ada (kecuali berat)','persepsi':'Flashback (re-experiencing): seperti kejadian nyata kembali terjadi (+)<br>Halusinasi: umumnya tidak ada kecuali flashback parah terasa seperti halusinasi<br>Hipervigilans: waspada berlebih (+)','kemauan':'Menurun: menarik diri dari aktivitas yang dulu disukai (anhedonia), avoidance perilaku, sulit keluar rumah/bergaul','psikomotor':'Bisa hiperaktif (gelisah, waspada) atau hipoaktif (menarik diri). Mudah terkejut (startle response). Insomnia, mimpi buruk. Bicara: normal, tapi bisa terhenti saat membahas trauma','tilikan':'Bervariasi: banyak yang menyadari ada masalah tapi tidak mau/tidak bisa mencari bantuan. Umumnya tilikan 3-4'},
'baby_blues':{'keadaan_umum':'Ibu postpartum (hari 2-3 atau dalam 4 minggu), tampak kelelahan, air mata gampang keluar, penampilan cukup terawat namun lesu','kontak':'Ada, umumnya kooperatif. Mungkin tidak mau bicara tentang perasaan negatifnya karena malu/takut dihakimi','kesadaran':'Compos mentis. Orientasi baik. Tidak ada disorientasi','mood_afek':'Mood: labil (gampang menangis tiba-tiba, kadang tertawa, kadang sedih dalam hitungan menit). Baby blues: eutimiadan distress campuran<br>Depresi PP: mood depresi, anhedonia, rasa bersalah tidak mampu merawat bayi<br>Afek: labil/terbatas<br>Keserasian: kurang serasi','proses_pikir':'Bentuk pikir: realistis<br>Arus pikir: koheren, mungkin sirkumstansial<br>Isi pikir: kekhawatiran berlebih tentang bayi (+), rasa tidak mampu menjadi ibu yang baik (+), pikiran menyakiti bayi (psikosis PP — DARURAT!)','persepsi':'Halusinasi: TIDAK ADA (baby blues/depresi PP). Jika ada halusinasi/waham: psikosis PP — DARURAT!<br>Persepsi umum: baik','kemauan':'Baby blues: masih bisa merawat bayi meski kelelahan<br>Depresi PP: kemauan merawat bayi menurun, sulit menyusui, tidak ada ikatan dengan bayi','psikomotor':'Baby blues: normoaktif, kelelahan<br>Depresi PP: hipoaktif, gerakan lambat, berbicara pelan. Insomnia meskipun bayi tidur','tilikan':'Umumnya tilikan 4-5. Sadar ada masalah emosional tapi sering malu/menganggap &quot;normal&quot; dan tidak mencari bantuan'},
'gad':{'keadaan_umum':'Tampak gelisah, tegang, tidak bisa duduk diam, sering mengubah posisi, mungkin keringatan/pucat. Penampilan cukup terawat','kontak':'Ada, kooperatif, mungkin banyak bertanya dan meminta reassurance berulang','kesadaran':'Compos mentis. Orientasi baik','mood_afek':'Mood: ansietas/cemas kronik, iritabel<br>Afek: cemas, tegang, terbatas<br>Keserasian: serasi (ekspresi sesuai kekhawatiran yang dirasakan)','proses_pikir':'Bentuk pikir: realistis<br>Arus pikir: sirkumstansial (banyak kekhawatiran), kadang perseverasi pada topik yang mengkhawatirkan<br>Isi pikir: kekhawatiran berlebih multipel (+), pikiran &quot;bagaimana jika...&quot; (+), sulit mengontrol khawatir (+). Tidak ada waham','persepsi':'Halusinasi: tidak ada<br>Hipersensitivitas terhadap ancaman/bahaya (+)<br>Persepsi fisik: sering melaporkan gejala fisik (jantung berdebar, sesak, pusing) yang tidak ada kelainan organik','kemauan':'Menurun untuk aktivitas karena cemas tentang konsekuensinya, prokrastinasi, perfeksionisme','psikomotor':'Hiperaktif (gelisah, tidak bisa diam, mondar-mandir). Bicara: cepat, banyak. Tegangan otot (+). Tremor ringan (+/-)','tilikan':'Umumnya tilikan 4-5. Menyadari kecemasannya berlebihan tapi tidak bisa mengendalikan'},
'insomnia':{'keadaan_umum':'Tampak kelelahan, mata sayu, kantung mata (+), konsentrasi menurun. Mungkin iritabel atau hipersomnolensi di siang hari','kontak':'Ada, kooperatif. Mungkin mudah frustrasi karena kelelahan kronik','kesadaran':'Compos mentis. Orientasi baik. Fungsi kognitif bisa sedikit terganggu karena kurang tidur','mood_afek':'Mood: disforik, iritabel, cemas tentang tidur (sleep anxiety/anxious arousal)<br>Afek: terbatas, mudah tersinggung<br>Keserasian: serasi','proses_pikir':'Bentuk pikir: realistis<br>Arus pikir: koheren, mungkin preokupasi pada masalah tidur (rumination)<br>Isi pikir: kekhawatiran berlebih tentang tidak bisa tidur dan konsekuensinya (+). Tidak ada waham','persepsi':'Halusinasi: tidak ada (kecuali deprivasi tidur ekstrem)<br>Persepsi: baik','kemauan':'Motivasi menurun karena kelelahan kronik. Menghindari aktivitas sosial karena lelah','psikomotor':'Hipoaktif siang hari karena lelah, tapi hiperaktif secara kognitif saat malam (racing mind). Konsentrasi menurun','tilikan':'Tilikan 5-6. Umumnya sangat sadar masalahnya dan aktif mencari bantuan'},
'bipolar':{'keadaan_umum':'Episode depresi: tampak lesu, pucat, tidak terawat, menarik diri<br>Episode manik: tampak bersemangat berlebih, berpakaian mencolok, banyak bergerak','kontak':'Episode depresi: kontak ada tapi terbatas, bicara lambat<br>Episode manik: kontak ada, mungkin terlalu bersahabat berlebih (over-familiar)','kesadaran':'Compos mentis. Orientasi baik','mood_afek':'Episode depresi:<br>  Mood: depresi, anhedonia, putus asa<br>  Afek: tumpul/datar atau disforik<br>Episode manik:<br>  Mood: euforik/iritabel/ekspansif<br>  Afek: labil, tidak serasi (terlalu gembira tidak sesuai konteks)','proses_pikir':'Episode depresi: arus lambat (retardasi psikomotor), isi: pikiran negatif, pikiran bunuh diri (+/-)<br>Episode manik: flight of ideas, logorhea, isi: grandiositas, perencanaan besar yang tidak realistis, waham kebesaran (+/-)','persepsi':'Episode depresi: halusinasi umumnya tidak ada (kecuali psikotik)<br>Episode manik: halusinasi auditorik memerintah/mendukung waham kebesaran (+/-)','kemauan':'Episode depresi: kemauan sangat menurun, anergi, tidak mau apa-apa<br>Episode manik: kemauan meningkat berlebih (terlibat banyak proyek, tidak perlu tidur, hypersexuality, boros)','psikomotor':'Episode depresi: hipoaktif, gerakan dan bicara lambat, insomnia atau hipersomnia<br>Episode manik: hiperaktif, agitasi, bicara cepat, tidak perlu tidur, distractible','tilikan':'Episode depresi: bervariasi tilikan 2-5<br>Episode manik: sering tilikan 1-2 (tidak merasa sakit, justru merasa hebat)'},
'disfungsi_seksual':{'keadaan_umum':'Penampilan terawat. Mungkin tampak malu/sungkan membicarakan masalah seksual. Kontak bisa terbatas awalnya','kontak':'Ada, mungkin terbatas karena topik tabu. Perlu membangun rapport dulu sebelum eksplorasi','kesadaran':'Compos mentis. Orientasi baik','mood_afek':'Mood: bisa eutimiik, atau disforik (jika ada depresi bersamaan), atau ansietas saat topik dibahas<br>Afek: mungkin terbatas/malu saat diskusi seksual','proses_pikir':'Bentuk pikir: realistis<br>Isi pikir: rasa malu tentang fungsi seksual, rasa tidak memadai, kekhawatiran tentang hubungan','persepsi':'Halusinasi: tidak ada<br>Persepsi tubuh: mungkin ada body image yang negatif','kemauan':'Kemauan seksual menurun (hiposeksual) atau menghindari hubungan intim (vaginismus)','psikomotor':'Normoaktif. Vaginismus: spasme otot involunter saat akan penetrasi (+)','tilikan':'Tilikan 4-5. Sadar ada masalah tapi sering tidak tahu harus bagaimana'},
'tic':{'keadaan_umum':'Anak usia sekolah (tersering). Tampak cemas jika diberi tahu untuk menahan tic. Penampilan sesuai usia','kontak':'Ada, kooperatif (anak)','kesadaran':'Compos mentis. Orientasi baik','mood_afek':'Mood: eutimia atau ansietas (karena tekanan sosial dari tic). Komorbid ADHD sering ada<br>Afek: serasi','proses_pikir':'Bentuk pikir: realistis<br>Isi pikir: preokupasi tentang tic dan reaksi orang lain (+), mungkin ada premonitory urge (sensasi sebelum tic)','persepsi':'Halusinasi: tidak ada<br>Persepsi: baik. Premonitory urge (sensasi tidak nyaman sebelum tic yang hilang setelah tic) (+)','kemauan':'Normal. Bisa menahan tic sementara (tapi makin terasa tidak nyaman)','psikomotor':'Tic motorik: gerakan involunter cepat berulang tidak ritmis (kedip, gerak kepala, bahu, wajah)<br>Tic vokal: suara berulang (berdehem, mengendus, kata-kata)<br>Normoaktif di luar periode tic','tilikan':'Tergantung usia. Anak kecil: tidak sadar (tilikan 1). Anak lebih besar: sadar tapi tidak bisa kontrol (tilikan 3-4)'},
'somatisasi':{'keadaan_umum':'Penampilan terawat. Mungkin membawa berkas/catatan panjang tentang keluhan fisiknya. Tampak distress tentang gejala fisik','kontak':'Ada, kooperatif. Mungkin defensif jika dikatakan gejala bersifat psikologis','kesadaran':'Compos mentis. Orientasi baik','mood_afek':'Mood: cemas berlebih tentang kondisi fisik, mungkin disforik<br>Afek: terbatas, preokupasi pada gejala fisik<br>Keserasian: serasi dengan kecemasannya','proses_pikir':'Bentuk pikir: realistis<br>Isi pikir: preokupasi pada gejala fisik multipel, keyakinan sakit serius meski sudah diperiksa normal, doctor shopping (+). Tidak ada waham (berbeda hipokondriasis berat)','persepsi':'Halusinasi: tidak ada<br>Persepsi tubuh: hipersensitif terhadap sensasi tubuh, somatosensory amplification (+)','kemauan':'Menurun untuk aktivitas karena gejala fisik. Motivasi mencari pertolongan medis justru tinggi','psikomotor':'Normoaktif. Mungkin gelisah saat membicarakan gejala. Bicara: panjang, deskriptif tentang gejala','tilikan':'Tilikan 1-3. Sulit menerima komponen psikologis dari gejalanya'},
'skizoafektif':{'keadaan_umum':'Bervariasi. Mungkin tidak terawat. Tampak aneh, eksentrik, atau agitasi. Atau tampak depresi berat dengan tatapan kosong','kontak':'Ada tapi tidak wajar. Kontak mata tidak konsisten. Mungkin berbicara sendiri (halusinasi auditorik)','kesadaran':'Compos mentis (umumnya). Orientasi mungkin terganggu pada episode berat','mood_afek':'Tipe depresi: Mood depresi + gejala psikotik bersamaan<br>Afek: tumpul/datar atau tidak serasi (tertawa saat seharusnya sedih)','proses_pikir':'Bentuk pikir: tidak realistis/autistik<br>Arus pikir: inkoheren, asosiasi longgar, tangensial, neologisme<br>Isi pikir: waham (+) — kejar, rujukan, pengaruh, siar pikir, sisip pikir + isi pikir depresi (tidak berharga, putus asa)','persepsi':'Halusinasi auditorik (+): suara memerintah, mengomentari, percakapan beberapa suara<br>Halusinasi visual (+/-)<br>Ilusi (+/-)','kemauan':'Menurun (komponen negatif + depresi): perawatan diri buruk, avolisi, anergi, isolasi sosial','psikomotor':'Hipoaktif (depresi+negatif). Mungkin stereotipi, posturing, atau katatonik','tilikan':'Tilikan 1-2. Tidak menyadari sakitnya (anosognosia)'},
'psikotik_akut':{'keadaan_umum':'Tampak bingung, agitasi, tidak terawat. Ekspresi ketakutan atau curiga. Gerakan tidak menentu','kontak':'Tidak wajar. Kontak mata curiga/ketakutan. Mungkin tidak mau bicara (mutisme) atau bicara kacau','kesadaran':'Compos mentis sampai berkabut. Disorientasi mungkin ada','mood_afek':'Mood: ketakutan, bingung, iritabel, atau euforik<br>Afek: tidak serasi, labil<br>Keserasian: tidak serasi','proses_pikir':'Bentuk pikir: tidak realistis<br>Arus pikir: inkoheren, asosiasi longgar, word salad<br>Isi pikir: waham akut (+) — kejar, rujukan, grandiositas','persepsi':'Halusinasi auditorik (+): memerintah, mengomentari<br>Halusinasi visual (+/-)<br>Pseudohalusinasi (+/-)','kemauan':'Kacau. Tidak bisa merawat diri. Perilaku tidak terarah/agitasi','psikomotor':'Agitasi (+), gaduh gelisah, bicara kacau/cepat, berteriak','tilikan':'Tilikan 1. Tidak menyadari sakitnya sama sekali'},
'campuran_ansietas':{'keadaan_umum':'Penampilan terawat. Tampak cemas dan sedikit murung. Tidak ada tanda psikosis','kontak':'Ada, kooperatif','kesadaran':'Compos mentis. Orientasi baik','mood_afek':'Mood: campuran ansietas dan depresi ringan<br>Afek: terbatas, sedikit cemas<br>Keserasian: serasi','proses_pikir':'Bentuk pikir: realistis<br>Arus pikir: koheren, mungkin ada preokupasi<br>Isi pikir: kekhawatiran + pikiran negatif tentang diri. Tidak ada waham. Ide bunuh diri: perlu dieksplorasi','persepsi':'Halusinasi: tidak ada. Persepsi baik','kemauan':'Sedikit menurun. Masih bisa beraktivitas namun terganggu','psikomotor':'Normoaktif atau sedikit gelisah. Bicara normal','tilikan':'Tilikan 4-5'},
'depresi_ringan':{'keadaan_umum':'Penampilan cukup terawat namun lesu. Ekspresi sedih, bahu tertunduk, kontak mata sedikit berkurang','kontak':'Ada, kooperatif, namun mungkin lambat merespons','kesadaran':'Compos mentis. Orientasi baik','mood_afek':'Mood: depresi/sedih, anhedonia<br>Afek: tumpul/terbatas, atau disforik<br>Keserasian: serasi','proses_pikir':'Bentuk pikir: realistis<br>Arus pikir: koheren, mungkin lambat (retardasi)<br>Isi pikir: pikiran negatif tentang diri (rasa tidak berharga), masa depan (putus asa ringan), masa lalu (rasa bersalah). Ide bunuh diri: EKSPLORASI AKTIF','persepsi':'Halusinasi: tidak ada. Persepsi baik','kemauan':'Sedikit menurun. Aktivitas harian masih bisa dilakukan tapi terasa berat. Anhedonia (+)','psikomotor':'Sedikit hipoaktif. Bicara mungkin lambat, volume pelan. Insomnia atau hipersomnia','tilikan':'Tilikan 4-5. Sadar ada masalah, mau mencari bantuan'}}

const EXTRAS_DATA={'bppv':{pro:'MANUVER EPLEY (Kanal Posterior):\n1. Duduk tegak di tepi tempat tidur, kepala diputar 45° ke sisi yang sakit\n2. Baringkan cepat ke posisi Dix-Hallpike (kepala menggantung 30° di bawah meja)\n3. Tunggu nistagmus berhenti (30-60 detik)\n4. Putar kepala 90° ke sisi sehat (tetap berbaring)\n5. Tunggu 30 detik\n6. Putar kepala + tubuh 90° ke bawah (wajah menghadap lantai)\n7. Dudukkan pasien perlahan\n8. Ulangi 3x per sesi',ruj:'Rujuk SpS/SpTHT jika: tidak respons setelah 3 sesi manuver Epley, curiga penyebab sentral (stroke serebelar), ada tuli/tinitus (Meniere?), pasca trauma kepala',res:'R/ Betahistin tab 16mg No. XXX\n   S 3 dd tab 1 (sesudah makan)\n\nR/ Domperidon tab 10mg No. X\n   S 3 dd tab 1 (jika mual, prn)\n\nProo: [Nama Pasien]',edu:'🔵 Edukasi Penyakit: BPPV terjadi karena kristal kalsium (otolit) berpindah di saluran telinga dalam. Bukan stroke, tidak berbahaya, dan bisa sembuh dengan manuver.\n\n🟢 Edukasi Support: Minta keluarga menemani saat latihan manuver di rumah. Siapkan kursi/tempat tidur yang aman.\n\n☪️ Edukasi Islami: "Setiap penyakit ada obatnya, maka berobatlah" (HR. Muslim). Pusing saat shalat boleh duduk atau berbaring — shalat tidak gugur karena penyakit.\n\n🔄 Kontrol: 1 minggu untuk evaluasi respons manuver. Segera ke IGD jika muncul kelemahan anggota gerak atau bicara pelo.',alg:'ONSET PUSING → Tanyakan: berputar atau melayang?\n↓ BERPUTAR\nAdakah nistagmus posisional? → Dix-Hallpike TEST\n↓ (+) < 1 menit, geotropik\nDiagnosis BPPV Kanal Posterior\n↓\nInformconsent manuver Epley\n↓\nLakukan Manuver Epley 3x\n↓\nEvaluasi langsung: nistagmus berkurang?\n↓ Ya → Berhasil → Edukasi, Betahistin\n↓ Tidak → Ulangi atau rujuk SpTHT'},
'migrain':{pro:'PEMERIKSAAN KEPALA NEUROLOGI:\n1. Palpasi otot perikranial (temporal, suboksipital) → nyeri tekan?\n2. Auskultasi kepala (bruit arteri)\n3. Pemeriksaan funduskopi (papil edema?)\n4. Tes Romberg, tandem gait\n5. Refleks cahaya langsung/tidak langsung\n6. Pemeriksaan saraf kranial lengkap N.I-XII',ruj:'Rujuk SpS jika: thunder-clap headache (mendadak & paling parah seumur hidup), defisit neurologis fokal persisten, demam+kaku kuduk, papil edema, usia >50 tahun onset baru, tidak respons terapi 3 bulan',res:'R/ Sumatriptan tab 50mg No. VI\n   S prn tab 1 saat awal serangan, ulangi 2 jam kemudian jika perlu (max 2 tab/hari)\n\nR/ Metoklopramid tab 10mg No. X\n   S prn tab 1 (diminum 15 mnt sebelum Sumatriptan, jika mual)\n\nJika profilaksis (≥4x/bulan):\nR/ Propranolol tab 40mg No. XX\n   S 2 dd tab 1 (pagi dan malam)\n\nPro: [Nama Pasien]',edu:'🔵 Edukasi Penyakit: Migrain adalah penyakit kepala berdenyut yang episodik dan bisa dikendalikan. Bukan tumor dan bukan stroke.\n\n🟢 Edukasi Support: Minta keluarga memahami bahwa saat serangan, pasien butuh ruangan gelap dan tenang — bukan dibiarkan sendirian.\n\n☪️ Edukasi Islami: Nabi ﷺ pernah mengalami sakit kepala dan bersabda: "Sakit yang menimpa seorang muslim adalah penghapus dosa." Bersabar dalam berobat adalah ibadah.\n\n🔄 Kontrol: 1 bulan. Minta pasien membuat diary migrain (frekuensi, pemicu, durasi, obat yang dipakai).',alg:'NYERI KEPALA BERDENYUT → Apakah ada RED FLAG?\n↓ Tidak ada red flag\nPemenuhan kriteria ICHD-3 Migrain\n↓\nSerangan aktif?\n↓ Ya: Triptan + Antiemetik → Istirahat di tempat gelap\n↓ Tidak: Edukasi identifikasi pemicu\n↓\nFrekuensi ≥4x/bulan? → Mulai profilaksis (Propranolol/Topiramat)\n↓\nKontrol 1 bulan → Evaluasi frekuensi & HIT-6 score'},
'stroke':{pro:'PEMERIKSAAN STROKE AKUT (FAST+):\n1. Face: minta pasien senyum → asimetri?\n2. Arms: angkat kedua lengan → salah satu jatuh?\n3. Speech: minta ucapkan kalimat → pelo/tidak?\n4. Time: catat waktu onset TEPAT\n5. NIHSS score (0-42)\n6. Cek GDS SEGERA (singkirkan hipoglikemia)\n7. GCS + pupil + refleks Babinski\n8. ECG: AF?\n9. Pasang IV line, ambil darah\n10. CT scan non-kontras SEGERA',ruj:'SEMUA stroke harus DIRUJUK ke RS dengan fasilitas stroke unit + CT scan SEGERA. Hubungi IGD, jangan tunggu!',res:'Fase akut (di IGD/RS):\nAspirin 325mg stat (jika bukan hemoragik)\nStatin: Atorvastatin 40mg malam\nAntihipertensi sesuai TD\n\nPulang (stroke iskemik):\nR/ Aspirin tab 80mg No. XXX\n   S 1 dd tab 1 (setelah makan pagi)\n\nR/ Atorvastatin tab 40mg No. XXX\n   S 1 dd tab 1 (malam)\n\nPro: [Nama Pasien]',edu:'🔵 Edukasi Penyakit: Stroke adalah kedaruratan otak. Setiap menit tanpa penanganan = 1,9 juta sel otak mati. "Time is Brain!"\n\n🟢 Edukasi Support: Keluarga harus tahu tanda FAST dan nomor darurat. Jangan berikan makan/minum per oral sebelum evaluasi disfagia!\n\n☪️ Edukasi Islami: "Sesungguhnya Allah tidak menurunkan penyakit kecuali Ia turunkan pula obatnya" (HR. Bukhari). Rehabilitasi adalah ikhtiar, hasilnya di tangan Allah.\n\n🔄 Kontrol: Ketat — 1 minggu pasca pulang, lalu tiap bulan. Pantau faktor risiko: TD, gula, kolesterol.',alg:'DEFISIT NEUROLOGIS MENDADAK\n↓\nAmankan airway, pasang O2, IV line\nCek GDS segera (hipoglikemia?)\n↓\nAktifkan CODE STROKE → hubungi SpS jaga\n↓\nCT scan non-kontras <25 menit dari tiba\n↓\nHemoragik? → Konsul SpBedSaraf\nIskemik? → Cek kontraindikasi trombolisis\n↓\nOnset <4.5 jam + tidak ada kontraindikasi?\n↓ Ya → rtPA 0.9mg/kgBB IV (10% bolus, 90% infus 1 jam)\n↓ Tidak → Aspirin 325mg + statin\n↓\nRawat stroke unit, rehabilitasi dini'},
'meningoensefalitis':{pro:'PUNGSI LUMBAL (LP):\n1. Posisi: lateral dekubitus fetal (lutut ke dada) atau duduk membungkuk\n2. Lokasi: L3-L4 atau L4-L5 (garis Tuffier)\n3. Antisepsis lapangan operasi\n4. Anestesi lokal: Lidokain 1-2% SC\n5. Insersi jarum Quincke 18-22G tegak lurus\n6. Ambil LCS: tabung 1 (kultur), 2 (biokimia), 3 (sitologi), 4 (simpan)\n7. Ukur tekanan pembukaan normal 80-180 mmH2O\n8. Kompres + plester\n9. Berbaring terlentang 1-2 jam\nCATATAN: CT kepala DULU jika ada papil edema/fokal!',ruj:'DARURAT — semua pasien harus dirawat inap. Jika tidak ada fasilitas LP/ICU → stabilisasi dan RUJUK segera dengan terapi antibiotik sudah dimulai',res:'Di IGD (sebelum LP jika tidak memungkinkan):\nDeksametason 0.15mg/kgBB IV → 10 menit sebelum antibiotik\nSeftriakson 2g/12jam IV\nAmpisilin 2g/4jam IV (jika curiga Listeria: usia >50, imunokompromis)\n\nViral (ensefalitis HSV):\nR/ Asiklovir inj 500mg (10mg/kgBB/8jam) IV drip selama 14-21 hari',edu:'🔵 Edukasi Penyakit: Meningitis adalah infeksi selaput otak yang darurat. Pengobatan harus segera dimulai, setiap jam keterlambatan memperburuk prognosis.\n\n🟢 Edukasi Support: Keluarga perlu tahu tanda bahaya: kejang, tidak bisa dibangunkan, ruam bintik merah → langsung IGD!\n\n☪️ Edukasi Islami: Sakit berat adalah ujian yang Allah berikan kepada hambanya yang dicintai. Bersabarlah dan teruslah berdoa kesembuhan.\n\n🔄 Kontrol: Rawat inap, evaluasi LCS ulang jika tidak membaik 48 jam. Setelah pulang: neurologi follow-up ketat.',alg:'DEMAM + NYERI KEPALA + KAKU KUDUK\n↓\nABC, O2, IV line, GCS\nCek GDS, ambil darah kultur\n↓\nAda papil edema / fokal / GCS turun?\n↓ Ya → CT kepala dulu\n↓ Tidak → LP segera\n↓\nBerikan DEKSAMETASON IV → SEGERA berikan ANTIBIOTIK\n(jangan tunda antibiotik >30 menit menunggu LP)\n↓\nRawat ICU/HCU, monitor ketat\n↓\nHasil LP/kultur → sesuaikan antibiotik'},
'ptsd':{pro:'WAWANCARA TRAUMA:\n1. Bangun rapport dahulu (jangan langsung tanya trauma)\n2. Gunakan pertanyaan terbuka: "Bisa ceritakan apa yang sedang Anda rasakan?"\n3. Administrasi PCL-5 (20 item, cutoff ≥33)\n4. Jangan paksa pasien mengulang detail trauma\n5. Akhiri wawancara dengan grounding: "Anda aman sekarang, kami di sini"\n6. Dokumentasi: onset, durasi, dampak fungsional',ruj:'Rujuk SpKJ jika: ada ide bunuh diri/menyakiti diri/orang lain, tidak respons terapi 2 bulan, ada komorbid psikiatri berat (psikosis, bipolar), PTSD kompleks (trauma berulang masa kecil)',res:'R/ Sertralin tab 50mg No. XXX\n   S 1 dd tab 1 pagi (mulai 25mg/hari minggu pertama, naik 50mg)\n\nJika insomnia berat:\nR/ Prazosin tab 1mg No. X\n   S 1 dd tab 1 malam (mengurangi mimpi buruk)\n\nPro: [Nama Pasien]\n\n*Konseling/CBT jadwalkan bersamaan dengan farmakoterapi',edu:'🔵 Edukasi Penyakit: PTSD adalah respons normal otak terhadap situasi yang tidak normal. Ini bukan kelemahan atau "lebay" — ini adalah cedera psikologis yang bisa disembuhkan.\n\n🟢 Edukasi Support: Keluarga dilarang berkata "sudah lupakan saja" atau "jangan lebay". Yang dibutuhkan: dengarkan tanpa menghakimi, temani, jangan tinggalkan sendirian.\n\n☪️ Edukasi Islami: "Dan Kami pasti akan menguji kamu dengan sedikit ketakutan, kelaparan, kekurangan harta, jiwa dan buah-buahan. Dan sampaikanlah kabar gembira kepada orang-orang yang sabar" (QS. Al-Baqarah: 155). Trauma adalah ujian, Allah tidak membebani di luar kemampuan hamba-Nya.\n\n🔄 Kontrol: 2 minggu awal (pantau efek samping dan respons obat), lalu 1 bulan. Terapi minimal 6-12 bulan.',alg:'RIWAYAT TRAUMA + GEJALA >1 BULAN\n↓\nSkrining: PCL-5 ≥33 / CAPS-5\n↓\nSingkirkan organik (tiroid, kafein, zat)\n↓\nAssessment risiko: ide bunuh diri?\n↓ Ada → Safety plan + rujuk SpKJ segera\n↓ Tidak ada\n↓\nMulai SSRI (Sertralin 25→50mg) + Jadwalkan TF-CBT\n↓\nKontrol 2 minggu → evaluasi efek samping\n↓\nKontrol 4-6 minggu → evaluasi respons (PCL-5 ulang)\n↓\nTidak respons → Naik dosis / rujuk SpKJ'},
'baby_blues':{pro:'SCREENING EPDS:\n1. Minta ibu mengisi EPDS (10 item) sendiri\n2. Cutoff: ≥10 curiga, ≥13 kemungkinan depresi PP\n3. Pertanyaan No.10 (ide bunuh diri): jika skor >0 → SEGERA tindak lanjut\n4. Lakukan pada kunjungan nifas hari 3-7, 6 minggu, dan 3 bulan\n5. Jika depresi PP: periksa TSH (hipotiroid postpartum)',ruj:'Rujuk SpKJ jika: EPDS ≥13 + tidak membaik dalam 2 minggu, ada ide bunuh diri/menyakiti bayi, curiga psikosis postpartum (halusinasi/waham → DARURAT, rawat inap!)',res:'Baby blues: tidak perlu obat, cukup suportif\n\nDepresi Postpartum:\nR/ Sertralin tab 50mg No. XIV\n   S 1 dd tab 1 pagi (aman untuk ASI)\n   (mulai 25mg/hari, naik setelah 1 minggu)\n\nInsomnia berat:\nR/ Lorazepam tab 0.5mg No. V\n   S prn tab 1 malam (hati-hati: sedasi, ASI)\n\nPro: [Nama Pasien, Ibu Postpartum]',edu:'🔵 Edukasi Penyakit: Baby blues dialami 50-80% ibu baru — sangat normal. Hormon turun drastis setelah melahirkan menyebabkan mood tidak stabil. Berbeda dengan depresi postpartum yang lebih berat dan butuh pengobatan.\n\n🟢 Edukasi Support: Suami dan keluarga WAJIB bantu merawat bayi agar ibu bisa istirahat. Jangan tinggalkan ibu sendirian. Tidak ada yang namanya "kerepotan sendiri adalah kewajiban ibu".\n\n☪️ Edukasi Islami: Islam sangat memuliakan ibu. Rasulullah ﷺ bersabda: "Surga di bawah telapak kaki ibu." Merawat ibu yang sedang rentan adalah kewajiban keluarga. Ibu yang bersabar dan tetap berikhtiar mendapat pahala berlipat.\n\n🔄 Kontrol: 1-2 minggu untuk re-screening EPDS. Jika baby blues: pastikan pulih dalam 2 minggu. Jika depresi PP: kontrol tiap 2 minggu selama 2 bulan pertama.',alg:'IBU POSTPARTUM + KELUHAN EMOSIONAL\n↓\nBerikan EPDS → skor?\n↓\n<10: Baby blues → Suportif, edukasi, istirahat\n10-12: Waspadai → Kontrol 1 minggu, re-screening\n≥13: Depresi PP → Sertralin + konseling\n↓\nCek pertanyaan No.10 EPDS (bunuh diri)\n↓ Ada ide → Keamanan pasien: jangan tinggal sendiri\n          → Rujuk SpKJ SEGERA\n↓\nCek TSH (hipotiroid postpartum)\n↓\nFollow-up ketat tiap 1-2 minggu'},
'oma_supuratif':{pro:'OTOSKOPI:\n1. Tarik aurikula ke atas-belakang (dewasa) atau ke bawah-belakang (anak)\n2. Masukkan spekulum terbesar yang bisa masuk liang telinga\n3. Inspeksi: warna MT (normal: abu mutiara, putih keabu-abuan)\n4. Cone of light: jam 5 (telinga kanan), jam 7 (telinga kiri)\n5. Gerak MT: pneumatoskopi (MT bergerak = tidak ada efusi)\n6. Perforasi: lokasi, ukuran\n7. Sekret: warna, jumlah',ruj:'Rujuk SpTHT jika: tidak respons antibiotik 72 jam, komplikasi mastoiditis (nyeri+bengkak retroaurikuler), perforasi MT persisten >3 bulan, OMA rekuren ≥3x/6 bulan atau ≥4x/tahun',res:'R/ Amoksisilin tab 500mg No. XXI\n   S 3 dd tab 1 selama 7 hari\n\nJika alergi penisilin:\nR/ Azitromisin tab 500mg No. III\n   S 1 dd tab 1 selama 3 hari\n\nR/ Parasetamol tab 500mg No. X\n   S 3 dd tab 1 prn (nyeri/demam)\n\nPro: [Nama Pasien]',edu:'🔵 Edukasi Penyakit: Infeksi telinga tengah umumnya sembuh dengan antibiotik. Jangan mengorek telinga dengan cotton bud — berbahaya!\n\n🟢 Edukasi Support: Jaga telinga agar tidak kemasukan air saat mandi/berenang. Pada anak: hindari dot/botol susu sambil tiduran.\n\n☪️ Edukasi Islami: Indera pendengaran adalah nikmat Allah. Jagalah dengan tidak mengorek berlebihan dan segera berobat jika ada keluhan.\n\n🔄 Kontrol: 72 jam (evaluasi respons antibiotik). Jika membaik: lanjutkan antibiotik sampai selesai. 4 minggu kemudian: evaluasi MT sudah menutup?',alg:'NYERI TELINGA + DEMAM + RIWAYAT ISPA\n↓\nOtoskopi: MT merah/bulging?\n↓ Ya → OMA\n↓\nStadium apa?\nOkklusif → Dekongestan\nHiperemis → Antibiotik oral\nSupurasi → Antibiotik + analgetik\nPerforasi → Antibiotik + tetes telinga\nResolusi → Observasi\n↓\nTidak membaik 72 jam → Ganti antibiotik / rujuk SpTHT'},
'ppok':{pro:'SPIROMETRI:\n1. Pasien istirahat 15 menit, tidak merokok 4 jam sebelum\n2. Masukkan mouthpiece (gunakan klip hidung)\n3. Tarik napas dalam penuh → hembuskan SEKUAT dan SECEPAT mungkin selama ≥6 detik\n4. Ulangi minimal 3x, ambil yang terbaik\n5. Interpretasi: FEV1/FVC <0.70 post-bronkodilator = obstruksi\n6. GOLD 1-4 berdasarkan FEV1:\n   GOLD 1: ≥80%, GOLD 2: 50-79%, GOLD 3: 30-49%, GOLD 4: <30%\n\nNEBULISASI:\n1. Salbutamol 2.5mg + Ipratropium 0.5mg dalam NaCl 0.9% 3mL\n2. Aliran oksigen 6-8 L/menit\n3. Durasi 10-15 menit\n4. Evaluasi SpO2 dan RR sebelum dan sesudah',ruj:'Rujuk SpP jika: eksaserbasi berat (SpO2 <88%, RR >30, GCS turun), tidak respons nebulisasi 2x, GOLD 3-4, curiga komplikasi (pneumotoraks, gagal napas)',res:'Eksaserbasi ringan-sedang (rawat jalan):\nR/ Salbutamol MDI 100mcg/puff No. 1 fls\n   S prn 2 puff inhaler (saat sesak)\n\nR/ Prednison tab 30mg No. V\n   S 1 dd tab 1 pagi hari (5 hari)\n\nR/ Amoksisilin-Klavulanat tab 625mg No. XIV\n   S 2 dd tab 1 (jika sputum purulen)\n\nPro: [Nama Pasien]',edu:'🔵 Edukasi Penyakit: PPOK adalah kerusakan paru permanen akibat merokok. Tidak bisa disembuhkan, tapi bisa dikendalikan. Berhenti merokok adalah pengobatan terpenting!\n\n🟢 Edukasi Support: Keluarga bantu pasien berhenti merokok — tidak boleh merokok di dekat pasien. Latih pasien teknik pernapasan pursed-lip breathing.\n\n☪️ Edukasi Islami: Merokok adalah mudharat (merusak diri) yang dilarang Islam. Berhenti merokok adalah kewajiban agama, bukan sekadar pilihan medis. "Tidak boleh membuat kemudharatan pada diri sendiri dan orang lain" (HR. Ibnu Majah).\n\n🔄 Kontrol: 1 bulan. Evaluasi: frekuensi eksaserbasi, CAT score, spirometri tahunan.',alg:'PPOK EKSASERBASI\n↓\nNilai beratnya: RR, SpO2, GCS, warna sputum\n↓\nRingan (SpO2 >90%, RR <25): Rawat jalan\n→ Nebulisasi SABA+SAMA, Prednison oral, Antibiotik jika sputum purulen\n↓\nSedang-Berat (SpO2 <90%, RR >25): Rawat Inap\n→ O2 kontrol target SpO2 88-92%\n→ Nebulisasi sering\n→ Metilprednisolon IV 40mg/hari\n→ Antibiotik IV\n→ Pertimbangkan NIPPV (BiPAP)\n↓\nGagal NIPPV / Apnea → Intubasi + Ventilator'},
'asma':{pro:'TEKNIK INHALER MDI YANG BENAR:\n1. Kocok inhaler 5x\n2. Buka tutup, kepala sedikit mendongak\n3. Buang napas pelan\n4. Letakkan mouthpiece di bibir, tutup rapat\n5. Tekan canister SAAT mulai tarik napas perlahan dalam\n6. Tahan napas 10 detik\n7. Buang napas perlahan lewat hidung\n8. Tunggu 30-60 detik sebelum puff kedua\n9. Kumur jika memakai ICS\n\nPEAK FLOW METER:\n1. Berdiri tegak\n2. Tarik napas dalam penuh\n3. Hembuskan sekuat mungkin ke alat\n4. Catat nilai tertinggi dari 3x percobaan\n5. Nilai normal = 80-100% predicted',ruj:'Rujuk SpP jika: serangan berat tidak respons SABA 3x, SpO2 <90% menetap, riwayat near-fatal asthma, butuh OCS jangka panjang, kontrol asma tidak tercapai dengan step 3-4',res:'Serangan ringan-sedang:\nR/ Salbutamol MDI 100mcg No. 1 fls\n   S prn 2-4 puff (saat sesak, max 4x/hari)\n\nPemeliharaan (persisten ringan):\nR/ Budesonide MDI 200mcg No. 1 fls\n   S 2 dd 1 puff (pagi dan malam)\n\nPro: [Nama Pasien]',edu:'🔵 Edukasi Penyakit: Asma adalah peradangan saluran napas yang bisa dikendalikan. Dengan kontrol yang baik, pasien bisa beraktivitas normal termasuk olahraga.\n\n🟢 Edukasi Support: Keluarga bantu identifikasi dan hindari pemicu (debu, bulu, asap, parfum). Simpan inhaler pelega di tempat mudah dijangkau.\n\n☪️ Edukasi Islami: Shalat boleh dilakukan dengan duduk atau cara yang memungkinkan saat sesak. Allah tidak membebani hamba melebihi kemampuannya.\n\n🔄 Kontrol: 4-6 minggu. Evaluasi kontrol asma (ACT score), teknik inhaler, kepatuhan terapi.',alg:'SESAK + MENGI\n↓\nNilai berat serangan: SpO2, RR, bicara, kesadaran\n↓\nRingan (SpO2 >95%, bisa kalimat penuh):\n→ SABA 2-4 puff MDI tiap 20 menit x 3\n→ Evaluasi 1 jam → membaik: pulang + edukasi\n↓\nSedang (SpO2 91-95%, kalimat terputus):\n→ O2, SABA nebulisasi, Prednison 40mg oral\n→ Observasi 1-3 jam → tidak membaik: rawat inap\n↓\nBerat (SpO2 <90%, kata-kata terputus, sianosis):\n→ O2 high flow, SABA+Ipratropium nebulisasi\n→ Metilprednisolon IV, Mg sulfat IV\n→ Rawat ICU'},
'vfib':{pro:'RESUSITASI JANTUNG PARU (RJP) - BLS/ACLS:\n1. Pastikan keamanan lokasi\n2. Cek respons: tepuk bahu, panggil keras\n3. Tidak ada respons → Aktifkan sistem darurat, minta AED\n4. Cek nadi karotis max 10 detik\n5. Tidak ada nadi → MULAI KOMPRESI:\n   - Posisi: tumit tangan di tengah dada (1/2 bawah sternum)\n   - Kedalaman: 5-6 cm\n   - Kecepatan: 100-120x/menit\n   - Rasio: 30:2 (30 kompresi: 2 napas)\n   - Minimal interupsi!\n6. Pasang AED/defibrillator → analisis irama\n7. VFib/VT pulseless: SHOCK 200J (bifasik) → lanjut CPR 2 menit\n8. CPR 2 menit → Epinefrin 1mg IV/IO tiap 3-5 menit\n9. Amiodaron 300mg IV bolus pertama\n10. Cari dan atasi 4H4T',ruj:'Setelah ROSC (Return of Spontaneous Circulation) → segera rujuk ke RS dengan ICU + kateterisasi jantung',res:'ACLS Medications:\nEpinefrin 1mg IV tiap 3-5 menit\nAmiodaron 300mg IV bolus → 150mg jika perlu\nAtropin 0.5mg IV (bradikardia)\nMg Sulfat 1-2g IV (Torsades de pointes)\n\nPost-ROSC:\nNorepinefrin jika hipotensi persisten\nTargeted Temperature Management (TTM) 32-36°C',edu:'🔵 Edukasi Penyakit (untuk keluarga): Henti jantung bisa terjadi tanpa peringatan. RJP yang dimulai segera oleh orang awam meningkatkan kelangsungan hidup 2-3x lipat!\n\n🟢 Edukasi Support: Ajarkan keluarga pasien risiko tinggi teknik RJP dasar. Pasang nomor darurat (118/119) di tempat mudah terlihat.\n\n☪️ Edukasi Islami: Menyelamatkan satu nyawa sama dengan menyelamatkan seluruh manusia (QS. Al-Maidah: 32). Belajar RJP adalah amalan yang bisa menyelamatkan nyawa.\n\n🔄 Kontrol: Rawat ICU pasca-ROSC. Evaluasi neurologi, fungsi jantung, cari penyebab.',alg:'TIDAK ADA RESPONS\n↓\nAktifkan bantuan darurat + minta AED\n↓\nTidak ada napas normal / tidak ada nadi\n↓\nMULAI CPR 30:2 (kualitas tinggi!)\n↓\nPasang monitor → Analisis irama\n↓\nShockable (VF/VT)? → DC Shock 200J → CPR 2 mnt\nNon-shockable (Asistol/PEA)? → CPR 2 mnt\n↓\nEpinefrin 1mg IV tiap 3-5 mnt\nAmiodaron 300mg IV jika VF persisten\n↓\nCari + atasi 4H4T:\n(Hipoksia, Hipovolemia, Hipo/Hiperkalemia, Hipotermia)\n(Tension PTX, Tamponade, Toksin, Thrombosis)\n↓\nROSC? → Post-resusitasi care + rujuk ICU'},
'stemi':{pro:'PEMBACAAN EKG STEMI:\n1. Kalibrasi: kecepatan 25mm/s, amplitudo 10mm/mV\n2. Irama: sinus atau tidak?\n3. HR, interval PR, QRS, QT\n4. Elevasi ST: ≥1mm di ≥2 sadapan berturutan\n   - Anterior: V1-V4 (LAD)\n   - Inferior: II,III,aVF (RCA)\n   - Lateral: I,aVL,V5-V6 (LCx)\n   - Posterior: depresi ST V1-V3 + tall R\n5. Cek LBBB baru (= STEMI equivalent)\n6. Bandingkan dengan EKG lama\n\nPEMASANGAN IV LINE:\n1. Pilih vena antekubiti, bersihkan dengan antiseptik\n2. Pasang torniket, vena menonjol\n3. Insersi iv catheter 18-20G sudut 15-30°\n4. Konfirmasi: darah flashback\n5. Maju 1-2mm, lepas torniket, tarik jarum\n6. Hubungkan infus set, plester',ruj:'SEMUA STEMI → RUJUK SEGERA ke RS dengan PCI capability. Target door-to-balloon <90 menit. Fibrinolisis jika PCI tidak tersedia dalam 120 menit dan onset <12 jam.',res:'Loading di IGD/ambulans:\nAspirin 320mg kunyah\nClopidogrel 300mg (atau Ticagrelor 180mg)\nEnoksaparin 1mg/kgBB SC\nNitrat SL jika nyeri dan TD >90\n\nPulang (pasca-PCI):\nR/ Aspirin tab 80mg + Clopidogrel tab 75mg No. XXX\n   S 1 dd tab 1 masing-masing (pagi, setelah makan)\n\nR/ Atorvastatin tab 40mg No. XXX\n   S 1 dd tab 1 (malam)\n\nR/ Bisoprolol tab 2.5mg No. XXX\n   S 1 dd tab 1 pagi\n\nPro: [Nama Pasien]',edu:'🔵 Edukasi Penyakit: Serangan jantung terjadi karena pembuluh darah koroner tersumbat. Setiap menit penting — segera ke IGD saat nyeri dada mendadak!\n\n🟢 Edukasi Support: Jangan bawa pasien dengan kendaraan pribadi jika kondisi tidak stabil — hubungi 118/119. Keluarga harus tahu letak obat darurat.\n\n☪️ Edukasi Islami: Berikhtiar dengan berobat adalah sunnah. Pasca serangan jantung adalah kesempatan untuk bersyukur dan memperbaiki gaya hidup sebagai bentuk ibadah.\n\n🔄 Kontrol: 1 minggu, 1 bulan, 3 bulan. Evaluasi: DAPT, statin, beta-blocker, EKG, ekokardiografi.',alg:'NYERI DADA AKUT >20 MENIT\n↓\nABC, O2 jika SpO2 <90%, IV line, monitor\nEKG 12 lead dalam 10 MENIT\n↓\nElevasi ST atau LBBB baru?\n↓ Ya → AKTIVASI CODE STEMI\n↓\nMONA: Morfin 2-4mg IV (nyeri berat)\n       O2 jika SpO2 <90%\n       Nitrat SL (TD >90mmHg)\n       Aspirin 320mg kunyah\n↓\nAmbil darah: troponin, DL, elektrolit, fungsi ginjal, koagulasi\n↓\nPCI tersedia <90 menit? → Primary PCI\nTidak? Onset <12 jam? → Fibrinolisis (rtPA/Streptokinase)\n↓\nPost-PCI: DAPT, statin, beta-blocker, ACEi'},
'appendisitis':{pro:'PALPASI ABDOMEN (Appendisitis):\n1. Pasien posisi supine, lutut sedikit fleksi (relaksasi abdomen)\n2. Mulai palpasi dari kuadran yang TIDAK nyeri\n3. Titik McBurney: 1/3 lateral garis SIAS-umbilikus → nyeri tekan?\n4. Rovsing sign: tekan LLQ → nyeri di RLQ?\n5. Psoas sign: fleksi pasif paha kanan → nyeri perut?\n6. Obturator sign: rotasi internal paha kanan fleksi → nyeri?\n7. Blumberg sign: tekan dalam RLQ → lepaskan tiba-tiba → nyeri meningkat?\n8. DRE (rectal toucher): nyeri jam 9-10',ruj:'SEMUA appendisitis harus DIRUJUK ke RS dengan fasilitas bedah untuk appendektomi. Jangan tunda!',res:'Preoperatif (di IGD):\nSefazolin 2g IV (dosis tunggal profilaksis, 30-60 mnt sebelum insisi)\nMetronidazol 500mg IV (jika perforasi)\nIVFD NaCl 0.9% 500mL/jam\nKetorolak 30mg IV (analgetik)\nPuasa, konsul bedah segera\n\nPasca operasi (pulang):\nR/ Sefadroksil kap 500mg No. XIV\n   S 2 dd kap 1\nR/ Metronidazol tab 500mg No. XXI\n   S 3 dd tab 1\nR/ As. Mefenamat tab 500mg No. X\n   S 3 dd tab 1 prn (nyeri)',edu:'🔵 Edukasi Penyakit: Usus buntu yang meradang harus segera dioperasi. Jika ditunda, bisa pecah dan menyebabkan infeksi seluruh rongga perut yang berbahaya.\n\n🟢 Edukasi Support: Setelah operasi, pasien perlu istirahat 1-2 minggu. Keluarga bantu aktivitas sehari-hari. Perhatikan tanda infeksi luka: merah, bengkak, keluar cairan.\n\n☪️ Edukasi Islami: Operasi adalah ikhtiar yang diizinkan Islam. Niatkan berobat untuk menjaga kesehatan sebagai amanah dari Allah SWT.\n\n🔄 Kontrol: 1 minggu pasca operasi (evaluasi luka). 1 bulan berikutnya (evaluasi pemulihan).',alg:'NYERI PERUT KANAN BAWAH + DEMAM\n↓\nAnamnesis: migrasi nyeri periumbilikal → RLQ?\n↓\nPemeriksaan: McBurney, Rovsing, Blumberg, Psoas sign\nAlvarado score (≥7: kemungkinan besar appendisitis)\n↓\nLab: DL (leukositosis), CRP, βhCG wanita\nUSG abdomen (apendiks >6mm, non-compressible)\n↓\nAlvarado ≥7 + USG positif:\n→ Puasa, IVFD, konsul bedah SEGERA\n→ Antibiotik profilaksis\n→ Informed consent operasi\n→ Appendektomi\n↓\nAlvarado 4-6 + USG ragu:\n→ Observasi 6-12 jam + CT scan abdomen'},
'gnaps':{pro:'PEMERIKSAAN URIN LENGKAP:\n1. Urin porsi tengah (midstream) pagi hari\n2. Segera periksa <2 jam\n3. Makroskopis: warna, kejernihan, busa\n4. Dipstik: protein (+), darah (+), nitrit, leukosit esterase\n5. Mikroskopis: eritrosit dismorfik (khas nefritik!), silinder eritrosit\n6. Estimasi proteinuria: rasio protein/kreatinin urin\n\nPENGUKURAN TD PADA ANAK:\n1. Manset harus menutupi 80% lingkar lengan atas\n2. Lengan setinggi jantung\n3. Ukur 3x, ambil rata-rata\n4. Interpretasi: persentil berdasarkan usia, TB, dan jenis kelamin',ruj:'Rujuk SpPD/SpA Nefrologi jika: hipertensi tidak terkontrol, oliguria/anuria menetap >24 jam, sindrom nefrotik, penurunan fungsi ginjal progresif, tidak membaik dalam 3-4 minggu',res:'R/ Amoksisilin tab 500mg No. XXX\n   S 3 dd tab 1 (10 hari, eradikasi Streptokokus)\n\nR/ Amlodipin tab 5mg No. XIV\n   S 1 dd tab 1 pagi (jika hipertensi)\n\nR/ Furosemid tab 40mg No. VII\n   S 1 dd tab 1 pagi (jika edema/oliguria berat)\n\nPro: [Nama Pasien]\n*Diet: rendah garam (<2g/hari), rendah protein (0.6-0.8g/kgBB/hari)',edu:'🔵 Edukasi Penyakit: GNAPS adalah reaksi sistem imun terhadap infeksi tenggorokan/kulit oleh kuman Streptokokus. Umumnya sembuh sendiri dalam 2-4 minggu dengan pengobatan yang tepat.\n\n🟢 Edukasi Support: Pantau produksi urin (volume dan warna) setiap hari. Timbang badan setiap pagi. Segera ke RS jika urin makin sedikit atau tidak ada sama sekali.\n\n☪️ Edukasi Islami: Jaga kebersihan badan dan lingkungan untuk mencegah infeksi kulit. Kebersihan adalah sebagian dari iman.\n\n🔄 Kontrol: 1 minggu (evaluasi TD, urin, edema). 3-6 bulan (urinalisis ulang, pastikan sembuh sempurna).',alg:'HEMATURIA + EDEMA + HIPERTENSI\n↓\nRiwayat ISPA/infeksi kulit 1-3 minggu lalu?\n↓ Ya → Curiga GNAPS\n↓\nLab: DL, ureum/kreatinin, ASTO, C3, urinalisis\nUSG ginjal\n↓\nDiagnosis GNAPS:\n→ Rawat inap jika: hipertensi berat, oliguria, komplikasi\n→ Rawat jalan jika: ringan, bisa monitoring ketat\n↓\nTerapi: diet rendah garam+protein, antihipertensi, diuretik, antibiotik\n↓\nMonitor harian: TD, berat badan, urin output\n↓\nTidak membaik/komplikasi → Rujuk SpPD/SpA Nefrologi'},
'peb':{pro:'PEMBERIAN MgSO4:\nLoading dose:\n- MgSO4 40% 4g IV dalam 100mL NaCl 0.9%\n- Infus selama 15-20 menit\nMaintenance dose:\n- MgSO4 40% 6g dalam 500mL RL\n- Drip 28 tetes/menit (1g/jam)\n\nPEMATAUAN MgSO4 (setiap jam):\n1. Refleks patela: harus (+), jika hilang → HENTIKAN MgSO4\n2. RR: harus ≥16x/mnt\n3. Urin output: harus ≥25mL/jam (≥100mL/4 jam)\n4. SpO2: pantau terus\n\nANTIDOT jika toksisitas:\nKalsium Glukonat 10% 1g (10mL) IV perlahan 10 menit',ruj:'SEMUA PEB harus dirawat inap RS dengan SpOG. Jika fasilitas tidak memadai (tidak ada SpOG/ICU neonatal) → stabilisasi MgSO4 + antihipertensi → RUJUK segera',res:'Di RS (rawat inap):\nMgSO4 (lihat prosedur di atas)\nAntihipertensi jika TD ≥160/110:\n  Nifedipin 10mg oral → cek TD 30 mnt → ulang jika perlu (max 30mg)\n  Atau Labetalol 20mg IV perlahan\n\nPascapersalinan (jika ada):\nR/ Metildopa tab 250mg No. XXX\n   S 2-3 dd tab 1 (antihipertensi aman laktasi)',edu:'🔵 Edukasi Penyakit: Preeklamsia berat adalah kondisi darurat kehamilan. Tekanan darah yang sangat tinggi bisa menyebabkan kejang (eklamsia), kerusakan otak, hati, dan ginjal pada ibu, serta gangguan pertumbuhan/kelahiran prematur pada bayi.\n\n🟢 Edukasi Support: Keluarga harus mendampingi ibu 24 jam. Jika muncul kejang → jangan masukkan apapun ke mulut, posisikan miring kiri, segera hubungi tenaga medis.\n\n☪️ Edukasi Islami: Kehamilan dan persalinan adalah perjuangan mulia. Rasulullah ﷺ menegaskan besarnya pahala wanita yang bersabar dalam kehamilan. Ikhtiar medis adalah wajib.\n\n🔄 Kontrol: Rawat inap ketat sampai 48 jam postpartum. Setelah pulang: pantau TD tiap hari 1 minggu. TD umumnya normal dalam 3 bulan.',alg:'IBU HAMIL >20 MINGGU + TD ≥140/90\n↓\nUkur TD 2x selang 4 jam\nProteinuria: dipstik / urin 24 jam\nLab: DL, trombosit, SGOT/SGPT, ureum/kreatinin, LDH\n↓\nTD ≥160/110 atau ada gejala berat?\n↓ Ya → PEB\n↓\nMulai MgSO4 loading → maintenance\nAntihipertensi: Nifedipin 10mg oral\nRawat inap, monitoring ketat\n↓\nUsia gestasi?\n<34 minggu: stabilisasi, pertimbangkan kortikosteroid (pematangan paru)\n34-36 minggu: diskusikan dengan SpOG\n≥37 minggu: terminasi kehamilan (induksi/SC)\n↓\nMgSO4 dilanjutkan 24 jam postpartum'},
'dm2':{pro:'CEK GULA DARAH MANDIRI:\n1. Cuci tangan dengan sabun, keringkan\n2. Tusuk ujung jari (sisi lateral, bukan ujung) dengan lancet\n3. Teteskan darah pertama → bersihkan dengan kapas\n4. Teteskan darah kedua ke strip glukometer\n5. Catat hasil + waktu pemeriksaan dalam buku diary\n\nPEMERIKSAAN KAKI DIABETIK:\n1. Inspeksi: luka, kapalan, deformitas, warna\n2. Palpasi: nadi dorsalis pedis, tibialis posterior\n3. Monofilamen 10g: 10 titik di telapak kaki\n4. Garpu tala 128Hz: malleolus, dorsum kaki\n5. Refleks achilles: normal/menurun/hilang\n6. ABI (Ankle-Brachial Index): normal >0.9',ruj:'Rujuk SpPD/Endokrin jika: HbA1c tidak tercapai dengan 3 obat, komplikasi berat (nefropati stadium 3+, retinopati proliferatif, neuropati berat), DM tipe 1, KAD/HHS, kehamilan dengan DM',res:'R/ Metformin tab 500mg No. LX\n   S 3 dd tab 1 (sesudah makan, mulai dosis rendah)\n\nJika HbA1c belum tercapai, tambahkan:\nR/ Glimepirid tab 1mg No. XXX\n   S 1 dd tab 1 (saat sarapan)\n\nR/ Vitamin B kompleks No. XXX\n   S 1 dd tab 1 (saraf)\n\nPro: [Nama Pasien]\n*Monitor: GDS mandiri, HbA1c tiap 3 bulan',edu:'🔵 Edukasi Penyakit: DM tipe 2 tidak bisa disembuhkan tapi BISA dikendalikan. Target: HbA1c <7%, gula darah puasa 80-130mg/dL, 2 jam setelah makan <180mg/dL.\n\n🟢 Edukasi Support: Keluarga bantu menyiapkan makanan sehat dan dorong aktivitas fisik bersama. Jangan biarkan pasien minum manis berlebihan.\n\n☪️ Edukasi Islami: "Berpuasalah maka kamu akan sehat" (HR. Ibnu Sunni). Puasa Ramadan umumnya aman bagi DM terkontrol — konsultasikan dulu dengan dokter untuk penyesuaian obat. Makanan halal dan tayyib (baik) adalah perintah Allah.\n\n🔄 Kontrol: Tiap 1-3 bulan. Evaluasi: HbA1c, GDS, TD, BB, fungsi ginjal, profil lipid, inspeksi kaki.',alg:'GDP ≥126 atau GDS ≥200 + gejala atau HbA1c ≥6.5%\n↓\nDiagnosis DM Tipe 2 → Edukasi intensif\n↓\nModifikasi gaya hidup: diet + olahraga 150 mnt/minggu\n↓\nMulai Metformin (jika GFR >30)\n↓\nEvaluasi HbA1c tiap 3 bulan\n↓\nHbA1c tidak tercapai (<7%)?\n→ Tambah: DPP4i / SGLT2i / GLP1-RA / Sulfonilurea\n↓\nMasih tidak tercapai?\n→ Intensifikasi: kombinasi 3 obat atau mulai insulin\n↓\nTarget tercapai → Pertahankan, kontrol rutin'},
'hipoglikemia':{pro:'PENANGANAN HIPOGLIKEMIA:\nPasien SADAR:\n1. Rule of 15: 15g karbohidrat cepat\n   - 3-4 tablet glukosa, ATAU\n   - 150mL jus buah/minuman manis, ATAU\n   - 1 sendok makan gula\n2. Tunggu 15 menit, cek GDS\n3. Masih <70? → Ulangi 15g lagi\n4. Setelah GDS >100: makan snack (karbohidrat kompleks)\n\nPasien TIDAK SADAR / Tidak bisa menelan:\n1. Jangan beri makan/minum per oral!\n2. Dekstrosa 40% 50mL IV bolus pelan\n3. Cek GDS 15 menit\n4. Belum sadar/GDS <70: ulangi D40% 25mL\n5. Pertimbangkan infus D10%\n6. Atau Glukagon 1mg IM/SC jika tidak ada akses IV\n7. Cari penyebab hipoglikemia',ruj:'Rawat inap jika: hipoglikemia berat berulang, tidak sadar >30 menit, hipoglikemia akibat sulfonilurea (durasi kerja panjang, risiko berulang)',res:'Akut (di fasilitas kesehatan):\nD40% ampul 25mL → IV bolus\nLanjut infus D10% 500mL/6 jam\n\nEdukasi mandiri:\nR/ Tablet Glukosa 4g No. XXX\n   (Simpan selalu di kantong/tas, konsumsi saat GDS <70 dan bergejala)\n\nJika ada sulfonilurea → pertimbangkan ganti ke DPP4i atau SGLT2i',edu:'🔵 Edukasi Penyakit: Hipoglikemia (gula darah terlalu rendah) bisa berbahaya jika tidak segera diatasi. Tanda: berkeringat, gemetar, pusing, jantung berdebar, bingung.\n\n🟢 Edukasi Support: Keluarga wajib tahu cara menangani hipoglikemia. Selalu simpan permen/tablet glukosa di rumah dan di kantong pasien.\n\n☪️ Edukasi Islami: Saat hipoglikemia, pasien dibolehkan membatalkan puasa (darurat medis). Tidak ada dosa — justru menjaga jiwa adalah kewajiban.\n\n🔄 Kontrol: Segera setelah episode, evaluasi penyebab (obat terlalu banyak? makan terlambat? olahraga berlebih?). Sesuaikan dosis obat.',alg:'PASIEN DIABETES + TIDAK SADAR / BERKERINGAT\n↓\nCek GDS SEGERA dengan glukometer\n↓\nGDS <70mg/dL?\n↓ Ya → HIPOGLIKEMIA\n↓\nSadar + bisa menelan?\n↓ Ya → Rule of 15: 15g karbohidrat cepat\n↓ Tidak → D40% 50mL IV bolus\n↓\nCek GDS 15 menit\n↓ Belum >100 → Ulangi\n↓ >100 + sadar → Makan snack + cari penyebab\n↓\nHipoglikemia berat/berulang/akibat sulfonilurea:\n→ Rawat inap, infus D10%\n→ Monitor GDS tiap jam'},
'dhf':{pro:'UJI TOURNIQUET (Rumpel-Leede):\n1. Pasang manset sfigmomanometer\n2. Pompa hingga tekanan antara sistolik dan diastolik\n   [(TD sistolik + TD diastolik) / 2]\n3. Pertahankan selama 5 MENIT\n4. Lepaskan, tunggu kulit kembali normal\n5. Hitung petekie di area 2.5 x 2.5 cm (1 inci persegi)\n6. POSITIF: ≥10 petekie per 1 inci persegi\n\nMONITORING CAIRAN DBD:\n1. Hematokrit tiap 4-6 jam\n2. Urin output: target >0.5mL/kgBB/jam\n3. Tanda syok: akral, nadi, capillary refill\n4. Balance cairan harian\n5. Trombosit harian',ruj:'Rawat inap SEMUA DBD Grade II ke atas, tanda syok (Grade III-IV = DSS), trombosit <20.000, perdarahan bermakna, ko-morbid berat',res:'Rawat jalan (Grade I ringan):\nR/ Parasetamol tab 500mg No. XX\n   S 4 dd tab 1 prn (demam/nyeri, max 4g/hari)\n   HINDARI Aspirin dan Ibuprofen!\n\nRawat inap (Grade II+):\nIVFD RL/NaCl 0.9%:\n- Mulai 5-7mL/kgBB/jam\n- Sesuaikan dengan Ht dan klinis\n- Monitor ketat',edu:'🔵 Edukasi Penyakit: DBD menular lewat gigitan nyamuk Aedes aegypti. Hari kritis DBD adalah hari ke 4-6 saat demam turun — justru saat paling berbahaya (risiko syok).\n\n🟢 Edukasi Support: Minum banyak cairan (air putih, jus, oralit, susu). Jangan beri aspirin/ibuprofen! Segera ke RS jika: gusi/hidung berdarah, muntah terus, tangan-kaki dingin, tidak buang air kecil >6 jam.\n\n☪️ Edukasi Islami: 3M Plus adalah kewajiban menjaga kebersihan lingkungan — bagian dari Islam yang menghargai kehidupan. Membersihkan bak mandi dan mengubur kaleng bekas adalah ibadah menjaga kesehatan umat.\n\n🔄 Kontrol: Cek darah tiap 24 jam selama rawat jalan. Segera ke IGD jika tanda bahaya muncul.',alg:'DEMAM AKUT 2-7 HARI + NYERI SENDI\n↓\nCurigai DBD: uji tourniquet, periksa petekie\n↓\nLab: DL harian (hari 3+), NS1 antigen\n↓\nGrade berdasarkan WHO:\nGrade I: Demam + tourniquet (+), trombosit <100.000\nGrade II: + perdarahan spontan\nGrade III: + tanda kegagalan sirkulasi\nGrade IV: + syok berat (nadi tidak teraba)\n↓\nGrade I ringan: Rawat jalan, parasetamol, minum banyak\nGrade II+: Rawat inap, IVFD, monitoring ketat\nGrade III-IV (DSS): Resusitasi cairan cepat 10-20mL/kgBB\n                    Bolus RL, evaluasi 15-30 mnt'},
'malaria':{pro:'APUSAN DARAH MALARIA:\n1. Darah jari (ujung jari IV, bersihkan alkohol, keringkan)\n2. Apusan TEBAL: tetes besar darah, putar dengan sudut 45° area 1cm\n3. Apusan TIPIS: tetes kecil, dorong dengan kaca objek lain sudut 30°\n4. Keringkan di udara (jangan dipanaskan)\n5. Fiksasi tipis: metanol 2 menit\n6. Pewarnaan: Giemsa 3% selama 30-45 menit\n7. Cuci air mengalir, keringkan\n8. Baca di bawah mikroskop minyak imersi (100x)\n9. Hitung 200-500 eritrosit untuk kepadatan parasit',ruj:'Rujuk ke RS jika: malaria berat (penurunan kesadaran, kejang, gagal ginjal, anemia berat, syok), tidak bisa minum obat oral, hamil dengan malaria falciparum',res:'Malaria Falciparum tanpa komplikasi:\nR/ DHP (Dihydroartemisinin-Piperaquine) tab 40/320mg\n   Dewasa >60kg: S 1 dd 4 tab (hari 1-3)\n   Dewasa 40-60kg: S 1 dd 3 tab (hari 1-3)\n\nR/ Primakuin tab 15mg No. III\n   S 1 dd tab 1 (hari 1, gametosidal)\n\nPro: [Nama Pasien]',edu:'🔵 Edukasi Penyakit: Malaria menular lewat gigitan nyamuk Anopheles malam hari. Obat harus diminum TUNTAS walau sudah merasa sembuh — jika tidak tuntas, malaria bisa kambuh dan resistensi obat.\n\n🟢 Edukasi Support: Gunakan kelambu berinsektisida. Pakai baju lengan panjang malam hari. Pasang kasa nyamuk di jendela. Semprotkan repelen.\n\n☪️ Edukasi Islami: Menjaga diri dari penyakit adalah kewajiban. Penggunaan kelambu dan tidak keluar malam tanpa pelindung adalah bentuk ikhtiar menjaga amanah Allah berupa tubuh yang sehat.\n\n🔄 Kontrol: Hari ke-3, 7, 14, 28 setelah pengobatan. Apusan ulang untuk konfirmasi parasit bersih.',alg:'DEMAM PERIODIK + DARI/DI DAERAH ENDEMIS\n↓\nApusan darah tebal-tipis + RDT malaria\n↓\nPositif?\n↓ Ya → Identifikasi spesies\n↓\nFalciparum tanpa komplikasi:\n→ ACT (DHP) 3 hari + Primakuin hari 1\n→ Rawat jalan, pastikan bisa minum oral\n↓\nFalciparum dengan tanda berat:\n(Penurunan kesadaran, kejang, anemia berat, gagal ginjal)\n→ RAWAT INAP\n→ Artesunat IV 2.4mg/kgBB (jam 0, 12, 24 lalu tiap 24 jam)\n→ Terapi suportif + monitor komplikasi'},
'ankle_sprain':{pro:'METODE RICE:\nR - Rest: Istirahat anggota gerak, hindari weight-bearing 24-48 jam\nI - Ice: Kompres es dalam handuk, 20 menit setiap 2-3 jam (24-72 jam pertama)\n   Jangan es langsung ke kulit!\nC - Compression: Elastic bandage dari jari ke betis, tidak terlalu ketat\n   Cek sirkulasi (CRT, warna, rasa) setiap 30 menit\nE - Elevation: Tinggikan kaki di atas level jantung saat berbaring\n\nOTTAWA ANKLE RULES:\nX-ray indikasi jika:\n- Nyeri tulang malleolus medial/lateral 6cm ke atas\n- Nyeri tulang navikular atau basis MT5\n- Tidak bisa weight-bearing 4 langkah',ruj:'Rujuk SpOT jika: Ottawa rules positif (curiga fraktur), grade III (instabilitas berat, tidak bisa weight-bearing sama sekali), tidak membaik dalam 2 minggu, cedera rekuren',res:'R/ Natrium Diklofenak tab 50mg No. XIV\n   S 3 dd tab 1 sesudah makan (5-7 hari)\n\nR/ Natrium Diklofenak gel 1% No. 1 tube\n   S 3-4 dd oleskan tipis di area nyeri\n\nPro: [Nama Pasien]\n*Fisioterapi setelah nyeri akut reda (hari 3-5)',edu:'🔵 Edukasi Penyakit: Keseleo ankle adalah cedera ligamen yang paling sering. Grade I-II umumnya sembuh sempurna dalam 2-6 minggu dengan penanganan yang benar.\n\n🟢 Edukasi Support: Bantu pasien melakukan RICE di rumah. Siapkan es dan elastic bandage. Temani saat latihan propriosepsi.\n\n☪️ Edukasi Islami: Bersabar dalam pemulihan dan tidak memaksakan diri adalah bijaksana. "Tidak ada kelelahan, penyakit, kesusahan... yang menimpa seorang muslim melainkan Allah akan menghapus dosa-dosanya" (HR. Bukhari).\n\n🔄 Kontrol: 1 minggu (evaluasi pembengkakan dan range of motion). Fisioterapi 2-3x/minggu selama 4-6 minggu.',alg:'TRAUMA ANKLE (INVERSI)\n↓\nOttawa Ankle Rules:\nNyeri tulang malleolus/navikular/MT5 + tidak bisa jalan 4 langkah?\n↓ Ya → X-ray ankle → Fraktur? → Rujuk SpOT\n↓ Tidak\nCedera ligamen (ankle sprain)\n↓\nGrade I: RICE + analgetik topikal, weight-bearing segera\nGrade II: RICE + NSAID oral + hindari weight-bearing 24-48 jam\nGrade III: RICE + rujuk SpOT (kemungkinan brace/operasi)\n↓\nFisioterapi setelah nyeri akut reda:\nRange of motion → Penguatan → Propriosepsi → Return to sport'},
'oa_genu':{pro:'INJEKSI INTRAARTIKULAR LUTUT:\n1. Posisi: supine, lutut ekstensi atau fleksi 90°\n2. Identifikasi celah sendi (suprapatelar atau infrapatelar)\n3. Antisepsis: betadine + alkohol\n4. Anestesi lokal: Lidokain 1% 1mL SC\n5. Jarum 21-23G, masuk di sisi lateral suprapatelar\n6. Konfirmasi di ruang sendi: aspirasi cairan/udara\n7. Injeksikan: Triamsinolon 40mg/mL 1mL + Lidokain 1% 4mL\n   (atau asam hialuronat jika tersedia)\n8. Plester steril\n9. Istirahat 24 jam pasca injeksi\nMax 3-4x/tahun!',ruj:'Rujuk SpOT jika: Kellgren-Lawrence grade III-IV tidak respons terapi konservatif 6 bulan, deformitas berat, pertimbangkan total knee replacement (TKR)',res:'Lini 1:\nR/ Parasetamol tab 500mg No. LX\n   S 3-4 dd tab 1-2 prn (max 4g/hari)\n\nAlternatif/tambahan:\nR/ Natrium Diklofenak tab 50mg No. XXX\n   S 2-3 dd tab 1 sesudah makan (jangka pendek)\n\nR/ Natrium Diklofenak gel 1% No. 2 tube\n   S 3 dd oleskan dan pijat ringan\n\nPro: [Nama Pasien]',edu:'🔵 Edukasi Penyakit: OA lutut adalah aus sendi yang tidak bisa dibalik, tapi nyeri dan fungsi bisa jauh membaik dengan penanganan tepat. Target: bisa beraktivitas sehari-hari dengan nyeri minimal.\n\n🟢 Edukasi Support: Keluarga bantu pasien menurunkan berat badan (tiap 1kg turun = beban lutut berkurang 4kg!). Modifikasi rumah: kursi toilet tinggi, pegangan tangga, hindari jongkok.\n\n☪️ Edukasi Islami: Shalat boleh dilakukan dengan kursi jika tidak mampu berdiri/duduk di lantai. Allah memberikan kemudahan: "Allah menghendaki kemudahan bagimu, dan tidak menghendaki kesulitan" (QS. Al-Baqarah: 185).\n\n🔄 Kontrol: 1-3 bulan. Evaluasi: VAS nyeri, WOMAC score, IMT, ROM lutut.',alg:'NYERI LUTUT KRONIK ≥45 TAHUN\n↓\nX-ray genu berdiri AP+lateral\nKellgren-Lawrence grading\n↓\nMulai terapi bertahap:\nStep 1: Edukasi + penurunan BB + fisioterapi + Parasetamol\nStep 2: NSAID topikal + oral\nStep 3: Injeksi kortikosteroid intraartikular\nStep 4: Injeksi asam hialuronat\n↓\nEvaluasi 6-12 minggu tiap step\n↓\nGagal Step 1-4 + Grade III-IV?\n→ Rujuk SpOT → Pertimbangkan TKR'},
'mh_mb':{pro:'SLIT SKIN SMEAR (SSS):\n1. Pilih lesi aktif + cuping telinga bilateral + dahi\n2. Cubit kulit hingga ischemia (memucat)\n3. Sayat kecil 5mm kedalaman hingga dermis (tidak sampai berdarah)\n4. Putar pisau 90° → kumpulkan cairan dermis\n5. Oleskan di kaca objek → keringkan\n6. Fiksasi methanol 2 menit\n7. Pewarnaan Ziehl-Nielsen\n8. Hitung Bacterial Index (BI) 0-6+\n\nUJI SENSASI LESI:\n1. Kapas: usapkan ringan → pasien tutup mata → bisa merasakan?\n2. Jarum: tusuk ringan tepi lesi → terasa?\n3. Air hangat/dingin: bisa membedakan suhu?\n4. Anestesia lengkap = khas lepra',ruj:'Rujuk SpKK jika: reaksi kusta berat (tipe 1: neuritis berat; tipe 2/ENL: demam+nodul), BI tidak turun setelah 12 bulan MDT, resistensi obat, komplikasi saraf berat (lagoftalmus, clawhand)',res:'MDT MB (12 BULAN):\nDosis bulan (diminum di depan petugas):\nR/ Rifampisin kap 600mg → S 1 dd tab 1 (tiap bulan)\nR/ Klofazimin kap 300mg → S 1 dd kap 1 (tiap bulan)\n\nDosis harian (dibawa pulang):\nR/ Dapson tab 100mg No. XXX\n   S 1 dd tab 1\nR/ Klofazimin kap 50mg No. XXX\n   S 1 dd kap 1\n\n*Blister MDT tersedia gratis di Puskesmas/Kemenkes',edu:'🔵 Edukasi Penyakit: Kusta BUKAN penyakit kutukan. Kusta adalah infeksi bakteri yang BISA DISEMBUHKAN dengan MDT. Pasien yang sudah minum MDT TIDAK menular lagi kepada orang lain.\n\n🟢 Edukasi Support: Keluarga dan masyarakat dilarang mendiskriminasi penderita kusta. Stigma adalah penyakit sosial yang lebih berbahaya. Periksa kontak serumah!\n\n☪️ Edukasi Islami: Rasulullah ﷺ bersabda: "Larilah dari penyakit kusta seperti kamu lari dari singa." Ini menunjukkan Islam mengenal karantina, namun juga melarang diskriminasi berlebihan. Berobat adalah kewajiban, menghilangkan stigma adalah dakwah.\n\n🔄 Kontrol: Tiap bulan untuk pengambilan MDT. Evaluasi BI tiap 6 bulan. POD (Prevention of Disability) assessment reguler.',alg:'BERCAK KULIT MATI RASA + PENEBALAN SARAF\n↓\nKonfirmasi diagnosis: hitung lesi, uji sensasi, periksa saraf\nSSS: Bacterial Index\n↓\nKlasifikasi: PB (≤5 lesi, BTA-) vs MB (>5 lesi atau BTA+)\n↓\nMulti-drug Therapy (MDT):\nPB: 6 bulan\nMB: 12 bulan\n↓\nEdukasi intensif: kepatuhan minum obat, perawatan diri\nPOD: cegah kecacatan (perawatan tangan/kaki, latihan mata)\n↓\nMuncul reaksi kusta?\n→ Tipe 1: Prednison + lanjutkan MDT\n→ Tipe 2 (ENL): Talidomid (SpKK) atau Prednison + Klofazimin'},
'varicella':{pro:'EDUKASI ISOLASI:\n1. Isolasi di rumah hingga SEMUA lesi berkrusta\n2. Umumnya hari ke 5-7 setelah lesi pertama\n3. Tidak boleh ke sekolah/kantor/tempat umum\n4. Ventilasi kamar baik, lap/kain bekas pakai dipisah\n5. Cuci tangan sering dengan sabun\n6. Hindari menggaruk (potong kuku!)\n\nCARA MERAWAT LESI:\n1. Mandi air hangat (bukan panas) 2x/hari dengan sabun lembut\n2. Calamine lotion atau bedak talk untuk mengurangi gatal\n3. Antihistamin oral untuk gatal\n4. Jangan pecahkan vesikel\n5. Cek: infeksi sekunder (kemerahan bertambah, kulit hangat, keluar nanah)',ruj:'Rujuk SpA/SpPD jika: pneumonia varicella (sesak napas), ensefalitis (kejang, penurunan kesadaran), infeksi bakteri sekunder berat, pasien imunosupresi (varicella berat), varicella pada neonatus atau ibu hamil',res:'Anak (imunokompeten, tidak komplikasi):\nR/ CTM tab 4mg No. X\n   S 3 dd tab ½-1 prn (gatal)\nR/ Parasetamol syr 120mg/5mL No. 2 fls\n   S 3-4 dd 1 cth prn (demam)\n\nDewasa atau komplikasi ringan:\nR/ Asiklovir tab 400mg No. XXXV\n   S 5 dd tab 2 (total 800mg 5x/hari x7 hari)\n   Mulai dalam 24 jam pertama lesi\nR/ Loratadin tab 10mg No. VII\n   S 1 dd tab 1 (gatal)\n\nPro: [Nama Pasien]',edu:'🔵 Edukasi Penyakit: Cacar air adalah infeksi virus yang sangat menular. Umumnya sembuh sendiri dalam 1-2 minggu. Komplikasi jarang pada anak sehat, lebih berbahaya pada dewasa/imunosupresi.\n\n🟢 Edukasi Support: Semua anggota keluarga yang belum pernah cacar air dan belum vaksin BERISIKO tertular. Kontak yang hamil atau imunosupresi harus segera konsultasi dokter.\n\n☪️ Edukasi Islami: Karantina adalah sunnah Nabi ﷺ: "Jika kamu mendengar wabah di suatu daerah, janganlah kamu mendatanginya" (HR. Bukhari). Isolasi adalah ibadah menjaga sesama.\n\n🔄 Kontrol: 3-5 hari (evaluasi perkembangan lesi, tanda komplikasi). Vaksin varicella untuk anggota keluarga yang belum imun.',alg:'LESI VESIKEL POLIMORFIK + DEMAM\n↓\nAnamnesis: kontak penderita cacar 10-21 hari lalu?\nInspeksi: lesi berbagai stadium bersamaan, sentripetal\n↓\nImunokompeten?\n↓ Ya → Varicella tidak komplikasi\n↓\nAnak: Suportif (antihistamin, parasetamol, calamine)\nDewasa: + Asiklovir 800mg 5x/hari (mulai <24 jam)\n↓\nEdukasi isolasi hingga semua lesi berkrusta\n↓\nTanda komplikasi: sesak, kejang, kesadaran turun?\n↓ Ya → Rawat inap + Asiklovir IV + Rujuk SpA/SpPD'},
'urtiaria':{pro:'IDENTIFIKASI PEMICU URTIKARIA:\n1. Riwayat makanan 24-48 jam sebelumnya\n2. Obat-obatan terbaru (termasuk obat bebas)\n3. Produk perawatan baru\n4. Aktivitas fisik\n5. Paparan fisik: tekanan, dingin, panas, air\n6. Infeksi terbaru\n7. Dermatografisme: gores kulit dengan ujung tumpul → wheals?\n8. Cold test: es batu di lengan bawah 4 menit → wheal?',ruj:'Rujuk SpKK jika: urtikaria kronik >6 minggu tidak respons antihistamin dosis ganda, curiga vaskulitis urtikaria (biopsi), urtikaria fisik berat. Rujuk IGD jika: angioedema laringeal/anafilaksis',res:'R/ Cetirizin tab 10mg No. XIV\n   S 1 dd tab 1 malam\n\nJika masih ada:\nR/ Loratadin tab 10mg No. XIV\n   S 1 dd tab 1 pagi (tambahan)\n\nUrgen/angioedema:\nR/ Metilprednisolon tab 4mg No. VI\n   S 3 dd tab 1 (3-5 hari saja)\n\nPro: [Nama Pasien]',edu:'🔵 Edukasi Penyakit: Urtikaria akut biasanya sembuh dalam beberapa hari-minggu. Tugas utama: identifikasi dan hindari pemicu. 50% kasus tidak ditemukan penyebabnya.\n\n🟢 Edukasi Support: Keluarga bantu mencatat makanan/aktivitas yang memicu. Simpan antihistamin sebagai obat darurat di rumah.\n\n☪️ Edukasi Islami: Hindari makanan yang diragukan kehalalannya — ini juga melindungi dari reaksi alergi. Makanan halal dan tayyib adalah untuk kebaikan badan.\n\n🔄 Kontrol: 1 minggu. Jika tidak membaik atau berlanjut >6 minggu → evaluasi ulang, skin prick test.',alg:'BENTOL GATAL MENDADAK\n↓\nAda tanda anafilaksis? (sesak, TD turun, stridor)\n↓ Ya → DARURAT: Epinefrin 0.3mg IM + O2 + IVFD\n↓ Tidak\nUrtikaria saja\n↓\nIdentifikasi pemicu: riwayat obat/makanan/aktivitas\n↓\nAntihistamin generasi 2 (Cetirizin/Loratadin)\n↓\nTidak respons?\n→ Tingkatkan dosis antihistamin 2-4x\n→ Tambah antihistamin H2 (Ranitidin)\n→ Kortikosteroid jangka pendek\n↓\nBerlanjut >6 minggu → Urtikaria kronik → Rujuk SpKK'}}

const NEURO_IDS = ['migrain','tth','bppv','bells_palsy','hnp','spondilitis_tb','meniere','stroke','tia','trauma_ms','meningoensefalitis','neuropati_dm','tarsal_tunnel','demensia']
const PSIKIATRI_IDS = ['ptsd','baby_blues','gad','insomnia','bipolar','disfungsi_seksual','tic','somatisasi','skizoafektif','psikotik_akut','campuran_ansietas','depresi_ringan']

let activeSys='all', activeYears=new Set([2022,2023,2024,2025]), searchQ=''
let isDark = localStorage.getItem('osce_theme') !== 'light'
function applyTheme(){
  document.body.classList.toggle('light', !isDark)
  document.getElementById('themeBtn').textContent = isDark ? '☀️ Light' : '🌙 Dark'
}
function toggleTheme(){
  isDark = !isDark
  localStorage.setItem('osce_theme', isDark ? 'dark' : 'light')
  applyTheme()
}
applyTheme()
const sk=id=>'osce4_'+id
const loadNote=id=>{try{return JSON.parse(localStorage.getItem(sk(id)))||{}}catch{return{}}}
const saveNote=(id,obj)=>localStorage.setItem(sk(id),JSON.stringify(obj))
const clearNote=id=>localStorage.removeItem(sk(id))

function buildNav(){
  const mkItems=container=>{
    const allCnt=SYSTEMS.reduce((a,s)=>a+visibleCount(s.key),0)
    container.innerHTML=`
      <div class="side-label">Sistem Organ</div>
      <div class="side-item ${activeSys==='all'?'active':''}" onclick="setSys('all')">
        <span class="side-icon">📋</span><span class="side-name">Semua Sistem</span>
        <span class="side-count">${allCnt}</span>
      </div>
      <div class="side-divider"></div>
      ${SYSTEMS.map(s=>`<div class="side-item ${activeSys===s.key?'active':''}" onclick="setSys('${s.key}')">
        <span class="side-icon">${s.icon}</span><span class="side-name">${s.label}</span>
        <span class="side-count">${visibleCount(s.key)}</span>
      </div>`).join('')}`
  }
  mkItems(document.getElementById('sidebar'))
  mkItems(document.getElementById('overlayNav'))
}

function visibleCount(key){return(DATA[key]||[]).filter(t=>t.years.some(y=>activeYears.has(y))).length}

function setSys(key){
  activeSys=key
  document.getElementById('activeSysLabel').textContent=key==='all'?'Semua Sistem':(SYSTEMS.find(s=>s.key===key)||{}).label||''
  buildNav(); render(); closeOverlay()
  window.scrollTo({top:0,behavior:'smooth'})
}

function toggleYr(yr,btn){
  if(activeYears.has(yr)&&activeYears.size===1)return
  if(activeYears.has(yr)){activeYears.delete(yr);btn.className='yr-btn'}
  else{activeYears.add(yr);btn.className=`yr-btn on-${yr}`}
  buildNav(); render()
}

document.getElementById('searchInput').addEventListener('input',function(){
  searchQ=this.value.toLowerCase().trim()
  document.getElementById('searchClear').style.display=searchQ?'block':'none'
  render()
})
function clearSearch(){searchQ='';document.getElementById('searchInput').value='';document.getElementById('searchClear').style.display='none';render()}

function toggleCard(id){
  const c=document.getElementById('card_'+id)
  if(c) c.classList.toggle('open')
}

function saveCard(id,e){
  if(e)e.stopPropagation()
  const am=document.getElementById('am_'+id)?.value||''
  // Get ss from textarea (may be hidden if list view)
  const ssTa = document.getElementById('ss_'+id)
  const ss = ssTa ? ssTa.value : ''
  const dd=document.getElementById('dd_'+id)?.value||''
  const tx=document.getElementById('tx_'+id)?.value||''
  saveNote(id,{am,ss,dd,tx})
  const btn=document.getElementById('sb_'+id)
