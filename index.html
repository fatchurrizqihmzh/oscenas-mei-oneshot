<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSCE UKMPPD — Materi Bulan Mei</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── DARK MODE (default) ── */
:root{
  --bg:#0f1117;--s1:#161b27;--s2:#1e2335;--s3:#252a3d;
  --border:#2e3452;--border2:#3d4468;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --accent:#818cf8;--accent-bg:#1e1b4b;
  --green:#34d399;--green-bg:#022c22;
  --head-bg:rgba(15,17,23,.97);
  --r:10px;
  --tag2022-bg:#1a3354;--tag2022:#60a5fa;
  --tag2023-bg:#3a1d1d;--tag2023:#f87171;
  --tag2024-bg:#052e1e;--tag2024:#34d399;
  --tag2025-bg:#2a1060;--tag2025:#c084fc;
}

/* ── LIGHT MODE ── */
body.light{
  --bg:#F0F4FF;--s1:#FFFFFF;--s2:#F7F9FF;--s3:#EEF2FF;
  --border:#D4DBFF;--border2:#B8C4FF;
  --text:#1E2640;--text2:#4B5680;--text3:#8B95C0;
  --accent:#4F46E5;--accent-bg:#EEF2FF;
  --green:#059669;--green-bg:#ECFDF5;
  --head-bg:rgba(255,255,255,0.97);
  --tag2022-bg:#DBEAFE;--tag2022:#1D4ED8;
  --tag2023-bg:#FEE2E2;--tag2023:#B91C1C;
  --tag2024-bg:#D1FAE5;--tag2024:#065F46;
  --tag2025-bg:#F3E8FF;--tag2025:#6B21A8;
}

html{font-size:14px;scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* HEADER */
#header{position:sticky;top:0;z-index:100;background:var(--head-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;height:50px;transition:background .3s,border-color .3s}
.logo-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#818cf8,#c084fc);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0}
body.light .logo-icon{background:linear-gradient(135deg,#4F46E5,#7C3AED)}
.logo-text{font-weight:700;font-size:13.5px;color:var(--text);white-space:nowrap}
.logo-sub{font-size:9.5px;color:var(--text3);margin-top:-2px}
.search-wrap{flex:1;max-width:380px;margin:0 auto;position:relative}
.search-wrap input{width:100%;padding:7px 30px 7px 30px;background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:12.5px;outline:none;transition:all .2s}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent)}
.search-wrap input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;line-height:1;padding:0;display:none}
.header-right{display:flex;align-items:center;gap:6px;flex-shrink:0}

/* THEME SWITCH */
.theme-switch{
  display:flex;align-items:center;gap:5px;padding:5px 10px;
  background:var(--s2);border:1px solid var(--border);border-radius:20px;
  cursor:pointer;font-size:11.5px;font-weight:600;color:var(--text2);
  transition:all .2s;white-space:nowrap;
}
.theme-switch:hover{border-color:var(--accent);color:var(--accent)}

.btn-save-all{padding:6px 12px;background:linear-gradient(135deg,#818cf8,#c084fc);color:#fff;border:none;border-radius:8px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:opacity .2s}
body.light .btn-save-all{background:linear-gradient(135deg,#4F46E5,#7C3AED)}
.btn-save-all:hover{opacity:.85}

/* APP LAYOUT */
.app{display:flex;min-height:calc(100vh - 50px);width:100%}

/* SIDEBAR */
#sidebar{width:180px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--border);padding:8px 6px;position:sticky;top:50px;height:calc(100vh - 50px);overflow-y:auto;transition:background .3s,border-color .3s}
.side-label{padding:3px 8px 5px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.side-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:11.5px;color:var(--text2);transition:all .15s;margin-bottom:1px;user-select:none}
.side-item:hover{background:var(--s2);color:var(--text)}
.side-item.active{background:var(--accent-bg);color:var(--accent);font-weight:600}
.side-icon{font-size:14px;flex-shrink:0}
.side-name{flex:1;line-height:1.3}
.side-count{font-size:9.5px;font-weight:600;padding:1px 5px;border-radius:8px;background:var(--s3);color:var(--text3);flex-shrink:0}
.side-item.active .side-count{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.side-divider{height:1px;background:var(--border);margin:5px 0}

/* MAIN */
main{flex:1;padding:10px 12px;min-width:0;width:100%}

/* FILTER */
.filter-box{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:10px;transition:background .3s,border-color .3s}
.filter-top{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.filter-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-right:2px}
.yr-btn{padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
.yr-btn.on-2022{background:var(--tag2022-bg);color:var(--tag2022);border-color:var(--tag2022)}
.yr-btn.on-2023{background:var(--tag2023-bg);color:var(--tag2023);border-color:var(--tag2023)}
.yr-btn.on-2024{background:var(--tag2024-bg);color:var(--tag2024);border-color:var(--tag2024)}
.yr-btn.on-2025{background:var(--tag2025-bg);color:var(--tag2025);border-color:var(--tag2025)}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:5px}
.stat-num{font-size:17px;font-weight:700;letter-spacing:-.04em}
.stat-lbl{font-size:10.5px;color:var(--text3);font-weight:500}

/* SECTIONS */
.sys-section{margin-bottom:12px}
.sys-head{display:flex;align-items:center;gap:8px;padding:7px 11px;margin-bottom:5px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r);transition:background .3s}
body.light .sys-head{box-shadow:0 1px 4px rgba(79,70,229,.08)}
.sys-head h2{font-size:12.5px;font-weight:700;letter-spacing:-.01em}
.sys-count{margin-left:auto;font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:10px;background:var(--s3);color:var(--text3)}

/* CARDS */
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);margin-bottom:4px;transition:all .2s;overflow:hidden}
.card:hover{border-color:var(--border2)}
body.light .card{box-shadow:0 1px 3px rgba(0,0,0,.06)}
body.light .card:hover{box-shadow:0 2px 8px rgba(79,70,229,.12)}
.card.open{border-color:var(--accent)}
body.light .card.open{box-shadow:0 2px 12px rgba(79,70,229,.15)}
.card-head{display:flex;align-items:center;padding:9px 11px;cursor:pointer;gap:9px;user-select:none}
.card-arrow{width:20px;height:20px;border-radius:5px;background:var(--s3);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.card.open .card-arrow{background:var(--accent)}
.card-arrow svg{transition:transform .2s}
.card.open .card-arrow svg{transform:rotate(180deg)}
.card-info{flex:1;min-width:0}
.card-name{font-weight:600;font-size:12.5px;line-height:1.35;margin-bottom:4px}
.card-tags{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.tag{font-size:9.5px;padding:2px 7px;border-radius:10px;font-weight:600}
.tag-2022{background:var(--tag2022-bg);color:var(--tag2022)}
.tag-2023{background:var(--tag2023-bg);color:var(--tag2023)}
.tag-2024{background:var(--tag2024-bg);color:var(--tag2024)}
.tag-2025{background:var(--tag2025-bg);color:var(--tag2025)}
.tag-multi{background:color-mix(in srgb,#a78bfa 15%,transparent);color:#7C3AED;border:1px solid color-mix(in srgb,#a78bfa 30%,transparent)}
body.light .tag-multi{background:#F3E8FF;color:#6B21A8;border-color:#D8B4FE}
.tag-saved{background:var(--green-bg);color:var(--green)}
.dots{display:flex;gap:3px;flex-shrink:0}

/* CARD BODY */
.card-body{display:none;border-top:1px solid var(--border);padding:10px 12px 12px}
.card.open .card-body{display:block}
.anam-section{background:var(--s3);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;margin-bottom:10px}
body.light .anam-section{background:#F5F3FF;border-color:#C4B5FD}
.anam-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.anam-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.anam-item{display:flex;flex-direction:column;gap:2px}
.anam-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
.anam-val{font-size:11.5px;color:var(--text2);line-height:1.4}
.anam-full{grid-column:1/-1}
.ss-num{counter-reset:ss-counter}
.ss-num li{counter-increment:ss-counter;list-style:none;padding-left:0;display:flex;gap:6px;margin-bottom:3px;font-size:12px;line-height:1.45;color:var(--text)}
.ss-num li::before{content:counter(ss-counter)'.';color:var(--accent);font-weight:700;font-size:11px;flex-shrink:0;min-width:14px}
body.light .ss-num li{color:#1E2640}
body.light .ss-num li::before{color:#4F46E5}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.field-group{display:flex;flex-direction:column;gap:4px}
.field-label{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:4px}
.field-label.ss{color:#3B82F6}.field-label.dd{color:#F97316}.field-label.tx{color:#10B981}
body.light .field-label.ss{color:#1D4ED8}
body.light .field-label.dd{color:#C2410C}
body.light .field-label.tx{color:#059669}
textarea{width:100%;min-height:88px;padding:7px 9px;border-radius:7px;font-family:inherit;font-size:12px;line-height:1.55;resize:vertical;outline:none;color:var(--text);transition:all .2s}
.ss-ta{background:#0a1628;border:1px solid #1e3a5f}
.dd-ta{background:#1a0e04;border:1px solid #6b2d0a}
.tx-ta{background:#011a10;border:1px solid #064e3b}
body.light .ss-ta{background:#EFF6FF;border:1px solid #BFDBFE;color:#1E40AF}
body.light .dd-ta{background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412}
body.light .tx-ta{background:#ECFDF5;border:1px solid #A7F3D0;color:#065F46}
.ss-ta:focus{border-color:#60a5fa;box-shadow:0 0 0 2px rgba(96,165,250,.15)}
.dd-ta:focus{border-color:#fb923c;box-shadow:0 0 0 2px rgba(251,146,60,.15)}
.tx-ta:focus{border-color:#34d399;box-shadow:0 0 0 2px rgba(52,211,153,.15)}
body.light .ss-ta:focus{border-color:#3B82F6;box-shadow:0 0 0 2px rgba(59,130,246,.15)}
body.light .dd-ta:focus{border-color:#F97316;box-shadow:0 0 0 2px rgba(249,115,22,.15)}
body.light .tx-ta:focus{border-color:#10B981;box-shadow:0 0 0 2px rgba(16,185,129,.15)}
textarea::placeholder{color:var(--text3)}
.card-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.btn-reset{font-size:11.5px;padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s}
.btn-reset:hover{background:#FEE2E2;color:#991B1B;border-color:#FCA5A5}
.btn-save{font-size:11.5px;padding:5px 14px;border-radius:6px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;font-weight:600;transition:all .2s}
.btn-save:hover{opacity:.85}
.btn-save.flash{background:#059669}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:10px}

/* MOBILE BAR */
.mobile-bar{display:none;margin-bottom:10px}
.btn-menu{display:flex;align-items:center;gap:7px;padding:7px 12px;background:var(--s1);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500}

/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6)}
.overlay.show{display:block}
.overlay-sidebar{position:absolute;left:0;top:0;bottom:0;width:220px;background:var(--bg);padding:8px 6px;overflow-y:auto;border-right:1px solid var(--border)}

/* TOAST */
.am-section{margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:10px}
.am-label{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A855F7;display:flex;align-items:center;gap:4px;margin-bottom:4px}
body.light .am-label{color:#7C3AED}
.am-ta{background:#1a1040;border:1px solid #4c1d95}
body.light .am-ta{background:#FAF5FF;border:1px solid #DDD6FE;color:#4C1D95}
.am-ta:focus{border-color:#A855F7;box-shadow:0 0 0 2px rgba(168,85,247,.15)}
#toast{position:fixed;bottom:16px;right:16px;z-index:999;background:var(--s2);border:1px solid var(--accent);color:var(--text);padding:8px 16px;border-radius:8px;font-size:12.5px;font-weight:500;opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translateY(0)}

/* LIGHT SPECIAL STYLES */
body.light{background:linear-gradient(135deg,#F0F4FF 0%,#EEF2FF 50%,#F5F0FF 100%)}
body.light #header{border-bottom-color:#E0E7FF}
body.light #sidebar{border-right-color:#E0E7FF}
body.light .filter-box{border-color:#E0E7FF;box-shadow:0 1px 4px rgba(79,70,229,.08)}

/* MOBILE */
@media(max-width:768px){
  #sidebar{display:none}
  .mobile-bar{display:flex}
  .fields{grid-template-columns:1fr !important}
  main{padding:8px 10px}
  #header{padding:0 10px;height:48px;gap:8px}
  .logo-sub{display:none}
  .search-wrap{max-width:none}
  .btn-save-all{padding:5px 10px;font-size:11px}
  .theme-switch{padding:5px 8px;font-size:10.5px}
  .yr-btn{padding:3px 9px;font-size:10.5px}
  .card-head{padding:8px 10px}
  .card-body{padding:8px 10px 10px}
  .filter-box{padding:8px 10px}
  .sys-head{padding:6px 10px}
  .stat-num{font-size:15px}
  .card-name{font-size:12px}
  textarea{min-height:75px;font-size:11.5px}
  main{padding:8px}
  .overlay-sidebar{width:200px}
}
</style>
</head>
<body>
<div id="header">
  <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
    <div class="logo-icon">O</div>
    <div><div class="logo-text">OSCE UKMPPD</div><div class="logo-sub">Materi Bulan Mei 2022–2025</div></div>
  </div>
  <div class="search-wrap">
    <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
    <input type="text" id="searchInput" placeholder="Cari diagnosis, gejala, tatalaksana...">
    <button class="search-clear" id="searchClear" onclick="clearSearch()">×</button>
  </div>
  <div class="header-right">
    <button class="theme-switch" onclick="toggleTheme()" id="themeBtn">☀️ Light</button>
    <button class="btn-save-all" onclick="saveAll()">💾 Simpan</button>
  </div>
</div>
<div class="app">
  <div id="sidebar"></div>
  <div class="overlay" id="overlay" onclick="closeOverlay()">
    <div class="overlay-sidebar" id="overlayNav" onclick="event.stopPropagation()"></div>
  </div>
  <main>
    <div class="mobile-bar">
      <button class="btn-menu" onclick="openOverlay()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <span id="activeSysLabel">Semua Sistem</span>
      </button>
    </div>
    <div class="filter-box">
      <div class="filter-top">
        <span class="filter-label">Filter Tahun</span>
        <button class="yr-btn on-2022" onclick="toggleYr(2022,this)">Mei 2022</button>
        <button class="yr-btn on-2023" onclick="toggleYr(2023,this)">Mei 2023</button>
        <button class="yr-btn on-2024" onclick="toggleYr(2024,this)">Mei 2024</button>
        <button class="yr-btn on-2025" onclick="toggleYr(2025,this)">Mei 2025</button>
      </div>
      <div class="stats">
        <div class="stat"><span class="stat-num" id="statTotal" style="color:var(--accent)">0</span><span class="stat-lbl">Total Topik</span></div>
        <div class="stat"><span class="stat-num" id="statMulti" style="color:#c084fc">0</span><span class="stat-lbl">Muncul &gt;1 Tahun</span></div>
        <div class="stat"><span class="stat-num" id="statFilled" style="color:var(--green)">0</span><span class="stat-lbl">Sudah Diisi</span></div>
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>
<div id="toast"></div>

<script>
const SYSTEMS=[
  {key:'saraf',label:'Saraf',icon:'🧠'},
  {key:'psikiatri',label:'Psikiatri',icon:'💭'},
  {key:'indera',label:'Indera',icon:'👁'},
  {key:'respirasi',label:'Respirasi',icon:'🫁'},
  {key:'kardio',label:'Kardiovaskular',icon:'❤️'},
  {key:'gastro',label:'Gastrointestinal',icon:'🫄'},
  {key:'ginjal',label:'Ginjal & Saluran Kemih',icon:'💧'},
  {key:'obgyn',label:'Obgyn',icon:'🌸'},
  {key:'endokrin',label:'Endokrin & Metabolisme',icon:'⚡'},
  {key:'hemato',label:'Hemato, Imunologi & Infeksi',icon:'🦠'},
  {key:'musku',label:'Muskuloskeletal',icon:'🦴'},
  {key:'integumen',label:'Integumen',icon:'🩹'},
]

const DATA={
saraf:[
{id:'migrain',name:'Classic Migrain',years:[2022],ss:'Nyeri kepala unilateral pulsatil intensitas sedang-berat, memburuk dengan aktivitas. Mual/muntah, foto/fonofobia. Aura: gejala neurologis reversibel <60 menit sebelum nyeri.',dd:'TTH, Cluster headache, Neuralgia trigeminal, SAH (thunderclap)',tx:'Serangan: Sumatriptan 50mg atau NSAID+Metoklopramid. Profilaksis ≥4x/bulan: Propranolol 2x40mg atau Topiramat.',am:'IDENTITAS: Usia 15-55 th, perempuan lebih sering (3:1)\n\nKELUHAN UTAMA: Nyeri kepala\n\nSACRED 7:\n1. Lokasi: Satu sisi kepala (unilateral), bisa berpindah sisi\n2. Onset/Kronologi: Mendadak, berlangsung 4-72 jam, episodik\n3. Kuantitas: Intensitas sedang-berat, mengganggu aktivitas\n4. Kualitas: Berdenyut/pulsatil "seperti dipompa"\n5. Faktor pemberat: Aktivitas fisik, cahaya terang, suara keras, bau menyengat\n6. Faktor peringan: Istirahat di tempat gelap dan tenang, tidur\n7. Gejala penyerta: Mual/muntah, fotofobia, fonofobia. Aura: kilatan cahaya, skotoma 20-30 menit sebelum nyeri\n\nFUNDAMENTAL 4:\n1. RPS: Onset, durasi, frekuensi serangan/bulan, ada/tidak aura\n2. RPD: Riwayat migrain sebelumnya, obat yang dipakai, kontrasepsi hormonal\n3. RPK: Migrain sering familial (ibu/saudara perempuan)\n4. Sos-Ek: Stres kerja/kuliah, pola tidur, konsumsi kafein/alkohol/rokok, siklus menstruasi'},
{id:'tth',name:'TTH (Tension-Type Headache)',years:[2022],ss:'Nyeri kepala bilateral menekan/mengikat (non-pulsatil), intensitas ringan-sedang. Tidak memburuk dengan aktivitas. Max 1 dari: mual, fotofobia, fonofobia.',dd:'Migren tanpa aura, Cluster headache, Nyeri kepala servikal, SAH',tx:'Episodik: Parasetamol 500-1000mg atau Ibuprofen 400mg. Kronis: Amitriptilin 10-25mg malam. Manajemen stres.',am:'IDENTITAS: Dewasa, tidak ada predileksi gender bermakna\n\nKELUHAN UTAMA: Kepala terasa berat/tertekan\n\nSACRED 7:\n1. Lokasi: Bilateral (kedua sisi), seperti "diikat tali" melingkar\n2. Onset/Kronologi: Perlahan, berlangsung 30 menit - 7 hari\n3. Kuantitas: Intensitas ringan-sedang\n4. Kualitas: Menekan/mengikat, tidak berdenyut\n5. Faktor pemberat: Stres, kelelahan, postur buruk (leher kaku), kurang tidur\n6. Faktor peringan: Istirahat, pijat leher/bahu, parasetamol\n7. Gejala penyerta: Maksimal 1 dari: mual, fotofobia, atau fonofobia (tidak keduanya sekaligus)'},
{id:'bppv',name:'BPPV',years:[2022,2023],ss:'Vertigo posisional episodik <1 menit dipicu perubahan posisi kepala. Dix-Hallpike (+), nistagmus geotropik. TIDAK ada tuli/tinitus.',dd:'Vestibular neuritis, Meniere disease, Stroke serebelar, Labirintitis',tx:'Manuver Epley (kanal posterior). Betahistin 2x16mg jika perlu. Edukasi hindari posisi pemicu.',am:'IDENTITAS: Usia 40-60 th, perempuan lebih sering\n\nKELUHAN UTAMA: Pusing berputar saat berganti posisi\n\nSACRED 7:\n1. Lokasi: Kepala (rasa berputar subjektif/vertigo)\n2. Onset/Kronologi: Mendadak saat perubahan posisi kepala, berlangsung <1 menit\n3. Kuantitas: Episodik, hilang sendiri dalam <1 menit\n4. Kualitas: Rasa berputar (vertigo), bukan pusing melayang/bergoyang\n5. Faktor pemberat: Bangun dari tidur, berbaring, menoleh kanan/kiri, menunduk\n6. Faktor peringan: Diam tidak bergerak, duduk tegak\n7. Gejala penyerta: Mual, kadang muntah. TIDAK ada tuli, tinitus, atau nyeri kepala\n\nFUNDAMENTAL 4:\n1. RPS: Posisi apa yang memicu, sudah berapa hari, pernah manuver sebelumnya\n2. RPD: Riwayat trauma kepala, infeksi telinga, riwayat BPPV sebelumnya\n3. RPK: Tidak spesifik\n4. Sos-Ek: Aktivitas sehari-hari yang terdampak'},
{id:'bells_palsy',name:"Bell's Palsy",years:[2022],ss:'Paresis wajah unilateral perifer akut - DAHI IKUT LEMAH (beda lesi sentral). Hiperakusis, gangguan pengecapan 2/3 anterior lidah.',dd:'Stroke sentral (dahi tidak terlibat), Ramsay Hunt (ada vesikel telinga), Tumor parotis',tx:'Prednison 1mg/kgBB/hari x5 hari tapering. Ramsay Hunt: + Asiklovir 5x800mg x7 hari. Pelindung mata: air mata buatan.',am:'IDENTITAS: Usia 15-45 th, tidak ada predileksi gender\n\nKELUHAN UTAMA: Wajah mencong/tidak bisa menutup mata sebelah\n\nSACRED 7:\n1. Lokasi: Wajah satu sisi (unilateral), seluruh wajah termasuk DAHI\n2. Onset/Kronologi: Mendadak, memburuk dalam 48-72 jam, sering pagi hari bangun tidur\n3. Kuantitas: Paresis parsial atau paralisis total\n4. Kualitas: Wajah terkulai, tidak bisa menutup mata, sudut mulut turun\n5. Faktor pemberat: Paparan dingin/angin malam sebelumnya\n6. Faktor peringan: -\n7. Gejala penyerta: Telinga terasa penuh, hiperakusis, gangguan pengecapan 2/3 anterior lidah, mata berair/kering\n\nFUNDAMENTAL 4:\n1. RPS: Kapan mulai, apakah ada kelemahan anggota gerak (jika ada → curiga stroke bukan Bell\'s)\n2. RPD: Riwayat herpes, DM, hipertensi (faktor risiko)\n3. RPK: Tidak familial\n4. Sos-Ek: Tidur dekat jendela/AC, bepergian jauh malam hari'},
{id:'hnp',name:'HNP Lumbal',years:[2022,2025],ss:'Nyeri punggung bawah menjalar ke tungkai sesuai dermatom. SLR/Laseque (+) <60°. Defisit motorik/sensorik/refleks sesuai level. MRI: herniasi diskus.',dd:'Stenosis kanal spinalis, Tumor intradural, Piriformis syndrome, Spondilitis TB',tx:'Konservatif 6 minggu: NSAID, relaksan otot, fisioterapi McKenzie. Gagal/kauda ekuina: diskektomi.',am:'IDENTITAS: Usia 30-50 th, pekerja berat atau kantoran postur buruk\n\nKELUHAN UTAMA: Nyeri pinggang menjalar ke kaki\n\nSACRED 7:\n1. Lokasi: Punggung bawah menjalar ke paha, betis, telapak kaki (sesuai dermatom L4/L5/S1)\n2. Onset/Kronologi: Mendadak (setelah angkat berat) atau perlahan kronik >3 bulan\n3. Kuantitas: Bisa sangat berat, mengganggu tidur\n4. Kualitas: Seperti "kesetrum"/terbakar, menjalar mengikuti jalur saraf (radikular)\n5. Faktor pemberat: Batuk, bersin, mengejan, duduk lama, membungkuk\n6. Faktor peringan: Berbaring, istirahat, posisi lutut ditekuk\n7. Gejala penyerta: Kesemutan/baal di kaki, kelemahan kaki, gangguan BAK/BAB (kauda ekuina = DARURAT!)\n\nFUNDAMENTAL 4:\n1. RPS: Red flag: penurunan BB, demam (tumor/infeksi), trauma (fraktur), inkontinensia\n2. RPD: Riwayat nyeri pinggang sebelumnya, pekerjaan fisik berat\n3. RPK: Riwayat nyeri punggung familial\n4. Sos-Ek: Pekerjaan (angkat berat/duduk lama), olahraga, merokok (risiko degenerasi diskus)'},
{id:'lbp_hnp',name:'LBP e.c Susp. HNP',years:[2023],ss:'Nyeri pinggang bawah kronik diperberat aktivitas. Palpasi otot paravertebral spasme (+). Evaluasi red flag (tumor, infeksi, fraktur).',dd:'HNP, Spondilitis TB, Fraktur kompresi, Tumor vertebra, Miofasial pain',tx:'NSAID, fisioterapi McKenzie, edukasi posisi, penurunan BB. MRI jika red flag.',am:'IDENTITAS: Usia 30-50 th, pekerja berat atau kantoran postur buruk\n\nKELUHAN UTAMA: Nyeri pinggang menjalar ke kaki\n\nSACRED 7:\n1. Lokasi: Punggung bawah menjalar ke paha, betis, telapak kaki (sesuai dermatom L4/L5/S1)\n2. Onset/Kronologi: Mendadak (setelah angkat berat) atau perlahan kronik >3 bulan\n3. Kuantitas: Bisa sangat berat, mengganggu tidur\n4. Kualitas: Seperti "kesetrum"/terbakar, menjalar mengikuti jalur saraf (radikular)\n5. Faktor pemberat: Batuk, bersin, mengejan, duduk lama, membungkuk\n6. Faktor peringan: Berbaring, istirahat, posisi lutut ditekuk\n7. Gejala penyerta: Kesemutan/baal di kaki, kelemahan kaki, gangguan BAK/BAB (kauda ekuina = DARURAT!)\n\nFUNDAMENTAL 4:\n1. RPS: Red flag: penurunan BB, demam (tumor/infeksi), trauma (fraktur), inkontinensia\n2. RPD: Riwayat nyeri pinggang sebelumnya, pekerjaan fisik berat\n3. RPK: Riwayat nyeri punggung familial\n4. Sos-Ek: Pekerjaan (angkat berat/duduk lama), olahraga, merokok (risiko degenerasi diskus)'},
{id:'spondilitis_tb',name:'Spondilitis TB',years:[2023,2025],ss:'Nyeri punggung kronis progresif, GIBBUS (kifosis angular - khas TB). Demam subfebris, keringat malam, BB turun. MRI: destruksi vertebra + cold abscess.',dd:'Osteomyelitis piogenik, Metastasis vertebra, Fraktur kompresi osteoporosis, Myeloma',tx:'OAT Kategori I: 2RHZE/10RH. Imobilisasi korset. Operasi jika defisit neurologis/instabilitas.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'meniere',name:'Meniere Disease',years:[2023,2025],ss:'TRIAS: (1) Vertigo episodik 20 menit-jam (2) Tuli sensorineural fluktuatif frekuensi rendah (3) Tinitus. Aural fullness. Audiogram: tuli frekuensi rendah.',dd:'BPPV (tanpa tuli/tinitus), Vestibular migrain, Neuroma akustik, TIA vertebrobasiler',tx:'Diet rendah garam <2g/hari, hindari kafein/alkohol. Betahistin 3x16-24mg. Serangan akut: Diazepam 5mg. Diuretik HCT.',am:'IDENTITAS: Usia 40-60 th, tidak ada predileksi gender bermakna\n\nKELUHAN UTAMA: Pusing berputar disertai telinga berdenging dan pendengaran berkurang\n\nSACRED 7:\n1. Lokasi: Telinga satu sisi (unilateral), disertai rasa berputar\n2. Onset/Kronologi: Episodik, berlangsung 20 menit hingga beberapa jam, frekuensi bervariasi\n3. Kuantitas: Berat, mengganggu aktivitas, disertai mual/muntah\n4. Kualitas: Vertigo berputar + tinitus (berdenging) + tuli fluktuatif (3 sekaligus = TRIAS Meniere)\n5. Faktor pemberat: Asupan garam tinggi, kafein, alkohol, stres\n6. Faktor peringan: Istirahat, diet rendah garam\n7. Gejala penyerta: Rasa penuh/tertekan di telinga (aural fullness), mual, muntah, berkeringat\n\nFUNDAMENTAL 4:\n1. RPS: Sudah berapa episode, durasi tiap episode, apakah tuli sudah permanen\n2. RPD: Riwayat infeksi telinga, trauma kepala, riwayat vertigo sebelumnya\n3. RPK: Tidak spesifik\n4. Sos-Ek: Pola makan (asupan garam), stres, kafein, alkohol'},
{id:'demensia',name:'Demensia Alzheimer',years:[2023],ss:'Gangguan memori jangka pendek progresif, disorientasi, penurunan fungsi eksekutif. MMSE turun. Onset >60 tahun. Singkirkan penyebab reversibel.',dd:'Demensia vaskular, LBD, FTD, Depresi, MCI, Hipotiroid, B12 defisiensi',tx:'Non-farmako: stimulasi kognitif. Farmako: Donepezil 5-10mg malam (AChEI). Memantine untuk sedang-berat.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'tia',name:'TIA',years:[2023],ss:'Defisit neurologis fokal REVERSIBEL <24 jam (biasanya <1 jam). CT/MRI normal. ABCD2 score untuk risiko stroke lanjutan.',dd:'Stroke iskemik, Hipoglikemia, Migrain dengan aura, Seizure fokal (Todd paralysis)',tx:'Antiplatelet ganda (Aspirin+Clopidogrel) segera x21 hari. Statin. Kontrol faktor risiko. Rawat inap 24-48 jam.',am:'IDENTITAS: Usia >55 th, lebih sering pria, faktor risiko vaskular\n\nKELUHAN UTAMA: Tiba-tiba tidak bisa bicara / anggota gerak lemah sebelah\n\nSACRED 7:\n1. Lokasi: Satu sisi tubuh (hemiparesis), bicara (afasia), atau penglihatan\n2. Onset/Kronologi: MENDADAK dalam detik-menit, saat aktivitas atau bangun tidur\n3. Kuantitas: Kelemahan parsial hingga paralisis total\n4. Kualitas: Wajah/lengan/tungkai lemah atau mati rasa sebelah, bicara pelo/tidak bisa bicara\n5. Faktor pemberat: Aktivitas fisik berat, emosi kuat sebelumnya\n6. Faktor peringan: -\n7. Gejala penyerta: Sakit kepala hebat mendadak (perdarahan), penurunan kesadaran, kejang, mual\n\nFUNDAMENTAL 4:\n1. RPS: WAKTU ONSET TEPAT (golden period 4.5 jam untuk trombolisis!), FAST (Face-Arm-Speech-Time)\n2. RPD: Hipertensi, DM, dislipidemia, riwayat stroke/TIA, fibrilasi atrial, merokok\n3. RPK: Riwayat stroke, hipertensi, DM dalam keluarga\n4. Sos-Ek: Merokok, alkohol, obesitas, sedentary lifestyle, stres'},
{id:'stroke',name:'Stroke Iskemik',years:[2023],ss:'Defisit neurologis fokal mendadak: hemiparesis, afasia, hemianopsia. FAST: Face, Arm, Speech, Time. CT non-kontras awal normal/hipodens. Tanda UMN.',dd:'TIA, Stroke hemoragik (CT hiperdens), Ensefalitis, Hipoglikemia, Todd paralysis',tx:'<4.5 jam: rtPA 0.9mg/kgBB IV. Antiplatelet: Aspirin 325mg. Statin. Kontrol faktor risiko. Rehabilitasi dini.',am:'IDENTITAS: Usia >55 th, lebih sering pria, faktor risiko vaskular\n\nKELUHAN UTAMA: Tiba-tiba tidak bisa bicara / anggota gerak lemah sebelah\n\nSACRED 7:\n1. Lokasi: Satu sisi tubuh (hemiparesis), bicara (afasia), atau penglihatan\n2. Onset/Kronologi: MENDADAK dalam detik-menit, saat aktivitas atau bangun tidur\n3. Kuantitas: Kelemahan parsial hingga paralisis total\n4. Kualitas: Wajah/lengan/tungkai lemah atau mati rasa sebelah, bicara pelo/tidak bisa bicara\n5. Faktor pemberat: Aktivitas fisik berat, emosi kuat sebelumnya\n6. Faktor peringan: -\n7. Gejala penyerta: Sakit kepala hebat mendadak (perdarahan), penurunan kesadaran, kejang, mual\n\nFUNDAMENTAL 4:\n1. RPS: WAKTU ONSET TEPAT (golden period 4.5 jam untuk trombolisis!), FAST (Face-Arm-Speech-Time)\n2. RPD: Hipertensi, DM, dislipidemia, riwayat stroke/TIA, fibrilasi atrial, merokok\n3. RPK: Riwayat stroke, hipertensi, DM dalam keluarga\n4. Sos-Ek: Merokok, alkohol, obesitas, sedentary lifestyle, stres'},
{id:'trauma_ms',name:'Trauma Medulla Spinalis + Fraktur Kompresi',years:[2024],ss:'Riwayat trauma. Defisit neurologis bawah level lesi: paraplegia/tetraplegia, gangguan sensorik, disfungsi bladder/bowel. ASIA scale.',dd:'HNP berat, Tumor medula, Myelitis, Perdarahan spinal, Brown-Sequard',tx:'Imobilisasi segera. O2, IVFD. Operasi dekompresi+stabilisasi jika unstable. Rehabilitasi intensif.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'meningoensefalitis',name:'Meningoensefalitis',years:[2024],ss:'Demam tinggi, nyeri kepala hebat, KAKU KUDUK (+), fotofobia, penurunan kesadaran. Kernig/Brudzinski (+). LP: pleositosis, protein tinggi, glukosa rendah.',dd:'Meningitis TB, Abses otak, SAH, Ensefalitis viral, Stroke hemoragik',tx:'Deksametason IV SEBELUM antibiotik. Empiris: Seftriakson 2g/12j + Ampisilin. Viral: Asiklovir IV.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'neuropati_dm',name:'Neuropati Perifer e.c DM Tipe 2',years:[2025],ss:'Kesemutan/rasa terbakar/baal simetris dimulai telapak kaki ("glove and stocking"). Refleks patela/achilles turun. NCS: amplitudo turun, kecepatan hantaran turun.',dd:'Neuropati alkoholik, B12 defisiensi, Hipotiroid, GBS, CKD',tx:'Kontrol glikemik ketat (HbA1c <7%). Pregabalin 2x75mg atau Gabapentin. Amitriptilin 25mg malam. Mekobalamin.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'tarsal_tunnel',name:'Tarsal Tunnel Syndrome',years:[2025],ss:'Nyeri/baal/kesemutan telapak kaki medial dan jari-jari kaki. Tinel sign (+) belakang malleolus medial. Diperberat berdiri lama. NCS: perlambatan saraf tibialis posterior.',dd:'Plantar fasciitis, Neuropati perifer, Ankle sprain, Radikulopati L5-S1',tx:'Orthotik, NSAID, injeksi kortikosteroid lokal, fisioterapi. Gagal: dekompresi bedah saraf tibialis posterior.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},

{id:'ptsd',name:'PTSD',years:[2022,2023,2025],ss:'Riwayat trauma berat. Re-experiencing: flashback, mimpi buruk. Avoidance: hindari hal terkait trauma. Hyperarousal: mudah kaget, insomnia, iritabel. Gejala >1 bulan.',dd:'GAD, Depresi mayor, Gangguan adaptasi, Acute stress disorder (<1 bulan)',tx:'TF-CBT lini 1, EMDR. Farmakoterapi: Sertralin 50-200mg atau Paroxetin (SSRI). Hindari benzodiazepin jangka panjang.',am:'IDENTITAS: Semua usia, sering perempuan, setelah peristiwa traumatik\n\nKELUHAN UTAMA: Ketakutan/mimpi buruk berkepanjangan setelah kejadian traumatik\n\nSACRED 7:\n1. Lokasi: Psikologis/mental\n2. Onset/Kronologi: Gejala muncul >1 bulan setelah paparan trauma\n3. Kuantitas: Mengganggu kehidupan sehari-hari dan pekerjaan\n4. Kualitas: Flashback (mengulang kejadian), mimpi buruk, menghindari hal terkait trauma, waspada berlebihan\n5. Faktor pemberat: Pengingat trauma (suara, bau, tempat), stres tambahan\n6. Faktor peringan: Dukungan sosial, psikoterapi\n7. Gejala penyerta: Insomnia, mudah marah, sulit konsentrasi, merasa terasing, kehilangan minat aktivitas\n\nFUNDAMENTAL 4:\n1. RPS: Peristiwa traumatik apa (tidak perlu detail), kapan, sudah pernah konsultasi ke profesional?\n2. RPD: Riwayat trauma sebelumnya, gangguan jiwa, penggunaan zat/alkohol\n3. RPK: Riwayat gangguan jiwa dalam keluarga\n4. Sos-Ek: Dukungan keluarga/sosial, pekerjaan, status menikah, penggunaan alkohol/NAPZA'},
{id:'baby_blues',name:'Baby Blues / Depresi Postpartum',years:[2023,2025],ss:'Baby blues: mood labil, mudah menangis, kelelahan, 2-3 hari postpartum, <2 minggu, SELF-LIMITING. Depresi PP: depresi mayor >2 minggu postpartum. EPDS ≥13.',dd:'Baby blues vs Depresi PP vs Psikosis PP (bingung, halusinasi - DARURAT). Hipotiroid postpartum.',tx:'Baby blues: suportif, edukasi. Depresi PP: Sertralin (aman ASI) + CBT/IPT. Psikosis PP: rawat inap + antipsikotik.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},

{id:'skizoafektif',name:'Skizoafektif Tipe Depresi',years:[2024],ss:'Gejala psikotik (halusinasi/waham) + episode depresi mayor bersamaan, dengan periode psikosis tanpa mood episode ≥2 minggu.',dd:'Skizofrenia + depresi terpisah, Bipolar dengan psikosis, Depresi psikotik',tx:'Antipsikotik + antidepresan. Atau Quetiapine (efektif keduanya). Lithium augmentasi.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},

{id:'blefaritis',name:'Blefaritis',years:[2022,2024],ss:'Inflamasi kronik tepi kelopak mata. Merah, bersisik, krusta di pangkal bulu mata, gatal, sensasi terbakar. Tipe anterior (stafilokokal/seboroik) atau posterior (disfungsi Meibom).',dd:'Konjungtivitis alergi, Dry eye syndrome, Rosacea okular, Demodex',tx:'Kompres hangat 5-10 menit + masase + bersihkan tepi kelopak 2x/hari. Antibiotik topikal (Eritromisin salep). Posterior: Doksisiklin 2x100mg x6-12 minggu.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'episkleritis',name:'Episkleritis',years:[2022,2023],ss:'Kemerahan segmen episklera, nyeri ringan, visus normal, tidak ada sekret. Penekanan menghilangkan kemerahan (beda skleritis). Bisa unilateral atau bilateral.',dd:'Skleritis (nyeri berat, visus turun), Konjungtivitis, Uveitis anterior, Pterigium meradang',tx:'Self-limiting. NSAID topikal (Ketorolak) atau oral. Kortikosteroid topikal jika berat. Evaluasi penyakit sistemik (RA, SLE).',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'dry_eye',name:'Dry Eye Syndrome',years:[2022],ss:'Sensasi terbakar, berpasir, gatal, epifora paradoks. TBUT <10 detik, Schirmer test <5mm/5 menit. Diperberat AC, screen time, usia lanjut.',dd:'Blefaritis, Konjungtivitis alergi, Defisiensi Vit A, Sindrom Sjogren, Rosacea okular',tx:'Air mata buatan (CMC/HA) 4-6x/hari. Omega-3. Cyclosporin topikal jika berat. Kurangi screen time. Humidifier.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'blefarokonj',name:'Blefarokonjungtivitis Bakteri',years:[2024],ss:'Kelopak merah bersisik + mata merah dengan sekret mukopurulen. Gabungan blefaritis dan konjungtivitis bakteri. Pseudomembran (-). Visus normal.',dd:'Konjungtivitis viral, Konjungtivitis alergi, Blefaritis saja, Dakriosistitis',tx:'Antibiotik topikal: Kloramfenikol/Gentamisin tetes 4x/hari x7 hari. Kompres hangat, bersihkan sekret.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'hifema',name:'Hifema Grade II',years:[2024],ss:'Darah dalam COA mengisi 1/3-1/2 setelah trauma tumpul. Visus turun. Nyeri. Risiko TIO meningkat, glaukoma sekunder.',dd:'Hifema grade lain, Uveitis anterior, Iridosiklitis',tx:'Tirah baring kepala 45°, eye shield, tidak mengucek mata. Kortikosteroid topikal. Monitor TIO. Rujuk SpM. Hindari Aspirin/NSAID.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'laserasi_pal',name:'Laserasi Palpebra',years:[2024],ss:'Luka terbuka kelopak mata akibat trauma. Perhatikan keterlibatan margo palpebra, kanalikulus lakrimal (medial), jaringan tarsal.',dd:'Avulsi palpebra, Trauma bola mata, Fraktur orbita',tx:'Eksplorasi, irigasi, debridement minimal. Sederhana: hecting lapis demi lapis. Kanalikulus/full thickness: rujuk SpM. Profilaksis tetanus.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'uveitis',name:'Uveitis Anterior',years:[2023],ss:'Mata merah perikorneal (sirkumkorneal flush), nyeri, fotofobia, visus turun. KP pada endotel, cells & flare di COA, miosis. Umumnya unilateral.',dd:'Glaukoma akut sudut tertutup, Konjungtivitis, Episkleritis, Endoftalmitis',tx:'Kortikosteroid topikal (Prednisolon asetat 1%). Siklopegik (Atropin 1%). Cari penyebab sistemik (HLA-B27, TB, sifilis). Rujuk SpM.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'keratitis',name:'Keratitis Bakteri',years:[2023],ss:'Nyeri mata hebat, fotofobia, blefarospasme, sekret purulen, visus turun. Ulkus kornea dengan infiltrat putih/abu. Pengguna lensa kontak tersering.',dd:'Keratitis HSV (dendritik), Keratitis jamur, Ulkus Mooren, Erosi kornea rekuren',tx:'Antibiotik topikal intensif: Moxifloksasin/Siprofloksasin tetes setiap jam. Siklopegik. TIDAK kortikosteroid awal. Rawat inap jika berat.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'oma_supuratif',name:'OMA (Otitis Media Akut) Supuratif',years:[2022,2025],ss:'Nyeri telinga mendadak, demam, riwayat ISPA. Otoskopi: MT merah, bulging, opak. Stadium supuratif: perforasi MT dengan sekret purulen. Pendengaran turun konduktif.',dd:'OMA serosa, OMSK, Otitis eksterna, Mastoiditis (komplikasi)',tx:'Amoksisilin 3x500mg x7-10 hari. Analgetik. Jika perforasi: AB tetes topikal. Miringotomi jika tidak respons.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'ome',name:'Otitis Media Efusi',years:[2025],ss:'Pendengaran turun TANPA nyeri atau demam. Otoskopi: MT suram, retraksi, air-bubble sign, light reflex hilang. Tympanogram tipe B. Sering pada anak pasca ISPA.',dd:'OMA stadium awal, Disfungsi tuba eustachius, Kolesteatoma',tx:'Watchful waiting 3 bulan. Miringotomi + grommet jika persisten >3 bulan atau bilateral.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'miringitis',name:'Miringitis Bullosa',years:[2023],ss:'Nyeri telinga mendadak sangat hebat, demam, bulla hemoragik pada membran timpani dan liang telinga medial. Pendengaran sedikit turun. Sering bersamaan influenza.',dd:'OMA, Otitis eksterna bulosa, Ramsay Hunt (Herpes zoster otikus)',tx:'Analgetik kuat (NSAID/opioid). Antibiotik (Amoksisilin-klavulanat). Bulla dapat dipecah untuk mengurangi nyeri.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'mastoiditis',name:'Mastoiditis ec OMSK',years:[2023],ss:'Nyeri/pembengkakan retroaurikuler, aurikula terdorong ke depan-bawah. Demam, sekret purulen kronik. CT mastoid: erosi mastoid. Komplikasi OMSK.',dd:'Adenitis retroaurikuler, Abses retroaurikuler, Selulitis, Parotitis',tx:'Rawat inap. Seftriakson 2g/24j IV. Mastoidektomi segera. Drainase abses jika ada.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'rhinitis_alergi',name:'Rhinitis Alergi',years:[2022],ss:'Bersin berulang, rhinorrhea encer, hidung tersumbat, gatal hidung/mata. Dipicu alergen. Sering disertai konjungtivitis. Skin prick test (+).',dd:'Rhinitis vasomotor, Rhinitis infeksi, Polip nasal',tx:'Hindari alergen. Antihistamin oral generasi 2 (Loratadin/Cetirizin). Steroid intranasal (Flutikason) - paling efektif.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'rhinitis_vasomotor',name:'Rhinitis Vasomotor',years:[2023],ss:'Hidung tersumbat dan rhinorrhea tanpa penyebab alergi/infeksi. Dipicu perubahan suhu, bau, asap, stres. Tes alergi negatif.',dd:'Rhinitis alergi (skin test +), Rhinitis medikamentosa, Polip nasal',tx:'Hindari trigger. Ipratropium bromida topikal. Salin nasal. Dekongestan max 5 hari.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'miopia',name:'Miopia',years:[2025],ss:'Kabur melihat jauh, jelas melihat dekat. Axis bola mata terlalu panjang. Dikoreksi dengan lensa sferis negatif (konkaf).',dd:'Presbiopia, Astigmatisme, Anisometropia, Ambliopia',tx:'Kacamata lensa sferis negatif. Lensa kontak. Lasik jika ≥18 tahun dan refraksi stabil.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'presbiopia',name:'Presbiopia',years:[2025],ss:'Pandangan dekat kabur pada usia ≥40 tahun. Perlu memperpanjang lengan untuk membaca (arm-length reading). Penurunan elastisitas lensa.',dd:'Hipermetropia, Katarak stadium awal',tx:'Kacamata baca lensa sferis positif (+1.0 s/d +3.0 sesuai usia). Kacamata bifokal/progresif jika ada kelainan refraksi lain.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'astigmatisme',name:'Astigmatisme',years:[2025],ss:'Penglihatan kabur/distorsi semua jarak. Kornea tidak sferis (torik). Mata cepat lelah, sakit kepala. Dikoreksi dengan lensa silindris.',dd:'Miopia, Hipermetropia, Keratokonus, Astigmatisme ireguler',tx:'Kacamata lensa silindris. Lensa kontak torik. Lasik/PRK untuk astigmatisme reguler.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},

respirasi:[
{id:'asma',name:'Asma',years:[2022],ss:'Mengi episodik, sesak napas, dada berat, batuk terutama malam/dini hari. Reversibel dengan bronkodilator. Riwayat atopi. Uji bronkodilator: VEP1 naik ≥12%.',dd:'PPOK, Gagal jantung (cardiac asthma), Bronkiolitis anak, Benda asing',tx:'Ringan: SABA inhalasi (Salbutamol). Sedang-berat: SABA + kortikosteroid sistemik + oksigen. Pemeliharaan: ICS ± LABA.',am:'IDENTITAS: Semua usia, sering mulai anak-anak, riwayat atopi (alergi, eksim)\n\nKELUHAN UTAMA: Sesak napas disertai bunyi ngik-ngik (mengi)\n\nSACRED 7:\n1. Lokasi: Saluran napas bawah (dada terasa sesak)\n2. Onset/Kronologi: Episodik, sering malam/dini hari atau setelah terpapar trigger\n3. Kuantitas: Ringan-sangat berat (sampai tidak bisa bicara sepatah kata)\n4. Kualitas: Sesak napas + bunyi MENGI (wheezing) saat ekspirasi, dada terasa berat seperti "ditekan"\n5. Faktor pemberat: Debu, asap rokok/polusi, bulu binatang, serbuk sari, olahraga berat, cuaca dingin, ISPA, stres, aspirin/NSAID\n6. Faktor peringan: Bronkodilator inhaler (salbutamol), menjauh dari trigger\n7. Gejala penyerta: Batuk kering (terutama malam), rinitis alergi, eksim (dermatitis atopi)\n\nFUNDAMENTAL 4:\n1. RPS: Serangan seberapa sering, apa yang memicu, sudah ada inhaler, pernah rawat inap karena sesak?\n2. RPD: Riwayat asma, eksim, alergi makanan/obat\n3. RPK: Riwayat asma/alergi/atopi dalam keluarga\n4. Sos-Ek: Lingkungan (hewan peliharaan, karpet, kasur lama), merokok aktif/pasif, pekerjaan (debu/kimia), olahraga'},
{id:'ppok',name:'PPOK Eksaserbasi Akut',years:[2022,2023,2024],ss:'Riwayat PPOK (merokok, batuk produktif kronis). Eksaserbasi: naik dispnea, naik volume/purulensi sputum (Anthonisen). SpO2 turun. Barrel chest, hipersonor, suara napas turun.',dd:'Gagal jantung akut, Pneumonia, Pneumotoraks, Emboli paru',tx:'O2 terkontrol (SpO2 88-92%). SABA+SAMA nebulisasi. Prednison 40mg/hari x5 hari. Antibiotik jika infeksi. Pertimbangkan NIPPV.',am:'IDENTITAS: Usia >40 th, PEROKOK berat (>10 pack-year), laki-laki lebih sering\n\nKELUHAN UTAMA: Sesak memberat, dahak tambah banyak dan berubah warna\n\nSACRED 7:\n1. Lokasi: Paru (dada)\n2. Onset/Kronologi: Riwayat batuk berdahak kronik >3 bulan/tahun selama >2 tahun. Saat ini eksaserbasi akut\n3. Kuantitas: Sesak saat aktivitas ringan atau istirahat, mMRC grade 3-4\n4. Kualitas: Sesak makin berat dari biasanya, dahak BERTAMBAH BANYAK dan/atau menjadi kuning/hijau (purulen)\n5. Faktor pemberat: Infeksi saluran napas, polusi, cuaca dingin, berhenti bronkodilator\n6. Faktor peringan: Bronkodilator, posisi duduk membungkuk ke depan, oksigen\n7. Gejala penyerta: Demam (jika infeksi), edema kaki (cor pulmonale), bibir/kuku kebiruan (sianosis)\n\nFUNDAMENTAL 4:\n1. RPS: Berapa lama merokok, berapa bungkus/hari, kapan berhenti, sudah diagnosis PPOK, obat rutin apa\n2. RPD: Riwayat asma, TB paru, infeksi paru berulang\n3. RPK: Defisiensi alfa-1 antitripsin (PPOK usia muda tanpa rokok)\n4. Sos-Ek: Riwayat merokok (pack-year = bungkus/hari × tahun), paparan asap biomassa (tungku kayu), debu pekerjaan, imunisasi influenza/pneumokokus'},
{id:'pneumotoraks',name:'Pneumotoraks Spontan',years:[2023],ss:'Nyeri dada pleuritik mendadak + sesak. Pria muda kurus (primer) atau PPOK (sekunder). Suara napas turun, perkusi hipersonor. Foto: garis pleura tanpa vascular marking. Tension: trakea terdorong.',dd:'Emboli paru, Pleuritis, Efusi pleura, Infark miokard, Pneumonia',tx:'Kecil/stabil: observasi + O2 100%. Besar/simtomatik: aspirasi jarum atau WSD. TENSION (darurat): dekompresi jarum ICS 2 MCL segera.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'efusi_pleura',name:'Efusi Pleura Masif',years:[2023],ss:'Sesak progresif, nyeri dada pleuritik. Perkusi redup, suara napas turun/hilang, fremitus turun. Trakea terdorong kontralateral jika masif. Foto: opasitas homogen dengan meniskus sign.',dd:'CHF, TB pleura, Keganasan, Pneumonia, Sirosis, Hipoalbuminemia',tx:'O2. Torakosentesis diagnostik+terapeutik (max 1-1.5L/sesi). Analisis Light criteria. Tatalaksana penyebab.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'edema_paru',name:'Edema Paru Akut',years:[2023],ss:'Sesak mendadak berat, orthopnea, PND, batuk berdahak merah muda berbusa. Ronki basah bilateral, S3 gallop. SpO2 turun. Foto: butterfly pattern, Kerley B lines.',dd:'Pneumonia bilateral, ARDS, Efusi pleura bilateral, Asma berat',tx:'Duduk tegak. O2 high-flow (CPAP/BiPAP). Furosemid IV 40-80mg. Nitrat SL/IV. Morfin 2-4mg IV hati-hati.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},

{id:'abses_peritonsiler',name:'Abses Peritonsiler',years:[2024],ss:'Nyeri tenggorok unilateral hebat, disfagia, TRISMUS, uvula terdorong kontralateral, tonsil membengkak asimetris, "hot potato voice". Komplikasi tonsilitis.',dd:'Tonsilitis berat, Parafaring abses, Epiglotitis, Angina Ludwig',tx:'INSISI DAN DRAINASE. Penisilin G IV atau Ampisilin-sulbaktam. Analgetik. Tonsillektomi setelah infeksi mereda.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'laringitis',name:'Laringitis',years:[2024],ss:'Suara serak/afonia, tenggorokan gatal/nyeri, batuk kering. Setelah ISPA atau penggunaan suara berlebihan. Laring: eritema, edema pita suara.',dd:'LTB/croup (anak, stridor berat), Tumor laring, Epiglotitis, GERD laringitis',tx:'Istirahat suara absolut. Uap hangat. Parasetamol. Kortikosteroid oral jika edema. Hindari berbisik.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},

{id:'tb_hiv',name:'TB Paru + Susp. HIV',years:[2024],ss:'Batuk kronis >2 minggu, dahak darah, demam, keringat malam, BB turun. Foto: infiltrat/kavitas apeks. BTA (+). Candidiasis oral, limfadenopati multipel: curigai HIV. CD4 <200: TB milier.',dd:'Pneumonia CAP, Keganasan paru, PPOK eksaserbasi, Aspergillosis',tx:'OAT Kategori I: 2RHZE/4RH. Kotrimoksazol profilaksis jika HIV (+). ARV mulai 2-8 minggu setelah OAT (CD4 <50: segera).',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
{id:'pertusis',name:'Pertusis',years:[2024],ss:'Batuk paroksismal dengan inspirasi "WHOOP", post-tussive vomiting, wajah kebiruan, bisa apnea pada bayi. Fase kataral (2 minggu) → paroksismal → konvalesen.',dd:'Bronkiolitis, Asma, Benda asing, Croup, Infeksi Mycoplasma/Chlamydia',tx:'Azitromisin 10mg/kgBB/hari x5 hari. Isolasi. Profilaksis kontak: Azitromisin. Vaksin DTP pencegahan.',am:'IDENTITAS: Nama, Usia, Jenis Kelamin, Pekerjaan, Status Menikah\n\nKELUHAN UTAMA: [Keluhan utama pasien]\n\nSACRED 7:\n1. Lokasi: Di mana lokasi keluhan? Menyebar atau tidak?\n2. Onset/Kronologi: Kapan mulai? Berapa lama? Mendadak atau perlahan?\n3. Kuantitas: Seberapa berat? Seberapa sering?\n4. Kualitas: Rasanya seperti apa? (nyeri, gatal, panas, baal, dll)\n5. Faktor pemberat: Apa yang membuat keluhan makin berat?\n6. Faktor peringan: Apa yang membuat keluhan berkurang?\n7. Gejala penyerta: Keluhan lain yang menyertai?\n\nFUNDAMENTAL 4:\n1. RPS: Urutan kejadian, pengobatan yang sudah dilakukan\n2. RPD: Penyakit serupa, penyakit kronik (HT, DM, asma), rawat inap, obat rutin, alergi, menstruasi (perempuan)\n3. RPK: Penyakit serupa/keturunan dalam keluarga (DM, HT, kanker, penyakit jantung)\n4. Sos-Ek: Pekerjaan, kebiasaan (merokok, alkohol, aktivitas fisik), status menikah, pola makan'},
