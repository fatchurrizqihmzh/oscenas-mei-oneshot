  if(btn){const orig=btn.textContent;btn.textContent='✓ Tersimpan!';btn.className='btn-save flash';setTimeout(()=>{btn.textContent=orig;btn.className='btn-save'},2000)}
  updateStats(); toast('✓ Catatan tersimpan')
}

function resetCard(id,e){
  if(e)e.stopPropagation()
  if(!confirm('Reset ke data default?'))return
  clearNote(id)
  const t=Object.values(DATA).flat().find(x=>x.id===id)
  if(!t)return
  const el=f=>document.getElementById(f+'_'+id)
  if(el('am'))el('am').value=t.am||''
  if(el('ss'))el('ss').value=t.ss||''
  if(el('dd'))el('dd').value=t.dd||''
  if(el('tx'))el('tx').value=t.tx||''
  updateStats(); toast('🔄 Direset ke default')
}

function saveAll(){
  let n=0
  document.querySelectorAll('.card').forEach(card=>{
    const id=card.dataset.id
    if(!id)return
    const ss=document.getElementById('ss_'+id)?.value
    if(ss!==undefined){saveNote(id,{am:document.getElementById('am_'+id)?.value||'',ss,dd:document.getElementById('dd_'+id)?.value||'',tx:document.getElementById('tx_'+id)?.value||''});n++}
  })
  const btn=document.querySelector('.btn-save-all')
  btn.textContent='✓ Semua Tersimpan!';btn.style.background='#059669'
  setTimeout(()=>{btn.textContent='💾 Simpan Semua';btn.style.background=''},2500)
  updateStats(); toast(`✓ ${n} catatan tersimpan`)
}

function openOverlay(){document.getElementById('overlay').classList.add('show')}
function closeOverlay(){document.getElementById('overlay').classList.remove('show')}

function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show')
  setTimeout(()=>t.classList.remove('show'),2200)
}

function updateStats(){
  const rows=getRows()
  let total=0,multi=0,filled=0
  rows.forEach(({list})=>list.forEach(t=>{
    total++;if(t.years.length>1)multi++
    const n=loadNote(t.id);if(n.ss||n.dd||n.tx)filled++
  }))
  document.getElementById('statTotal').textContent=total
  document.getElementById('statMulti').textContent=multi
  document.getElementById('statFilled').textContent=filled
}

function getRows(){
  const sys=activeSys==='all'?SYSTEMS:SYSTEMS.filter(s=>s.key===activeSys)
  return sys.map(s=>({sys:s,list:(DATA[s.key]||[]).filter(t=>{
    if(!t.years.some(y=>activeYears.has(y)))return false
    if(!searchQ)return true
    return [t.name,t.ss,t.dd,t.tx].join(' ').toLowerCase().includes(searchQ)
  })})).filter(r=>r.list.length>0)
}


function buildExtras(id){
  const e = EXTRAS_DATA[id]
  if(!e) return ''

  function parseEdu(raw){
    const blocks = []
    const parts = raw.split(/\n\n/)
    for(const p of parts){
      const t = p.trim()
      if(!t) continue
      if(t.startsWith('🔵')) blocks.push(['edu-penyakit','🔵 Edukasi Penyakit', t.replace(/^🔵 Edukasi Penyakit:\s*/,'')])
      else if(t.startsWith('🟢')) blocks.push(['edu-support','🟢 Edukasi & Support Keluarga', t.replace(/^🟢 Edukasi Support:\s*/,'')])
      else if(t.startsWith('☪')) blocks.push(['edu-islami','☪️ Perspektif Islami (Rahmatan lil Alamin)', t.replace(/^☪️ Edukasi Islami:\s*/,'')])
      else if(t.startsWith('🔄')) blocks.push(['edu-kontrol','🔄 Edukasi Kontrol & Follow-up', t.replace(/^🔄 Kontrol:\s*/,'')])
      else blocks.push(['edu-penyakit','📌 Catatan', t])
    }
    return blocks
  }

  const uid = id + '_' + Math.random().toString(36).slice(2,6)

  const tabs = [
    e.pro  ? ['pro_'+uid,  '🔧 Prosedur'] : null,
    e.alg  ? ['alg_'+uid,  '🔀 Algoritma'] : null,
    e.ruj  ? ['ruj_'+uid,  '🚨 Rujukan'] : null,
    e.res  ? ['res_'+uid,  '💊 Resep'] : null,
    e.edu  ? ['edu_'+uid,  '📚 Edukasi'] : null,
  ].filter(Boolean)

  if(!tabs.length) return ''

  let tabHtml = tabs.map((t,i) =>
    `<button class="etab${i===0?' active':''}" onclick="switchETab(this,'${t[0]}')">${t[1]}</button>`
  ).join('')

  let panels = ''

  if(e.pro) panels += `<div id="pro_${uid}" class="epanel${tabs[0][0]==='pro_'+uid?' show':''}">
    <div class="prosedur-box">${e.pro.replace(/\\n/g,'\n')}</div>
  </div>`

  if(e.alg) panels += `<div id="alg_${uid}" class="epanel${tabs[0][0]==='alg_'+uid?' show':''}">
    <div class="alg-box">${e.alg.replace(/\\n/g,'\n')}</div>
  </div>`

  if(e.ruj) panels += `<div id="ruj_${uid}" class="epanel${tabs[0][0]==='ruj_'+uid?' show':''}">
    <div class="ruj-box">⚠️ ${e.ruj.replace(/\\n/g,'\n')}</div>
  </div>`

  if(e.res) panels += `<div id="res_${uid}" class="epanel${tabs[0][0]==='res_'+uid?' show':''}">
    <div class="resep-box">${e.res.replace(/\\n/g,'\n')}</div>
  </div>`

  if(e.edu){
    const blocks = parseEdu(e.edu.replace(/\\n/g,'\n'))
    const blocksHtml = blocks.map(([cls,lbl,txt]) =>
      `<div class="edu-item ${cls}"><strong style="display:block;margin-bottom:4px;font-size:10px;text-transform:uppercase;letter-spacing:.06em">${lbl}</strong>${txt}</div>`
    ).join('')
    panels += `<div id="edu_${uid}" class="epanel${tabs[0][0]==='edu_'+uid?' show':''}">
      <div class="edu-block">${blocksHtml}</div>
    </div>`
  }

  return `<div class="extras-section">
    <div class="extras-tabs">${tabHtml}</div>
    ${panels}
  </div>`
}

function switchETab(btn, panelId){
  const sec = btn.closest('.extras-section')
  sec.querySelectorAll('.etab').forEach(t=>t.classList.remove('active'))
  sec.querySelectorAll('.epanel').forEach(p=>p.classList.remove('show'))
  btn.classList.add('active')
  const p = document.getElementById(panelId)
  if(p) p.classList.add('show')
}

function escH(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

    html += `<span class="sub">📋 Pemeriksaan Fisik</span>`

      html += fPoints.map(p=>`<div class="row">• ${p.replace(/\.$/,'').trim()}</div>`).join('')

    html += `<span class="sub" style="margin-top:8px">🔬 Pemeriksaan Penunjang</span>`

    if(pPoints.length > 1){

  html += `</div>`

  // TAB 2: Neurologi lengkap

      <span class="sub">🫀 Tanda Vital</span>
      <div class="row" style="font-family:monospace;font-size:10.5px">${nt.tv}</div>
      <span class="sub">🧠 Nervus Kranialis (I–XII)</span>
      <div class="neuro-grid">

      </div>
      <span class="sub">💪 Motorik</span>
      <div class="neuro-grid">
        ${[['Inspeksi',nt.mo.ins],['Tonus Otot',nt.mo.ton],['Kekuatan Otot (0-5)',nt.mo.kek],['Koordinasi',nt.mo.kor]].map(([lbl,val])=>`<div class="neuro-box"><div class="neuro-lbl">${lbl}</div><div class="neuro-val">${val}</div></div>`).join('')}
      </div>
      <span class="sub">🎯 Sensorik</span>
      <div class="neuro-grid">
        ${[['Raba Ringan (kapas)',nt.se.rab],['Nyeri (jarum)',nt.se.nye],['Suhu',nt.se.suh],['Vibrasi (garpu tala 128Hz)',nt.se.vib],['Posisi/Propiosepsi',nt.se.pos]].map(([lbl,val])=>`<div class="neuro-box"><div class="neuro-lbl">${lbl}</div><div class="neuro-val">${val}</div></div>`).join('')}
      </div>
      <span class="sub">⚡ Refleks Fisiologis & Patologis</span>
      <div class="neuro-grid">
        <div class="neuro-box" style="grid-column:1/-1"><div class="neuro-lbl">Refleks Fisiologis</div><div class="neuro-val" style="white-space:pre-line">${nt.re.fis}</div></div>
        <div class="neuro-box" style="grid-column:1/-1"><div class="neuro-lbl">Refleks Patologis</div><div class="neuro-val" style="white-space:pre-line;color:#f87171">${nt.re.pat}</div></div>
      </div>
      <span class="sub">🔗 Tanda Rangsang Meningeal</span>
      <div class="neuro-box" style="margin-bottom:6px"><div class="neuro-val" style="white-space:pre-line">${nt.men}</div></div>
      <span class="sub">🧩 Fungsi Luhur</span>
      <div class="neuro-box"><div class="neuro-val">${nt.luh}</div></div>
    </div>`
  }

  // TAB 3: Status Psikiatri
  if(isPsi){
    const spes = PSI_SPES[id] || {}
    const tmpl = PSI_TMPL
    const items = [
      ['👤 Keadaan Umum','keadaan_umum'],
      ['🤝 Kontak','kontak'],
      ['🧠 Kesadaran & Orientasi','kesadaran'],
      ['😊 Mood & Afek','mood_afek'],
      ['💬 Proses Pikir (Bentuk·Arus·Isi)','proses_pikir'],

function switchPemfisTab(btn, targetId){
  const section = btn.closest('.pemfis-section')
  section.querySelectorAll('.pemfis-tab').forEach(t=>t.classList.remove('active'))
  section.querySelectorAll('.pemfis-content').forEach(c=>c.style.display='none')
  btn.classList.add('active')
  const target = document.getElementById(targetId)
  if(target) target.style.display='block'
}

function buildAnam(id){
  const a = ANAM[id]
  if(!a) return ''
  const row = (lbl,val) => val ? `<div class="anam-item"><div class="anam-label">${lbl}</div><div class="anam-val">${val}</div></div>` : ''
  const rowFull = (lbl,val) => val ? `<div class="anam-item anam-full"><div class="anam-label">${lbl}</div><div class="anam-val">${val}</div></div>` : ''
  return `<div class="anam-section">
    <div class="anam-title">📋 Anamnesis</div>
    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:5px">🪪 Identitas Pasien</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px;font-size:11px;color:var(--text2)">
      <div>Nama: ................</div>
      <div>Usia: ................</div>
      <div>Pekerjaan: .......</div>
      <div>Status: □ Menikah &nbsp;□ Belum</div>
    </div>
    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:4px">📍 Penyakit Sekarang (Sacred Seven)</div>
    <div class="anam-grid" style="margin-bottom:6px">
      ${row('1. Lokasi & Penyebaran', a.lok)}
      ${row('2. Onset & Kronologi', a.ons)}
      ${row('3. Kualitas Keluhan', a.kua)}
      ${row('4. Kuantitas & Frekuensi', a.kun)}
      ${row('5. Faktor Memperberat', a.mpb)}
      ${row('6. Faktor Meringankan', a.mr)}
      ${rowFull('7. Gejala Sistemik Penyerta', a.sis)}
    </div>
    <div class="anam-grid">
      ${rowFull('🏥 RPD — Riwayat Penyakit Dahulu', a.rpd)}
      ${rowFull('👨‍👩‍👧 RPK — Riwayat Penyakit Keluarga', a.rpk)}
      ${rowFull('🌍 Riwayat Sosial, Ekonomi & Kebiasaan', a.rsos)}

function buildSSDisplay(ss, id){
  if(!ss) return `<textarea id="ss_${id}" class="ss-ta" placeholder="Tanda dan gejala khas..." onclick="event.stopPropagation()"></textarea>`
  // Convert comma/period-separated text to numbered list, or split on dot/comma
  const parts = ss.split(/(?<=[.+)])\s+(?=[A-Z0-9(])/).filter(p=>p.trim())
  if(parts.length <= 1){
    // Try splitting on comma for short entries
    const byComma = ss.split(',').map(s=>s.trim()).filter(s=>s)
    if(byComma.length > 2){
      const items = byComma.map(p=>`<li>${p}</li>`).join('')
      return `<div onclick="toggleSSEdit('${id}')" style="cursor:pointer" title="Klik untuk edit">
        <ol class="ss-num">${items}</ol>
      </div>
      <textarea id="ss_${id}" class="ss-ta" style="display:none;margin-top:6px" placeholder="Tanda dan gejala khas..." onclick="event.stopPropagation()">${escH(ss)}</textarea>`
    }
  }
  const items = parts.map(p=>`<li>${p.trim()}</li>`).join('')
  return `<div onclick="toggleSSEdit('${id}')" style="cursor:pointer" title="Klik untuk edit">
    <ol class="ss-num">${items}</ol>
  </div>
  <textarea id="ss_${id}" class="ss-ta" style="display:none;margin-top:6px" placeholder="Tanda dan gejala khas..." onclick="event.stopPropagation()">${escH(ss)}</textarea>`
}

function toggleSSEdit(id){
  const ta = document.getElementById('ss_'+id)
  if(!ta) return
  ta.style.display = ta.style.display==='none' ? 'block' : 'none'
}

function render(){
  const rows=getRows()
  if(!rows.length){
    document.getElementById('content').innerHTML='<div class="empty"><div class="empty-icon">🔍</div><strong>Tidak ada topik ditemukan</strong><br><small>Coba ubah filter atau kata kunci</small></div>'
    updateStats();return
  }
  document.getElementById('content').innerHTML=rows.map(({sys,list})=>`
    <div class="sys-section">
      <div class="sys-head">
        <span style="font-size:18px">${sys.icon}</span>
        <h2>${sys.label}</h2>
        <span class="sys-count">${list.length} topik</span>
      </div>
      ${list.map(t=>{
        const note=loadNote(t.id)
        const am=note.am!==undefined?note.am:(t.am||'')
        const ss=note.ss!==undefined?note.ss:(t.ss||'')
        const dd=note.dd!==undefined?note.dd:(t.dd||'')
        const tx=note.tx!==undefined?note.tx:(t.tx||'')
        const hasSaved=Object.keys(note).length>0
        const isMulti=t.years.length>1
        const dots=['#A855F7','#60a5fa','#fb923c','#34d399'].map((c,i)=>{
          const v=[am,ss,dd,tx][i]
          return`<div class="dot" style="background:${v?c:'var(--border)'};opacity:${v?1:0.3}"></div>`
        }).join('')
        return`<div class="card" id="card_${t.id}" data-id="${t.id}">
          <div class="card-head" onclick="toggleCard('${t.id}')">
            <div class="card-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></div>
            <div class="card-info">
              <div class="card-name">${t.name}</div>
              <div class="card-tags">
                ${t.years.map(y=>`<span class="tag tag-${y}">Mei ${y}</span>`).join('')}
                ${isMulti?`<span class="tag tag-multi">🔁 ${t.years.length}× muncul</span>`:''}
                ${hasSaved&&(ss||dd||tx)?'<span class="tag tag-saved">✓ tersimpan</span>':''}
              </div>
            </div>
            <div class="dots">${dots}</div>
          </div>
          <div class="card-body">
            ${buildAnam(t.id)}
            ${buildPemfis(t.id)}
            ${buildExtras(t.id)}
            <div class="fields">
              <div class="field-group">
                <div class="field-label ss">🔵 Signs &amp; Symptoms <span style="font-size:9px;color:var(--text3)">(klik untuk edit)</span></div>
                ${buildSSDisplay(ss, t.id)}
              </div>
              <div class="field-group">
                <div class="field-label dd">🟠 Diagnosis Banding</div>
                <textarea id="dd_${t.id}" class="dd-ta" placeholder="Diagnosis banding utama..." onclick="event.stopPropagation()">${escH(dd)}</textarea>
              </div>
              <div class="field-group">
                <div class="field-label tx">🟢 Tatalaksana</div>
                <textarea id="tx_${t.id}" class="tx-ta" placeholder="Tatalaksana farmako & non-farmako..." onclick="event.stopPropagation()">${escH(tx)}</textarea>
              </div>
            </div>
            <div class="card-actions">
              <button class="btn-reset" onclick="resetCard('${t.id}',event)">Reset</button>
              <button class="btn-save" id="sb_${t.id}" onclick="saveCard('${t.id}',event)">💾 Simpan</button>
            </div>
          </div>
        </div>`
      }).join('')}
    </div>`).join('')
  updateStats()
}

buildNav(); render()
</script>
